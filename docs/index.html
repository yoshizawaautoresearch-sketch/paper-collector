 a faith-based asset owner can influence corporate behaviour to align with moral objectives. Unlike the conventional investment chain, the Church engaged directly with Shell, bypassing asset managers, to advocate for greenhouse gas emissions reduction targets consistent with the Paris Agreement. While internal tensions persisted between practical considerations and theological commitments in the Church, the engagement prompted Shell to adopt GHG-reduction metrics. This engagement contributed to Shell incorporating GHG-reduction metrics into executive remuneration, marking a novel preced","doi":"10.1017/s1740355326101338","venue":"Journal of Anglican Studies","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"When Earlier Is Better But Still Not Cost-Effective ― Reframing the Value of Tafamidis in Transthyretin Amyloid Cardiomyopathy ―","url":"https://doi.org/10.1253/circj.cj-26-0898","authors":["Takuya Kishi"],"date":"2026-09-29","abstract":"required substantially longer follow-up.The supplementary analysis summarized \"time to benefit\" as approximately 18 months in stage I and 56 months in stage II, with no demonstrable time to benefit in stage III within the available follow-up. 6,9The economic message is equally important.Even where clinical benefit was greatest, economic value at the current Japanese reimbursement price remained unfavorable: the lowest estimated incremental cost-effectiveness ratios (ICERs) were approximately ¥47 million/QALY in stage I and ¥52 million/QALY in stage II, both above commonly cited Japanese willingness-to-pay ranges.6,7 Stage III was far less favorable.Utility assumptions changed estimates only ","doi":"10.1253/circj.cj-26-0898","venue":"Circulation Journal","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Psychometric properties of health-related quality of life tools for clinically stable people living with HIV in Cambodia","url":"https://doi.org/10.1186/s12955-026-02632-7","authors":["Esabelle Lo Yan Yam","Sovanvorleak Tep","Pheak Chhoun","Sovannary Tuot","Vichea Ouk","Siyan Yi","Nan Luo"],"date":"2026-09-29","abstract":"In Cambodia, treatment outcomes for people living with HIV are routinely monitored using clinical indicators; however, these measures do not capture the broader impact of HIV and its treatment on health-related quality of life (HRQoL). HRQoL encompasses an individual’s perceived wellbeing and functioning across multiple domains and is commonly assessed using instruments such as the EuroQol five-dimension (EQ-5D) and World Health Organization Quality of Life-BREF (WHOQOL-BREF). This study evaluated the psychometric properties of the Khmer versions of these instruments among people living with HIV in Cambodia. This study was nested within a quasi-experimental evaluation of a community-based an","doi":"10.1186/s12955-026-02632-7","venue":"Health and Quality of Life Outcomes","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP","KH","SG"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Toward a Framework for Trade Relating to Content:","url":"https://doi.org/10.14391/ajhs.e3005.2.002","authors":["Ken Nayef SUZUKI"],"date":"2026-09-29","abstract":"Japan-Saudi Arabia trade has long centered on the exchange of crude oil for automobiles and machinery, but has recently diversified to include halal foods, cosmetics, tourism-related services, and entertainment content such as anime, manga, and video games.Alongside the inflow of Japanese content, the Public Investment Fund (PIF) has acquired shares in Japanese game companies.Works and services flow from Japan to Saudi Arabia, while corporate ownership flows from Saudi Arabia to Japan, and existing statistical categories and theoretical frameworks treat these as separate phenomena.This study aims to review the transformation of the Japan-Saudi trade structure and, in particular, to clarify t","doi":"10.14391/ajhs.e3005.2.002","venue":"Asian Journal of Human Services","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Selling the Future: Community, Hope, and Crisis in the Early History of Japanese Life Insurance","url":"https://doi.org/10.1080/0030851x.2026.2739714","authors":["Takakazu Yamagishi"],"date":"2026-09-29","abstract":"Ryan Moran’s Selling the Future analyzes the role that life insurance played in shaping social order from the early stages of modern state formation in Japan. The development of welfare institution...","doi":"10.1080/0030851x.2026.2739714","venue":"Pacific Affairs","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Luxury resale volume and composition shifted during the COVID-19 tourism shock, but co-purchase network tests were inconclusive and construction-sensitive","url":"https://arxiv.org/abs/2609.36825","authors":["Tengfei Shao"],"date":"2026-09-29","abstract":"Japan's 2020 tourism shock coincided with 27% fewer buyers and 35% lower gross merchandise value at one second-hand luxury resale intermediary. We compared 2019 and 2020 co-purchase projections of recorded brand labels with a Holm-corrected battery of five label-invariant metrics and Portrait Divergence against two permutation nulls rebuilding both graphs. Neither test separated the full years (smallest Holm p 0.407; 0.097 under the design-matched paired-swap null). For one random two-block split of brands, the battery detected a planted redirection of 30% of multi-brand baskets (178 of 10,399 second-group baskets, 1.7%) in 83 of 100 simulations (83-92 of 100 across 11 splits, all at least 8","doi":"10.48550/arxiv.2609.36825","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Financial Frictions, Corporate‐to‐Consumption Tax Shifting, R&D‐Driven Growth, and Welfare","url":"https://doi.org/10.1111/jpet.70142","authors":["Ken Tabata"],"date":"2026-09-29","abstract":"ABSTRACT Does shifting the tax base from corporate income to consumption under a balanced‐budget constraint improve welfare? From a purely efficiency perspective, we study this question in a Rivera‐Batiz and Romer‐type variety‐expanding growth model with heterogeneous R&D productivity and financial frictions that limit external finance for innovation. Taking the labor income tax rate as fixed, we characterize the welfare‐maximizing corporate income and consumption tax rates and examine how they vary with financial development, modeled as a relaxation of borrowing constraints on R&D and interpreted as an improvement in legal institutions. Our main contribution is to show how financial develop","doi":"10.1111/jpet.70142","venue":"Journal of Public Economic Theory","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Short-term barrier option price expansion","url":"https://arxiv.org/abs/2610.00340","authors":["Masaaki Fukasawa"],"date":"2026-09-29","abstract":"We derive a short-maturity expansion for up-and-out put barrier option prices under continuous stochastic volatility when the strike and the barrier approach the spot at the diffusive scale. Assuming joint weak convergence of the normalized terminal return, the relative volatility fluctuation, and the running maximum, together with uniform integrability, we show that the leading term is the time-inhomogeneous Black-Scholes barrier price fitted to the forward variance curve. The first model-dependent correction is of order $θ^{H+1/2}$, where $θ^H$, $H \\in (0,1/2]$, is the order of the relative volatility fluctuation, and is represented explicitly through killed Brownian transition densities. ","doi":"10.48550/arxiv.2610.00340","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Agricultural Trade between Japan and Latin America: Determinants, Trade Potential and Implications for Food Security","url":"https://doi.org/10.5109/7443185","authors":["Chen Yao","Yoshifumi Takahashi"],"date":"2026-09-29","abstract":"TRODUCTIONIn recent decades, agricultural trade has played an increasingly important role in ensuring global food security by facilitating the efficient allocation of food resources across regions.For countries with limited domestic agricultural capacity, such as Japan, international trade has become an essential mechanism for securing stable food supplies.At the same time, Latin America 1 has emerged as an important supplier of agricultural products due to its abundant natural resources and comparative advantages in agricultural production.Compared with major traditional suppliers such as the United States and Asia-Pacific countries, Latin America still accounts for a relatively small share","doi":"10.5109/7443185","venue":"Journal of the Faculty of Agriculture Kyushu University","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["CN","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Forecasting Türkiye’s salmon exports: A multi-method assessment of market dynamics and country-specific prospects","url":"https://doi.org/10.33714/masteb.2015600","authors":["Gülçin Güreşçi Pehlivan","Mehmet Yunus Çelik","Adem Yavuz Sönmez"],"date":"2026-09-29","abstract":"Türkiye has rapidly emerged as an important producer and exporter of Turkish salmon, yet the future trajectory of its exports may differ substantially across destination markets. This study examines the short-term country-specific prospects of Türkiye’s salmon exports and identifies markets characterized by growth potential, contraction, and uncertainty. The analysis uses January–August export data for 2022–2025 for 25 destination countries with complete observations for all four study years. January–August export volumes for 2026–2028 are projected using Holt’s Linear Trend Method, the Damped Holt Method, and the GM(1,1) grey forecasting model, while Compound Annual Growth Rates (CAGR) are ","doi":"10.33714/masteb.2015600","venue":"Marine Science and Technology Bulletin","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["TR"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"2.53eP Real-world characteristics and care patterns of DMD patients in Japan and the USA: a medical claims data comparison on the same platform","url":"https://doi.org/10.1016/j.nmd.2026.106812","authors":["Tatsuya Suzuki","Tsubasa Bito","Masahito Oishi","Kakeru Nakagawa","Akari Kawano","Takuya Toramoto","Hidenori Komori","Ryotaro Sonoda","Takeshi Tanaka"],"date":"2026-09-29","abstract":"","doi":"10.1016/j.nmd.2026.106812","venue":"Neuromuscular Disorders","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Putting Autonomy in ‘Defensive Defence’: Media Discourse, Strategic Culture and the Normalisation of Artificial Intelligence and Autonomous Weapons Systems in Japan","url":"https://doi.org/10.1177/23477970261485640","authors":["Adam Bartley","Tom Saxton"],"date":"2026-09-29","abstract":"This article examines the integration of artificial intelligence and autonomous weapons systems (AI/AWS) into Japan’s national security framework, exploring why a technologically advanced state facing severe regional threats has maintained a uniquely constrained development trajectory. While global military trends suggest a convergence towards AI-enabled capabilities, Japan’s adoption of these technologies is filtered through its strategic culture, which mediates how innovation is interpreted and legitimised. Drawing on a thematic analysis of Japanese print media (2015–2024) and recent strategic documents, the study identifies a shift in the role of AI/AWS from abstract ethical concerns to t","doi":"10.1177/23477970261485640","venue":"Journal of Asian Security and International Affairs","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["AU"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Structural Friction: Reginald Eyre and the Limits of British Film Propaganda in Wartime Japan, 1916–1919","url":"https://doi.org/10.1080/01439685.2026.2738079","authors":["Satoru Fukamachi"],"date":"2026-09-29","abstract":"This article reconstructs the British effort to distribute official war films in Japan between 1916 and 1919 through the career of Reginald Eyre, the agent who managed it, drawing on the largely untapped Foreign Office and Ministry of Information records at The National Archives read against contemporary Japanese film journalism. It argues that the campaign’s uneven fortunes are best understood through the concept of structural friction: the resistance generated when a media flow encoded within one industrial, institutional, and cultural system enters a reception space organised by different codes. Three distinct layers of friction—industrial, formal, and affective—are distinguished and weig","doi":"10.1080/01439685.2026.2738079","venue":"Historical Journal Of Film Radio and Television","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Global trade competition patterns in categorised meat products: A weighted network analysis","url":"https://doi.org/10.17221/266/2025-agricecon","authors":["Qi Wang","Rongzhu Cheng","Shiyang Liu","王芳 许"],"date":"2026-09-29","abstract":"Meat trade plays a crucial role in global food systems and is a key area of competition among nations. This study analyses the competitive network of global categorised meat trade using weighted network analysis, focusing on four major meat types. The results indicate that meat trade competition is dominated by large consuming nations such as China, Japan, and Germany due to their high demand. Beef, pork, and poultry markets exhibit relatively concentrated competition among a small number of high-strength countries, whereas the sheep market is characterised by a more balanced competitive structure and greater variability in the strength-degree relationship. Weighted clustering coefficients d","doi":"10.17221/266/2025-agricecon","venue":"Agricultural Economics (Zemědělská ekonomika)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["CN"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Canevas_donnees_Taylor_Rule_Hormuz","url":"https://doi.org/10.5281/zenodo.23027606","authors":["Mohamed Benbouziane"],"date":"2026-09-29","abstract":"This repository contains the complete data set and estimation code behind the paper \"Chokepoint Shocks in Central Bank Reaction Functions: An Augmented Taylor Rule for Oil Supply Disruptions\" (Benbouziane, Benghalem, Chibi and Chekouri, submitted to the Journal of International Money and Finance). It reproduces every table and figure in the paper end to end from the underlying panel. The data set is a quarterly and monthly macro-financial panel covering the United States, the euro area and Japan from January 1990 to mid-2026 (146 quarterly and 440 monthly observations per economy), built from public sources: the Federal Reserve Bank of St. Louis (FRED), the US Energy Information Administrati","doi":"10.5281/zenodo.23027606","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["DZ"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Strengthening legal safeguards against genetic discrimination: review and recommendations for Malaysia","url":"https://doi.org/10.1007/s12687-026-00937-0","authors":["Motharasan Manogaran","Syahrilnizam Abdullah","Raha Abdul Rahim","Yusuf Muhammad Noor","Bin Alwi Zilfalil"],"date":"2026-09-29","abstract":"","doi":"10.1007/s12687-026-00937-0","venue":"Journal of Community Genetics","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["MY"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Intelligence Hours: replication data and code for the 2023-2025 panel and exploratory 2026 extensions","url":"https://doi.org/10.5281/zenodo.23030430","authors":["Kwangseob Ahn"],"date":"2026-09-29","abstract":"This dataset and code release supports public version 5 of Intelligence Hours, revised 2 October 2026 by Kwangseob Ahn (Sejong University; ORCID 0009-0000-5299-1457). It does not modify or resubmit the separate ILR manuscript. The archive preserves frozen original inputs and adds traceable Bulgaria currency-unit and Chile 2025 statutory-wage corrections, a corrected panel, HC3 cross-sectional inference, country-clustered CR1 pooled inference, matched-sample market/PPP comparisons, distinct-currency FX diagnostics, tied rollout-wave tests, corrected figures and an Anthropic Economic Index appendix. Native-language official tax and payroll sources are recorded by country, with dated legal rule","doi":"10.5281/zenodo.23030430","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["KR"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Financialization of Nonfinancial Corporations and Structural Transformation Under Neoliberalism: The Cases of Japan and South Korea","url":"https://doi.org/10.1177/04866134261485613","authors":["Deokmin Kim"],"date":"2026-09-29","abstract":"This article examines the structural transformation of the Japanese and South Korean economies under neoliberal reform and financialization. Existing research has focused mainly on Western economies, leaving underexplored the trajectories of Japan and Korea, which differ from finance-led models such as the United States and United Kingdom. Drawing on a Marxist framework, the study estimates multiple profit rates, including after-tax rates incorporating financial relations, to capture structural shifts more effectively than the conventional profit rate à la Marx. Using national accounts data since the 1970s, the analysis traces capital accumulation, corporate financing, and profitability befo","doi":"10.1177/04866134261485613","venue":"Review of Radical Political Economics","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["KR"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"When disasters travel: Europe’s hidden exposure to remote climate-related risks. Integrating computable general equilibrium and natural disaster risk models","url":"https://doi.org/10.1080/09535314.2026.2726751","authors":["Jan Brusselaers","O.J. Kuik","Alessio Ciullo","W. J. Wouter Botzen","Paul Gretton"],"date":"2026-09-29","abstract":"This paper contributes to the literature on cross-border impacts at the global level of compound, climate-related multi-hazards. Our study examines the economic damage to Europe from alternative realizations (along storylines) of cyclones in the United States, China, and Japan by coupling natural hazard risk models that estimate the immediate, direct physical costs of hazards with a global recursive dynamic computable general equilibrium model. This approach offers two innovations. First, we assess cross-border impacts of compound natural hazards at the global level and across sectors using a computable general equilibrium model. This goes beyond the conventional narrow focus on a single sec","doi":"10.1080/09535314.2026.2726751","venue":"Economic Systems Research","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["AU","BE","CH","NL"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Competitive Position, Trade Integration, and Determinants of Indonesia’s Basic Metal Exports To RCEP Countries: The Role of Downstream Industrialization Policy","url":"https://doi.org/10.55681/jige.v7i3.6129","authors":["Frisca Yunita Sari","Farida Rachmawati","Nasikh Nasikh"],"date":"2026-09-29","abstract":"Increased trade integration within the Regional Comprehensive Economic Partnership (RCEP) presents both opportunities and challenges for Indonesia’s base metal exports. This study analyzes the competitiveness of Indonesia’s base metal exports to RCEP member countries and the factors influencing it, using a combination of Revealed Comparative Advantage (RCA), Export Product Dynamics (EPD), x-model, Intra-Industry Trade (IIT), and panel data gravity models. Results indicate that Indonesia holds a comparative advantage in most RCEP countries, with EPD identifying Vietnam, the Philippines, China, and New Zealand as rising star markets, while Japan, Brunei, Myanmar, and Cambodia are lost opportun","doi":"10.55681/jige.v7i3.6129","venue":"JURNAL ILMIAH GLOBAL EDUCATION","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["ID"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Fast and Efficient Estimation of Macromodels with Large Shocks","url":"https://doi.org/10.1080/07350015.2026.2740570","authors":["Luisa Corrado","Stefano Grassi","Aldo Paolillo"],"date":"2026-09-29","abstract":"","doi":"10.1080/07350015.2026.2740570","venue":"Journal of Business & Economic Statistics","sources":["Journal of Business & Economic Statistics"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Money to Burn: Crowdfunding Wildfire Recovery","url":"https://doi.org/10.1111/jofi.70094","authors":["J. ANTHONY COOKSON","EMILY A. GALLAGHER","PHILIP MULDER"],"date":"2026-09-29","abstract":"ABSTRACT Person‐to‐person crowdfunding is an increasingly important form of disaster relief, yet its distribution is poorly understood. Linking GoFundMe campaigns from a major wildfire to property and household credit records, we find that higher‐income households are 12 pp more likely to have campaigns and raise over 25% more, holding property losses constant. These disparities reflect unequal access to social capital: broader donor bases, more nonlocal ties, greater advocacy by friends, and more generous donors. Donors appear influenced by social pressure in online crowdfunding. These mechanisms mirror national patterns and underscore crowdfunding's limitations as a tool for equitable disa","doi":"10.1111/jofi.70094","venue":"The Journal of Finance","sources":["Journal of Finance"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Perception Gaps and Proactive Strategy in Japanese SME Disaster Recovery","url":"http://www.rieti.go.jp/jp/publications/summary/26090010.html","authors":["泉 佑太朗（政策研究大学院大学）","中田 啓之（ファカルティフェロー）","澤田 康幸（東京大学）","関口 訓央（コンサルティングフェロー）"],"date":"2026-09-28","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ディスカッション・ペーパー（英語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"1990年代後半から2010年代までの日本の半導体産業に関わる政策史","url":"http://www.rieti.go.jp/jp/publications/summary/26090009.html","authors":["石井 晋（ファカルティフェロー）"],"date":"2026-09-28","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ディスカッション・ペーパー（日本語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"The Swiss Franc and the Swiss Economy: Updated evidence","url":"http://www.rieti.go.jp/jp/publications/summary/26090008.html","authors":["Willem THORBECKE（上席研究員）"],"date":"2026-09-28","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ディスカッション・ペーパー（英語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Growing in China’s Shadow","url":"https://d.repec.org/n?u=RePEc:wbk:wbrwps:11467&r=&r=sea","authors":["Fukuzawa, Daisuke","Islamaj, Ergys","Le, Duong Trung","Mattoo, Aaditya","Samano Penaloza, Agustin"],"date":"2026-09-28","abstract":"This paper analyses how China’s rapid expansion has affected growth in other developing economies through the trade channel. The empirical strategy is a shift-share design that exploits pre-determined variation across countries in the exposure of their exports to China’s import demand and export supply in global markets, well before China became a dominant trader. The paper shows that China’s rising demand for commodities and intermediate goods has had a favorable impact on other developing countries’ growth, while intensified competition from its manufacturing exports has had an adverse effect. The former effect is stronger and therefore the net effect has been positive for most countries. ","doi":"","venue":"NEP 東南・東アジア (nep-sea)","sources":["NEP 東南・東アジア (nep-sea)"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Who’s Borrowing and Lending in Repo Markets?","url":"https://d.repec.org/n?u=RePEc:fip:fednls:103821&r=&r=mon","authors":["Gara Afonso","Jun-Davinci Choi","Gonzalo Cisternas","Will Riordan"],"date":"2026-09-28","abstract":"Repo markets play a vital role in the U.S. financial system. In this three-part series, we examine who participates in these markets, what trade-offs influence how different repo segments are structured, and why repos matter for monetary policy. Today’s post introduces repo transactions, focusing on the major private-sector participants and why they engage in these markets.","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["repo market"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"The Direct and Indirect Effects of the Belt and Road Initiative on Exports to China","url":"https://doi.org/10.1111/twec.70159","authors":["Haonan Li","Yasuyuki Todo"],"date":"2026-09-28","abstract":"ABSTRACT This study investigates the direct effect of a country's participation in China's Belt and Road Initiative (BRI) on that country's exports to China, as well as the indirect effect of such participation on other countries' exports to China. Using panel data covering 187 countries from 2006 to 2023, we employ an event study approach, a staggered difference‐in‐differences (DID) methodology, and spatial econometric models in this research. The results show that participation in the BRI significantly increases member countries' exports to China, partly as a result of improvements in infrastructure. Turning to the indirect effect, we reveal that the BRI has a significantly negative effect","doi":"10.1111/twec.70159","venue":"World Economy","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Stage-Specific Cost-Effectiveness of Early vs. Delayed Tafamidis for Transthyretin Amyloid Cardiomyopathy in Japan","url":"https://doi.org/10.1253/circj.cj-26-0576","authors":["Yasufumi Nagata","Yosuke Nabeshima","Tetsuji Kitano","Masaaki Takeuchi","Masaharu Kataoka"],"date":"2026-09-28","abstract":"BACKGROUND: Tafamidis improves survival in patients with transthyretin amyloid cardiomyopathy (ATTR-CM); however, its cost raises concerns regarding healthcare sustainability. We evaluated the stage-specific cost-effectiveness of tafamidis in Japan. METHODS AND RESULTS: Individual patient-level data were reconstructed from published Kaplan-Meier curves from the ATTR-ACT long-term extension study. Time-dependent survival benefit between early (continuous tafamidis) and delayed (placebo-to-tafamidis) tafamidis initiation was quantified using restricted mean survival time (RMST). Stage-specific incremental cost-effectiveness ratios (ICERs) were estimated according to National Amyloidosis Centre","doi":"10.1253/circj.cj-26-0576","venue":"Circulation Journal","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Replication Package for The Structure of Supply Chains and the Impacts of Trump 1.0 Tariffs: Evidence from Japanese Firms’ Sales to North America","url":"https://doi.org/10.3886/icpsr315873","authors":["Mitsuyo Ando","Kazunobu Hayakawa","Fukunari Kimura","Kenta Yamanouchi"],"date":"2026-09-28","abstract":"This study investigates how the US–China trade war affected the North American sales by Japanese manufacturing firms between 2014 and 2021. It considers sales by affiliates in North America, exports from Japan, and exports by affiliates in third countries such as China, Mexico, and ASEAN. The replication package contains Stata code, industry concordance files, tables and figures, and replication instructions. Confidential data are not included, but data sources and access information are described.","doi":"10.3886/icpsr315873","venue":"ICPSR Data Holdings","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Hidden Fiscal Unsustainability: Evidence from Real-Time Data in the Euro Area","url":"https://doi.org/10.15456/ger.2026271.1237071281","authors":["Hideaki Matsuoka"],"date":"2026-09-28","abstract":"This study examines the implications of data revisions for the assessment of fiscal sustainability in the Euro area. Using vintage datasets from the OECD Economic Outlook, we define ex ante data as the latest available estimates at each point in time and ex post data as the final revised values. To capture heterogeneous fiscal behaviors between Greece and other Euro area countries, we develop a novel approach, panel regression kink model with heterogeneous unknown thresholds. This study yields three main findings. First, it provides the first evidence of substantial differences in estimated fiscal responses between ex ante and ex post data for Greece, consistent with the fiscal sustainabilit","doi":"10.15456/ger.2026271.1237071281","venue":"ZBW Journal Data Archive","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Renewable Electricity and CO2 Emissions in Tajikistan: Evidence from an ARDL–STIRPAT Framework","url":"https://doi.org/10.3390/en19194600","authors":["Mirzosaid Sultonov","K. Kh. Khushvakhtzoda","Fumiaki Inagaki","Kobil Kurbonov","Junichiro Oda"],"date":"2026-09-28","abstract":"Tajikistan relies heavily on hydropower for electricity generation, but increasing energy demand, winter electricity shortages, rising coal consumption, and climate-related changes in water availability pose significant challenges to the country’s energy system and environment. In this study, we examined the relationship between renewable electricity generation and per capita CO2 emissions in Tajikistan from 1991 to 2023. We conducted the analysis within the Stochastic Impacts by Regression on Population, Affluence, and Technology (STIRPAT) framework using an autoregressive distributed lag (ARDL) approach. Our model incorporates population growth, gross domestic product (GDP) per capita, ind","doi":"10.3390/en19194600","venue":"Energies","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP","TJ"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Heterogeneous urban decarbonization pathways revealed by typological and machine learning frameworks: A global analysis across Annex I cities","url":"https://doi.org/10.1016/j.uclim.2026.103160","authors":["Yukai Jin","Ayyoob Sharifi"],"date":"2026-09-28","abstract":"Cities are central to global climate mitigation, yet existing projections often rely on coarse-grained assessment models that overlook the interplay between urban typology and socioeconomic dynamics. Here, we harness a context-aware deep learning framework combined with typological clustering to project CO₂ emissions for 46,833 cities in Annex I countries through 2050 under Shared Socioeconomic Pathways. Specifically, we classify cities by multidimensional urban morphology and couple the resulting typologies with FiLMSeq2Seq prediction model we proposed to generate city-level emission projections. We identify five distinct urban typologies characterized by differing patterns of horizontal ex","doi":"10.1016/j.uclim.2026.103160","venue":"Urban Climate","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"限界収入生産物を野球の労働市場で学ぶ","url":"https://doi.org/10.5281/zenodo.23008120","authors":["Katsuhiko Kawai"],"date":"2026-09-28","abstract":"本稿は、メジャーリーグ (MLB) の選手市場を題材にして限界収入生産物 (marginal revenue product, MRP) を教える授業プロジェクトを提案した Wooten and White (2018)の解説である。対象は経済学の基礎理論を学び終えた学部生であり、原論文が結果だけを示している関係式を、途中の式変形を省かずに導出する。具体的には、(i) 利潤最大化条件MRP = w、(ii) 「選手の指標の差を 9 で割る」限界生産物の式、(iii) 競争的な入札から導かれる年俸の式 MRP = 535,000 + MP × MR、(iv) 最小二乗法による近似直線、(v) 三つの回帰係数のあいだの連鎖律 b1 = b2b3 + (ずれ) を扱う。さらに、原論文が学生に集めさせるデータを実際に収集し (2016 年の全 30 球団の成績・観客動員・平均チケット価格、および2016–17 年オフのフリーエージェント野手 83 人の成績と契約)、課題の全手順を Python で再現した。攻撃指標 1 ポイントの限界収入は約 4.10 百万ドル (標準誤差 1.70 百万ドル) と推定され、推定 MRP と実際の年俸の相関係数は 0.573 であった。年俸上位 10 人に限ると推定 MRP の平均 (17.56 百万ドル) は実際の年俸の平均 (17.12 百万ドル) とほぼ一致する。授業の締めくくりに行うドラフトとシーズンのシミュレーションも計算モデルとして実装し、6 種類の指名戦略を比較したうえで、「年俸が MRP に等しい効率的な市場では、どの戦略を使ってもチー","doi":"10.5281/zenodo.23008120","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"How to Reform US Long-Term Care","url":"https://doi.org/10.26509/frbc-wp-202625","authors":["R. Anton Braun","Karen Kopecky"],"date":"2026-09-28","abstract":"Long-term care is costly. About 45 percent of 65-year-old Americans will require formal long-term care assistance during their lifetime and one in twelve will incur out-of-pocket expenses of $200,000 or more. Surprisingly, only 10 percent of retirees have private long-term care insurance. We use a quantitative structural model to show that an obstacle to increasing coverage is disagreement across the income distribution: scaling back public long-term care insurance expands the private market and benefits the affluent but imposes large welfare losses on the poor, while universal public insurance does the opposite. We then show that making the main public insurer, Medicaid, the primary rather ","doi":"10.26509/frbc-wp-202625","venue":"Working paper","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP","US"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"計算実験で学ぶメカニズムデザイン","url":"https://doi.org/10.5281/zenodo.19177798","authors":["Katsuhiko Kawai"],"date":"2026-09-28","abstract":"メカニズムデザインは、私的情報をもつ合理的主体が参加するゲームにおいて、社会的に望ましい結果を達成するための制度(メカニズム)を設計する理論である。本稿では、オークション設計、公共財供給、安定マッチング、最適オークション、混雑課金、排出権取引、非線形価格設定、クラウドリソース配分という 8 つの代表的応用領域を取り上げ、各メカニズムの数理的基礎を解説するとともに、Python による計算実験を通じてその理論的性質を数値的に検証する。収益同値定理、VCG メカニズムの誘因両立性、Gale–Shapley アルゴリズムの安定性、Myerson 最適オークションの収益最大化特性、混雑課金による社会的余剰の改善、排出権取引による費用効率化、スクリーニングによる最適契約設計、およびクラウドリソースの VCG 型配分を、具体的なシミュレーション結果をもって示す。最後に、これらの理論と計算実験を現実の制度設計(マーケットデザイン)へ拡張するための指針を、設計の手順、仮定の点検、領域別の論点に分けて述べる。なお、同じ 8 つの題材を学部生向けに書き直した別冊『計算実験で学ぶメカニズムデザイン 入門編』を用意しており、本稿との対応関係は第 1.6 節に示す。","doi":"10.5281/zenodo.19177798","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"Heterogeneous preferences for rural road investments and willingness to contribute","url":"https://doi.org/10.1080/00036846.2026.2740197","authors":["Yintu Bao","Gumula Wuri","Ligao Bao"],"date":"2026-09-28","abstract":"Rural road plays a crucial role in improving market access, labour mobility, and public service delivery in remote regions. However, limited evidence exists on how rural residents evaluate alternative road investment designs and how household characteristics shape their preferences. This study investigates rural residents’ preferences for road development using a discrete choice experiment conducted in Inner Mongolia, China. The experiment presented respondents with hypothetical road investment scenarios characterized by variations in road quality, maintenance obligations, financing arrangements, construction employment opportunities, travel time reduction, expected income impacts, and house","doi":"10.1080/00036846.2026.2740197","venue":"Applied Economics","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["CN","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"サービス・IT・デジタル産業をミクロ経済学入門にどう組み込むか","url":"https://doi.org/10.5281/zenodo.23004996","authors":["Katsuhiko Kawai"],"date":"2026-09-28","abstract":"本稿は,Hernández-Julián and Limehouse (2026, Journal of Economics Teaching) “Coverage of the Services, Information Technology, and Digital Industries in Principles of Microeconomics Courses” を解説し,同論文が提案する三つの教材モデル―経済コンサルティング企業の短期費用曲線,限界費用ゼロのストリーミング・サービスの独占価格設定,ライドシェアに代表されるギグエコノミーの労働供給とプラットフォームの手数料・価格差別―を計算実験によって再現・拡張する。同論文は,主要出版社のミクロ経済学入門教科書 14 冊を調査し,生産・費用・市場構造の説明に用いられる「モデル構築のための事例」の過半が依然として製造業や天然資源産業から採られていること,サービス業や情報技術産業の事例は本文から切り離された囲み記事にとどまりがちであることを示した。本稿では,論文の表 2 を厳密に再現したうえで 3 次費用関数をあてはめ,操業停止価格と損益分岐価格を導出する。次に線形需要と限界費用ゼロの独占モデルを数値化し,利潤最大化点が需要の単位弾力的な点に一致すること,限界費用が正になると最適価格が弾力的領域に移ることを確認する。さらに異質な留保賃金をもつ 300 人のドライバーの供給を水平和した市場を構築し,摩擦のない市場・従量手数料を課すアプリ・完全価格差別を行うアプリの三つの状況における余剰配分と死荷重を計算し,需要ショック時のサ","doi":"10.5281/zenodo.23004996","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"Current status and 10-year trends of reimbursed robot-assisted surgery in Japan: a nationwide claims-based study using the NDB Open Data","url":"https://doi.org/10.1007/s00464-026-13374-4","authors":["Kojiro Taura","Meiki Fukuda","Eiji Tanaka","Kohta Iguchi","Yoshihisa Okuchi","Hisatsugu Maekawa","Takayuki Kawai","Kenzo Nakano","Yusuke Fujita","Koji Hisano","Yoshiki Oshimo","Hiroaki Terajima"],"date":"2026-09-28","abstract":"","doi":"10.1007/s00464-026-13374-4","venue":"Surgical Endoscopy","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"エネルギー単価と価格指数、広がる乖離","url":"https://doi.org/10.5281/zenodo.23006210","authors":["Koji Nomura","Sho Inaba"],"date":"2026-09-28","abstract":"エネルギーモニター, No. 2607 日本では、消費熱量当たりの単純単価と、消費構成の変化を調整したECM価格指数との乖離が2020年以降緩やかに拡大し、両者の比率は2026年1–6月平均で1.044となった。エネルギー価格を捉えるうえで、消費構成の変化を考慮することの重要性を示している。","doi":"10.5281/zenodo.23006210","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"Recurrence Triangle Features for Unsupervised Time Series Clustering: Application to Human Gait","url":"https://doi.org/10.3390/s26196137","authors":["Md Mehedi Hasan","Jun-ichiro Hirayama","Yoshiyuki Kobayashi","Masanori Shiro"],"date":"2026-09-28","abstract":"Unsupervised classification or clustering of complex time series generated from nonlinear dynamical systems remains challenging, particularly when signals exhibit noise and subtle structural differences. We develop a recurrence-based framework that captures local geometric patterns in recurrence plots by extracting triangular motifs, termed recurrence triangles (RTs), and mapping their relative frequencies to compact feature vectors for clustering. The approach is evaluated on four synthetic systems: the continuous-time Rössler and Lorenz systems and the discrete-time Logistic map and AR(2) model. RT-based features generally achieved higher clustering accuracy than classical recurrence quant","doi":"10.3390/s26196137","venue":"Sensors","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"ScenarioMIP-CMIP7: LN marker scenario analysis","url":"https://doi.org/10.5281/zenodo.23009080","authors":["Osamu Nishiura"],"date":"2026-09-28","abstract":"","doi":"10.5281/zenodo.23009080","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"計算実験で学ぶメカニズムデザイン入門編","url":"https://doi.org/10.5281/zenodo.23004486","authors":["Katsuhiko Kawai"],"date":"2026-09-28","abstract":"本冊子は、経済学部で基礎理論(ミクロ経済学と初歩のゲーム理論)を学び終えた学部生を対象に、メカニズムデザインの考え方を 8 つの応用例を通じて解説する。オークション、公共財の供給、研修医と病院のマッチング、売り手の収益を最大化するオークション、道路の混雑課金、排出権取引、航空券のクラス設計、クラウド計算資源の配分という身近な題材を取り上げ、各節で「場面の設定」「小さな数値例」「なぜそのルールがうまく働くのか」「Python による計算実験」の順に説明する。数学的な厳密さよりも直感的な理解を優先し、発展的な内容は同じ著者による発展編『計算実験で学ぶメカニズムデザイン』に譲る。8 つの応用例のあとに、学んだ内容を現実の制度設計(マーケットデザイン)へ広げるための指針を、学校選択・複数財のオークション・腎臓交換の数値例とともに述べる。巻末に用語集、計算実験に用いた Python スクリプトの初心者向け解説、および各節末の「考えてみよう」の模範解答を付した。","doi":"10.5281/zenodo.23004486","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"Evaluating intergenerational consequences by dominance: Efficiency when future identities are unobservable","url":"https://doi.org/10.1007/s00355-026-01674-6","authors":["Geir B. Asheim","Kohei Kamaga","Stéphane Zuber"],"date":"2026-09-28","abstract":"Abstract We examine the claim that Pareto Dominance can evaluate efficiency-improving policies with long-lasting intergenerational consequences. Climate policies is a prime example, seeking to correct the externality that emitters of greenhouse gases do not pay for the future consequences of their emissions. However, climate policies lead to different identities of future people, ruling out a personal interpretation of Pareto Dominance. Assuming that there are infinitely many future people whose identities are not observable, we specify conditions under which their spatiotemporal positions do not matter and where rank-ordered streams play an important role. We justify Rank-Order Dominance wh","doi":"10.1007/s00355-026-01674-6","venue":"Social Choice and Welfare","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["FR","JP","NO"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Healthcare Cost Patterns in CDK4/6 Inhibitor-Treated HR+/HER2- Metastatic Breast Cancer","url":"https://doi.org/10.1007/s40261-026-01591-7","authors":["Munenobu Kashiwa","Kensuke Moriwaki"],"date":"2026-09-28","abstract":"BACKGROUND AND OBJECTIVES: Cyclin-dependent kinase 4/6 inhibitors (CDK4/6i) are standard first-line treatment for hormone receptor-positive, human epidermal growth factor receptor 2-negative (HR+/HER2-) metastatic breast cancer, yet the cost architecture across the full treatment trajectory remains poorly characterized. This study aimed to characterize phase-specific healthcare costs using a Japanese nationwide claims database. METHODS: We conducted a retrospective cohort study using the DeSC-IQVIA integrated Claims data (April 2014-May 2025). Patients with HR+/HER2- metastatic breast cancer who initiated first-line CDK4/6i were identified. Healthcare costs were decomposed into drug, non-dru","doi":"10.1007/s40261-026-01591-7","venue":"Clinical Drug Investigation","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Stock exchange governance pressure and the valuation of liquid assets: Evidence from Japanese listed firms","url":"https://doi.org/10.1016/j.frl.2026.110825","authors":["Hideo Nakamura","Katsutoshi Shimizu"],"date":"2026-09-28","abstract":"This paper examines how the valuation of liquid assets changes under governance pressure created by the Tokyo Stock Exchange’s request. On March 31, 2023, the Tokyo Stock Exchange requested Prime and Standard Market firms to manage their businesses with greater awareness of the cost of capital and stock price. Using valuation regressions for Japanese listed firms, we find that the post-request valuation of liquid assets is relatively higher for firms subject to the request (treated firms) than for firms not subject to the request. We also find that, among treated firms, the marginal valuation of liquid assets declines more for high-return-on-equity (ROE) firms than for low-ROE firms followin","doi":"10.1016/j.frl.2026.110825","venue":"Finance research letters","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"A note on energy subsidies in Japan: a political economy perspective","url":"https://doi.org/10.1080/13504851.2026.2738768","authors":["Minoru Nakada","Naoko Hamashima"],"date":"2026-09-28","abstract":"This paper examines Japan’s energy subsidy policy through a simple political-economy framework. Standard microeconomic analyses imply that an optimal subsidy rate is zero. By contrast, in a Meltzer and Richard (1981) median-voter framework with income heterogeneity and majority voting, a positive energy subsidy may arise as a political equilibrium if the median household’s energy consumption, relative to the national average, exceeds its income share. Thus, energy subsidies may function as an imperfect form of income redistribution. Applying this condition to Japanese household data indicates that recent electricity subsidies align with political incentives predicted by the model. However, s","doi":"10.1080/13504851.2026.2738768","venue":"Applied Economics Letters","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Robust Mechanism Design on Networks with Externalities","url":"https://arxiv.org/abs/2609.35907","authors":["Kohmei Makihara"],"date":"2026-09-28","abstract":"We study how to allocate a good with positive externalities among agents in an information network, without monetary transfers. Each agent observes their own valuation and those of their neighbors. A principal seeks to allocate the good to the highest-valuation agent through a mechanism robust to agents' heterogeneous belief hierarchies, leveraging the network structure and the partial incentive alignment created by allocative externalities. We characterize the networks for which a robustly efficient mechanism exists: it exists if and only if at least two agents are connected to all others. Relaxing robustness to rule out weakly dominated strategies, one universally connected agent suffices.","doi":"10.48550/arxiv.2609.35907","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Basket implied volatility skew and stickiness","url":"https://arxiv.org/abs/2609.38230","authors":["Masaaki Fukasawa","Jun Maeda","Tatsuya Ogiwara"],"date":"2026-09-28","abstract":"We study the short-maturity implied volatility and the skew stickiness ratio for baskets of assets with continuous, possibly rough, stochastic volatility. The fluctuation of the instantaneous basket variance has two sources: fluctuations of the constituent variances and fluctuations of the basket weights. We derive a near-the-money implied volatility expansion that separates these contributions. We then specialize the result to volatility models given by general functions of Gaussian Volterra factors and obtain an explicit basket skew coefficient in terms of the short-time kernel asymptotics, the factor sensitivities, and the return-factor correlations. A density expansion justifies differen","doi":"10.48550/arxiv.2609.38230","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"A Scientometrics Analysis of Eye-Drops in China: Research, Patenting, Developing, Licensing, and Innovation","url":"https://doi.org/10.66977/xsci.2609.0006","authors":["Yueqing Huang"],"date":"2026-09-28","abstract":"Aim/Background. Normally, it is believed that Japanese pharmaceutical corporations have experienced a notable decline in recent decades, especially in the international market. Materials and Methods. Drawn on scientometrics data, this study revisits this assumption through the case of China’s eye drop sector, a niche field traditionally dominated by Japanese and Swiss-German pharmaceutical corporations. Result. A framework based on the drug life cycle is developed, to assess the ever-changing landscape of China’s eye drop sector from the late 1970s to the early 2020s. Analysis results suggest a more serious decline in representative European pharmaceutical corporations than in Japanese pharm","doi":"10.66977/xsci.2609.0006","venue":"","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Quantitative Verification and Mathematical and Structural Stress Testing of Bitcoin Valuation Models and Computational Foundations ビットコイン評価モデルの定量的検証と数理・構造ストレステスト / Quantitative Verification and Mathematical and Structural Stress Testing of Bitcoin Valuation Models and Computational Foundations","url":"https://doi.org/10.5281/zenodo.23003164","authors":["Yoko Hasebe"],"date":"2026-09-28","abstract":"Abstract (English) Bitcoin’s economic valuation has historically been anchored in intuitive scarcity narratives—most notably the deterministic 21-million supply cap, the Stock-to-Flow (S2F) power-law pricing model, and Metcalfe’s quadratic network scaling (N²). This paper presents an exhaustive quantitative verification and stress test spanning Bitcoin Core’s C++ source code, econometric time-series dynamics, and on-chain microstructural forensics, demonstrating substantial structural divergence between prevailing market narratives and mathematical reality. First, protocol-level code auditing reveals intrinsic computational constraints: integer truncation via right bit-shift operations (nSub","doi":"10.5281/zenodo.23003164","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"Japan MLB Pitchers Batters Statcast","url":"https://doi.org/10.34740/kaggle/dsv/20092982","authors":["Ymori"],"date":"2026-09-28","abstract":"","doi":"10.34740/kaggle/dsv/20092982","venue":"Kaggle","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Japanese MLB Players Statcast 2015-2026","url":"https://doi.org/10.34740/kaggle/dsv/20096977","authors":["Ymori"],"date":"2026-09-28","abstract":"","doi":"10.34740/kaggle/dsv/20096977","venue":"Kaggle","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Rounding Rules in Retail Foreign Exchange Interfaces: Evidence from CNY and HKD Quotes","url":"https://doi.org/10.21203/rs.3.rs-11165583/v1","authors":["Ruirui Deng"],"date":"2026-09-28","abstract":"","doi":"10.21203/rs.3.rs-11165583/v1","venue":"Research Square","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Green Technological Advances as a Basis for Climate Strategies in Industrialized Countries","url":"https://doi.org/10.64599/fdhe9123","authors":["Rashiya Bekmurzaeva","Varvara Goryacheva","Ravil Ramilevich Asmyatullin"],"date":"2026-09-28","abstract":"Green technological advances are increasingly serving as the foundation for national climate strategies in industrialized countries, enabling ambitious emissions reductions while fostering economic growth, energy security, and industrial competitiveness. This study examines the role of key innovations — such as highefficiency renewable energy systems, green hydrogen, carbon capture and storage (CCS), smart grids, electrification of industry, and circular economy technologies — in shaping climate policies across leading economies, including the European Union, the United States, Japan, and South Korea. The analysis reveals that these technologies are no longer supplementary tools but central ","doi":"10.64599/fdhe9123","venue":"International Journal of Sustainability and Risk Control","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["RU"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Does economic policy uncertainty affect public pension spending? Evidence from Japan","url":"https://doi.org/10.1017/s1474747226100213","authors":["Esmatullah Karimi","Fei Fan"],"date":"2026-09-28","abstract":"Abstract We study the impact of economic policy uncertainty (EPU) on public pension spending (PPS) in Japan from 1997 to 2024, employing the autoregressive distributed lag (ARDL) approach alongside kernel-based regularized least squares (KRLS), a machine learning method that does not require a predefined functional form. The results show that higher EPU is negatively associated with PPS in the long run, while short-run estimates indicate a significant positive association. The KRLS results show a somewhat larger negative association compared to the ARDL model, and estimates across EPU quantiles indicate that the negative association varies across the EPU distribution. Heterogeneity analysis ","doi":"10.1017/s1474747226100213","venue":"Journal of Pensions Economics and Finance","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["CN"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"A Comparative Analysis of the Export Competitiveness of the Indonesian and Philippine Fisheries Sectors in the International Market","url":"https://jurnal.buddhidharma.ac.id/index.php/PE/article/view/4699","authors":["Rt Siti NurFaizah"],"date":"2026-09-28","abstract":"This study aims to analyze and compare the export competitiveness of the fisheries sector between Indonesia and the Philippines in the international market. The study uses a quantitative approach with Revealed Comparative Advantage (RCA) analysis based on secondary data from 2025 obtained from BPS and UN Comtrade. The results indicate that Indonesia has a comparative advantage in all fisheries commodities across five major markets: the United States, Japan, China, the European Union, and South Korea, with RCA values greater than one. In contrast, the Philippines only shows comparative advantage in selected commodities such as seaweed. These findings suggest that Indonesia has stronger and mo","doi":"10.31253/pe.v24i3.4699","venue":"Primanomics Jurnal Ekonomi & Bisnis","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["ID"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"選定療養費導入による後発医薬品使用への影響 : 医科入院を比較基準とする供給経路別分析","url":"https://hdl.handle.net/11094/106649","authors":["Takumi Gotoh"],"date":"2026-09-28","abstract":"Price policies to promote generic drug use may have different effects across supply pathways. Previous studies show that patient and physician preferences, inertia in past choices, and pharmacy explanations about generic substitution affect switching, but little is known about how a common change in patient cost sharing affects outpatient medical care, dental care, and pharmacy dispensing differently. This study uses the selected medical treatment charge for long-listed originator drugs, introduced nationwide in Japan in October 2024, as a cost-sharing shock. Using monthly aggregate data from the Japan Health Insurance Association, disaggregated by prefecture, age group, therapeutic class, a","doi":"","venue":"Institutional Repositories DataBase (IRDB)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"Робототехника как объект промышленной политики: международные уроки и дизайн отраслевой политики в России","url":"https://doi.org/10.31737/22212264_2026_3_332-338","authors":["А.А. Федюнина","А.Д. Дергачева","Ю.В. Симачев"],"date":"2026-09-28","abstract":"Робототехника занимает особое место среди объектов промышленной политики, поскольку одновременно выступает самостоятельной высокотехнологичной отраслью и технологией широкого применения, определяющей темпы роста производительности, модернизации производства и технологического обновления экономики. В условиях дефицита трудовых ресурсов, низких темпов роста производительности труда, внешних ограничений и необходимости достижения технологического суверенитета робототехника становится одним из приоритетных объектов промышленной политики России. Цель статьи заключается в анализе уроков международного опыта развития робототехнической отрасли и обсуждении направлений совершенствования российской пр","doi":"10.31737/22212264_2026_3_332-338","venue":"Journal of the New Economic Association","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["RU"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"An IV Hazard Model of Loan Default with an Application to Subprime Mortgage Cohorts","url":"https://doi.org/10.1111/jofi.70088","authors":["CHRISTOPHER J. PALMER"],"date":"2026-09-28","abstract":"ABSTRACT I develop a control function methodology robust to endogenous or mismeasured regressors in hazard models. Applying the estimator to the subprime mortgage crisis, I quantify what caused the foreclosure rate to triple across the 2003 to 2007 subprime cohorts. To identify the elasticity of default to housing prices, I use various home price instruments including historical variation in home price cyclicality. Loose credit played a significant role in the crisis, but much of the increase in defaults across cohorts was caused by price declines unrelated to lending standards, with a 10% price decline increasing subprime mortgage default rates by 50%.","doi":"10.1111/jofi.70088","venue":"The Journal of Finance","sources":["Journal of Finance"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"An Analysis of the Literature on Monetary Policy Shocks","url":"https://d.repec.org/n?u=RePEc:fip:fedlwp:103833&r=&r=mon","authors":["Christopher J. Neely"],"date":"2026-09-27","abstract":"Monetary policy has been the primary tool of macroeconomic management since the 1970s. As a result, the effects of monetary shocks became an important area of policy research. In the 1980s, event studies showed that U.S. monetary-aggregate announcements strongly affected asset prices, although no single model readily explained the responses. Greater central-bank transparency in the 1980s and 1990s increased interest in measuring monetary policy's effects on financial and macroeconomic variables. In the 1990s, researchers predominantly used vector autoregressions (VARs) to estimate the effects of monetary shocks. This work raised questions about why monetary shocks explained little output var","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["monetary policy shocks; central-bank information effects; federal funds target; forward guidance; high-frequency identification; structural vector autoregressions; external instruments"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"The Potential of Nighttime Light Imagery for Detailed Local Economic Analysis","url":"https://arxiv.org/abs/2609.33859","authors":["Shoichi Otomo"],"date":"2026-09-27","abstract":"This manuscript is an English translation and extended version of a paper originally published in Japanese (2022). Driven by remarkable advances in remote sensing and big data processing, spatial technologies are increasingly leveraged in economic research. While satellite nighttime light intensity is widely recognized for tracking macroeconomic parameters - such as regional GDP, employment, and population - less attention has been paid to fine-grained spatial processing methodologies for local tourism economies. This study first details a raster processing technique applied to nightlight imagery. It then focuses on Yuzawa Town (Uonuma District, Niigata Prefecture), analyzing the local econo","doi":"10.20729/00217468","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["cs.CY","econ.EM"],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Calibrated Order-Randomized Rosenblatt Tests","url":"https://arxiv.org/abs/2609.37477","authors":["Mehrdad Pournaderi"],"date":"2026-09-27","abstract":"We test whether a multivariate vector X conforms to a specified distribution F, a problem in copula modelling and density forecasting. The Rosenblatt transform reduces it to a test of uniformity, but depends on an arbitrary coordinate ordering that strongly affects power under dependence. We study order randomization: applying the transform under many random orderings and merging the evidence with dependence-robust rules. Reordering conserves the total Mahalanobis signal energy and merely redistributes it, so one ordering is a lucky or unlucky draw. In simulations we observe significant gains in calibrated power over both the expected single random ordering and order-invariant references. Tw","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.AP","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"A One-Saddle 1/5 Approximation Algorithm for Common-Kernel Bimatrix Games: Recognition, Exact Segment Optimization, Sharp Selector Bounds, and Certified Robustness","url":"https://arxiv.org/abs/2609.33471","authors":["Davit Gondauri"],"date":"2026-09-27","abstract":"We study a fixed-normalization class of symmetric bimatrix games generated by a common kernel and show that it admits efficient approximation despite exact symmetric-equilibrium computation remaining PPAD-hard. For every rational game in the class, a single auxiliary zero-sum saddle computation yields a rational symmetric \\(1/5\\)-approximate Nash equilibrium in polynomial time. We also give exact recognition and unique kernel recovery, and an exact polynomial-time post-processing algorithm that minimizes regret along the segment joining the selected saddle strategies. For arbitrary rational square games, we formulate the nearest common-kernel projection as a linear program with an explicit d","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Evolution of Market Microstructure in the Age of AI","url":"https://arxiv.org/abs/2609.33058","authors":["Irene Aldridge"],"date":"2026-09-27","abstract":"Market microstructure studies how trading rules turn orders into prices and allocations. Those rules have been rebuilt repeatedly: for floor traders, electronic limit order books and high-frequency trading, batch auctions and dark pools, blockchains run by automated market makers and block builders, and now AI agents that discover, pay for, and compete over resources. This survey traces that evolution through one question: can a market allocate scarce goods efficiently and fairly without participants revealing everything they know and want? Each technological shift moved the binding constraint of market design from trader rationality to speed, to control over transaction ordering, to the dim","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["cs.GT","econ.EM","q-fin.GN","q-fin.TR"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Association Between Volcanic Rock Area Ratio and Regional Variation in Acne Medication Utilisation in Japan: A Nationwide Ecological Study","url":"https://doi.org/10.3390/environments13100537","authors":["Ryosuke Shinkai","Genki Shinohara","Takahiro Amemiya","Takashi Tomita"],"date":"2026-09-27","abstract":"Regional variation in healthcare utilisation is influenced by demographic, healthcare, and environmental factors; however, the contribution of regional geological characteristics remains poorly understood. This nationwide ecological study investigated whether the volcanic rock area ratio (VRAR) was associated with regional variation in acne medication utilisation across the 47 prefectures of Japan. Acne-specific prescription volumes for 2022 were obtained from the National Database of Health Insurance Claims and Specific Health Checkups of Japan and analysed using Spearman’s rank correlation, locally estimated scatterplot smoothing (LOESS), multivariable linear regression, influence and sens","doi":"10.3390/environments13100537","venue":"Environments","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Analysis of conflicted nodes in three-state threshold dynamics on signed networks","url":"https://doi.org/10.1016/j.chaos.2026.119234","authors":["Naoki Hirakura"],"date":"2026-09-27","abstract":"The spread of opinions and behaviors on networks is studied as complex contagion, where individual attitudes change through cumulative influence from multiple neighbors, primarily within the framework of the linear threshold model. Analytical methods including mean-field approximation, pair approximation, and approximate master equations (AMEs) have been developed for this purpose. Models on signed networks and three-state models distinguishing adoption, opposition, and indecision have also been investigated, but the former have mostly been limited to two-state dynamics, while the latter have relied mainly on simulations. The absence of an analytical framework for models combining both featu","doi":"10.1016/j.chaos.2026.119234","venue":"Chaos Solitons & Fractals","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"capAItalism: a research program for re-deriving the forces and factors of capitalism under artificial intelligence","url":"https://doi.org/10.5281/zenodo.22983777","authors":["Jovan David Rebolledo-Mendez"],"date":"2026-09-27","abstract":"This concept note introduces and dates the term capAItalism — capitalism with AI substituted at its core — and states the research program the term names: the primitives from which capitalist economies are derived (exchange, supply, demand; labour, resources, production, capital, money/value) must each be re-derived when the optimising agents inside the market are no longer exclusively human. It gives a working definition, decomposes it into eight primitives with the classical assumption each rests on, the way AI violates it and the observable that would show it, states two falsifiable propositions (fear-of-AI as displaced fear of accelerated capitalism; Hinton's maternal-instinct proposal r","doi":"10.5281/zenodo.22983777","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"smprime: the prime structure of stable-matching instances","url":"https://doi.org/10.5281/zenodo.22984730","authors":["Yoshiteru Ishida"],"date":"2026-09-27","abstract":"Code and data for Prime factorisation of stable-matching instances: uniqueness, simultaneous products, and an exact census. Two independent implementations of serial deferred acceptance built from the definitions, the blocks and the unique finest partition they generate, the exact census of prime instances in exact integer arithmetic, and a verification suite that re-derives every checkable number of the paper and prints PASS or FAIL. Includes a dataset of all 46,656 size-three instances with their invariants. Scope: strict and complete preference lists on both sides, equal numbers of proposers and receivers, and a serial scheduler. Nothing here applies to ties, synchronous updates, many-to-","doi":"10.5281/zenodo.22984730","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Agglomeration economies, mechanisation and changes in product quality: The post‐war development of the sake brewery clusters in Japan, 1980–2020","url":"https://doi.org/10.1111/aehr.70040","authors":["Yuya Aikawa","Nobuaki Hamaguchi","Tomoko Hashino","Keijiro Otsuka"],"date":"2026-09-27","abstract":"Abstract Agglomeration economies contribute to firm performance; however, their changing roles are rarely analysed. This study explores how technology choices and the changing nature of agglomeration economies affected firm performance in the Japanese sake (rice wine) brewing industry from 1980 to 2020. Using plant‐level data, we find that agglomeration benefits arose from sales of sake from small unknown firms to large established firms when production was labour‐intensive. These inter‐firm transactions, however, diminished as scale economies emerged with mechanisation. As the demand for high‐quality sake increased, collective internalisation of information spillover benefits appears to bec","doi":"10.1111/aehr.70040","venue":"Asia‐Pacific Economic History Review","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Electoral timing and local user charges: evidence from sewerage tariffs in Japan","url":"https://doi.org/10.1007/s11127-026-01482-7","authors":["Yoshimi Adachi","Hikaru Ogawa"],"date":"2026-09-27","abstract":"","doi":"10.1007/s11127-026-01482-7","venue":"Public Choice","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Uncovering Non-Normality in Information Flow: Network Structure and Dynamics of Social Media Cascades","url":"https://arxiv.org/abs/2609.34026","authors":["Qianyun Wu","Bruno Toshio SUGANO","Genta Toya","Kei Ichikawa","Yasuhiro Hashimoto","Masashi Toyoda","Naoki Yoshinaga","Kazutoshi Sasahara"],"date":"2026-09-27","abstract":"Information cascades on social media are conventionally conceptualized as directed, feedforward branching processes. However, real-world diffusion pathways frequently deviate from pure hierarchical trees due to localized clustering, reciprocal commentary, and multi-wave temporal surges. In this work, we quantify the directional asymmetry and hierarchical structure of empirical information cascades on X (formerly Twitter) using spectral non-normality via Henrici's departure from normality. Analyzing approximately 58,000 cascade networks across diverse topics (including politics, entertainment, natural disasters, etc.), we investigate (1) how non-normality relates to temporal dynamics such as ","doi":"10.48550/arxiv.2609.34026","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Monotone Mixing and Distribution Dynamics","url":"https://arxiv.org/abs/2609.33900","authors":["Takashi Kamihigashi","Qingyin Ma","John Stachurski"],"date":"2026-09-27","abstract":"Many economic applications establish stability of Markov dynamics using the monotone mixing condition (MMC) of Hopenhayn and Prescott (1992). Working in the same setting as that paper, we introduce a weak monotone mixing condition (WMMC), phrased in terms of the reversal of rank between populations, and show that it is strictly weaker than the MMC and both necessary and sufficient for global stability under the Kolmogorov metric. We apply these results to a small open economy version of the Aiyagari model, showing how the WMMC can be used to establish global stability in a setting where the MMC fails. In addition, we show that, when the state space is one-dimensional, the MMC and WMMC coinci","doi":"10.48550/arxiv.2609.33900","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["CN","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"When Growth Meets the Cost of Capital: Terminal Value under Measured Business Survival","url":"https://doi.org/10.5281/zenodo.22983802","authors":["Ruben Freitas"],"date":"2026-09-27","abstract":"The constant-growth perpetuity fails when nominal growth reaches the discount rate: the factor 1/(r − g) becomes infinite at g = r and undefined beyond it. This paper shows that the failure is an artifact of the implicit assumption that the firm never ceases to exist. When each cash flow is weighted by the probability that the firm survives to generate it, the terminal-value factor under a constant exit hazard h becomes, to first order, 1/(r − g + h). The singularity moves from g = r to g ≈ r + h, a boundary that can be measured. Under an extrapolated Weibull curve the domain of convergence depends on the shape parameter; under the tail convention used in practice, a hazard frozen at the las","doi":"10.5281/zenodo.22983802","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Informational Superiority of Schmittian Notation as a Macroeconomic State Description: Comparing the Departmental Status and Logical Order of Profit through SPC","url":"https://doi.org/10.5281/zenodo.22983560","authors":["Nyun"],"date":"2026-09-27","abstract":"This working paper examines the informational content of Schmittian three-department bookkeeping through Sequential Provenance Comparison (SPC). Using the numerical example 100–80–20 discussed by Andrea Carrera, the paper compares two analytically distinguished states: one in which profit of 20 has been formed in Department II, and another in which it has been transferred to Department III. Although the two states have equal aggregate values for deposits, claims on firms, profit, goods, and the consolidated external net balance of the banking system, they differ in the departmental status of profit and in whether the required transfer has been completed. The paper shows that aggregate notati","doi":"10.5281/zenodo.22983560","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"New edge proposed: harami_cross_reversal — E8 Intelligence Research","url":"https://doi.org/10.5281/zenodo.22986928","authors":["Andrew Stewart Caldin"],"date":"2026-09-27","abstract":"{ \"name\": \"harami_cross_reversal\", \"source\": \"Steve Nison, Japanese Candlestick Charting Techniques\", \"type\": \"entry_engine\", \
