<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">

<title>論文新着コレクター</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1f23; --muted:#5d636e; --faint:#8a909a;
  --line:#e3e1da; --accent:#1f5f8b; --accent-soft:#e3eef6;
  --jp:#a1442b; --jp-soft:#f7e6df; --ecm:#2f6f4f; --ecm-soft:#e1f0e7; --star:#8a5a00; --star-soft:#fbefd4;
  --err:#9b2c2c;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181c; --panel:#1f2227; --ink:#e7e8ea; --muted:#a6acb6; --faint:#7d838d;
    --line:#30343b; --accent:#7fb6dd; --accent-soft:#1d3240;
    --jp:#e79a82; --jp-soft:#3a241d; --ecm:#86c9a3; --ecm-soft:#1c3226; --star:#e8c072; --star-soft:#3a2f17;
    --err:#f19a9a;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  line-height:1.6;font-size:15px}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 64px}
header h1{font-size:22px;margin:0 0 4px;letter-spacing:.02em}
.status{color:var(--muted);font-size:13px}
.status details{display:inline}
.status summary{cursor:pointer;color:var(--err)}
.status ul{margin:6px 0 0;padding-left:18px}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.row .label{font-size:12px;color:var(--faint);width:44px;flex:none}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;
  padding:4px 11px;font-size:13px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chip .n{opacity:.7;margin-left:4px;font-size:12px}
input[type=search]{flex:1;min-width:180px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:8px;padding:7px 10px;font-size:14px;font-family:inherit}
.count{font-size:13px;color:var(--muted);margin:10px 0 4px}
h2.day{font-size:13px;color:var(--muted);font-weight:600;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px dashed var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.card h3{font-size:15.5px;margin:0 0 4px;line-height:1.45;font-weight:600}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--accent);text-decoration:underline}
.meta{font-size:12.5px;color:var(--muted)}
.badges{display:inline-flex;gap:4px;margin-right:6px;vertical-align:1px}
.b{font-size:11px;border-radius:4px;padding:1px 6px;font-weight:600}
.b.jp{background:var(--jp-soft);color:var(--jp)}
.b.ecm{background:var(--ecm-soft);color:var(--ecm)}
.b.star{background:var(--star-soft);color:var(--star)}
details.abs{margin-top:6px;font-size:13.5px}
details.abs summary{cursor:pointer;color:var(--faint);font-size:12.5px}
details.abs p{margin:6px 0 0;color:var(--ink)}
.tools{margin-top:6px;display:flex;gap:10px;font-size:12px}
.tools button{background:none;border:none;color:var(--faint);cursor:pointer;padding:0;font-family:inherit;font-size:12px}
.tools button:hover{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.more{display:block;margin:16px auto;}
@media (max-width:600px){.row .label{width:100%}}
</style>
</head>

  </div>

  <div class="count" id="count"></div>
  <div id="list"></div>
  <button class="chip more" id="more" hidden>さらに表示</button>
</div>

gs to better inform future policy decisions in","doi":"10.2118/234359-ms","venue":"SPE Asia Pacific Oil & Gas Conference and Exhibition (APOGCE)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["AU"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Parliamentary workload and outpatient medical costs among Japanese national civil servants: An ecological study in Kasumigaseki","url":"https://doi.org/10.5271/sjweh.4338","authors":["Koryu Sato","Hirotaka Kato","Kosuke Inoue","Naoki Kondo","Ichiro Kawachi"],"date":"2026-10-11","abstract":"OBJECTIVES: This study aimed to examine whether ministry-level parliamentary workload was associated with outpatient medical costs among Japanese national civil servants, who are exempt from the Labor Standards Act's statutory limits on working hours. METHODS: We conducted an ecological study of headquarters branches (\"Kasumigaseki\") of ten major cabinet-level ministries, 2016-2023. Participants were Japanese national civil servants aged 18-50 years. The analysis included 6454 outpatient claims adjudicated in April of each year. The outcome was sex- and age-standardized per-capita monthly outpatient costs, estimated using Horvitz-Thompson weighting. Inter-ministry differences were decomposed","doi":"10.5271/sjweh.4338","venue":"Scandinavian Journal of Work Environment & Health","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The presence of prior-effects of the Medicaid expansion on Drug prescription","url":"https://doi.org/10.1080/14737167.2026.2746156","authors":["Andrew Kim","Taisuke Sadayuki"],"date":"2026-10-11","abstract":"","doi":"10.1080/14737167.2026.2746156","venue":"Expert Review of Pharmacoeconomics & Outcomes Research","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP","US"] er embedding lucrative, state-sanctioned loopholes (medicinal whiskey prescription monopolies, sacramental exemptions, industrial alcohol diversions, and private agricultura","doi":"10.5281/zenodo.23275440","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The Systemic Anatomy of \"Neo-Fukoku Kyohei\": Modernization Trauma, the Global AI Arms Race, and the Re-Anchoring of Human Dignity","url":"https://doi.org/10.5281/zenodo.23273332","authors":["Yoko Hasebe"],"date":"2026-10-10","abstract":"【Abstract】This strategic systems and historical sociology monograph examines the structural convergence between Meiji Japan's foundational state modernization doctrine—\"Fukoku Kyohei\" (Enrich the Country, Strengthen the Military)—and the contemporary global arms race for Artificial General Intelligence (AGI) and autonomous weapon systems. Emerging from the existential geopolitical shock of Western imperialism, the historical Meiji state fused state-sponsored industrialization with rapid militarization, creating a self-reinforcing mobilization engine that ultimately subordinated individual dignity, civil society, and thermodynamic resource realities to competitive geopolitical survival, culmi","doi":"10.5281/zenodo.23273332","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Workers wage and consumer goods prices late Russian empire era 1900-1917.","url":"https://doi.org/10.5281/zenodo.23275159","authors":["Kazuma Moriwaki"],"date":"2026-10-10","abstract":"Economic data before Russian revolution 1917. This data focuses workers wage and consumer goods price. Language: Japanese/English This data is AI Generated based on human planning, support, surveilance.","doi":"10.5281/zenodo.23275159","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"An Unsupervised Intelligent System for Adaptive Decision Control in Non-Stationary Financial Environments","url":"https://doi.org/10.3390/jrfm19100801","authors":["Nasser Mianei","Vitaliy Milke","Man-Fai Leung","Cristina Luca"],"date":"2026-10-10","abstract":"Intelligent decision systems assume a stable relationship between observations and outcomes. Financial markets violate that assumption, since shifts in volatility, trend and liquidity erode models trained on historical data. This study proposes an unsupervised decision system that restricts trading according to market conditions. Features from multiple time horizons are partitioned by walk-forward clustering into distinct market states, and execution is permitted only when the state satisfies predefined conditions, so that clustering governs when predictions are acted upon rather than how they are formed. The framework is evaluated on gold, Bitcoin, the S&P 500, Nasdaq 100, Dow Jones and the","doi":"10.3390/jrfm19100801","venue":"Journal of risk and financial management","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["GB"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"sfukui/RegionalIOTables: v2.0","url":"https://doi.org/10.5281/zenodo.23286359","authors":["sfukui"],"date":"2026-10-10","abstract":"2015 input-output tables on 13 industrial classifications and various related macroeconomic data, for Japan as a whole, its prefectures, and some cities.","doi":"10.5281/zenodo.23286359","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"ta _seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"【WTO等国際通商判例解説㊺】中国の知的財産権に関する措置（WT/DS611/11、WT/DS611/ARB25）－標準必須特許をめぐる「禁訴令」とTRIPS協定の射程－","url":"http://www.rieti.go.jp/jp/publications/summary/26100005.html","authors":["髙嵜 直子（アンダーソン・毛利・友常法律事務所）"],"date":"2026-10-09","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ポリシー・ディスカッション・ペーパー（日本語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"Realized Tail-Risk Conditional Autoregressive Expectile Models: Accurate and Stable Forecasting Performance","url":"https://arxiv.org/abs/2610.13446","authors":["Keisuke Sasaki","Yasuhiro Omori"],"date":"2026-10-09","abstract":"A realized tail-risk conditional autoregressive expectile (RTCARE) model is proposed for joint forecasting of value-at-risk (VaR) and expected shortfall (ES). Realized tail measures such as the realized quantile and the realized ES, constructed from intraday high-frequency returns, are incorporated into the dynamics and measurement equations of the conditional expectile, allowing information about lower-tail risk to enter the forecasts. The parameters are estimated by Markov chain Monte Carlo, and we evaluate the resulting VaR-ES forecasts in numerical examples and in an empirical application using U.S. stock-return data. Across the considered tail levels, the RTCARE models deliver competiti","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","q-fin.RM","stat.AP"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Intentionally Overidentifying Local Projections","url":"https://arxiv.org/abs/2610.13269","authors":["Junjie Guo","Endong Wang","Ke-Li Xu"],"date":"2026-10-09","abstract":"Local projections (LPs) have become a standard tool for estimating dynamic effects in macroeconomics and are typically implemented using ordinary least squares (OLS) for a given lag order. We propose an alternative approach that exploits additional lags as excluded instrumental variables (IVs). Under a finite-order model with martingale-difference shocks, the resulting (optimally weighted) IV estimator is never asymptotically less efficient than OLS and, as we show, can deliver substantial efficiency gains when data are persistent. For the unit-root AR(1) data with i.i.d. errors, our baseline IV estimator (with one overidentifying restriction) has asymptotic variance $2-h^{-1}$, compared wit","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"An efficient stochastic generalized method of moments estimator for nonlinear moment models","url":"https://arxiv.org/abs/2610.12873","authors":["Duy Nguyen"],"date":"2026-10-09","abstract":"We study the asymptotic properties of the nonlinear stochastic GMM algorithm proposed by Chen, Lee, Liao, Seo, Shin and Song for recursively estimating parameters defined by possibly nonlinear and overidentified moment restrictions $\\E[g(X,β^*)]=0$. Each observation updates estimates of the moment Jacobian, inverse covariance matrix and Gauss--Newton preconditioner at a cost independent of sample size. For linear and nonlinear instrumental-variable moments, we derive an exact rank-two Sherman--Morrison--Woodbury update. The algorithm combines preconditioned stochastic approximation with iterate averaging. Under a preconditioned monotonicity condition, satisfied globally in linear models and ","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","math.PR","math.ST","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"GMM for Panel Data Quantile Regression","url":"https://arxiv.org/abs/2610.12824","authors":["Antonio F. Galvao","Ulrich Hounyo","Jiahao Lin"],"date":"2026-10-09","abstract":"This paper develops a smoothed generalized method of moments (GMM) framework for panel quantile models with individual-specific fixed-effects and endogenous regressors. By smoothing the indicator in the quantile moment conditions and profiling out the individual effects through smoothed individual quantile restrictions, the proposed estimator can be implemented using standard GMM algorithms. We establish consistency, asymptotic normality, and feasible inference under weak time dependence as both panel dimensions diverge. This dependence structure accommodates dynamic panel specifications, serially dependent disturbances, lagged instruments, and within-individual heteroskedasticity and autoco","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Applied economic reasoning in air transport management: A question- and concept-level analysis of an airport business course","url":"https://doi.org/10.1016/j.jairtraman.2026.103137","authors":["Toru Hasegawa"],"date":"2026-10-09","abstract":"Economic reasoning underpins business decision-making. Yet how it is taught and assessed in air transport management education remains underexplored. Drawing on final-exam data from an Airport Business course for non-specialists at a Japanese university, this study identifies aspects of assessed economic reasoning that appeared relatively more demanding. At the question level, the higher-difficulty side concerned airport network financing, restructuring, and public support, whereas the lower-difficulty side addressed charge pass-through, the club-good characteristics of small-airport services, and concession-contract risks. At the concept level, government failure, incentives, and user-pays ","doi":"10.1016/j.jairtraman.2026.103137","venue":"Journal of Air Transport Management","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Non-Physician Areas in Japan: Typological Classification Based on Regional Demographic Characteristics","url":"https://doi.org/10.2196/101570","authors":["Takashi Kuwayama","Kazuhiko Kotani"],"date":"2026-10-09","abstract":"Abstract Background Across Japan, there are “non-physician areas” where medical institutions are not present and health care access is difficult. Although these areas are defined as a single administrative category, they may vary according to regional demographic characteristics. Understanding this possible heterogeneity may be important for developing more context-sensitive strategies to improve health care accessibility. Objective This study examined whether non-physician areas can be classified based on regional demographic characteristics using an unsupervised machine learning model. Methods A total of 590 non-physician areas were identified from the national survey conducted by the Mini","doi":"10.2196/101570","venue":"JMIR Formative Research","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Drivers of multidimensional financial inclusion in Ghana’s informal sector","url":"https://doi.org/10.1080/23322039.2026.2735121","authors":["Michel Adurayi Amenah","Matilda Kabutey-Ongor","Ishmael K. K. Tsatsu","Dominic Owusu","Fidelia Ohemeng","Kenneth Ofori‐Boateng","Wiliams Ohemeng"],"date":"2026-10-09","abstract":"Financial inclusion is an important contributor to inclusive growth and household resilience, yet substantial disparities persist among informal-sector households in developing economies. This study examines changes in multidimensional financial deprivation among Ghana’s informal-sector households between the Ghana Living Standards Survey (GLSS) 6 (2012/13) and GLSS7 (2016/17) and investigates the factors associated with these changes. Using nationally representative data, we construct a four-pillar Alkire–Foster index covering account ownership, credit access, insurance and remittances. We analyse a binary multidimensional deprivation indicator (FImpi, cutoff k = 0.5) and a continuous depri","doi":"10.1080/23322039.2026.2735121","venue":"Cogent Economics & Finance","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["GB","GH","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"K-Index as an Exploratory Quantitative Indicator of Competitive Structure: A Comparative Review of Japanese Industry Evidence","url":"https://doi.org/10.3390/businesses6040054","authors":["Takumu Doi","Yoshitaka Miyake"],"date":"2026-10-09","abstract":"Porter’s Five Forces remains a foundational framework in strategic management, but its application is often qualitative and can be difficult to compare across industries shaped by digitalization, network effects, and intangible capital. This study examines the K-Index (K) through a comparative review of published estimates of scale elasticity across five Japanese industries: automotive, printing, retail, financial services, and information services. K is treated as a quantitative indicator of latent competitive structure, particularly related to entry barriers and concentration pressure. The reviewed evidence shows that information services exhibit the strongest positive K values, ranging fr","doi":"10.3390/businesses6040054","venue":"Businesses","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Asset-based model of innovation: Governance structure and the coevolution of complementary and innovation assets","url":"https://doi.org/10.1007/s00191-026-00981-6","authors":["Tsutomu Harada"],"date":"2026-10-09","abstract":"Abstract This paper develops an asset-based dynamic model of innovation that links governance structure to the co-evolution of complementary and innovation assets. By representing these assets as interdependent dynamic stocks, the framework provides a formal account of how ownership and appropriation choices may affect the rate and direction of capability accumulation. Governance influences innovation not only through incentive alignment but by altering two structural parameters—an inhibitory effect that stabilizes complementary assets and an absorptive effect that enhances innovation productivity. The model highlights four main implications: high appropriation may induce technological lock-","doi":"10.1007/s00191-026-00981-6","venue":"Journal of Evolutionary Economics","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Sovereign Money, Resource Enclosures, and Cryptographic Scarcity: A Systems-Theoretic Analysis of the 1931 Manchurian Rupture and the Physical Limits of Algorithmic Currency","url":"https://doi.org/10.5281/zenodo.23269383","authors":["Yoko Hasebe"],"date":"2026-10-09","abstract":"【Abstract】This strategic systems monograph establishes a formal comparative framework linking the 1931 monetary rupture—characterized by the collapse of the international gold standard, competitive currency devaluations, and Imperial Japan's militarized resource enclosure during the Manchurian Incident—with contemporary algorithmic currencies, specifically Bitcoin. The paper argues that both historical episodes represent radical systemic responses to the breakdown of sovereign monetary anchors and the unchecked dilution of fiat credit. While contemporary retail speculation treats Bitcoin's micro-volatility as an isolated financial phenomenon, historical systems theory reveals that currency c","doi":"10.5281/zenodo.23269383","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Market Structure and Sustainable Competitive Dynamics of the Peruvian Textile Sector in Global Trade","url":"https://doi.org/10.3390/su182010268","authors":["Rogger Orlando Morán Santamaría","Milagros Lamadrid Aldana","Nikolays Pedro Lizana Guevara","JUAN CARLOS VARGAS BARRERA","Jean Michell Carrión Mezones","Yefferson Llonto-Caicedo"],"date":"2026-10-09","abstract":"This study evaluated the market structure and sustainable competitive dynamics of the Peruvian textile sector in global trade during 2010–2024. A quantitative, non-experimental, and longitudinal design was applied, integrating four analytical dimensions—product, firm, and geographic concentration, and temporal persistence—through concentration indicators, revealed symmetric comparative advantage, Markov transition analysis, the Kaplan–Meier estimator, and a gravity model estimated through EGLS with PCSE correction. The results show that the exported FOB value increased from USD 1548.9 million in 2010 to USD 1640.2 million in 2024, following a non-linear trajectory marked by a peak in 2012, a","doi":"10.3390/su182010268","venue":"Sustainability","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["PE"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Nobody Believed They Would Succeed","url":"https://doi.org/10.5281/zenodo.23249926","authors":["Zen Revista"],"date":"2026-10-09","abstract":"This article examines how a seventy-two-second YouTube Short, published in Portuguese in October 2026 under the title Ninguém acreditou que eles conseguiriam (“No One Believed They Would Succeed”), compresses the twenty-one-year trajectory of American twin brothers Arthell and Darnell Isom, who founded D’ART Shtajio, a two-dimensional animation studio in Tokyo, in December 2016. Using the video as its primary narrative source, the study reconstructs the biographical trajectory it presents, including a pact made in 1995 while watching Mamoru Oshii’s Ghost in the Shell, the brothers’ decision to pursue different professional paths, one sibling’s migration to Japan, training at Yoyogi Animation","doi":"10.5281/zenodo.23249926","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"LAB #3922 NEUTRAL: TG AUTO: New edge proposed: evening_star_reversal_with_volume_climax — E8 Intelligence Research","url":"https://doi.org/10.5281/zenodo.23255365","authors":["Andrew Stewart Caldin"],"date":"2026-10-09","abstract":"IDEA: AUTO-FORWARDED from the Telegram/breakthrough stream (#1182586, division=research, agent=gtx_scout): { \"name\": \"evening_star_reversal_with_volume_climax\", \"source\": \"Steve Nison, Japanese Candlestick Charting Techniques\", \"type\": \"filter_flag\", \"rule\": \"Flag a short entry when a large bullish candle (body > 1.5x prior 20-bar average body) is followed by a small-bodied candle (body 1.5x 20-bar average volume.\", \"pseudocode\": \"avg_body = sma(20, abs(close-open)); avg_vol = sma(20, volume); c1 = close>open and body1 > 1.5*avg_body; c2 = body2 < 0.5*body1; c3 = close3 1.5*avg_vol; signal = c1 and c2 SAME-WINDOW EFFECT: Over the current 10-trade window, this filter would have flagged only t","doi":"10.5281/zenodo.23255365","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Cost-effectiveness of RIMS1 methylation-guided gastric cancer surveillance after Helicobacter pylori eradication","url":"https://doi.org/10.1080/14737167.2026.2746232","authors":["Yifan Qiu","Xianzhu Zhou","Hao Hu","Shudan Chen","Xinhui Zhan","Jingmin Feng","Xinyi Cai","Tuo Li","Jing Zhang","Yiqi Du","Jiafeng Zhang"],"date":"2026-10-09","abstract":"BACKGROUND: The cost-effectiveness of methylation-guided surveillance after Helicobacter pylori eradication remains uncertain. RESEARCH DESIGN AND METHODS: From a healthcare system perspective, a cohort model compared annual, biennial, and RIMS1 methylation-guided surveillance over 30 years in Japanese patients aged 50 years with open-type gastric atrophy. Differences in stage at diagnosis were calibrated from annual-surveillance data. Costs and quality-adjusted life-years (QALYs) were discounted at 3.0% annually. Sensitivity analyses examined uncertainty; an exploratory analysis used Korean inputs. RESULTS: At US$52,037.74/QALY, methylation-guided surveillance had the highest net monetary b","doi":"10.1080/14737167.2026.2746232","venue":"Expert Review of Pharmacoeconomics & Outcomes Research","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"日本で徹底的な子育ては広がったのか：育児時間と育児費用のコーホート分析","url":"http://www.rieti.go.jp/jp/publications/summary/26100004.html","authors":["宇南山 卓（ファカルティフェロー）","高橋 悠太（大阪大学）","高山 直樹（一橋大学）"],"date":"2026-10-08","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ディスカッション・ペーパー（日本語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"家計の所得変動と所得源泉別の要因分解","url":"http://www.rieti.go.jp/jp/publications/summary/26100003.html","authors":["大野 太郎（信州大学）"],"date":"2026-10-08","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ディスカッション・ペーパー（日本語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"Simple Standard Errors for Complicated (Quasi-)Experimental Designs","url":"https://arxiv.org/abs/2610.12674","authors":["Sylvia Klosin","Jonathan Roth"],"date":"2026-10-08","abstract":"We develop standard errors for estimates of causal effects in settings where the distribution of treatment exposures is known but potentially exhibits complicated dependence patterns across units. Such dependence arises, for example, in settings with spillovers/interference across units or when the treatment assignment is spatially correlated. Our variance estimator generalizes several properties of the Neyman variance estimator for completely randomized experiments to general designs: it is unbiased for an upper bound on the variance from the design-based perspective; the conservativeness of this upper bound depends on the heterogeneity of treatment effects; and it is also valid under certa","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"The Panel Information Matrix Test","url":"https://arxiv.org/abs/2610.12350","authors":["Martin Schumann"],"date":"2026-10-08","abstract":"The Information Matrix (IM) test is a natural specification check for likelihood-based models, yet cross-sectional implementations are often badly sized, confound neglected heterogeneity with distributional misspecification, and require third derivatives. We develop the panel information matrix (PIM) test for models with fixed effects. Explicit fixed effects isolate functional-form misspecification from time-invariant unobserved heterogeneity. Although the profile maximum likelihood estimator inherits incidental-parameter bias of order $O(1/T)$, the leading bias of the profile PIM is of order $\\sqrt{n}/T$, so it is asymptotically negligible whenever $n/T^2\\to 0$, which includes the rectangul","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Rolling Window Selection in FAR Models with Structural Instabilities","url":"https://arxiv.org/abs/2610.12025","authors":["Antoine A. Djogbenou"],"date":"2026-10-08","abstract":"The paper develops a theory for selecting the rolling window when generating out-of-sample forecasts with factor-augmented regression (FAR) models in the presence of structural instabilities. It shows how to select a rolling window by minimizing the conditional mean squared forecast error (MSFE) while accounting for uncertainty in factor estimation. Because the conditional MSFE is unobserved and the factors are latent, this paper proposes a feasible version of the criterion and derives conditions under which the new method is asymptotically loss-efficient. A simulation experiment documents the procedure's performance.","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Inference in Panel SVARs with Two-Way Dependence","url":"https://arxiv.org/abs/2610.11898","authors":["Lennart Empting","Saskia Öztürk","Simone Maxand","Konstantin Wagner"],"date":"2026-10-08","abstract":"We develop inference for heterogeneous panel vector autoregressive (VAR) models and their structural impulse response functions, where the error terms are dependent in the cross-sectional and time dimensions (two-way dependence). For proxy-identified structural VARs, we first adapt mean-group estimation and construct a closed-form pooled identification. Considering the reduced-form VAR dynamics, residual covariances, and structural parameters, we derive a joint central limit theorem under joint limits in the cross-sectional and time dimensions. We then propose a recursive-design panel moving-block bootstrap that resamples the estimated error terms in (i) the temporal, (ii) the cross-sectiona","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"A relational dataset of international badminton singles matches with ranking and Elo measures, 2006–2025","url":"https://doi.org/10.1038/s41597-026-08408-4","authors":["Mingchao Sun","Fengkai Zhang"],"date":"2026-10-08","abstract":"Abstract International badminton competitions generate rich records of individual athletic performance; however, no publicly available dataset integrates match outcomes, rankings, and dynamic performance ratings across all competition tiers in a unified relational structure. This paper presents a relational dataset of 178,896 international badminton singles matches drawn from 1,847 Badminton World Federation (BWF)-sanctioned tournaments spanning 2006 to 2025. The match data encompass men’s singles ( n = 108,590) and women’s singles ( n = 70,306) from 172 national associations across all major competition tiers, with annual updates planned. Three linked tables—namely tournaments, players, and","doi":"10.1038/s41597-026-08408-4","venue":"Scientific Data","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Who is counted? The (in)different selection of population figures for measuring malapportionment","url":"https://doi.org/10.1007/s10602-026-09526-2","authors":["Yuta Kamahara","Yukihiro Nakajima","Junichiro Wada"],"date":"2026-10-08","abstract":"Abstract Who is counted? To realize the “one person, one vote” principle and measure malapportionment, practitioners and political scientists have selected a population figure, or population count, arbitrarily or indifferently . Population figures include total population, eligible voters, registered voters, cast ballots, and valid votes. Focusing on population figures for measuring malapportionment, the paper demonstrates that the (in)different selection of the population figure matters theoretically and empirically. Normatively, who is counted brings us to mind who is included in demos. Thus, selecting different population figures mirrors different conceptualizations of the norm of represe","doi":"10.1007/s10602-026-09526-2","venue":"Constitutional Political Economy","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Electoral democracy, lottocracy, and social inequality","url":"https://doi.org/10.1017/s1468109926100474","authors":["Takuto Kobayashi"],"date":"2026-10-08","abstract":"Abstract This article compares electoral democracy and lottocracy from the perspective of social egalitarianism. Social egalitarians hold that political institutions should be assessed by whether they enable persons to stand to one another as social equals, rather than as inferiors and superiors. I distinguish two dimensions of social inequality relevant to the justification of political procedures: asymmetries of inescapable and final power and unmerited disparities of consideration. I then argue, first, that electoral democracy is not obviously superior to lottocracy in addressing the vertical inequality of political power between officials and non-officials, because electoral accountabili","doi":"10.1017/s1468109926100474","venue":"Japanese Journal of Political Science","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Forest-weighted causal correlation: A scalable framework for causal inference in ecological time series","url":"https://doi.org/10.64898/2026.10.01.756118","authors":["Shigeki Kishi"],"date":"2026-10-08","abstract":"1. Detecting causal relationships from ecological time series remains challenging because community dynamics are often nonlinear, high-dimensional, noisy, and strongly synchronized. These characteristics can reduce the reliability of existing causal inference methods and complicate the identification of ecological interactions in complex natural systems. 2. I introduce Forest-weighted Causal Correlation (FORCC), a machine-learning-based framework that infers directional causality from adaptive neighborhood structures learned by random forests. Rather than evaluating causal direction through cross-map reconstruction, FORCC quantifies directional dependence from the preservation of neighborhoo","doi":"10.64898/2026.10.01.756118","venue":"bioRxiv (Cold Spring Harbor Laboratory)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Replication Dataset and Analysis Materials for \"Observability-Based Design for Critical Mineral Demand Monitoring under Statistical Discontinuity in Japan's Special Steel Industry\"","url":"https://doi.org/10.5281/zenodo.23112583","authors":["Wataru Aaraki","Akira Nagamatsu"],"date":"2026-10-08","abstract":"This replication package supports the manuscript “Observability-Based Design for Critical Mineral Demand Monitoring under Statistical Discontinuity in Japan’s Special Steel Industry.” The study examines whether continuously available industrial production statistics can provide supplementary monitoring information for special-steel-use critical mineral demand when use-specific official demand statistics are no longer continuously available. The empirical case covers six mineral or statistical categories—antimony (Sb), nickel (Ni), Ni alloy, cobalt (Co), tungsten (W), and molybdenum (Mo)—and eight hot-rolled special-steel production categories: MCS, LAS, SUP, SUJ, SUS, SUM, SWP, and HTS. “Ni ","doi":"10.5281/zenodo.23112583","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Economic analysis of adjuvanted trivalent influenza vaccine for older adults in the Korean National Immunization Program","url":"https://doi.org/10.3389/fpubh.2026.1833971","authors":["Eunha Shim","Byung Wook Eun","Won Suk Choi"],"date":"2026-10-08","abstract":"Background Seasonal influenza causes substantial morbidity and mortality among older adults in South Korea despite high vaccination coverage. The MF59-adjuvanted trivalent influenza vaccine (aTIV) has shown superior immunogenicity in older populations, but its economic value within the Korean National Immunization Program (NIP) has not been evaluated using a dynamic transmission model that captures indirect protection. This study evaluated the budget impact of introducing aTIV into the Korean NIP for adults aged ≥65 years. Methods We developed an age-structured dynamic compartmental model to simulate seasonal influenza transmission in South Korea, allowing estimation of both direct and indir","doi":"10.3389/fpubh.2026.1833971","venue":"Frontiers in Public Health","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP","KR"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Cross-border Digital Payments in Asia: Retail Connectivity, Wholesale Settlement, and Implications for Trade","url":"https://doi.org/10.56506/dgld7740","authors":["Sayuri Shirai"],"date":"2026-10-08","abstract":"Key Points• Asia's cross-border payment architecture is becoming multilayered.Different systems, platforms and frameworks are likely to coexist rather than be replaced by a single technology.• To expand digital trade or close the SME trade-finance gap, payment systems should be connected with digital identity systems among other services and facilities.• Modernizing wholesale payment systems can make large-value cross-border transactions faster and more transparent.New arrangements are likely to complement rather than immediately replace correspondent banking.• Policy makers should strengthen the institutional foundations of cross-border payments through the legal recognition of electronic t","doi":"10.56506/dgld7740","venue":"","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Is urban polycentricity associated with capital circulation? Insights from China’s mergers and acquisitions","url":"https://doi.org/10.1080/23322039.2026.2740321","authors":["Will W. Qiang","Haowen Luo","Bo Huang","Shuai Shi","Harry Fung Lee"],"date":"2026-10-08","abstract":"Urban planning has increasingly embraced polycentrism to mitigate agglomeration diseconomies and strengthen complementarities among cities, yet its relationship with national capital markets remains underexplored. This study addresses that gap by examining three polycentric characteristics of 14 urban agglomerations in China—spatial dispersion, hierarchical differentiation, and local clustering of urban centers—and their associations with agglomeration-level performance in national M&A capital flows. The results show that greater spatial dispersion is significantly negatively associated with an agglomeration’s in-degree centrality in the inter-urban M&A network. By contrast, stronger hierarc","doi":"10.1080/23322039.2026.2740321","venue":"Cogent Economics & Finance","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["HK","JP","ZA"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"輸入生産比、エネルギー多消費産業で再び広がる日独差","url":"https://doi.org/10.5281/zenodo.23225649","authors":["Koji Nomura","Sho Inaba"],"date":"2026-10-08","abstract":"エネルギーモニター, No. 2612 日本とドイツの輸入生産比を産業グループ別に比較すると、Non-EITEではおおむね同方向に推移し水準はドイツがやや上回る一方、EITEではコロナ期と2025年以降に乖離がみられる。Non-EITEでは日本がドイツを下回るなかでEITEのみ上回るという対照は、EITEに特徴的な供給構造の変化、とりわけ日本で輸入が国内供給を代替する動きに注意を促す。","doi":"10.5281/zenodo.23225649","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"Beyond Conspiratorial Narratives: A Tri-Structural Topology of Systemic Financial Collapse across Endogenous Phase Transitions, Arbitrage Weaponization, and Populist Retail Financialization","url":"https://doi.org/10.5281/zenodo.23225227","authors":["Yoko Hasebe"],"date":"2026-10-08","abstract":"Abstract: Conventional discourse surrounding systemic financial dislocations remains trapped in a sterile dichotomy between superficial conspiratorial plots attributing crashes to external malice and orthodox macroeconomic apologies dismissing catastrophic shocks as unpredictable stochastic noise. This technical monograph transcends this false binary by formalizing systemic collapse through a unified tri-structural topology grounded in complex systems theory, discrete interval mathematics, and thermodynamic institutional dynamics. First, under the Endogenous Topology Hypothesis, we demonstrate that financial structures such as the 2008 subprime mortgage apparatus and modern tokenomics collap","doi":"10.5281/zenodo.23225227","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Reproducibility materials for \"Selective Exit and Institutional Metastability: Competing Effects on Reform Thresholds and Escape Barriers\"","url":"https://doi.org/10.5281/zenodo.23226262","authors":["Jun Tsuzurugi"],"date":"2026-10-08","abstract":"This record contains reproducibility materials for the manuscript \"Selective Exit and Institutional Metastability: Competing Effects on Reform Thresholds and Escape Barriers\" by Jun Tsuzurugi. The materials support Figures 1–3 of a minimal nonequilibrium model coupling population orientation, population density, and an institutional coordinate. All numerical data are model-generated; no empirical observations are included. The Figure 1 archive reproduces the frozen threshold–barrier sign boundaries, an admissible interior example, and the corresponding potential geometry and selective-exit drift comparison. The Figure 2 archive reproduces fixed-density coupled equilibrium branches, their sta","doi":"10.5281/zenodo.23226262","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Investing with a conscience: the impact of ESG performance on corporate financing ease in Western Europe","url":"https://doi.org/10.1080/20430795.2026.2710170","authors":["R. M. Ammar Zahid","Muhammad Kaleem Khan","Umer Sahil Maqsood","Alina Țaran"],"date":"2026-10-08","abstract":"This study examines the impact of environmental, social, and governance (ESG) performance on corporate financing strategies in Western Europe, focusing on debt maturity and financing structure. Using a panel dataset of 8,592 firm-year observations from 706 listed non-financial firms during 2009–2021, the results show that stronger ESG performance is associated with longer debt maturity and greater reliance on internal financing. Mechanism analysis further indicates that improved ESG performance alleviates firms’ financing constraints, thereby reduce financing frictions. These findings suggest that strong ESG performance increases both shareholder and creditor confidence, enabling firms to se","doi":"10.1080/20430795.2026.2710170","venue":"Journal of Sustainable Finance & Investment","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["AU","CN","JP","KR","TR"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Interpretable additive model for analyzing high-dimensional functional time series","url":"https://doi.org/10.1016/j.jmva.2026.105722","authors":["Haixu Wang","Tianyu Guan","Han Lin Shang"],"date":"2026-10-08","abstract":"High-dimensional functional time series offers a powerful framework for extending functional time series analysis to settings with multiple simultaneous dimensions, capturing both temporal dynamics and cross-sectional dependencies. We propose a novel, interpretable additive model tailored for such data, designed to deliver both high predictive accuracy and clear interpretability. The model features bivariate coefficient surfaces to represent relationships across panel dimensions, with sparsity introduced via penalized smoothing and group bridge regression. This enables simultaneous estimation of the surfaces and identification of significant inter-dimensional effects. Through Monte Carlo sim","doi":"10.1016/j.jmva.2026.105722","venue":"Journal of Multivariate Analysis","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Multinational Film and Television Video Metadata Dataset: Public Preview","url":"https://doi.org/10.5281/zenodo.23233380","authors":["Thordata"],"date":"2026-10-08","abstract":"This record describes a limited metadata-only preview of the Thordata DataMall product VID-20260916-150124-758, Multinational Film and Television Video Metadata Dataset. The underlying dataset contains metadata for movie and television video files from more than 30 countries and regions, including the United States, the United Kingdom, Japan, and South Korea. The public product description identifies field families covering basic catalog metadata, file-location information, video technical specifications, runtime information, and UTC update timestamps. The dataset can support exploratory work in media catalog construction, regional distribution analysis, resolution and runtime filtering, and","doi":"10.5281/zenodo.23233380","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"LAB #3889 NEUTRAL: TG AUTO: New edge proposed: three_black_crows_reversal_after_volume_climax — E8 Intelligence Research","url":"https://doi.org/10.5281/zenodo.23229995","authors":["Andrew Stewart Caldin"],"date":"2026-10-08","abstract":"IDEA: AUTO-FORWARDED from the Telegram/breakthrough stream (#1179401, division=research, agent=gtx_scout): { \"name\": \"three_black_crows_reversal_after_volume_climax\", \"source\": \"Steve Nison's Japanese Candlestick Charting Techniques\", \"type\": \"entry_engine\", \"rule\": \"After a 5-bar uptrend where the last bar has volume >= 2x its 20-bar average, trigger a short entry when the next 3 consecutive bars are all bearish, each closing near its low (lower wick = 2 * sma(volume,20)[i-1]:\\\\n SAME-WINDOW EFFECT: Over the current live window, this edge would have triggered only on setups matching the strict 5-bar uptrend + volume climax + 3-bar crows sequence. Scanning the listed tr Author: Andrew Stewar","doi":"10.5281/zenodo.23229995","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Okinawa real estate asking-price data (niffee) / 沖縄 不動産売り出しデータ","url":"https://doi.org/10.5281/zenodo.23236189","authors":["niffee"],"date":"2026-10-08","abstract":"沖縄県内で売りに出ている不動産(中古マンション・中古戸建て・土地など)の売り出し価格の統計。 conometrics":false,"lang":"en"},{"title":"Implementation of Blockchain Policy to Strengthen the Creative Economy Ecosystem at the Ministry of Creative Economy","url":"https://doi.org/10.61194/ijss.v7i4.2733","authors":["Dessy Ruhati","Triyuni Soemartono","Anwar Sanusi","T. Herry Rachmatsyah"],"date":"2026-10-08","abstract":"Protecting and utilizing intellectual property (IP) are strategic aspects of the creative economy, yet the sector faces challenges in transparency, data security, and governance efficiency. Blockchain technology—characterized by decentralization, transparency, and immutability—holds the potential to enhance trust and effectiveness in IP rights management, as demonstrated by implementation policies in the United States, South Korea, Japan, and Saudi Arabia.Using the Indonesian context as the primary case study alongside international references, this qualitative policy study examines regulatory, infrastructure, and creative economy conditions. The research involved ten informants representing","doi":"10.61194/ijss.v7i4.2733","venue":"Ilomata International Journal of Social Science","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["ID"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Generative AI and Firm Values","url":"https://doi.org/10.1111/jofi.70089","authors":["ANDREA L. EISFELDT","GREGOR SCHUBERT","MIAO BEN ZHANG","BLEDI TASKA"],"date":"2026-10-08","abstract":"ABSTRACT How do recent advances in Generative Artificial Intelligence (AI) affect firm value? We construct the first measure of firms' workforce exposures to Generative AI and show that an “Artificial‐Minus‐Human” portfolio earned 5% in the two weeks following the release of ChatGPT. The labor‐exposure effect is more pronounced for firms with greater data assets and is distinct from the effect of firms' product exposures to AI. We assess whether exposed workforces are substituted or complemented by Generative AI based on whether their exposed tasks are core or supplemental. Examining firms' labor demand and profitability following the release of ChatGPT supports a labor‐technology substituti","doi":"10.1111/jofi.70089","venue":"The Journal of Finance","sources":["Journal of Finance"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Feedback and Contagion through Distressed Competition","url":"https://doi.org/10.1111/jofi.70080","authors":["HUI CHEN","WINSTON WEI DOU","HONGYE GUO","YAN JI"],"date":"2026-10-08","abstract":"ABSTRACT Firms tend to compete more aggressively when facing financial distress. This intensified competition reduces profit margins, pushing them further into distress and adversely affecting their industry peers. To study such feedback and contagion effects, we incorporate strategic competition in a dynamic model with long‐term defaultable debt, exploring various peer interactions such as predation and price wars. The feedback effect represents a novel source of financial distress costs associated with leverage, which helps explain the negative profitability‐leverage relation across industries. Owing to the contagion effect, firms' optimal leverage is often excessively high from an industr","doi":"10.1111/jofi.70080","venue":"The Journal of Finance","sources":["Journal of Finance"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"The Financial Premium","url":"https://doi.org/10.1111/jofi.70084","authors":["JENS DICK‐NIELSEN","PETER FELDHÜTTER","DAVID LANDO"],"date":"2026-10-08","abstract":"ABSTRACT We show that bonds issued by financial firms have higher spreads than bonds issued by industrial firms with the same rating and maturity, a difference that we refer to as the financial premium. Over the period 1987 to 2020, in the United States, this premium is 43 basis points on average, with the premium higher for lower ratings, higher during financial crises, and increasing in bond beta. We derive a model that explains the financial premium: banks hold diversified portfolios of nonfinancial debt, and bank debt therefore reflects more systematic risk than nonfinancial debt.","doi":"10.1111/jofi.70084","venue":"The Journal of Finance","sources":["Journal of Finance"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"When Does Inexact Matching Ensure Balance and Inference without Adjustment?","url":"https://arxiv.org/abs/2610.10873","authors":["Ying Jin"],"date":"2026-10-07","abstract":"One-to-one matching without replacement is a classical approach to constructing comparable treated and control samples in the design of observational studies. It pairs each treated unit with a distinct control while minimizing a covariate distance objective. With continuous covariates, the matched pairs generally remain inexact, which contributes to bias in downstream analysis. Its key theoretical properties, such as the resulting imbalance between matched pairs and when it is negligible to support valid inference, remain unclear. In this paper, we analyze one-to-one matching based on $d$-dimensional, continuous covariates with a quadratic covariate-distance objective. First, we find that wh","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","math.ST","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"From a Hierarchy of Stochastic Differential Equations to a Hierarchy of Generalized Beta Distributions","url":"https://arxiv.org/abs/2610.10476","authors":["Siqi Shao","R. A. Serota"],"date":"2026-10-07","abstract":"We introduce a mean-reverting stochastic differential equation with a three-component stochastic term and show that it generates a hierarchy of steady-state (stationary) distributions. At the top level, the hierarchy is described by a modified-Beta distribution, while one- and two-parameter reductions produce compact-support, power-law-tailed, and exponential-type limiting families within a single stochastic framework. We then construct two generalized extensions of this hierarchy. In the first, the power transformation is applied directly at the level of the stochastic differential equation; in the second, the same transformation is applied only after the stationary modified-Beta hierarchy ","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["cond-mat.stat-mech","econ.EM","physics.data-an","q-fin.ST"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Building Macroeconomically Relevant Climate Indices via the Assemblage VAR","url":"https://arxiv.org/abs/2610.10043","authors":["Christophe Barrette","Philippe Goulet Coulombe","Tim Reinicke"],"date":"2026-10-07","abstract":"What should a macroeconomically relevant climate index contain? The composition is inherently ambiguous, and aggregation choices affect structural inference. We introduce the Assemblage VAR, which jointly estimates nonnegative aggregation weights and VAR parameters by maximizing the system likelihood-gain criterion, effectively outsourcing aggregation to observed macroeconomic dynamics. Two variants operate in component-space and rank-space, reweighting named subcomponents or emphasizing regions of the cross-sectional distribution. Applied to disaggregated U.S. climate data from the Actuaries Climate Index and NOAA, VARs using the assembled climate measures yield contractionary impulse respo","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Cluster-Robust Prediction-Powered Inference","url":"https://arxiv.org/abs/2610.09601","authors":["David Broska","Michael Howes"],"date":"2026-10-07","abstract":"Data collection is often costly or logistically demanding, limiting both the questions researchers can pursue and how precisely they can answer them. Prediction-powered inference (PPI) can reduce the amount of data needed for precise parameter estimation by combining labeled data with machine learning predictions. However, ignoring dependence within clusters can produce confidence intervals that cover the true parameter less often than their nominal rate. We introduce Cluster-Robust PPI++, which provides standard errors in closed form and asymptotically valid confidence intervals under arbitrary dependence within independent clusters, requiring no bootstrap or resampling. Our central contrib","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.ME","stat.ML"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Detecting Copula Structural Changes: A Smooth Testing Approach","url":"https://arxiv.org/abs/2610.09351","authors":["Shiyao Huang","Xiaojun Song"],"date":"2026-10-07","abstract":"This paper develops novel smooth tests for structural changes in the innovation copula of multivariate dynamic models. We characterize deviations from copula constancy through a collection of generalized Fourier coefficients and test their joint significance. Under the null hypothesis, estimation of the dynamic parameters and the unknown marginals has no first-order estimation effect on the proposed statistics. Consequently, the feasible tests based on estimated residuals are asymptotically equivalent to their infeasible counterparts based on the unobserved innovations, yielding a desirable oracle property. Our proposed tests are asymptotically $χ^2$-distributed and possess nontrivial power ","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Complication-attributable admission episodes after shunt surgery for idiopathic normal pressure hydrocephalus in Japan: a scenario-based micro-costing analysis of hospital margins under DPC/PDPS and fee-for-service","url":"https://doi.org/10.1186/s13561-026-00871-4","authors":["Kosei Goto","Nobuo Kutsuna","Takuto Nishihara","Tomoya Ohida","Kotaro Makita"],"date":"2026-10-07","abstract":"Shunt-related complications after surgery for idiopathic normal pressure hydrocephalus (iNPH) generate repeat admissions, procedures, and bed use, but their provider-side financial consequences depend on the reimbursement rule. Evidence on hospital accounting margins under Japan’s mixed Diagnosis Procedure Combination/Per-Diem Payment System (DPC/PDPS) remains limited. This study compared modeled hospital margins under DPC/PDPS and a fee-for-service (FFS) comparator and, as a secondary analysis, estimated infection-specific prevention thresholds. A deterministic scenario-based micro-costing model was constructed from the hospital perspective. The primary analysis comprised 10 mutually exclus","doi":"10.1186/s13561-026-00871-4","venue":"Health Economics Review","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Rural-Urban Differences in Household Food Demand in Bangladesh","url":"https://doi.org/10.5539/jas.v18n11p32","authors":["Riaj Ahmed Rifat","Melli Suryanty S. N.","Toshinobu Matsuda"],"date":"2026-10-07","abstract":"This study examines whether rural and urban households in Bangladesh respond differently to changes in food budgets, prices, and demographic characteristics. Using Household Income and Expenditure Survey (HIES) 2022 microdata from the Bangladesh Bureau of Statistics, we aggregate food purchases into ten groups and estimate a censored Quadratic Almost Ideal Demand System (QUAIDS) model in an analytical sample of 14,388 households. The estimates reveal a common pattern of expenditure-driven diversification but sharper spatial differences in price responses. Meat has the largest expenditure elasticity, at about 2 in both areas, while fruits and eggs & milk are also expenditure elastic. Rice, ve","doi":"10.5539/jas.v18n11p32","venue":"Journal of Agricultural Science","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Estimating Japanese consumers’ willingness to pay for a fish voucher: A policy evaluation of demand-side interventions","url":"https://doi.org/10.1080/13657305.2026.2741841","authors":["Kentaka Aruga","Arifa Jannat","Md. Monirul Islam"],"date":"2026-10-07","abstract":"Global shifts in protein demand and demographic aging challenge the economic viability of traditional seafood and aquaculture markets. Using Japan as an example of these structural transitions, this paper evaluates a tax-financed fish voucher program as a targeted demand-side intervention to stabilize domestic aquatic food supply chains. Using contingent valuation data from 849 Japanese consumers, an interval regression model estimates a mean willingness to pay (WTP) of 828.63 JPY for the program. Valuation is significantly higher among high-income households, frequent seafood buyers, residents of high-consumption regions, and environmentally conscious consumers. We also identify a critical ","doi":"10.1080/13657305.2026.2741841","venue":"Aquaculture Economics & Management","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["BD","BG","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Winner’s blessing: determinants of acquirer returns in Japanese corporate divestitures","url":"https://doi.org/10.1007/s43546-026-01451-8","authors":["Yoshiaki MATSUURA"],"date":"2026-10-07","abstract":"","doi":"10.1007/s43546-026-01451-8","venue":"SN Business & Economics","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The large-scale investor ESG paradox and greenwashing penalty: Evidence from Japanese GX transition bonds","url":"https://doi.org/10.1016/j.iref.2026.105929","authors":["Kentaka Aruga","Michał Ostrowski","Ihsan Ullah"],"date":"2026-10-07","abstract":"As global markets shift beyond standard green bonds, transition finance has emerged to fund the decarbonization of hard-to-abate sectors. This study investigates the factors influencing the yield premium demanded by investors within Japan’s GX Climate Transition framework, the world’s first sovereign transition bond. Employing interval regression and robust Oster bounding ( δ = − 7.76 ), we decompose the stated yield demand into fundamental market frictions and three core ESG pricing dynamics. First, we find that standard illiquidity concerns are associated with a baseline risk premium of up to 5.7 basis points. Second, we identify a walk-the-talk discount, where investors with revealed ESG ","doi":"10.1016/j.iref.2026.105929","venue":"International Review of Economics & Finance","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Three patent portfolio structures for lifecycle management of cell therapy products","url":"https://doi.org/10.1016/j.wpi.2026.102507","authors":["Yasuaki Kawai","Shingo Kano"],"date":"2026-10-07","abstract":"Lifecycle management (LCM) in the pharmaceutical industry uses patent protection and regulatory strategies to maximize the lifetime value of approved products. Although product-level patent analyses have examined small molecules and biologics, product-patent linkage information remains limited for cell therapy products (CTPs). A previous study suggested that the drug LCM framework could be applied to approved chimeric antigen receptor T-cell (CAR-T) products. The present study assessed whether the drug LCM framework evaluated in the previous CAR-T study could be generalized to CTPs beyond CAR-T by analyzing five non-CAR-T products approved in Japan. Product–patent linkages were identified us","doi":"10.1016/j.wpi.2026.102507","venue":"World Patent Information","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Spatially adaptive neighboring information improves constraints on local temperature projections","url":"https://doi.org/10.5281/zenodo.23212507","authors":["Yifan Li","Atsushi Okazaki","Tomoko Nitta","Alexandre Cauquoin"],"date":"2026-10-07","abstract":"Python code accompanying the manuscript “Spatially adaptive neighboring information improves constraints on local temperature projections”. The package implements observational constraints on local temperature projections using Kriging for Climate Change (KCC). It combines historical temperature information from neighboring locations with the target record and global mean temperature. It includes fixed-radius distance weighting, the adaptive neighborhood method, the joint local–global temperature update, and evaluation of predictive skill and uncertainty. The adaptive method determines the neighborhood radius and the contribution of neighboring records using their relationship with the targe","doi":"10.5281/zenodo.23212507","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Drift Estimation for a Multi-Dimensional Lévy-Driven Stochastic Differential Equation Using Deep Neural Networks","url":"https://arxiv.org/abs/2610.09813","authors":["Taisei Noguchi","Teppei Ogihara"],"date":"2026-10-07","abstract":"We develop a non-asymptotic theory for nonparametric drift estimation in discretely observed multi-dimensional Lévy-driven stochastic differential equations using sparse ReLU neural networks. Under exponential \\(β\\)-mixing and an exponential-tail condition on the Lévy measure, we establish an oracle inequality for the least-squares estimator. The jump component changes both the martingale structure and the concentration regime relative to diffusion models: continuous martingales are replaced by discontinuous martingales, while the relevant empirical-process fluctuations are sub-exponential rather than sub-Gaussian. We handle these difficulties without truncating the observed increments, usin","doi":"10.48550/arxiv.2610.09813","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Carbon dioxide removal deployment and sustainability assessment in the low emission scenarios for CMIP7","url":"https://doi.org/10.5281/zenodo.23210746","authors":["Osamu Nishiura","Shinichiro Fujimori","Tomoko Hasegawa","Shotaro Mori","Ken Oshiro","Tatsuya Hanaoka","Kiyoshi Takahashi","Koga Yamazaki","Alexander Popp","Florian Humpenöder","Patrick von Jeetze","Kristine Karstens","Jessica Strefler","Tabea Dorndorf","Anne Merfort","Elmar Kriegler","Fabrice Lécuyer","Leon Merfort","Luiz Bernardo Baptista","Gerd Brantes Angelkorte","Pedro Rochedo","Fabio Teixeira Ferreira da Silva","Roberto Schaeffer","Jay Fuhrman","Haewon C. McJeon","Mel George","Christoph Bertram","Candelaria Bergero","Harmen Sytze de Boer","Vassilis Daioglou","Jonathan Doelman","Isabela Schmidt Tagomori","Detlef Peter van Vuuren","Elke Stehfest","Yoga Wienda Pratama","Oliver Fricko","Volker Krey","Keywan Riahi","Siddharth Joshi","Matthew Gidden","Yazhen Wu","Stefan Frank","Peter Havlík","Mykola I. Gusti","Jarmo Kikstra","Laurent Drouet","Cindy G. Azuero-Pedraza","Marco Gambarini","Lara Aleluia Reis"],"date":"2026-10-07","abstract":"This is a pre-print. Figure 3, panel (a) has been fixed. (2026-10-9)","doi":"10.5281/zenodo.23210746","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["AE","AT","BR","DE","DK","GB","IT","JP","KR","NL","NO","PT","US","ZA"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Similar coordination gains, divergent urban trajectories: A state–contribution–pathway analysis of human–environment coupling in chinese metropolitan areas","url":"https://doi.org/10.1016/j.cities.2026.107681","authors":["Yusong Xie","Wei Zhao","Jiefeng Kang","欧阳琦","Xiao Zhang","Xiangyun Shi","Xudong Zhang","Shaofei Niu","Xiaoyu Gan"],"date":"2026-10-07","abstract":"Despite the convergence of rapid urban growth and ecological stress in metropolitan areas (MAs), existing studies have investigated ecosystem conditions and human activities separately or simplified their relationship using average coordination indicators. Consequently, knowledge gaps persist regarding how human–environment coupling is restructured across metropolitan contexts, why distinct contribution structures result in similar coordination outcomes, and how these variations should inform governance strategies. To address these gaps, this study introduced a state–contribution–pathway framework and applied it to 17 Chinese national–level MAs from 2000 to 2023. Combining coupling–state dia","doi":"10.1016/j.cities.2026.107681","venue":"Cities","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["CN","JP","SG"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The Expansion of 0 to 2019 and estimates p","doi":"10.1108/ijhma-06-2026-0185","venue":"International Journal of Housing Markets and Analysis","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["CN"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Japan must capitalise on its second capital law","url":"https://doi.org/10.59425/eabc.1791410400","authors":["Daniel Aldrich"],"date":"2026-10-07","abstract":"","doi":"10.59425/eabc.1791410400","venue":"","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Steel robots and space turtleships: the divergence of Korean animation and Japanese anime","url":"https://doi.org/10.1080/17564905.2026.2738153","authors":["Zachary Samuel Gottesman"],"date":"2026-10-07","abstract":"During the Park Chung-hee military dictatorship, Korea shadowed Japanese industrial upgrading at every stage. The same was true in animation, in which Korea took Japanese animations, indigenized them, and imbued them with a techno-nationalism that positioned Korean animation as both dependent on Japan and destined to overcome it. Instead, the opposite happened: today South Korean animation is a pale shadow of Japanese anime’s global success. This essay argues that this divergence, rather than the result of flawed state policies or overdependence on outsourcing, is the result of objective shifts in global capitalism that began in the 1970s. This essay analyses two Korean animated films that m","doi":"10.1080/17564905.2026.2738153","venue":"Journal of Japanese and Korean Cinema","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Как возникает неравенство доходов в эпоху ИИ? От рынка к внутрифирменной структуре распределения","url":"https://doi.org/10.5281/zenodo.23204786","au tools to investigate the structural role of the middle class as the core driver of sustainable consumption demand. The research applies three measurement standards (relative income, absolute income and subjective self‑identification) and introduces a new “middle‑class economic weight index”, calculated as the ratio of the group’s income share to its popu","doi":"10.17605/osf.io/bf25j","venue":"OSF Preprints (OSF Preprints)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Sovereign Reserve Asymmetry and the Localized Crypto-Asset Narrative: The European Central Bank's Refusal of Bitcoin Reserves and the Deconstruction of Political Financialization in the US, UK, and Japan","url":"https://doi.org/10.5281/zenodo.23200093","authors":["Yoko Hasebe"],"date":"2026-10-07","abstract":"Description / Abstract: The dominant public relations narrative surrounding speculative digital assets asserts that Bitcoin is inexorably evolving into a decentralized global reserve currency adopted uniformly across sovereign jurisdictions. This monograph deconstructs this claim by exposing an irreconcilable geopolitical and institutional divergence: the categorical refusal of the European Union (EU) and the European Central Bank (ECB) to hold Bitcoin as a sovereign reserve asset, contrasted against the aggressive political financialization of digital assets across localized corridors in the United States, the United Kingdom, and Japan. First, we examine the ECB’s institutional doctrine—cry","doi":"10.5281/zenodo.23200093","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Endogenous Dissolution of Sovereign Debt Topologies: Domestic Retirement Capital Flight and Nonlinear Discontinuities in Risk-Free Discount Rates","url":"https://doi.org/10.5281/zenodo.23223407","authors":["Yoko Hasebe"],"date":"2026-10-07","abstract":"Conventional macroeconomic assessments of sovereign debt sustainability predominantly focus on external, geopolitical factors—most notably the potential decline in foreign central bank accumulation (exemplified by Ray Dalio’s warnings regarding Chinese and Japanese demand curtailment). This monograph demonstrates that this exogenous framework overlooks the primary, non-linear failure mode of sovereign balance sheets: the endogenous, demographic flight of domestic private retirement capital. Synthesizing Nassim Nicholas Taleb’s critique of structural bond market fragility with our topological fencepost (Uekizan) formulation, we formalize the mathematical dynamics through which domestic demogr","doi":"10.5281/zenodo.23223407","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"AI यग म आय असमनत कस उतपनन हत ह? बजर स फरम क भतर क वतरण सरचन तक","url":"https://doi.org/10.5281/zenodo.23206318","authors":["K. Tsuchiya"],"date":"2026-10-07","abstract":"This is the Hindi-language version of the original Japanese paper, “AI時代の所得格差はどのように発生するのか――市場から企業内部の分配構造へ――” by Kiyoto Tsuchiya.The main text and argument are identical to the original Japanese version. A Hindi abstract and keywords have been added for international readability.Original Japanese version: https://doi.org/10.5281/zenodo.22975442 यह शोध-पत्र AI युग की आय असमानता को AI नामक प्रौद्योगिकी का प्रत्यक्ष परिणाम नहीं मानता, बल्कि उसे उस प्रक्रिया का परिणाम मानता है जिसमें AI द्वारा निर्मित मूल्य फर्म के भीतर के वितरण निर्णयों के माध्यम से विभिन्न कर्ताओं को अभिगुणित होता है। AI मूल्य-निर्माण में योगदान दे सकता है, किंतु वह उसके परिणामों को आय के रूप में प्राप्त करने वाला कर्ता नहीं है","doi":"10.5281/zenodo.23206318","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Wie entsteht Einkommensungleichheit im Zeitalter der KI? Vom Markt zur unternehmensinternen Verteilungsstruktur","url":"https://doi.org/10.5281/zenodo.23201980","authors":["K. Tsuchiya"],"date":"2026-10-07","abstract":"This is the German-language version of the original Japanese paper, “AI時代の所得格差はどのように発生するのか――市場から企業内部の分配構造へ――” by Kiyoto Tsuchiya.The main text and argument are identical to the original Japanese version. A German abstract and keywords have been added for international readability.Original Japanese version: https://doi.org/10.5281/zenodo.22975442 Der vorliegende Beitrag begreift Einkommensungleichheit im Zeitalter der KI nicht als unmittelbare Folge der KI als Technologie, sondern als Ergebnis eines Prozesses, in dem der durch KI gebildete Wert über unternehmensinterne Verteilungsentscheidungen unterschiedlichen Subjekten zugerechnet wird. KI kann zur Wertbildung beitragen, ist aber kein Subj","doi":"10.5281/zenodo.23201980","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Проблема заработной платы в эпоху ИИ: кому принадлежит стоимость, созданная ИИ?","url":"https://doi.org/10.5281/zenodo.23204657","authors":["K. Tsuchiya"],"date":"2026-10-07","abstract":"This is the Russian-language version of the original Japanese paper, “AI時代の賃金問題――AIが生み出した価値は誰のものか――” by Kiyoto Tsuchiya.The main text and argument are identical to the original Japanese version. A Russian abstract and keywords have been added for international readability.Original Japanese version: https://doi.org/10.5281/zenodo.22954607 Стремительное распространение иск
