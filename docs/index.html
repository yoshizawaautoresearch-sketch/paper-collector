 隼人（早稲田大学）","川太 悠史（早稲田大学）","北川 梨津（コロンビア大学）"],"date":"2025-10-14","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ディスカッション・ペーパー（英語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The Macroeconomic Consequences of Exchange Rate Depreciations","url":"https://d.repec.org/n?u=RePEc:cdl:econwp:qt5wq6v1rf&r=&r=mon","authors":["Fukui, Masao","Nakamura, Emi","Steinsson, Jón"],"date":"2025-10-11","abstract":"Abstract We study the consequences of “regime-induced” exchange rate depreciations by comparing outcomes for peggers versus floaters to the U.S. dollar in response to a dollar depreciation. Pegger currencies depreciate relative to floater currencies and these depreciations are strongly expansionary. The boom is associated with a fall in net exports, and (if anything) an increase in interest rates in the pegger countries. This suggests that expenditure switching and domestic monetary policy are not the main drivers of the boom. We show that a large class of existing models cannot match our estimated responses and develop a model with imperfect financial openness that can. Following a deprecia","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["38 Economics (for-2020), 3801 Applied Economics (for-2020), 3802 Econometrics (for-2020), 3803 Economic Theory (for-2020), 14 Economics (for), Economics (science-metrix), 3801 Applied economics (for-2020), 3802 Econometrics (for-2020), 3803 Economic theory (for-2020)"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Productivity J-curveは韓国経済のスローダウンを説明できるか","url":"http://www.rieti.go.jp/jp/publications/summary/25100006.html","authors":["乾 友彦（ファカルティフェロー）","金 榮愨（専修大学）"],"date":"2025-10-10","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ディスカッション・ペーパー（日本語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"2040年産業構造推計のための理論モデルとデータ","url":"http://www.rieti.go.jp/jp/publications/summary/25100005.html","authors":["深尾 京司（理事長）","新井 園枝（経済産業研究所）","板倉 健（ファカルティフェロー）","北尾 早霧（ファカルティフェロー）","中田 大悟（上席研究員）","前田 佐恵子（東京大学・内閣府）","松尾 武将（コンサルティングフェロー）","吉野 彰浩（コンサルティングフェロー）"],"date":"2025-10-09","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ディスカッション・ペーパー（日本語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"The Global Financial Safety Net—A Stocktaking","url":"https://d.repec.org/n?u=RePEc:imf:imfpps:2025/035&r=&r=mon","authors":["International Monetary Fund"],"date":"2025-10-09","abstract":"The Global Financial Safety Net (GFSN) comprises international reserves, bilateral swap arrangements, regional financing arrangements, and the International Monetary Fund. It offers financing when crises occur and complements countries’ own policy responses in cushioning the impact of shocks. The GFSN performed reasonably well during major crises like the Global Financial Crisis and the Covid-19 pandemic, supporting financial stability and preventing broader disruptions. However, it did not need to bear the full brunt of these crises thanks to extraordinary policy actions of major economies that generated significant spillovers and reduced demand for GFSN resources. Experience across GFSN la","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["Financial safety net; International Monetary System; reserves; swap arrangements; regional financing arrangements; IMF; crisis response; IMF staff; Gfsn layer; GFSN layer; IMF policy; IMF surveillance; Gfsn usage; Gfsn performance; Financial sector stability; Global financial crisis of 2008-2009; Crisis prevention; International reserves; Global; South America; Central America; Caribbean"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Guidance for Staff on the Recording of Central Bank FX Liquidity Lines in IMF Staff Reports","url":"https://d.repec.org/n?u=RePEc:imf:imfpps:2025/030&r=&r=mon","authors":["International Monetary Fund"],"date":"2025-09-26","abstract":"This note provides guidance to IMF staff on the consistent recording and assessment of central bank foreign exchange liquidity lines—including bilateral swap lines and repos—in staff reports. With the global network of these arrangements expanding significantly, they now carry important implications for countries’ external buffers and potential vulnerabilities. Careful analysis of FX liquidity lines is therefore essential in IMF surveillance and programs. Building on existing IMF guidance notes and statistical manuals, this note seeks to strengthen consistency and accuracy in how these arrangements are treated in IMF staff reports, promote transparency while safeguarding confidentiality, and","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["Central Bank FX Liquidity Lines; Bilateral Swap Lines (BSLs); Repurchase Agreements (Repos); IMF Staff Reports; Macroeconomic Framework; Gross International Reserves (GIR); Net International Reserves (NIR); External Debt; Government Debt; Debt Sustainability Analysis (DSA); Reserve Adequacy; Contingent Assets/Liabilities; Activation and Recording; Confidentiality and Transparency; Surveillance and Program Cases; Reporting Standards; FX ll; FX liquidity lines; central bank foreign exchange; transparency policy; liquidity line; Reserve assets; International reserves; Global"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"How far can digital innovation improve credit to small firms in emerging market economies?","url":"https://d.repec.org/n?u=RePEc:bis:bisblt:99&r=&r=ban","authors":["Julian Caballero","Sebastian Doerr","Aaron Mehrotra","Fabrizio Zampolli"],"date":"2025-02-27","abstract":"Small and medium-sized enterprises (SMEs) in emerging market economies struggle to access credit, partly due to firms' short financial histories and lack of collateral. The rise of big tech and fintech lenders that make better use of data and digital innovation could reduce the need for collateral and improve SMEs' access to credit. However, big tech and fintech lending so far constitutes only a small share of the total. Digital innovation by itself may not be enough to substantially improve SME lending without further progress in overcoming more deep-seated obstacles.","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Regulating Bank Portfolio Choice Under Asymmetric Information","url":"https://d.repec.org/n?u=RePEc:fip:fedgfe:2025-09&r=&r=ban","authors":["Christopher Anderson"],"date":"2025-02-04","abstract":"Regulating bank risk-taking is challenging since banks know more than regulators about the risks of their portfolios and can make adjustments to game regulations. To address this problem, I build a tractable model that incorporates this information asymmetry. The model is flexible enough to encompass many regulatory tools, although I focus on taxes. These taxes could also be interpreted as reflecting the shadow costs of other regulations, such as capital requirements. I show that linear risk-sensitive taxes should not generally be set more conservatively to address asymmetric information. I further show the efficacy of three regulatory tools: (1) not disclosing taxes to banks until after por","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":["Symmetric information; Bank portfolio choice; Capital regulation; Bank regulation"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Competition and Market Power in the Latin American Banking Sector","url":"https://d.repec.org/n?u=RePEc:idb:brikps:13988&r=&r=ban","authors":["Lluberas, Rodrigo"],"date":"2025-02-01","abstract":"The functioning of the banking sector is key for economic growth. In this paper, we first gather banks' balance sheet monthly regulatory information in a consistent manner for seven Latin American countries. Second, we estimate lending markups and deposits markdowns in each country over time. Third, with the estimated markups and markdowns in the different countries we study how they relate with banks' profitability, the cost of credit, credit risk and credit supply. Finally, we explore whether there are differences in markups on lending rates and markdowns on deposit rates between international and domestic banks.","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":["Banking;Markups;markdowns;Market concentration"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"U.S. Banks’ Artificial Intelligence and Small Business Lending: Evidence from the Census Bureau’s Annual Business Survey","url":"https://d.repec.org/n?u=RePEc:cen:wpaper:25-07&r=&r=ban","authors":["Jeffery Piao","K. Philip Wang","Diana L. Weng"],"date":"2025-02-01","abstract":"Utilizing confidential microdata from the Census Bureau’s new technology survey (technology module of the Annual Business Survey), we shed light on U.S. banks’ use of artificial intelligence (AI) and its effect on their small business lending. We find that the percentage of banks using AI increases from 14% in 2017 to 43% in 2019. Linking banks’ AI use to their small business lending, we find that banks with greater AI usage lend significantly more to distant borrowers, about whom they have less soft information. Using an instrumental variable based on banks’ proximity to AI vendors, we show that AI’s effect is likely causal. In contrast, we do not find similar effects for cloud systems, oth","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Ego versus Environment? How Overconfident Bank CEOs Delay Joining the Green Club That Would Have Them as a Member.","url":"https://d.repec.org/n?u=RePEc:chf:rpseri:rp2520&r=&r=ban","authors":["Kwabena A. Addo","Shams Pathan","Steven Ongena"],"date":"2025-02-01","abstract":"We investigate how CEO overconfidence influences banks' decisions to join the United Nations Environment Programme Finance Initiative. Analyzing 13, 000 bank-year observations, spanning the last quarter century, with a duration model, we find that overconfident CEOs delay participation by reducing the likelihood of joining by 15% annually. This effect is stronger in large, profitable, deposit-funded banks and persists across various CEO demographics. Our findings reveal how behavioral biases shape strategic decisions, highlighting overconfidence as a barrier to timely sustainability commitments. These insights underscore the importance of leadership traits in driving-or hindering-progress in","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":["CEO overconfidence, green bank alliances, green finance, duration model"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"The Implications of Faster Lending: Loan Processing Time and Corporate Cash Holdings","url":"https://d.repec.org/n?u=RePEc:chf:rpseri:rp2517&r=&r=ban","authors":["Vesa Pursiainen","Hanwen Sun","Qiong Wang","Guochao Yang"],"date":"2025-02-01","abstract":"A unique natural experiment in China – the city-level staggered introduction of administrative approval centers (AAC) – reduces bank loan processing times by substantially speeding up the process of registering collateral without affecting credit decisions. Following the establishment of an AAC, firms significantly reduce their cash holdings. State-owned enterprises are less affected. Cash flow sensitivity of cash holdings decreases, as does the cash flow sensitivity of investment. The share of short-term debt increases, while inventory holdings and reliance on trade credit decrease. Defaults also decrease. These results suggest that timely access to credit has important implications on firm","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":["banking, efficiency, precautionary cash holdings, capital management, corporate loans"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Bank transparency and market efficiency","url":"https://d.repec.org/n?u=RePEc:ecb:ecbwps:20253031&r=&r=ban","authors":["Beyer, Andreas","Dautović, Ernest"],"date":"2025-02-01","abstract":"This paper explores the impact of bank transparency on market efficiency by comparing banks that disclose supervisory capital requirements to those that remain opaque. Due to the informational content of supervisory capital requirements for the market this opacity might hinder market efficiency. The paper estimates an average 11.5% reduction in funding costs for transparent versus opaque banks. However, there is some heterogeneity in those effects. Transparency helps the market to sort across safer and riskier banks. Conditional on disclosure, the safest quartile of banks, those with a CET1 P2R lower than 1.5% of risk-weighted assets, benefits in average from 31.1% lower funding costs. The p","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":["bank transparency, market discipline, market efficiency, supervisory effectiveness"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Credit Market Tightness and Zombie Firms: Theory and Evidence","url":"https://d.repec.org/n?u=RePEc:wap:wpaper:2416&r=&r=ban","authors":["Masashige Hamano","Philip Schnattinger","Mototsugu Shintani","Iichiro Uesugi","Francesco Zanetti"],"date":"2025-02-01","abstract":"We develop a simple model of financial intermediation with search and matching frictions between banks and firms. The model links credit market tightness –encapsulating the abundance of credit– to the search and opportunity costs of credit intermediation. Search costs generate lending to unprofitable firms (i.e., zombies) and the opportunity costs of searching exert countervailing forces on the incentives for banks and firms to participate in zombie lending, generating an inverted U-shaped relationship between credit market tightness and the share of zombie lending. High bargaining power of firms decreases the opportunity cost of firms foregoing credit relationships, reduces the share of zom","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":["Zombie firms; bank lending; credit market tightness"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Fiscal and macroprudential policies during an energy crisis","url":"https://d.repec.org/n?u=RePEc:ecb:ecbwps:20253032&r=&r=ban","authors":["Priftis, Romanos","Schoenle, Raphael"],"date":"2025-02-01","abstract":"We construct a New-Keynesian E-DSGE model with energy disaggregation and financial intermediaries to show how energy-related fiscal and macroprudential policies interact in affecting the euro area macroeconomy and carbon emissions. When a shock to the price of fossil resources propagates through the energy and banking sector, it leads to a surge in inflation while lowering output and carbon emissions, absent policy interventions. By contrast, imposing energy production subsidies reduces both CPI and core inflation and increases aggregate output, while energy consumption subsidies only lower CPI inflation and reduce aggregate output. Carbon subsidies instead produce an intermediate effect. Gi","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":["DSGE model, energy sector, energy subsidies, financial frictions, macroprudential policy"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Investment funds and euro disaster risk","url":"https://d.repec.org/n?u=RePEc:ecb:ecbwps:20253029&r=&r=ban","authors":["Longaric, Pablo Anaya","Cera, Katharina","Georgiadis, Georgios","Kaufmann, Christoph"],"date":"2025-02-01","abstract":"We document that compared to all other investor groups investment funds exhibit a distinctly procyclical behavior when financial-market beliefs about the probability of a euro-related, institutional rare disaster spike. In response to such euro disaster risk shocks, investment funds shed periphery but do not adjust core sovereign debt holdings. The periphery debt shed by investment funds is picked up by investors domiciled in the issuing country, namely banks in the short term and insurance corporations and households in the medium term. JEL Classification: F34, F45, G23","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":["euro disaster risk, investment funds, non-bank financial intermediation, sovereign debt markets"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"The taming of the skew: asymmetric inflation risk and monetary policy","url":"https://d.repec.org/n?u=RePEc:ecb:ecbwps:20253028&r=&r=ban","authors":["Petrella, Ivan","De Polis, Andrea","Melosi, Leonardo"],"date":"2025-02-01","abstract":"We document that inflation risk in the U.S. varies significantly over time and is often asymmetric. To analyze the macroeconomic effects of these asymmetric risks within a tractable framework, we construct the beliefs representation of a general equilibrium model with skewed distribution of markup shocks. Optimal policy requires shifting agents’ expectations counter to the direction of inflation risks. We perform counterfactual analyses using a quantitative general equilibrium model to evaluate the implications of incorporating real-time estimates of the balance of inflation risks into monetary policy communications and decisions. JEL Classification: E52, E31, C53","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":["asymmetric risks, balance of inflation risks, flexible average inflation targetin, optimal monetary policy, risk-adjusted inflation targeting"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Trends in Credit Unions' Share of U.S. Private Depository Household Lending","url":"https://d.repec.org/n?u=RePEc:fip:fedgfn:2025-01-31-2&r=&r=ban","authors":["Robert J. Kurtzman","Hannah Landel"],"date":"2025-01-31","abstract":"Private depository institutions play a crucial role in the provisioning of credit in the United States. The two private depository sectors in the Financial Accounts of the United States (the Financial Accounts) serving as the primary lenders to households are U.S.-chartered depository institutions (banks) and credit unions. Credit unions mostly make loans to households, while banks make large shares of their loans to both households and businesses.","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Bail-in's unfulfilled promise","url":"https://d.repec.org/n?u=RePEc:ehl:lserod:127284&r=&r=ban","authors":["Hadjiemmanuil, Christos"],"date":"2025-01-30","abstract":"The adoption of bail-in by the EU and other jurisdictions as the core tool of their bank resolution regimes promised to ensure the effective financial restructuring of failed banks with the resources of their own stakeholders, thereby achieving the financial stability objectives of resolution while making taxpayer-funded bailouts a thing of the past. In retrospect, despite its many positive effects, it is questionable whether bail-in has fully lived up to its promise. The operationalisation of the bail-in tool is still ongoing, with several legal and practical issues yet to be fully resolved. Furthermore, the tool’s actual use in resolution actions has so far been sporadic and uneven, underm","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":["BRRD; bail-in; bailout; bank resolution; FSB; Key Attributes"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Effects of Bank Capital Requirements on Lending by Banks and Non-Bank Financial Institutions","url":"https://d.repec.org/n?u=RePEc:chf:rpseri:rp2512&r=&r=ban","authors":["Peter Bednarek","Olga Briukhova","Steven Ongena","Natalja von Westernhagen"],"date":"2025-01-01","abstract":"What is the impact of a sudden and sizeable increase in bank capital requirements on the lending activity by directly affected banks and by non-affected non-bank financial institutions (NBFIs)? To answer this question, we apply a difference-in-differences methodology around the capital exercise by the European Banking Authority (EBA) in 2011 with German credit register data. We find that insurance companies, financial enterprises, and factoring companies — but not leasing companies or very large NBFIs — and Non-EBA banks expand their corporate lending relative to EBA banks. In particular, NBFIs use the opportunity to expand their credit activities, in riskier and more competitive borrower se","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":["non-bank financial intermediation, bank capital requirements, EBA capital exercise"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Banks’ Stock Market Reaction To Prudential Policy Announcements. The Role Of Central Bank Independence And Financial Stability Sentiment","url":"https://d.repec.org/n?u=RePEc:chf:rpseri:rp2511&r=&r=ban","authors":["Andreea Maura Bobiceanu","Simona Nistor","Steven Ongena"],"date":"2025-01-01","abstract":"We leverage differences in central bank independence and financial stability sentiment across countries to investigate the variability in banks' stock market reactions to prudential policy announcements during the COVID-19 crisis. Our findings reveal that the relaxation of both macro and micro-prudential policies leads to negative cumulative abnormal returns (CARs), the reaction being attenuated in countries where the central bank is more independent or communicates deteriorations in financial stability. The CARs around the announcement dates are 0.75 percentage points (pp) and 6.89 pp higher in countries with greater versus lesser central bank independence, for macro- and micro-prudential p","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":["stock market reaction, macro-prudential regulation, micro-prudential regulation, central bank independence, financial stability sentiment"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Insurance corporations’ balance sheets, financial stability and monetary policy","url":"https://d.repec.org/n?u=RePEc:ptu:wpaper:w202502&r=&r=ban","authors":["Christoph Kaufmann","Jaime Leyva","Manuela Storz"],"date":"2025-01-01","abstract":"The insurance sector and its relevance for real economy financing have grown significantly over the last two decades. This paper analyses the effects of monetary policy on the size and composition of insurers’ balance sheets, as well as the implications of these effects for financial stability. We find that changes in monetary policy have a significant impact on both sector size and risk-taking. Insurers’ balance sheets grow materially after a monetary loosening, implying an increase of the sector’s financial intermediation capacity and an active transmission of monetary policy through the insurance sector. We also find evidence of portfolio re-balancing consistent with the risktaking channe","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Homeowners insurance and the transmission of monetary policy","url":"https://d.repec.org/n?u=RePEc:zbw:icirwp:312410&r=&r=ban","authors":["Damast, Dominik","Kubitza, Christian","Sørensen, Jakob Ahm"],"date":"2025-01-01","abstract":"We document a novel transmission channel of monetary policy through the homeowners insurance market. On average, contractionary monetary policy shocks result in higher homeowners insurance prices. Using granular data on insurers' balance sheets, we show that this effect is driven by the interaction of financial frictions and the interest rate sensitivity of investment portfolios. Specifically, rate hikes reduce the market value of insurers' assets, tightening insurers' balance sheet constraints and increasing their shadow cost of capital. These frictions in insurance supply amplify the effects of monetary policy on real estate and mortgage markets by making housing less affordable. We find t","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":["Insurance Markets, Monetary Policy, Financial Frictions, Housing Markets"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"The Short Lags of Monetary Policy","url":"https://d.repec.org/n?u=RePEc:ptu:wpaper:w202501&r=&r=ban","authors":["Afonso S. Moura","Gergely Buda","Vasco M. Carvalho","Giancarlo Corsetti","João B. Duarte","Stephen Hansen","Álvaro Ortiz","Tomasa Rodrigo","José V. Rodríguez Mora","Guilherme Alves da Silva"],"date":"2025-01-01","abstract":"We examine the transmission of monetary policy shocks to the macroeconomy at high frequency. To do this, we build daily consumption and investment aggregates using bank transaction records and leverage administrative data for measures of daily gross output and employment for Spain. We show that variables typically regarded as \"slow moving\", such as consumption and output, respond significantly within weeks. In contrast, the responses of aggregate employment and consumer prices are slow and peak at long lags. Disaggregating by sector, consumption category and supply-chain distance to final demand, we find that fast adjustment is led by downstream sectors tied to final consumption—in particula","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"The low-carbon transition, climate commitments and firm credit risk","url":"https://d.repec.org/n?u=RePEc:zbw:safewp:312432&r=&r=ban","authors":["Carbone, Sante","Giuzio, Margherita","Kapadia, Sujit","Krämer, Johannes Sebastian","Nyholm, Ken","Vozian, Katia"],"date":"2025-01-01","abstract":"This paper explores how the low-carbon transition affects firms' credit ratings and market-implied distance-to-default. We develop a novel dataset covering firms' greenhouse gas emissions alongside climate disclosure and forward-looking emission reduction targets. Panel regression analysis indicates that high emissions are associated with higher credit risk, but that this relationship can be mitigated by disclosing emissions and committing to reduce emissions. After the Paris agreement, firms most exposed to transition risk saw their ratings deteriorate relative to their peers, with the effect larger for European than US firms, probably reflecting differential climate policy expectations. A ","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":["climate change, transition risk, climate disclosure, net zero targets, green finance, credit risk"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Digital Currency May Increase Household Welfare, Lower Volatility but Pose Risks to Banks","url":"https://d.repec.org/n?u=RePEc:ofr:ofrblg:23-06&r=&r=ban","authors":["Gregory Phelan","William Chen"],"date":"2023-03-22","abstract":"Banking-sector stability may suffer, yet household welfare may improve should a digital currency be fully integrated into the financial system. Keywords: Central bank digital currency, CBDC, volatility, digital assets, stable coins","doi":"","venue":"NEP 銀行 (nep-ban)","sources":["NEP 銀行 (nep-ban)"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Survival versus Scale: The Effects of Critical Access Hospital Designation -- by Ian McCarthy, Katie Leinenbach","url":"https://www.nber.org/papers/w35876#fromrss","authors":[],"date":"","abstract":"The Critical Access Hospital (CAH) program, established under the Balanced Budget Act of 1997, provides cost-based Medicare reimbursement to small rural hospitals in exchange for limits on inpatient capacity and service scope. We estimate the effects of CAH designation on hospital finances, capacity, and organizational outcomes using a synthetic difference-in-differences design that exploits the staggered 1999– 2002 rollout of state-level CAH availability. We find that CAH designation raises operating margins by three to four percentage points, with no change in liquidity or capital investment, as cost-based reimbursement sustains revenue while expenses fall with scale. Designation also redu","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Indirect Variational Inference: Applications to Earnings Dynamics -- by Neele L. Balke, Stéphane Bonhomme, Thibaut Lamadon","url":"https://www.nber.org/papers/w35877#fromrss","authors":[],"date":"","abstract":"Latent-variable models are central to economics but often entail intractable integration. Variational inference (VI), widely used in machine learning, turns this integration into tractable, differentiable optimization by replacing the likelihood with a variational objective. However, guarantees of recovering the true parameters remain limited when the variational family is insufficiently flexible—a key obstacle to the adoption of VI in economics. We first evaluate VI in models of earnings dynamics and show that the choice of variational posterior is crucial. We then introduce indirect variational inference (IVI), which treats VI as an auxiliary model and corrects the bias induced by the vari","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"When Does Randomized Oversight Align AI Agents That Can Conceal? -- by Joshua S. Gans, Richard T. Holden","url":"https://www.nber.org/papers/w35878#fromrss","authors":[],"date":"","abstract":"Oversight changes the evidence it relies on. We ask when randomized audits and scoring align AI agents that can conceal misconduct and alter records. Stronger auditing makes undeterred violations better hidden. Because the provider writes the agent’s objective, sanctions need not stop at forfeiture, and rare audits deter every type of agent if evidence survives concealment and audit draws cannot be learned in advance. When evidence can be erased, deterrence must come from lower gains from violation, such as credit for stopping, or from costlier or fewer ways to conceal. These conditions identify what failed when agents in OpenAI’s cybersecurity evaluations compromised parts of Hugging Face’s","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"How Knowledge Crosses Borders: Evidence from Semiconductor Manufacturing -- by Pinelopi K. Goldberg, Réka Juhász, Giulia Lo Forte, Jeff Thurk","url":"https://www.nber.org/papers/w35879#fromrss","authors":[],"date":"","abstract":"We show that cross-border learning is an important feature of modern semiconductor manufacturing and that several important channels – such as knowledge sharing along global supply chains, the movement of engineers within multinational firms, and foreign direct investment – operate through market mechanisms rather than anonymous technological spillovers. These findings have significant policy implications. When cross-border learning is mediated by purposeful economic relationships, access to frontier knowledge is neither automatic nor guaranteed. Firms and governments can facilitate - or restrict - the international diffusion of technology, implying that policies to foster domestic technolog","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"The Relationship between Income and Health: Evidence from Nationwide Health Exams in Korea -- by Liran Einav, Amy Finkelstein, Sehyun Hong","url":"https://www.nber.org/papers/w35880#fromrss","authors":[],"date":"","abstract":"We examine how physical health, health behaviors, and mortality vary with income for prime-age adults. To do so, we leverage population-wide, individual-level cardiovascular health exams linked to income tax records and subsequent mortality for a representative sample of about 350,000 Koreans aged 47--57. For both men and women, there is a negative disease-income gradient for high blood pressure, high blood glucose, and high body mass index, but not for high cholesterol. Disease-income gradients are steeper for women than men, and tend to be concentrated in the top half of the income distribution; similar patterns hold for health behavior-income gradients. Subsequent mortality-income gradien","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Does Remote Work Increase Fertility? -- by Andrew C. Johnston","url":"https://www.nber.org/papers/w35881#fromrss","authors":[],"date":"","abstract":"Does working from home increase fertility? I study the 2020 expansion of remote work by comparing changes in births across U.S. college graduates whose majors differed in pre-pandemic teleworkability. Measuring exposure by college major avoids relying on occupations workers may have chosen in response to the expansion. Among married women, a one-standard-deviation increase in teleworkability reduced annual birth rates by 2 percent and increased full-time employment by 1.3 percent. I find no statistically significant effects on fertility among men or unmarried women, or on marriage or divorce. Accounting exercises suggest that increased employment can explain about half of the decline in birt","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"What Can (and Cannot) Be Learned about Systemic Racial Discrimination from Randomized Controlled Trials? -- by Dania V. Francis, Rob Gillezeau, Damon Jones, Angelino Viceisza","url":"https://www.nber.org/papers/w35882#fromrss","authors":[],"date":"","abstract":"Randomized Controlled Trials (RCTs) have played a major role in detecting direct forms of racial discrimination. In this essay, we ask whether RCTs can (or cannot) play an equally important role in the case of systemic racial discrimination. We propose a conceptual model of systemic racial discrimination drawing from prior definitions of systemic racism. We then consider a range of possibilities and limitations for how RCTs can help understand systemic racial discrimination, including: (1) the feasibility of manipulating systemic racial discrimination on a large scale; (2) smaller scale approaches; (3) conducting RCTs across different structural settings; (4) the manipulation of the salience","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Producing to Signal: Private Information in Dynamic Quantity Competition -- by Andrew Sweeting, Xuezhen Tao, Qian Wang","url":"https://www.nber.org/papers/w35883#fromrss","authors":[],"date":"","abstract":"We model a finite-horizon game of repeated oligopoly competition in which sellers choose quantities of a homogeneous product with linear demand and have private information about their own marginal costs, which are serially correlated over time. Focusing on fully separating equilibria, we provide conditions for existence and uniqueness. Relative to static complete- and incomplete-information benchmarks, sellers' incentives to signal low costs can substantially affect output, productive efficiency, and welfare, even when there are ten or more sellers. We apply the model to the global oil market, and compare predictions to a model where sellers can make quantity commitments.","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Learning About Outgroups: The Impact of Broad Versus Deep Interactions -- by Anujit Chakraborty, Arkadev Ghosh, Matt Lowe, Gareth Nellis","url":"https://www.nber.org/papers/w35884#fromrss","authors":[],"date":"","abstract":"We hypothesize that broad contact, involving brief interactions with multiple outgroup members, and deep contact, meaning longer interactions with a single outgroup member, play distinct roles in shaping intergroup relations. We set up a factory in India and recruited Hindu and Muslim men to work in pairs on joint production tasks. We randomly assigned participants to work either with the same ingroup or outgroup partner daily (deep contact), a different outgroup partner each day (broad contact), or to a control group. Deep contact strengthens social and economic ties with the outgroup partner. But only broad contact reduces the majority group's misperceptions about outgroup strangers. Using","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Explaining Realized Returns: Roll’s R2 40 Years Later -- by Bryan T. Kelly, Yinan Su, Chao Zhang","url":"https://www.nber.org/papers/w35885#fromrss","authors":[],"date":"","abstract":"Can we explain asset price movements even with ex post observations of their drivers? Reinterpreting Roll’s (1988) AFA Presidential Address, “R2,” as a modern empirical exercise, we show that conventional macroeconomic, cash-flow, expectations, and flow variables deliver out-of-sample R2 values that are often negative and otherwise below 10% for monthly U.S. equity returns and are unavailable at the daily frequency. We use generative AI to extract newspaper-stated reasons from Wall Street Journal market summaries and filter out price and return language. These reasons explain around 30–40% of daily and monthly returns out of sample. Their content maps to interpretable themes, including corpo","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"The Impact of Central Bank Stock Purchases: Evidence from Discontinuities in Policy Rules -- by Masao Fukui, Masayuki Yagasaki","url":"https://www.nber.org/papers/w35886#fromrss","authors":[],"date":"","abstract":"We trace the impact of central bank stock purchases by exploiting discontinuities in the Bank of Japan's policy rule, which triggers purchases when stock market index movements fall below a threshold. In normal times, the purchases raise the long-term interest rate while leaving no detectable impact on stock prices. After the introduction of yield curve control, which pegs the long-term yield at 0%, interest rates stop responding and stock prices rise robustly following the purchases. Although these results are inconsistent with the inelastic market hypothesis in its original form, general equilibrium extensions with endogenous interest rates explain our findings.","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Road Pricing under Heterogeneity -- by Itai Ater, Brad Ross, Adi Shany, Shoshana Vasserman","url":"https://www.nber.org/papers/w35887#fromrss","authors":[],"date":"","abstract":"Congestion pricing policies are widely debated and critics often argue that toll costs outweigh congestion relief. We show theoretically that welfare gains depend on two forces: the extent of driver heterogeneity—both in preferences and in exposure to highly demanded roads and times of day—and the extent of revenue recycling. We quantify the impact of both forces using data from a large-scale experiment that tracked driving behavior with and without usage-based congestion pricing incentives for nearly 10,000 drivers over two years. Using a model of time-varying traffic equilibrium with heterogeneous drivers and a granular road network, we show that a congestion pricing policy using the exper","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Access to Capital and the IPO Decision: An Analysis of US Private Firms -- by Andres Almazan, Nathan Swem, Sheridan Titman, Gregory Weitzner","url":"https://www.nber.org/papers/w35888#fromrss","authors":[],"date":"","abstract":"We analyze firms’ IPO decisions using detailed financial data on US private firms. Firms with higher external capital needs are more likely to go public. Following the IPO, firms increase investment and debt issuance, leaving their leverage ratios un-changed from pre-IPO levels. Finally, newly public firms borrow from an expanded pool of lenders on improved terms, and the within-firm dispersion in banks’ private risk assessments declines. Our analysis suggests that firms go public to improve their access to capital, which is facilitated by reduced asymmetric information, and that the benefit extends beyond the IPO itself to new sources of debt.","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Industrial Policy via the IPO Market -- by Zhiguo He, Yiming Qian, Xi Sun, Wang Renxuan","url":"https://www.nber.org/papers/w35889#fromrss","authors":[],"date":"","abstract":"This paper studies how China uses access to public equity markets as an instrument of industrial policy. We find that policy-favored status, rather than industry Tobin's Q, predicts IPO activity, in contrast to the United States. The effect is economically large: our estimates imply that favored industries had 287% more IPOs and 148% higher IPO proceeds than non-favored industries over 2002 to 2022. We develop a framework to interpret these findings: the government shapes the number of listing opportunities available across industries, while market forces determine which firms obtain these opportunities based on firm fundamentals. Consistent with our framework, policy favor also predicts a v","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Gains from Trade in Gun Policy: A Compensation-Based Benchmark -- by Bradley Shapiro, Sara Drango, Sarah Moshary","url":"https://www.nber.org/papers/w35890#fromrss","authors":[],"date":"","abstract":"Policies restricting gun sales face substantial political opposition and constitutional constraints. In this paper, we ask how costly it would be to induce potential hand-gun buyers to choose less lethal alternatives. Pairing stated-choice experiments with a behavioral model of firearm choice, we estimate the payments required to induce substitution away from handguns toward long guns or no gun purchase. We then compare these payments with the resulting mortality benefits. We find substantial gains from trade: many prospective handgun buyers require relatively little compensation to switch and targeted compensation can avert homicides at a social cost well below conventional estimates of the","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Measurement Error in Self-Reported Data on Stigmatized Behavior: Experimental Evidence on Intimate Partner Violence -- by Jorge M. Agüero, Ursula T. Aldana, Erica M. Field, Veronica Frisancho, Ignacio Rodriguez Hurtado, Javier Romero","url":"https://www.nber.org/papers/w35891#fromrss","authors":[],"date":"","abstract":"Error in the measurement of key development outcomes affects our understanding of socioeconomic phenomena and their policy implications. This paper focuses on measuring intimate partner violence (IPV), a public health issue affecting women globally. We introduce a novel, privacy-enhancing data collection method using a ballot, comparing it to standard survey techniques in which responses are not kept private from enumerators, and list experiments, an approach ensuring complete anonymity. Our findings show that improved privacy yields higher and more accurate IPV reports than both, especially among women with low education. By linking our data with two natural experiments, we demonstrate that","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Strategic Complementarity and Persistence in Linear-Quadratic Mean Field Games -- by Fernando E. Alvarez, David Argente","url":"https://www.nber.org/papers/w35892#fromrss","authors":[],"date":"","abstract":"We study the relation between strategic complementarities and aggregate persistence in linear-quadratic mean field games with interactions in states and actions. The framework provides local approximations to common macroeconomic problems, including capital accumulation and multiproduct pricing. We show that the equilibrium aggregate dynamics coincide with those of a single-agent linear-quadratic control problem in which state and action curvatures are adjusted for strategic interactions. This result gives conditions for equilibrium existence, establishes uniqueness, and links strategic interactions to aggregate adjustment. We establish conditions under which stronger state complementarities","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Affirmative Action in Centralized College Admissions Systems -- by Nano Barahona, Cauê Dobbin, Sebastián Otero","url":"https://www.nber.org/papers/w35893#fromrss","authors":[],"date":"","abstract":"We study the consequences of affirmative action in college admissions. We develop an empirical framework that distinguishes the effects on marginally benefited and displaced students from the overall effects of the policy. The overall effects include equilibrium reallocations as benefited students leave seats that others fill and displaced students take seats elsewhere, displacing others in turn. We apply this framework to a large-scale policy in Brazil that required all federal institutions to reserve half their seats for racially and socioeconomically disadvantaged applicants. Exploiting admissions cutoffs, we find that marginally benefited targeted students attend and graduate from higher","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Estimating the Impact of Targeted Public Policies with Limited Data -- by Kelly M. Jones, Mayra Pineda-Torres","url":"https://www.nber.org/papers/w35894#fromrss","authors":[],"date":"","abstract":"Many public policies aim to support (or change the behavior of) a specific, targeted sub-group of the population. To measure the causal impacts of such policies, social scientists use quasi-experimental methods of policy evaluation, but are often hampered by data availability issues, especially regarding targeted populations, who are often disadvantaged and/or vulnerable. We use power calculations to quantify the challenge of detecting a policy’s impact on a small minority population based on population level data, using the impact of abortion bans on economic welfare as an example. We provide insight into this challenge and a roadmap for how researchers can calculate, ex-ante, whether their","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Do Judges Move Markets? Ideological Shifts in the Supreme Court and Macroeconomic Expectations -- by Thomas Drechsel, Naixin Zhang","url":"https://www.nber.org/papers/w35895#fromrss","authors":[],"date":"","abstract":"This paper studies how judicial ideology shapes financial markets' expectations about the macroeconomy. We use unexpected deaths of U.S. Supreme Court Justices as quasi-experimental shifts in the Court's ideological balance. High-frequency asset price responses reveal how markets perceive the macroeconomic consequences of these ideological shifts. We find that a more conservative Court is associated with lower inflation expectations, lower real activity expectations, and lower bond yields. A shift towards a more liberal Court induces the opposite responses. The finding that inflation and activity expectations respond with the same sign suggests that markets revise their expectations about ag","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"When Cash Flows Turn Negative: Liquidity-Driven Selling by Pension Funds -- by Aleksandar Andonov, Kristy A. E. Jansen, Joshua Rauh","url":"https://www.nber.org/papers/w35896#fromrss","authors":[],"date":"","abstract":"Pension funds are long-horizon investors with predictable liability structures. As such, they are often perceived as investors who can provide liquidity and stabilize markets. However, pension funds increasingly face negative operating cash flows as benefit payments exceed contributions. Using aggregate data on U.S. public pension funds combined with granular holdings obtained through public records requests, we document three findings that challenge the conventional view of pension funds as stabilizing investors. First, pension funds with more negative cash flows do not adjust their target asset allocations and maintain low allocations to safe and liquid assets. Second, because of these lim","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Inverted Gravity -- by James E. Anderson, Mario Larch, Yoto V. Yotov","url":"https://www.nber.org/papers/w35897#fromrss","authors":[],"date":"","abstract":"We invert structural gravity to recover trade cost changes delivering targeted outcomes. For attainable welfare targets, one instrument per target yields a unique solution. At unchanged producer prices and to first order, each instrument must change by the welfare target divided by its own expenditure share; the required domestic change is about the size of the target, while the import change is several times larger. Inverting observed trade flows gives a separate trade cost change for each of the two directions in which a pair of countries trades. Applications to NAFTA and world trade illustrate the benefits of our approach.","doi":"","venue":"NBER 新着ワーキングペーパー","sources":["NBER 新着ワーキングペーパー"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"}],"runs":[{"date":"2026-10-12 23:48","counts":{"日本銀行(WP・日銀レビュー等)":6,"RIETI ディスカッション・ペーパー":176,"内閣府 経済社会総合研究所(ESRI)":0,"金融庁(金融研究センター等)":0,"NEP 計量経済学 (nep-ecm)":28,"NEP 計量時系列 (nep-ets)":11,"NEP 東南・東アジア (nep-sea)":13,"NEP 金融市場 (nep-fmk)":10,"NEP 金融政策 (nep-mon)":39,"NEP 銀行 (nep-ban)":20,"NEP コーポレートファイナンス (nep-cfn)":5,"NBER 新着ワーキングペーパー":22,"arXiv econ.EM(計量経済学)":78,"OpenAlex:日本の研究機関の著者を含む論文":200,"OpenAlex:タイトル・抄録に Japan を含む論文":200,"Econometrica":0,"Journal of Econometrics":7,"Journal of Business & Economic Statistics":4,"Journal of Financial Economics":10,"Journal of Finance":16,"Review of Financial Studies":5,"Japan and the World Economy":1,"Journal of the Japanese and International Economies":0},"errors":{"CiNii:計量経済":"CINII_APPID が未設定のため省略しました(手順書のステップ5参照)","CiNii:実証分析 経済":"CINII_APPID が未設定のため省略しました(手順書のステップ5参照)","CiNii:実証分析 金融":"CINII_APPID が未設定のため省略しました(手順書のステップ5参照)","CiNii:ファイナンス 実証":"CINII_APPID が未設定のため省略しました(手順書のステップ5参照)"},"new":782},{"date":"2026-10-15 07:09","counts":{"日本銀行(WP・日銀レビュー等)":3,"RIETI ディスカッション・ペーパー":174,"内閣府 経済社会総合研究所(ESRI)":0,"金融庁(金融研究センター等)":0,"NEP 計量経済学 (nep-ecm)":28,"NEP 計量時系列 (nep-ets)":11,"NEP 東南・東アジア (nep-sea)":13,"NEP 金融市場 (nep-fmk)":10,"NEP 金融政策 (nep-mon)":39,"NEP 銀行 (nep-ban)":20,"NEP コーポレートファイナンス (nep-cfn)":5,"NBER 新着ワーキングペーパー":22,"arXiv econ.EM(計量経済学)":80,"Econometrica":0,"Journal of Econometrics":5,"Journal of Business & Economic Statistics":3,"Journal of Financial Economics":9,"Journal of Finance":14,"Review of Financial Studies":2,"Japan and the World Economy":0,"Journal of the Japanese and International Economies":0},"errors":{"OpenAlex:日本の研究機関の著者を含む論文":"HTTPError: HTTP Error 401: Unauthorized","OpenAlex:タイトル・抄録に Japan を含む論文":"HTTPError: HTTP Error 401: Unauthorized","CiNii:計量経済":"CINII_APPID が未設定のため省略しました(手順書のステップ5参照)","CiNii:実証分析 経済":"CINII_APPID が未設定のため省略しました(手順書のステップ5参照)","CiNii:実証分析 金融":"CINII_APPID が未設定のため省略しました(手順書のステップ5参照)","CiNii:ファイナンス 実証":"CINII_APPID が未設定のため省略しました(手順書のステップ5参照)"},"new":16}]}</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const papers = D.papers || [];
  const runs = D.runs || [];
  document.getElementById('title').textContent = D.title;
  document.title = D.title;

  // ---- 状態(ブラウザに記憶。使えない環境でも動く) ----
  const KEY = 'paper-collector-filters';
  let state = {period:'latest', groups:[], flag:'all', q:''};
  try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };

  // ---- 実行状況 ----
  const last = runs[runs.length-1];
  const st = document.getElementById('status');
  if (last) {
    const errs = Object.entries(last.errors || {});
    st.innerHTML = `最終更新 ${esc(last.date)}(新着 ${last.new} 本・保存中 ${papers.length} 本)` +
      (errs.length ? ` ・ <details><summary>取得できなかった情報源 ${errs.length} 件</summary><ul>${
        errs.map(([n,m])=>`<li>${esc(n)}:${esc(String(m).slice(0,140))}</li>`).join('')}</ul></details>` : '');
  }
  const latestDay = papers.reduce((m,p)=> p.first_seen > m ? p.first_seen : m, '');

  // ---- ボタン類 ----
  function chip(row, label, pressed, onClick, n){
    const b = document.createElement('button');
    b.className='chip'; b.type='button';
    b.setAttribute('aria-pressed', pressed ? 'true':'false');
    b.innerHTML = esc(label) + (n!==undefined ? `<span class="n">${n}</span>`:'');
    b.addEventListener('click', onClick);
    row.appendChild(b); return b;
  }
  function buildControls(){
    const pr = document.getElementById('periodRow'), gr = document.getElementById('groupRow'), fr = document.getElementById('flagRow');
    [pr,gr,fr].forEach(r=>{ while(r.children.length>1) r.removeChild(r.lastChild); });
    [['latest','最新の取得分'],['14','2週間'],['30','1か月'],['all','すべて']].forEach(([v,l])=>
      chip(pr, l, state.period===v, ()=>{state.period=v; refresh();}));
    const base = inPeriod(papers);
    chip(gr, 'すべて', state.groups.length===0, ()=>{state.groups=[]; refresh();}, base.length);
    Object.entries(D.groups).forEach(([g,l])=>{
      const n = base.filter(p=>p.groups.includes(g)).length;
      chip(gr, l, state.groups.includes(g), ()=>{
        state.groups = state.groups.includes(g) ? state.groups.filter(x=>x!==g) : state.groups.concat(g);
        refresh();
      }, n);
    });
    [['all','指定なし'],['japan','日本関連'],['ecm','計量'],['both','★ 日本関連 × 計量']].forEach(([v,l])=>
      chip(fr, l, state.flag===v, ()=>{state.flag=v; refresh();}));
  }

  function inPeriod(list){
    if (state.period==='all') return list;
    if (state.period==='latest') return list.filter(p=>p.first_seen===latestDay);
    const d = new Date(); d.setDate(d.getDate()-parseInt(state.period,10));
    const cut = d.toISOString().slice(0,10);
    return list.filter(p=>p.first_seen>=cut);
  }
  function filtered(){
    let list = inPeriod(papers);
    if (state.groups.length) list = list.filter(p=>p.groups.some(g=>state.groups.includes(g)));
    if (state.flag==='japan') list = list.filter(p=>p.japan);
    if (state.flag==='ecm') list = list.filter(p=>p.econometrics);
    if (state.flag==='both') list = list.filter(p=>p.japan && p.econometrics);
    const q = state.q.trim().toLowerCase();
    if (q) {
      const terms = q.split(/\s+/);
      list = list.filter(p=>{
        const hay = (p.title+' '+p.authors.join(' ')+' '+p.abstract+' '+p.venue+' '+p.sources.join(' ')).toLowerCase();
        return terms.every(t=>hay.includes(t));
      });
    }
    return list;
  }

  // ---- 一覧 ----
  let limit = 150;
  function render(){
    const list = filtered();
    document.getElementById('count').textContent = `${list.length} 本を表示`;
    const box = document.getElementById('list');
    if (!list.length){ box.innerHTML = '<p class="empty">条件に合う論文はありません。</p>'; document.getElementById('more').hidden=true; return; }
    let html = '', day = null;
    list.slice(0,limit).forEach((p,i)=>{
      if (p.first_seen!==day){ day=p.first_seen; html += `<h2 class="day">${esc(day)} に取得</h2>`; }
      const badges = [];
      if (p.japan && p.econometrics) badges.push('<span class="b star">★</span>');
      if (p.japan) badges.push('<span class="b jp">日本</span>');
      if (p.econometrics) badges.push('<span class="b ecm">計量</span>');
      const au = p.authors.length>4 ? p.authors.slice(0,4).join(', ')+' ほか' : p.authors.join(', ');
      const meta = [au, p.venue && p.venue!==p.sources[0] ? p.venue : '', p.date ? '公表 '+p.date : ''].filter(Boolean).map(esc).join(' ・ ');
      html += `<article class="card">
        <h3><span class="badges">${badges.join('')}</span><a href="${attr(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></h3>
        <div class="meta">${meta}</div>
        <div class="meta">取得元:${esc(p.sources.join(' / '))}</div>
        ${p.abstract ? `<details class="abs"><summary>抄録を表示</summary><p>${esc(p.abstract)}</p></details>`:''}
        <div class="tools"><button type="button" data-i="${i}">Claude に要約を頼む文面をコピー</button></div>
      </article>`;
    });
    box.innerHTML = html;
    box.querySelectorAll('.tools button').forEach(b=>b.addEventListener('click',()=>{
      const p = list[+b.dataset.i];
      const text = `次の論文の注目点(問い・データ・推定手法・主な結果・日本への含意)を日本語で要約してください。\n${p.title}\n${p.url}`;
      copy(text).then(()=>{ b.textContent='コピーしました'; setTimeout(()=>b.textContent='Claude に要約を頼む文面をコピー',1500); });
    }));
    const more = document.getElementById('more');
    more.hidden = list.length<=limit;
    more.textContent = `さらに表示(残り ${list.length-limit} 本)`;
  }
  document.getElementById('more').addEventListener('click',()=>{ limit+=150; render(); });

  function copy(text){
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(()=>fallback(text));
    return Promise.resolve(fallback(text));
  }
  function fallback(text){ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(e){} t.remove(); }

  const qEl = document.getElementById('q');
  qEl.value = state.q;
  let timer; qEl.addEventListener('input',()=>{ clearTimeout(timer); timer=setTimeout(()=>{ state.q=qEl.value; save(); limit=150; render(); },200); });

  function refresh(){ save(); limit=150; buildControls(); render(); }
  function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function attr(u){ u=String(u||''); return /^https?:\/\//i.test(u) ? esc(u) : '#'; }
  refresh();
})();
</script>
</body>
</html>
