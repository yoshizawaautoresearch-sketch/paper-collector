パー（日本語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"Evaluating Spatial Underperformance : A Spatial Computable General Equilibrium Model Applied to Ho Chi Minh City","url":"https://d.repec.org/n?u=RePEc:wbk:wbrwps:11444&r=&r=sea","authors":["Bird, Julia","Venables, Anthony","Dehe, Henry","Rubinyi, Steven Louis","Wibisana, Putu Sanjiwacika","Bui, Quang Anh Phan"],"date":"2026-09-09","abstract":"Thu Duc, a rapidly urbanizing area of Ho Chi Minh City, is well located and heavily invested in policy ambition, yet its output and density remain far below what its position in the metropolitan economy would support. Much of it is also flood exposed. This paper asks how much of that shortfall flood risk explains, and what coordinated investment could recover. A Spatial Computable General Equilibrium model of the Greater Ho Chi Minh City Metropolitan Area, covering 116 cells across Ho Chi Minh City and neighboring provinces, evaluates interventions to 2040. The model endogenizes firm location, household residence and commuting, land use intensity, and agglomeration externalities, recovering ","doi":"","venue":"NEP 東南・東アジア (nep-sea)","sources":["NEP 東南・東アジア (nep-sea)"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"The Impact of Minimum Wage Increases in Japan: An analysis after the introduction of numerical targets","url":"http://www.rieti.go.jp/jp/publications/summary/26090003.html","authors":["森川 正之（特別上席研究員（特任））"],"date":"2026-09-08","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ポリシー・ディスカッション・ペーパー（英語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"How an Economy Shrinks in Space: Concavity-on-jobs and upward consolidation under demographic decline","url":"http://www.rieti.go.jp/jp/publications/summary/26090002.html","authors":["森 知也（ファカルティフェロー）","小川 実起（京都大学）"],"date":"2026-09-08","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ディスカッション・ペーパー（英語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"悪魔は「細目」に宿る―EUのCBAMが輸入品に課す品目別・国別の炭素コストの推定と貿易への影響―","url":"http://www.rieti.go.jp/jp/publications/summary/26090001.html","authors":["上野 貴弘（電力中央研究所）"],"date":"2026-09-08","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ディスカッション・ペーパー（日本語）"],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"ja"},{"title":"Affine-Equivariant Adjusted-Range Self-Normalization","url":"https://d.repec.org/n?u=RePEc:cam:camdae:2678&r=&r=ecm","authors":["Hong, Y.","Lin, Z.","Linton, O. B.","Newey, W. K.","Sun, J."],"date":"2026-09-08","abstract":"We propose affine-equivariant adjusted-range self-normalization for joint inference on time-series parameters. The method uses the projected ranges of a centered influence path to normalize estimation error, yielding pivotal limiting inference without estimating the long-run covariance matrix. The resulting statistic is invariant to nonsingular linear reparameterizations, and its inversion yields affine-equivariant confidence regions. In the univariate case, the proposed method reduces exactly to adjusted-range self-normalization. We derive scalar reference distributions and accommodate proportional variance accumulation through appropriate path centering. Simulations show power gains over q","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":["Self-Normalized Inference, Long-Run Covariance, Affine Equivariance, Influence Functions, Local Projections"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Average Treatment Effect Localization: Projection Methods in Synthetic Control","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.10617&r=&r=ecm","authors":["Ruei-Chi Lee"],"date":"2026-09-01","abstract":"Many real-world policies and business interventions require assessing short-term effects to inform timely decisions, even though most causal inference methods focus on long-term average treatment effects. In this paper, we introduce average treatment effect localization (ATEL), which captures localized, short-term policy impacts in panel data settings with a single treated unit and provides early indicators of policy impact. To accommodate both time-varying and nonlinear effects of observed and unobserved covariates, we propose a nonparametric model for untreated outcome, interpreted as a time-varying factor model via sieve approximation. Estimating the time-varying factor model is challengi","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Poisson Regression under Multivariate Sample Selection","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.21056&r=&r=ecm","authors":["Kirill O. Morozov"],"date":"2026-09-01","abstract":"This paper develops a Poisson regression model with multivariate sample selection, in which the outcome is observed only when several potentially correlated selection conditions are satisfied. To the best of our knowledge, this is the first Poisson sample selection model that allows for an arbitrary number of selection equations. We derive the conditional mean of the observed outcome under joint normality of the outcome and selection errors and obtain a multivariate selection-correction term. We prove identification of the model parameters and show that, under suitable support and rank conditions, the outcome parameters can be identified without an exclusion restriction. We also propose two-","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Tensor-BEKK: Conditional Covariance Modeling and Inference for Tensor-Valued Time Series","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.18157&r=&r=ecm","authors":["Huan Gong","Feiyu Jiang"],"date":"2026-09-01","abstract":"Modern economic and financial data are increasingly organized as multiway arrays, with observations indexed simultaneously by geographic regions, industrial sectors, asset categories, and other economic characteristics. Representing such data as tensor-valued time series preserves their intrinsic multiway structure. Although substantial effort has been devoted to modeling the conditional mean of tensor-valued time series, comparatively less attention has been paid to their conditional covariance dynamics. The latter remains challenging because unrestricted multivariate covariance models involve many parameters and substantial computational cost. To address these challenges, we propose the Te","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Uniform Inference for Parameters Identified by Conditional Quantile Restrictions","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.23303&r=&r=ecm","authors":["Xuqing Lin","Xiaojun Song"],"date":"2026-09-01","abstract":"Many structural and dynamic economic models imply that key parameters are identified by conditional quantile restrictions. Building on the exponential-weighting approach of Bierens (1990) and recent advances in penalized maximum statistics for conditional moment restrictions (Chen et al., 2025), we develop a unified inference framework for such parameters. We propose an adaptive $\\ell_1$-penalized supremum statistic that transforms the conditional restriction into a continuum of unconditional moment conditions and aggregates evidence across quantile indices. The penalty regularizes the maximization over the weighting direction. Under the stated uniformity conditions, the known-parameter adap","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Identification and Inference in proxy-SVARs with non-Gaussian shocks","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.14398&r=&r=ecm","authors":["Paritosh Shankarrao Junare"],"date":"2026-09-01","abstract":"Two frequent approaches for identifying structural VARs are external instruments, which carry economic content but are often weak, and non-Gaussianity of the shocks which provides statistical identification but carries no economic meaning. We combine the two strategies in a single generalized method of moments framework that stacks proxy exclusion restrictions with higher-order moment conditions of the structural shocks. This hybrid approach point-identifies the target shocks while also identifying the non-target shocks up to sign and ordering. Under suitable rank conditions, the higher-order moments anchor the identification uniformly over the instrument strength. Consequently, under local-","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Conditional-Moment Estimation and Inference in the BLP Model","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.15736&r=&r=ecm","authors":["Hua Jin","Rui Sun","Tian Xie"],"date":"2026-09-01","abstract":"The random-coefficient demand model of Berry, Levinsohn, and Pakes (1995) is commonly estimated by the generalized method of moments (GMM), using an unconditional moment restriction with a fixed set of instruments. Identification of the model, however, rests on a conditional moment restriction. The two are not equivalent: the unconditional restriction may admit additional parameter values. We construct a counterexample in which the model is identified by the conditional restriction yet standard GMM is not, even with the optimal instrument. Building directly on the identifying restriction, we propose a two-step estimator, following Ai and Chen (2003), that first estimates the relevant conditi","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Synthetic Nearest Neighbors: Extending Synthetic Controls for Matrix Completion with Missing Not at Random Data","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.13586&r=&r=ecm","authors":["Anish Agarwal","Munther Dahleh","Devavrat Shah","Dennis Shen"],"date":"2026-09-01","abstract":"We develop a causal framework for matrix completion under missing not at random (MNAR) data. Drawing on synthetic controls from the econometric panel data literature, our approach relaxes two assumptions common in MNAR matrix completion: positivity and independence of observation indicators. Unlike traditional panel data models, which often require prescribed block-sparse geometries, our framework accommodates flexible, heterogeneous observation patterns through target-specific local information structures. We propose synthetic nearest neighbors (SNN), a local synthetic-controls-inspired estimator, and establish finite-sample entrywise error bounds and consistency for mean recovery under sui","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"A Stochastic Nested Fixed Point Algorithm for Large-Scale BLP Estimation","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.23998&r=&r=ecm","authors":["Zhentong Lu","Myung Hwan Seo","Youngki Shin","Qichen Zhang"],"date":"2026-09-01","abstract":"We develop a stochastic nested fixed point (SNFP) estimator for random coefficients logit demand models that updates model parameters using stochastic gradients and performs demand inversion one market at a time. Relative to the conventional nested fixed point (NFP) estimator, SNFP substantially reduces memory requirements and computational cost, making estimation feasible in very large datasets. We establish the large-$T$ (number of markets) asymptotic properties of the estimator under regularity conditions. We also characterize the effect of sharing one block of simulation draws across markets and show how to correct for it. Monte Carlo simulations show that the SNFP estimator achieves sta","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)","arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.CO","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Summary Indices in Treatment Effect Estimation","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.21393&r=&r=ecm","authors":["Danil Fedchenko"],"date":"2026-09-01","abstract":"This paper studies the practice of combining multiple outcomes into a summary index to estimate a causal effect. For common estimators and index constructions, the estimate equals a weighted sum of the estimated effects on the components, with weights that are implicit and rarely reported. The paper derives the weights and shows that, for inverse-covariance-weighted indices, they can be negative and unrestricted in magnitude, so the index effect can have the opposite sign to every component effect. The paper proposes two procedures for valid inference on the index effect: a variance estimator that accounts for the data-dependent weights, and a shifted t-test that requires no such correction.","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Shrinkage Bayesian Causal Forest with Instrumental Variable","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.18903&r=&r=ecm","authors":["Lennard Ma{\\ss}mann","Jens Klenke"],"date":"2026-09-01","abstract":"Discovering interpretable subgroups whose complier effects deviate from the average is a central goal of instrumental variable analysis under imperfect compliance, yet existing tree-based methods degrade when most covariates are irrelevant to the effect. We propose Shrinkage Bayesian Causal Forest with Instrumental Variable (SBCF-IV) for discovering and estimating subgroups with heterogeneous Complier Average Causal Effects (CACE) in sparse high-dimensional settings. SBCF-IV places a sparsity-inducing Dirichlet prior on the splitting probabilities of the Bayesian Additive Regression Trees that estimate the conditional intention-to-treat and the complier share, concentrating posterior mass on","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Causal inference in two-sided randomization designs: factorial regression, two-way clustering, and covariate adjustment","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.22761&r=&r=ecm","authors":["Pengfei Tian","Jizhou Liu","Lei Shi","Peng Ding"],"date":"2026-09-01","abstract":"We study randomized experiments involving two interacting populations, such as buyers and sellers in a marketplace. In the two-sided experiments we consider, we randomize the two populations separately and independently. For a pair consisting of one member from each population, the two assignments jointly determine one of four exposure conditions. Under a local interference assumption, we consider a broad class of linear estimands, including total, interaction, and buyer- and seller-side spillover effects. Our first main result establishes that researchers can estimate these effects using ordinary least squares and conduct asymptotically valid design-based inference using the conventional tw","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Omitted Variable Bias in Difference-in-Differences Designs","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.19386&r=&r=ecm","authors":["Juejue Wang","Pedro H. C. Sant'Anna","Victor Chernozhukov","Carlos Cinelli"],"date":"2026-09-01","abstract":"We study the omitted variable bias (OVB) problem in canonical difference-in-differences (DiD) designs when unobserved confounding induces departures from the parallel trends assumption. Our results provide a novel characterization of the OVB formula for the average treatment effect on the treated (ATT), which is of independent interest. We show how the ATT bias is mainly governed by the strength of confounding in the treatment assignment mechanism and provide alternative ways of quantifying this strength, such as (i) changes in the average odds of treatment among the treated, (ii) confounding imbalance between treated and control units, or (iii) variation explained in treatment odds among th","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Consistent Order Selection under Non-Identifiability and Dependence","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.23220&r=&r=ecm","authors":["Eduardo Fonseca Mendes"],"date":"2026-09-01","abstract":"We provide sufficient conditions for the consistency of penalized least squares procedures that select the order (dimension) of a regression model from a sequence of nested classes, allowing for dependent, martingale-difference errors. The main contribution is to relax the classical identifiability requirement: parameters indexing classes larger than the true order need not be identified, provided the additional, excess directions admit a linear approximation to the truth in a neighbourhood of the true parameter. This relaxation lets the number of candidate models grow with the sample size, removing the usual need for a fixed upper bound. We verify the resulting high-level conditions for two","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Two Margins in Difference-in-Differences with a Continuous Treatment","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.09488&r=&r=ecm","authors":["Fangzhou Yu"],"date":"2026-09-01","abstract":"This paper studies difference-in-differences with staggered adoption and a continuous, time-invariant dose. Each cohort-time comparison contains two margins. The level margin is the average treatment effect at realized doses. Under level parallel trends it equals the level contrast between the treated cohort and not-yet-treated controls. The response margin is the within-cohort slope of the outcome change on dose. It uses no controls, and its causal interpretation requires a response parallel trends assumption and a restriction on selection on gains. We show that the continuous-dose OLS coefficient in each cohort-time comparison is a convex combination of the response index and the level con","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Simultaneous Clustered Orthogonalization","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.12280&r=&r=ecm","authors":["Bastien Buchwalter","Francis X. Diebold","Kamil Yilmaz"],"date":"2026-09-01","abstract":"Identification in vector autoregressions involves two distinct choices: how extensively to orthogonalize shocks and whether orthogonality is imposed sequentially or simultaneously. Generalized identification imposes no orthogonality; Sims (1980} imposes full orthogonality sequentially; Francis et al. (2026) impose full orthogonality simultaneously; and Buchwalter et al. (2026a) provide clustered partial orthogonalization sequentially. We fill the remaining case by developing simultaneous clustered orthogonalization (SCO). SCO preserves contemporaneous dependence within economically meaningful clusters while imposing orthogonality across clusters jointly, thereby eliminating dependence on clu","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Penalized Maximum Likelihood Inference of Core-Periphery Networks","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.15796&r=&r=ecm","authors":["Antonio Mosca","Piero Mazzarisi"],"date":"2026-09-01","abstract":"Likelihood-based network models are often fitted under links' independence and low-order constraints, while empirical networks frequently exhibit systematic higher-order structures such as triangles and wedges, characterizing the observed clustering patterns. Real-world core-periphery networks such as the interbank market or the air transportation system represent key examples, with cores displaying complex and nonlinear features. We formalize Penalized Likelihood with Structural Discrepancies (PLSD) as an inference-level correction that trades likelihood fit for agreement with targeted motifs. PLSD augments the negative log-likelihood with a penalty on standardized wedge and triangle discre","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Anthropogenic Forcing, Climate Change, and the Shape of Warming: Statistical Inference for Distributional Cointegration","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.16509&r=&r=ecm","authors":["Won-Ki Seo","Kyungsik Nam"],"date":"2026-09-01","abstract":"Anthropogenic forcing components follow different long-run paths, while persistent temperature change can involve distributional changes beyond the mean. Scalar regressions aggregate these components and retain only mean temperature, obscuring how distinct forcing paths relate to persistent distributional change. We develop new testing, estimation, and inference methods for long-run relations between an integrated predictor vector and a density-valued response. These comprise a residual-based test of between-cointegration (whether predictor trends account for all stochastic trends in the response density), a fully modified least-squares estimator of predictor-specific functional responses, a","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Learn the measure, estimate the moment: machine-learned drivers in dynamic conditional correlation models","url":"https://d.repec.org/n?u=RePEc:cdf:wpaper:2026/12&r=&r=ecm","authors":["Xu, Yongdeng"],"date":"2026-09-01","abstract":"Realized measures are biased for the moments of returns. We propose a two-step approach to forecasting large correlation matrices: machine-learned forecasts of realized measures enter a dynamic conditional correlation model as drivers, and their weights are estimated by quasi-maximum likelihood on returns. The correlation recursion is run in a matrix-logarithm parametrization, so every forecast is a valid correlation matrix. For Dow Jones stocks, a learned volatility driver and this recursion improve on a dynamic conditional correlation model with realized drivers at horizons of one, five and 22 days. For S&P 500 stocks, the model fits monthly returns better than machine-learned projections ","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":["DCC-GARCH-X; Realized measures; Covariance forecasting; Forecast evaluation; Positive definiteness; Log-correlation coordinates; Nonlinear shrinkage"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Entropic tilting of forecasts to SPF histograms: analytics & applications","url":"https://d.repec.org/n?u=RePEc:ecb:ecbwps:20263284&r=&r=ecm","authors":["Mertens, Elmar","Clark, Todd E."],"date":"2026-09-01","abstract":"We develop a direct approach to incorporating survey density forecasts into model-based predictive distributions. Histogram forecasts from the U.S. Survey of Professional Forecasters (SPF) carry rich nonparametric information about expected outcomes, but existing methods rely on moment-based approximations that discard part of it. We instead tilt entropically to the histogram probabilities themselves, matching them exactly. After reformulating the single-histogram problem, we derive a new analytic characterization of the multiple-histogram case, solved by Iterative Proportional Fitting and applicable to simulated densities from essentially any model. Applying the method to real-time forecast","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":["Bayesian vector autoregression, iterative proportional fitting, predictive densities, relative entropy, survey expectations"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Beyond Pretrends: A Discordance-Based Sensitivity Analysis for Difference-in-Differences","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.19081&r=&r=ecm","authors":["Thomas Leavitt"],"date":"2026-09-01","abstract":"In the canonical Difference-in-Differences design, the control group's post-treatment change serves as an imputation of the treated group's counterfactual change in the same period, an imputation justified by parallel trends. However, differences in group composition can produce between-group differences in how outcomes would evolve over time, rendering this imputation vulnerable to confounding. An alternative imputation -- such as one based on the treated group's pre-treatment change -- avoids such between-group confounding but introduces the risk of confounding from within-group temporal shifts. Ideally, both imputations, each vulnerable to different sources of confounding, would have conc","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"The \"Rough\" HAR Model","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.21587&r=&r=ecm","authors":["Mikkel Bennedsen","Kim Christensen","Peter Korsbakke Christensen","Jun Yu","Chen Zhang"],"date":"2026-09-01","abstract":"This paper proposes discrete-time approximations to rough continuous-time models of realized variance (RV). The leading rough models can be viewed as autoregressive processes driven by fractional Gaussian noise. We show that the Wold representation of this noise concentrates its dependence at the first lag when the Hurst parameter is below one half. Augmenting the autoregressive (AR) and heterogeneous autoregressive (HAR) models with a first-order moving-average (MA(1)) component therefore approximates the roughness, and the MA coefficient maps almost linearly into the Hurst parameter. We refer to these extensions as the \"rough\" AR and \"rough\" HAR models. Estimating them on the log RV of ten","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Multitask Reinforcement Learning for Assisting Choice Model Specification","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.18441&r=&r=ecm","authors":["Gabriel Nova","Stephane Hess","Sander Van Cranenburgh"],"date":"2026-09-01","abstract":"Discrete choice model specification is a time-consuming task in which modellers often specify and estimate multiple models while balancing goodness-of-fit, parsimony, and behavioural plausibility. We present Delphos, a multitask reinforcement learning framework that learns transferable specification strategies across transport choice datasets. Delphos frames model specification as a sequential decision-making problem in which it applies a sequence of modelling actions and receives feedback from an estimation environment based on model performance and convergence. To transfer modelling decisions across datasets with different sets of variables, Delphos represents utility specifications as set","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Bootstrap-Assisted Tests for Skewness, Kurtosis, and Normality Under Unknown Dependence","url":"https://d.repec.org/n?u=RePEc:svk:wpaper:1146&r=&r=ets","authors":["Charisios Grivas","Zacharias Psradakis","Marian Vavra"],"date":"2026-09-01","abstract":"This paper considers tests for skewness, kurtosis and normality of the one-dimensional marginal distribution of a stationary fractional process, which may exhibit short memory, antipersistence or long memory. The autoregressive-sieve bootstrap is used to obtain Pvalues and critical values for tests based on studentized empirical coefficients of skewness and kurtosis. These studentized coefficients are constructed using variance estimators obtained by the same bootstrap procedure. Notably, such tests, as well as variants based on non-studentized statistics, can be implemented in a straightforward manner without requiring knowledge or estimation of the memory parameter of the process. Monte Ca","doi":"","venue":"NEP 計量時系列 (nep-ets)","sources":["NEP 計量時系列 (nep-ets)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Probabilistic Seasonality","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.36280&r=&r=ets","authors":["Feras A. Saad","Todd B. Walker"],"date":"2026-09-01","abstract":"Seasonal adjustment is fundamental to economic analysis, but uncertain because seasonal components are inherently latent. This article introduces a probabilistic model discovery method that decomposes a time series into seasonal and nonseasonal components. The method returns a posterior distribution over the structure and parameters of a seasonal component. In simulation studies, the method can improve point forecasts, interval predictions, and recovery of seasonal components relative to X-13ARIMA-SEATS. In a study of eight U.S. macroeconomic series during the COVID-19 recession, the method surfaces significant ex-ante uncertainty about current seasonal adjustments in real time, well before ","doi":"","venue":"NEP 計量時系列 (nep-ets)","sources":["NEP 計量時系列 (nep-ets)","arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"An adaptive $L_2$-type test for high-dimensional white noise","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.33418&r=&r=ets","authors":["Jinyuan Chang","Jing He","Weiming Li","Chen Lin"],"date":"2026-09-01","abstract":"We propose a new $L_2$-type test for white noise which allows the dimension $p$ of the time series to either (i) be a fixed constant, or (ii) diverge with the sample size $n$. The proposed test statistic exhibits an interesting phase transition, following two different regimes of behavior: $p$ is fixed, and $p\\rightarrow\\infty$. Because identification of the operable regime is difficult, if not impossible in practice, we devise a novel adaptive bootstrap method to construct unified testing procedure across different phases. Numerical experiments confirm the good finite sample performance of the proposed adaptive $L_2$-type test in comparison to the existing methods in the literature. The pro","doi":"","venue":"NEP 計量時系列 (nep-ets)","sources":["NEP 計量時系列 (nep-ets)","arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","math.ST"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Two-Point Dependent Wild Bootstrap for Weakly Dependent Estimating Equations","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.32369&r=&r=ets","authors":["Mikihito Nishi","Takashi Yamagata"],"date":"2026-09-01","abstract":"This paper develops a general two-point dependent wild bootstrap (DWB) for weakly dependent estimating equations. Its key feature is that the two-point marginal distribution and the latent serial dependence specification can be chosen separately. The construction combines a normalized two-point distribution with a stationary latent Gaussian process via a Gaussian copula transformation, includes dependent Rademacher and Mammen multipliers, and nests the classical iid two-point wild bootstrap as the serially independent case. The induced multiplier autocovariances determine the lag weights in a corresponding heteroskedasticity- and autocorrelation-consistent (HAC) covariance estimator, which c","doi":"10.48550/arxiv.2609.32369","venue":"NEP 計量時系列 (nep-ets)","sources":["NEP 計量時系列 (nep-ets)","OpenAlex:日本の研究機関の著者を含む論文","arXiv econ.EM(計量経済学)"],"groups":["ecm","japan"],"countries":["GB","JP"],"tags":["econ.EM","stat.ME"],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Openness and Productivity Reform: Lessons for Middle-Income Economies from Thailand and other ASEAN","url":"https://d.repec.org/n?u=RePEc:wbk:wbrwps:11440&r=&r=sea","authors":["Artuc, Erhan","Constantinescu Neagu, Ileana Cristina","Taglioni, Daria"],"date":"2026-09-01","abstract":"How can middle-income economies convert trade openness and productivity-enhancing reforms into higher real income and welfare? This paper develops a quantitative trade model with input-output linkages and labor market frictions to assess the impact of trade and productivity reforms on real income, wages, trade, and production. Thailand and ASEAN provide a useful case because the region spans economies with very different approaches to growth: some deeply embedded in Asian manufacturing value chains, others focused on commodities, export-led industrializers, and countries pursuing more selective integration. This variation allows assessing when openness yields large welfare gains, when produc","doi":"","venue":"NEP 東南・東アジア (nep-sea)","sources":["NEP 東南・東アジア (nep-sea)"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Oil versus Non-Oil Geopolitical Risk and US Industry Stock Market Volatility","url":"https://d.repec.org/n?u=RePEc:pre:wpaper:202626&r=&r=fmk","authors":["Onur Polat","Yuxiang Ye","Rangan Gupta"],"date":"2026-09-01","abstract":"This study examines whether decomposing the geopolitical risk (GPR) index into oil- and non-oil-related components yields incremental explanatory power for U.S. industry stock market volatility. Using daily conditional volatilities derived from a GJR-GARCH model with time-varying skewness and kurtosis (GJR-SK) across 49 Fama-French industries, we estimate autoregressive specifications with exogenous inputs (ARX). Each model incorporates rich macro-financial controls, including market portfolio volatility, the Aruoba-Diebold-Scotti business conditions index, and the shadow-rate-augmented federal funds rate. Through a sequence of properly nested F-tests, we address three core empirical questio","doi":"","venue":"NEP 金融市場 (nep-fmk)","sources":["NEP 金融市場 (nep-fmk)"],"groups":["global"],"countries":[],"tags":["stock price volatility, industry sectors, geopolitical risk, oil geopolitical risk, ARX, nested F-test"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Measuring sentiment news with transformer-based language models","url":"https://d.repec.org/n?u=RePEc:ecb:ecbwps:20263283&r=&r=fmk","authors":["Borgioli, Stefano","Gallo, Giampiero M.","Ongari, Chiara","Mavillonio, Maria Saveria","Giannetti, Caterina"],"date":"2026-09-01","abstract":"Measuring sentiment from financial news is a central task in economics and finance, yet most existing indicators rely on dictionary-based approaches that infer sentiment from word counts and only partially capture context, negation, and semantic structure. This paper proposes a framework for constructing daily news mood indices using transformer-based language models and evaluates whether they better represent sentiment than dictionary-based alternatives. Using 143, 755 financial news articles from Factiva, we classify sentiment at the sentence level with FinBERT and aggregate these predictions into article-level and daily sentiment measures through alternative normalization schemes. We comp","doi":"","venue":"NEP 金融市場 (nep-fmk)","sources":["NEP 金融市場 (nep-fmk)"],"groups":["global"],"countries":[],"tags":["daily mood indices, financial news sentiment, FinBERT, human validation, text-as-data, transformer-based language models"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Deregulation and the Predictability of U.S. Stock Market Bubbles: State-Dependent Evidence from Multivariate Quantile-on-Quantile Approach","url":"https://d.repec.org/n?u=RePEc:pre:wpaper:202627&r=&r=fmk","authors":["Khder Alakkari","Bushra Ali","Mariem Brahim","Rangan Gupta"],"date":"2026-09-01","abstract":"In this paper, it is analyzed whether deregulation can be used as a positive or negative state dependent predictor of U.S. stock market bubbles. We use monthly data between February 1973 and May 2025 to calculate the dynamics of these bubbles using 6 Multi-Scale Log-Periodic Power Law Singularity Confidence Indicators, separated by positive and negative bubbles in short-, medium- and long-term horizons. We then use a multivariate quantile-on-quantile regression model to analyse the joint changing nature of the prediction power of deregulation as the distribution of deregulation intensity and the distribution of bubble confidence are controlled for macroeconomic activity and monetary conditio","doi":"","venue":"NEP 金融市場 (nep-fmk)","sources":["NEP 金融市場 (nep-fmk)"],"groups":["global"],"countries":[],"tags":["Stock market bubbles, MS-LPPLS confidence indicators, Quantile-on-quantile regression, Regulatory policy, Financial stability"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Hedge funds and bond market liquidity dynamics at the onset of the 2026 Middle East conflict","url":"https://d.repec.org/n?u=RePEc:bca:bocsap:26-42&r=&r=fmk","authors":["Vincent Meh","Jabir Sandhu","Andreas Uthemann"],"date":"2026-09-01","abstract":"We examine whether hedge funds and other asset managers contributed to illiquidity in the Government of Canada bond market at the onset of the war in the Middle East in early 2026. We find no evidence that they did. Hedge funds remained active participants in primary auctions, while the extent to which dealers could offset client transactions in secondary markets stayed within its typical range. Although hedge funds did reduce leveraged positions, their trading remained broadly consistent with their usual relative-value strategies.","doi":"","venue":"NEP 金融市場 (nep-fmk)","sources":["NEP 金融市場 (nep-fmk)"],"groups":["global"],"countries":[],"tags":["Financial markets and funds management; Funds management; Market functioning"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Financial Language Models as Applied Artificial Intelligence Systems for News-Based Trading under Market Frictions","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.23703&r=&r=fmk","authors":["Kemal Kirtac"],"date":"2026-09-01","abstract":"Financial language models can transform unstructured firm-specific news into structured decision signals, but financial AI research lacks an integrated deployment framework for evaluating whether those signals remain useful in financial decision systems. Computer science research has developed strong methods for time-series forecasting, text classification, multimodal stock prediction, graph-based market modeling, and machine-learning operations, yet these streams do not provide a domain-specific protocol that jointly tests financial language-model outputs under event-time observability, probability calibration, execution timing, transaction costs, liquidity constraints, capacity limits, ope","doi":"","venue":"NEP 金融市場 (nep-fmk)","sources":["NEP 金融市場 (nep-fmk)"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"CAST: A Cross-Asset State-Space Trading System for Drawdown Control in Stock Markets","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.14205&r=&r=fmk","authors":["Yu Peng","Matloob Khushi","Josiah Poon"],"date":"2026-09-01","abstract":"Managing drawdown, the peak-to-trough decline in an investment portfolio's value, is a precondition for long-term survival in practical investment management. However, mainstream stock forecasting methods predominantly optimize returns or Sharpe ratios under the independent and identically distributed (i.i.d.) assumption. Real markets do not follow this assumption, triggering catastrophic drawdowns. We propose a cross-asset state-space trading system (CAST), consisting of two components: The predictor, Cross-Asset Collaborative Kalman Filter (CoKF), estimates each asset's latent state online, coupling all assets through their correlations and adaptively fusing multiple integrated-random-walk","doi":"","venue":"NEP 金融市場 (nep-fmk)","sources":["NEP 金融市場 (nep-fmk)"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Uncovering the use of haircuts in the Canadian repo market","url":"https://d.repec.org/n?u=RePEc:bca:bocsap:26-39&r=&r=fmk","authors":["Sadia Anum","Jabir Sandhu","Adrian Walton"],"date":"2026-09-01","abstract":"We document haircut practices in the Canadian dealer-to-client repo market using transaction level data. We find that haircuts are rarely used across repos for different collateral, maturities and most counterparty types. Notable exceptions include wealth managers and some foreign official institutions, which use haircuts more, likely due to their specific regulations or requirements. We also find no evidence that haircut use increased materially during periods of market stress, including March 2020.","doi":"","venue":"NEP 金融市場 (nep-fmk)","sources":["NEP 金融市場 (nep-fmk)"],"groups":["global"],"countries":[],"tags":["Financial markets and funds management; Market structure; Financial system; Financial institutions and intermediation; Financial stability and systemic risk; Financial system regulation and oversight"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Disappearing Dollar Convenience?","url":"https://d.repec.org/n?u=RePEc:nbr:nberwo:35742&r=&r=fmk","authors":["Arvind Krishnamurthy","Miguel Chumbo"],"date":"2026-09-01","abstract":"We measure the convenience yield on dollar safe assets over the last 5 years to answer this question. We find that within the set of U.S. dollar assets, safe asset convenience yields are about the same in 2025 as they were in 2019, and these levels are expected to persist for the next decade. Across the globe, the richness of U.S. dollar safe assets, particularly Treasurys, compared to the safe assets of other currencies have fallen considerably. There is also evidence that the U.S. dollar repo is currently the highest convenience dollar safe asset. In short, our answer is, no for domestic liquidity purposes, and yes for global liquidity purposes.","doi":"","venue":"NEP 金融市場 (nep-fmk)","sources":["NEP 金融市場 (nep-fmk)"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Corporate bond pricing in the AI era","url":"https://d.repec.org/n?u=RePEc:bdi:opques:qef_1057_26&r=&r=fmk","authors":["Marco Albori","Andrea Zaghini"],"date":"2026-09-01","abstract":"We study how the emergence of generative artificial intelligence (AI) affected corporate bond pricing. Using bond-level issuance data for U.S. non-financial corporations and a difference-in-differences design centered on the launch of ChatGPT, we examine whether debt investors differentiate firms according to their position in the AI value chain. We find that hyperscalers experienced a significant decline in borrowing costs relative to comparable issuers, while software firms faced less favorable financing conditions. The results suggest that credit markets rapidly incorporated expectations regarding the distribution of gains and losses from generative AI. More broadly, the evidence indicate","doi":"","venue":"NEP 金融市場 (nep-fmk)","sources":["NEP 金融市場 (nep-fmk)"],"groups":["global"],"countries":[],"tags":["artificial intelligence, asset pricing, bonds, corporate finance"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"A New Approach to Estimating Portfolio-Balance Models of the Yield Curve","url":"https://d.repec.org/n?u=RePEc:bca:bocawp:26-33&r=&r=fmk","authors":["Antonio Diez de los Rios"],"date":"2026-09-01","abstract":"We show that the parameters of a broad class of portfolio-balance models can be recovered from estimates of Gaussian dynamic term structure models (GDTSMs) using a two-step estimator that bypasses the fixed-point problem that characterizes portfolio balance models. Specifically, we develop a novel canonical representation of bond supply in terms of factor-mimicking portfolios, whose returns replicate the structural shocks to the pricing factors. We identify these structural shocks by assuming that each shock corresponds to a distinct, mutually exclusive dimension of bond-supply variation. Using U.S. Treasury yields and macroeconomic data, we show the recovered shocks admit interpretations as","doi":"","venue":"NEP 金融市場 (nep-fmk)","sources":["NEP 金融市場 (nep-fmk)"],"groups":["global"],"countries":[],"tags":["Financial markets and funds management; Funds management; Models and tools; Econometric, statistical and computational methods"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"The long‐run disinflationary effects of central bank independence","url":"https://d.repec.org/n?u=RePEc:tcd:tcduee:tep2026&r=&r=mon","authors":["Angelos Athanasopoulos","Donato Masciandaro","Davide Romelli"],"date":"2026-09-01","abstract":"This paper provides novel evidence of the long‐run effects of reforms in central bank independence on inflation. Using instrumental‐variable local projections, we show that improvements in central bank independence have a much larger impact on inflation in the long run compared to the short run. Contrary to most of the previous literature, we also find that these long‐run effects are larger in developing countries. Our results are robust to alternative local projection designs, including doubly robust and difference‐in‐differences specifications. Finally, we provide evidence that reforms that strengthen central bank independence also reduce inflation persistence, reinforcing the effectivenes","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["central bank design; central bank independence; inflation; persistence; central bank reforms"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Financial Innovation and the International Monetary System","url":"https://d.repec.org/n?u=RePEc:nbr:nberwo:35822&r=&r=mon","authors":["Gordon Y. Liao","Eswar S. Prasad","Tony Zhang"],"date":"2026-09-01","abstract":"We show that the dollar remains dominant in most aspects of global finance. The euro and renminbi are competing in an increasingly fragmented second tier of currencies, leaving no clear rivals to the dollar. We study how financial innovation could reshape the international monetary system. In principle, innovation levels the playing field between countries, for instance by reducing the need for vehicle currencies to intermediate transactions between other currency pairs and by making it easier to acquire and trade foreign assets. We show that an alternative outcome is more likely. Innovations that reduce frictions in cross-border transactions, especially dollar-backed payment stablecoins and","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"What happens after Governing Council sets the policy interest rate: Inside the implementation framework that makes monetary policy work","url":"https://d.repec.org/n?u=RePEc:bca:bocsap:26-45&r=&r=mon","authors":["Kaetlynd McRae"],"date":"2026-09-01","abstract":"What happens after Governing Council sets the target for the policy interest rate? Setting the target rate is the most visible part of monetary policy, but it is only the first step in transmitting the rate decision to the Canadian economy. This paper explains how the Bank of Canada uses its monetary policy implementation framework (MPI) to ensure that the rate decision is reflected in financial markets by keeping short-term interest rates close to the target policy rate.","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["Financial markets and funds management; Funds management; Monetary policy; Monetary policy framework and transmission; Monetary policy tools and implementation; Money and payments; Payment and financial market infrastructures"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Money and Power: Historical Lessons for Stablecoins and U.S. Dollar Dominance","url":"https://d.repec.org/n?u=RePEc:pri:cepsud:359&r=&r=mon","authors":["Michael D. Bordo","Carolyn A. Wilkins"],"date":"2026-09-01","abstract":"This paper uses the history of private money to assess the conditions under which stablecoins could function safely at scale and what their growth may imply for U.S. monetary power. Historical systems of private money in the United Kingdom, the United States, Canada, Sweden, and Switzerland show that par circulation depended on institutional arrangements rather than payment technology. Drawing on the monetary history of private money, convertibility, and international currencies, the paper identifies five foundations for scalable private money: credible convertibility, high quality and transparent backing, a uniform regulatory perimeter, par clearing infrastructure, and credible crisis manag","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["Stablecoins, digital money, private money, commitment, coordination, crisis management, international role of the dollar, dollar dominance, cross-border cooperation, rules, regulations, rails"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Subjective Models of the Macroeconomy and the Transmission of Monetary Policy","url":"https://d.repec.org/n?u=RePEc:nbr:nberwo:35831&r=&r=mon","authors":["Francesco D’Acunto","Dimitris Georgarakos","Geoff Kenny","Michael Weber"],"date":"2026-09-01","abstract":"Standard macroeconomic theories assume that representative or heterogeneous agents share a common model of how the economy operates. Yet evidence shows that households hold heterogeneous subjective models---distinct beliefs about how macroeconomic variables interact. As a result, identical shocks or policies may elicit different responses from otherwise similar households. We test this hypothesis by measuring subjective models and investigating their role in the transmission of monetary policy to consumption embedding randomized controlled experiment in a large-scale, multi-country survey. Consumers who believe that monetary tightening primarily operates through its effects on borrowing or s","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Are there asymmetries in euro area monetary policy transmission?","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.37168&r=&r=mon","authors":["Michael Pfarrhofer","Anna Stelzer"],"date":"2026-09-01","abstract":"We answer the question posed in the title with a nonlinear mixed-frequency vector autoregression, estimated with Bayesian additive regression trees. The model combines monthly macro-financial variables with quarterly bank lending survey data, and identifies the dynamic responses from high-frequency policy surprises. Sign asymmetry dominates; a tightening produces monetary policy transmission mostly in line with the theoretical predictions, whereas easing of any size produces mostly insignificant responses. Peak effects vary with initial conditions, while several common, predefined regime splits do not yield considerable differences in the propagation of the shocks.","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)","arXiv econ.EM(計量経済学)"],"groups":["ecm","global"],"countries":[],"tags":["econ.EM","stat.AP"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Price Setting During a Currency Changeover","url":"https://d.repec.org/n?u=RePEc:nbr:nberwo:35790&r=&r=mon","authors":["Fernando E. Alvarez","David Argente","Alberto Cavallo","Francesco Lippi"],"date":"2026-09-01","abstract":"We use the euro cash changeover, a large-scale and purely nominal reform that requires all firms to redenominate posted prices, to distinguish among theories of price rigidity. We develop a nonstationary menu-cost model in which firms anticipate the changeover date and may combine currency adoption with real price adjustment. The announcement makes the firm’s inaction region time-varying, a singular control problem with a moving boundary for which closed-form characterizations are rarely available. We solve this problem analytically by perturbation, recovering the whole path of the boundary, the date at which firms begin adopting the new currency, and the implied pricing moments. The model p","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Price Stability in the European Union: A Systemic Approach Using Random Matrix Theory","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.35011&r=&r=mon","authors":["Sami Diaf"],"date":"2026-09-01","abstract":"Price stability remains a pillar in monetary policy practices and carries a special importance within monetary unions. Mainstream economics tried to leverage price stability using price indices and several metrics to shed light on specific dynamics and optimal macroeconomic levels. The wide availability of data led researchers to consider the study of systems using Random Matrix Theory, based on inner correlation patterns. This aims to enhance the multivariate analysis by removing noisy patterns from the signal and improve data quality for further inferences. This work considers the collection of monthly inflation indices in the Eurozone as a \\textit{system} of prices to analyze its eigenval","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)","arXiv econ.EM(計量経済学)"],"groups":["ecm","global"],"countries":[],"tags":["cs.LG","econ.EM","stat.AP","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Early Results from the RESET Demonstration Project: Inflation in Food at Home","url":"https://d.repec.org/n?u=RePEc:nbr:nberwo:35817&r=&r=mon","authors":["Steve Coffey","Gabriel Ehrlich","John C. Haltiwanger","Ron S. Jarmin","David Johnson","Tod Johnson","Matthew D. Shapiro"],"date":"2026-09-01","abstract":"This paper presents early results from the RESET Demonstration Project, an initiative that constructs price and sales indices using item-level transactions data. The project’s overarching goal is to demonstrate the feasibility and advantages of leveraging modern transactions data for economic measurement by pointing toward a future in which official economic statistics are rebuilt on 21st-century data and technology. The paper introduces new inflation measures for Food at Home and evaluates them on two fronts: how they compare to current official statistics and what they offer as novel measures that capture more accurately the dynamics of consumer choice. The paper also addresses the challen","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Forecasting Intraday USD/CAD Exchange Rate with News-Derived Monetary-Policy Signals","url":"https://d.repec.org/n?u=RePEc:arx:papers:2609.32773&r=&r=mon","authors":["Maya Kodeih","Aliaa Alnaggar","Mucahit Cevik"],"date":"2026-09-01","abstract":"Monetary-policy announcements and central-bank communications play a central role in foreign exchange markets, yet their qualitative, unstructured form makes their forecasting value difficult to quantify. While prior research has largely focused on sentiment extracted from financial news, comparatively little is known about the relative contribution of different dimensions of monetary-policy communication. Existing studies primarily evaluate whether textual information improves overall forecasting performance but provide limited insight into which communication channels drive such improvements. To address this gap, this paper introduces a statistical attribution methodology that decomposes m","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Identification in Linear Quantile Panel Models","url":"https://d.repec.org/n?u=RePEc:boc:bocoec:1116&r=&r=ecm","authors":["Shakeeb Khan","Elie Tamer"],"date":"2026-08-31","abstract":"This paper studies identification in linear quantile panel models with unrestricted individual heterogeneity when the number of time periods is fixed and small. We impose quantile strict exogeneity, whereby the conditional quantile restriction holds given the individual’s complete regressor history and latent individual effect, but otherwise allow the disturbances to be arbitrarily dependent over time. We show that the common slope coefficient can be partially identified from the requirement that the residuals in all periods be compatible with a common latent individual effect. We characterize the sharp identified set as the set of coefficients for which there exists a latent coupling satisf","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":["panel data, quantile regression, fixed effects, partial identification, sharp identified set, duality, linear programming"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Estimation beyond missing (completely) at random","url":"https://d.repec.org/n?u=RePEc:ehl:lserod:138134&r=&r=ecm","authors":["Ma, Tianyi","Verchand, Kabir A.","Berrett, Thomas B.","Wang, Tengyao","Samworth, Richard J."],"date":"2026-08-31","abstract":"We study the effects of missingness on the estimation of population pa rameters. Moving beyond restrictive missing completely at random (MCAR) assumptions, we first formulate a missing data analogue of Huber’s arbi trary ϵ-contamination model. For mean estimation with respect to squared Euclidean error loss, we show that the minimax quantiles decompose as a sum of the corresponding minimax quantiles under a heterogeneous, MCAR assumption, and a robust error term, depending on ϵ, that reflects the addi tional error incurred by departure from MCAR. We next introduce natural classes of realisable ϵ-contamination models, where an MCAR version of a base distribution P is contaminated by an ar bit","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":["missing data;Huber contamination model;missing not at random;robust estimation"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Strengthening Regional Co-operation on Ship Waste Management in ASEAN: From Strategy to Implementation","url":"https://d.repec.org/n?u=RePEc:era:wpaper:pb-2026-06&r=&r=sea","authors":["Economic Research Institute for ASEAN and East Asia (ERIA)"],"date":"2026-08-27","abstract":"ASEAN faces persistent challenges in managing ship waste despite established international obligations under MARPOL and supporting regional frameworks, including the ASEAN Framework of Action on Marine Debris and the Regional Action Plan for Combating Marine Debris. Without harmonised and effective ship waste management procedures, ASEAN risks becoming a weak link in global maritime compliance, potentially undermining regional integration efforts and increasing the risk of illegal waste discharges. ASEANâ€™s Regional Strategy on Ship Waste Management provides a comprehensive framework for harmonising ship waste management across the region. However, implementation across ASEAN Member States ","doi":"","venue":"NEP 東南・東アジア (nep-sea)","sources":["NEP 東南・東アジア (nep-sea)"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026  pollution at firms’ locations (scope-1), indirect pollution from energy generation (scope-2), and indirect pollution from the supply chain (scope-3). We combine granular satellite data on air pollution with detailed information on manufacturing firms and coal power plants, and leverage exogenous foreign demand shocks for","doi":"","venue":"NEP 東南・東アジア (nep-sea)","sources":["NEP 東南・東アジア (nep-sea)"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Currency Dominance Is Not Forever: Some Insights from a Non-linear Dynamic Model","url":"https://d.repec.org/n?u=RePEc:pri:cepsud:355&r=&r=mon","authors":["Michael D Bordo","Cecile Bastidon"],"date":"2026-08-01","abstract":"We propose stress tests based on an original International Monetary System (IMS) model with regime switchings. The model is calibrated for nine reference currencies from the beginning of the Classical Gold Standard to the present. Regime switchings in currency dominance are related to combinations of conditions on a multidimensional environment variable that includes five classes of shocks: technology; development; monetary, financial and fiscal institutions; democracy and conflicts; and the regulatory environment. We provide an original database of events for these five classes of shocks, which is used for calibration. The calibration highlights the important role of the democracy and confl","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["International monetary system; Currency dominance; Democracy; Conflicts; Geopolitics; Monetary and financial graphs; Non-linear modeling; Conditional Markov chains"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"The Uncertainty Trap: Effectiveness of macroeconomic policy","url":"http://www.rieti.go.jp/jp/publications/summary/26070009.html","authors":["家富 洋（立正大学）","吉川 洋（東京大学）"],"date":"202 6010001.html","authors":["LI Anqi（曁南大学）","丸山 士行（大阪大学）","ZHANG Yangyang（曁南大学）"],"date":"2026-01-06","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ディスカッション・ペーパー（英語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Does it add up? Reconciling forecasts and impulse responses for hierarchical macroeconomic data","url":"https://d.repec.org/n?u=RePEc:zbw:rwirep:343573&r=&r=ecm","authors":["Blagov, Boris","Krause, Clara"],"date":"2026-01-01","abstract":"This paper introduces a mixed-frequency Gaussian state-space framework that embeds forecast reconciliation into Bayesian VAR modeling for hierarchical macroeconomic data. Using precision-based sampling to generate high-frequency latent estimates, we construct a consistent proxy for the forecast-error covariance matrix, enabling optimal reconciliation with short datasets. We prove the symptotic convergence of this estimator and show that forecast reconciliation can be formally derived as a special case of conditional forecasting, allowing straightforward implementation with standard state-space algorithms. We derive reconciled impulse response functions that ensure bottom-level structural res","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":["forecast reconciliation, regional forecasts, mixed-frequency, hierarchical impulse responses"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"What Does Structural Noise Measure? Revealed-Preference Inconsistency and Model Misspecification","url":"https://d.repec.org/n?u=RePEc:wrk:warwec:1629&r=&r=ecm","authors":["Ali Moghaddasi Kelishomi","Daniel Sgroi"],"date":"2026-01-01","abstract":"Empirical comparisons of preferences often treat the dispersion parameter in a random utility model as noise around a correctly specified utility function. We show that this interpretation can fail: dispersion absorbs systematic behaviour that the fitted preference family cannot span. Using portfolio choices from four studies, we estimate disappointment-aversion random utility models and compare the dispersion parameter with revealed-preference diagnostics. A money-metric decomposition separates axiomatic inconsistency from the additional loss due to imposing DA-CRRA preferences. Both components in dependently predict dispersion, and model-relative misspecification remains strongly predictiv","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":["Revealed Preference, Random Utility Models, Model Misspecification, Structural Noise, Choice Consistency JEL codes: D81, D11, D12, C91"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"A Cyclical Long Memory Model for US Unemployment","url":"https://d.repec.org/n?u=RePEc:ces:ceswps:_13026&r=&r=ets","authors":["Guglielmo Maria Caporale","Sergio Di Nallo Serrano","Sergio E. García Bermejo","Luis Alberiko Gil-Alana"],"date":"2026-01-01","abstract":"This paper examines the cyclical structure of the monthly US unemployment rate using an approach that differs from the stationary I(0) and unit root cycle ones. In particular, the model specification allows for the spectrum to explode at a frequency away from zero. This long memory component enables us to approximate the length of the cycle such that shocks can have transitory but persistent effects. The empirical results show the adequacy of the proposed framework to capture the observed behaviour of the monthly US unemployment rate.","doi":"","venue":"NEP 計量時系列 (nep-ets)","sources":["NEP 計量時系列 (nep-ets)"],"groups":["ecm"],"countries":[],"tags":["US unemployment rate, stochastic cycles, long memory"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Who Bears the Cost of Tax Digitalization? : Asymmetric Compliance-Cost Incidence of China's Fully Digitalized Electronic Invoice","url":"https://d.repec.org/n?u=RePEc:zbw:esprep:344060&r=&r=sea","authors":["Shi, Yingxin","Shi, Xinyu"],"date":"2026-01-01","abstract":"We exploit the staggered, province-level rollout of China's Fully Digitalized Electronic Invoice (the Shu-Dian- Piao, or FDEI) between late 2021 and 2023 to identify how invoice digitalization affects firms' formal compliance costs and tax compliance, and-most importantly-how these effects are distributed across parties with different bargaining power. Using firms in regions that never opened an FDEI issuance pilot within the window as controls and the Callaway and Sant'Anna (2021) estimator, which is robust to heterogeneous treatment timing, we document three findings. First, on average, firms' administrative- expense ratio rises by about 0.26 percentage points after treatment, with no dete","doi":"","venue":"NEP 東南・東アジア (nep-sea)","sources":["NEP 東南・東アジア (nep-sea)"],"groups":["japan"],"countries":[],"tags":["electronic invoice, tax administration, compliance cost, incidence, staggered difference-in differences, China"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Resolving Malawi’s Binding Foreign Exchange Constraint","url":"https://d.repec.org/n?u=RePEc:glh:wpfacu:274&r=&r=mon","authors":["Ricardo Hausmann","Kishan Shah","Tim O'Brien","Martina Cometti","Yomna Mohei Eldin","Lucila Venturi","Ricardo Villasmil","Pablo Andrés Neumeyer"],"date":"2026-01-01","abstract":"This research note diagnoses the causes behind Malawi’s foreign exchange constraint and identifies options for addressing the problem. Malawi is currently experiencing a severe and prolonged macroeconomic crisis, characterized by declining per capita income, crippling foreign exchange shortages, high inflation, and a rapidly growing (domestic) debt burden. Multi-faceted macroeconomic reforms are needed (see Growth Lab’s previous report, “Malawi’s Path out of Poverty and Toward Prosperity”). However, we find that relaxing extreme foreign exchange shortages by achieving a market-clearing rate could be achieved relatively quickly. The gains of this reform would be large, and the risks would be ","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["Foreign exchange, macroeconomic crisis, Malawi"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Bankruptcy law and firm size","url":"https://d.repec.org/n?u=RePEc:zbw:safewp:343060&r=&r=cfn","authors":["Canipek, Aras","Kind, Axel","Litov, Lubomir","Trešl, Jiří"],"date":"2026-01-01","abstract":"Weaker creditor rights can increase credit costs and thus prompt firms to reduce debt and investment. Yet, they can reduce distress costs and thus allow firms to increase leverage and eliminate risk-reducing but unprofitable investments. We hypothesize that firm size influences the effect of creditor rights on credit costs and distress costs and thus which effect dominates. Weaker creditor rights should have a negative effect for small firms but a positive effect for large firms. Using a German bankruptcy reform, we find support for our hypothesis. Our findings reconcile mixed evidence and have important implications for optimal bankruptcy design.","doi":"","venue":"NEP コーポレートファイナンス (nep-cfn)","sources":["NEP コーポレートファイナンス (nep-cfn)"],"groups":["global"],"countries":[],"tags":["creditor rights, bankruptcy law, debt, investments, firm size"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Bankruptcy law penalties and board independence","url":"https://d.repec.org/n?u=RePEc:zbw:safewp:343059&r=&r=cfn","authors":["Canipek, Aras"],"date":"2026-01-01","abstract":"A large theoretical literature suggests that bankruptcy law penalties can reduce agency problems, yet evidence remains scarce. To provide evidence, I examine whether firms implement independent directors as a substitute when penalties are eliminated. For identification, I exploit that penalties are relevant only for risky firms. Across countries, board independence is negatively related to penalties, but only among risky firms. Comparing board independence of risky and safe firms around bankruptcy reforms in Germany, Italy, and the US confirms the results. Economically, risky firms increase the number of independent directors by 21% relative to safe firms following the elimination of penalti","doi":"","venue":"NEP コーポレートファイナンス (nep-cfn)","sources":["NEP コーポレートファイナンス (nep-cfn)"],"groups":["global"],"countries":[],"tags":["bankruptcy law, board independence, debt, corporate governance"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"SME financing in Ireland revisited: Exploring the long shadow of the financial crisis","url":"https://d.repec.org/n?u=RePEc:esr:wpaper:wp833&r=&r=cfn","authors":["Coates, Dermot","McIndoe-Calder, Tara","O'Toole, Conor","O'Shea, Dónal","Tran, Chi"],"date":"2026-01-01","abstract":"","doi":"","venue":"NEP コーポレートファイナンス (nep-cfn)","sources":["NEP コーポレートファイナンス (nep-cfn)"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Offshoring Bias in Productivity Estimates: Evidence from Japanese customs data","url":"http://www.rieti.go.jp/jp/publications/summary/25120027.html","authors":["深尾 京司（理事長）","堀江 哲史（日本大学）","乾 友彦（ファカルティフェロー）","川窪 悦章（研究員（特任））","金 榮愨（専修大学）","権 赫旭（ファカルティフェロー）","張 紅詠（上席研究員）"],"date":"2025-12-25","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ディスカッション・ペーパー（英語）"],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Healthcare Utilization in the Face of Illness and Costs: Evidence from Japan","url":"http://www.rieti.go.jp/jp/publications/summary/25120026.html","authors":["Akshar SAXENA（シンガポール南洋理工大学）","殷 婷（研究員（特任））","Mingxuan FAN（シンガポール国立大学）","Wenjie WANG（シン
