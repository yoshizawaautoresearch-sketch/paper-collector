ith extra-european benchmarks","url":"https://doi.org/10.55871/2072-9847-2026-72-3-206-216","authors":["D. K. Baigazinova","Aliya S. Dosmanbetova"],"date":"2026-09-30","abstract":"The article offers a comprehensive comparative assessment of standard value-added tax (VAT) rate increases overthepastfifteenyearsandevaluatestheirdirecteffectsontaxrevenuepotentialacrossadiverserange of European and non-European economies. In contrast to traditional fiscal approaches that primarily focus on standardelasticitymodels,thisstudydemonstratesthatsustainable,long-termrevenuegrowthisnotensured by a mechanical increase in the nominal tax rate. Instead, fiscal efficiency is achieved through the synergy of continuous transaction control (CTC) systems, the systematic reduction of inefficient tax reliefs, and improved corporate liquidity maintained through predictable, streamlined tax r","doi":"10.55871/2072-9847-2026-72-3-206-216","venue":"«МЕМЛЕКЕТТІК АУДИТ – ГОСУДАРСТВЕННЫЙ АУДИТ»","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["KZ"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"From the group to the personal to the digital: Evolving modes of memorialising viewer engagement with Japanese cinema culture","url":"https://orcid.org/0000-0003-4326-1481>","authors":["J. Coates"],"date":"2026-09-30","abstract":"In the frst two decades after Japan's defeat in World War 2 in 1945 Japanese cinema had some of the highest production rates and box ofce takings in the world.From the US-led Allied Occupation of Japan (1945Japan ( -1952) ) to the 'income doubling plan' of 1960, this period of intensive cinema viewership also spans two decades of constant social and political change.Reactions to these changes often played out on cinema screens and feature to a signifcant degree in the memories of audiences (Coates 2022).It therefore seems important to preserve memories of cinemagoing and engagement with flm culture in this period.Drawing on a four-year ethnohistorical investigation of postwar cinema memory i","doi":"","venue":"White Rose Research Online (University of Leeds, The University of Sheffield, University of York)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Reframing U.S. Geopolitical Perceptions of the Korean Peninsula: The East-Up Map and Changes in U.S. Alliance Management","url":"https://doi.org/10.29159/kjas.44.3.1","authors":["Juyoung Song"],"date":"2026-09-30","abstract":"This article examines the changing spatial and geopolitical perceptions of the Korean Peninsula in U.S. strategic thinking and the corresponding shifts in U.S. alliance management, as reflected in the East-Up Map presented by General Xavier T. Brunson, Commander of United States Forces Korea (USFK), and in his related remarks. Rather than attributing new strategic meaning to the mere reorientation of the map itself, this study analyzes the broader strategic context in which the East-Up Map was presented together with Brunson’s accompanying statements. Although his references to South Korea as a “fixed aircraft carrier,” the “dagger and shield” analogy, and the South Korea–Japan–Philippines s","doi":"10.29159/kjas.44.3.1","venue":"","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Industrial Authorship in Japanese Animation: The Many Faces of Studio Ghibli","url":"https://doi.org/10.32798/dlk.2066","authors":["Manuel Hernández‐Pérez"],"date":"2026-09-30","abstract":"This review article examines Studio Ghibli: An Industrial History, a volume by Ray­na Denison (2023), through the concept of industrial authorship and its contested place within Japanese animation studies. Drawing on authorship studies, anime studies, and creative industries research, the author of the article argues that, while Denison explicitly distances her analysis from auteurist frameworks, favouring an industrial and historical account of Studio Ghibli’s production practices, institu­tional structures, and global circulation, authorship nevertheless recurs as an in­escapable organising principle throughout the publication. Figures such as Hayao Miyazaki, Isao Takahata, and producer To","doi":"10.32798/dlk.2066","venue":"Dzieciństwo Literatura i Kultura","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["GB"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"A Study on Central–Subnational Fiscal Cost-Sharing for Investment in Regional Universities: Germany and Japan","url":"https://doi.org/10.20306/kces.2026.9.30.93","authors":["Korean Comparative Education Society","Serim Won","Sookyong 남수경Nam"],"date":"2026-09-30","abstract":"[Purpose] This study compares fiscal cost-sharing mechanisms in Germany and Japan to identify measures to expand Korean local governments’ strategic investment in regional universities. [Method] It applies a structured, focused comparison to Germany’s Future Contract for Strengthening Studying and Teaching in Higher Education (ZSL) and Japan’s Grant for Regional University and Local Industry Revitalization, focusing on co-financing, budget-substitution safeguards, multiyear funding, and local burden adjustment. [Results] Both countries institutionalize subnational investment by combining central and local funds while granting planning and coordination authority. Germany secures additional, s","doi":"10.20306/kces.2026.9.30.93","venue":"","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The Politicization of Social Responsibility","url":"https://doi.org/10.1111/jofi.70093","authors":["TODD A. GORMLEY","MANISH JHA","MENG WANG"],"date":"2026-09-30","abstract":"ABSTRACT Institutional investors are less likely to support shareholder proposals on environmental and social issues for firms headquartered in Republican‐led states. The decline in support has become more pronounced in recent years, aligning with politicians emphasizing companies’ social responsibility efforts, and among firms receiving state‐level subsidies and tax breaks. Investor support also varies with shifts in state leadership, dropping by 12 percentage points in the same state when Republicans are in control instead of Democrats. The findings indicate that institutional investors prioritize maximizing shareholder value and that politicians can influence investor votes by altering th","doi":"10.1111/jofi.70093","venue":"The Journal of Finance","sources":["Journal of Finance"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"The Real Channel for Nominal Bond‐Stock Puzzles","url":"https://doi.org/10.1111/jofi.70092","authors":["MIKHAIL CHERNOV","LARS A. LOCHSTOER","DONGHO SONG"],"date":"2026-09-30","abstract":"ABSTRACT We document that the nature of aggregate consumption dynamics changes when the bond‐stock correlation switches sign. We identify three regimes in a real‐time, sequential learning framework: two highly persistent regimes where permanent or transitory consumption shocks are more dominant, and a largely transitory disaster regime. We study the implications for asset prices. The transition from the second to the first regime in the late 1990s makes the correlation between equities and real bonds switch from positive to negative as in the data, providing an explanation from the perspective of real consumption dynamics. The findings extend to the international setting.","doi":"10.1111/jofi.70092","venue":"The Journal of Finance","sources":["Journal of Finance"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Supranational Banking Supervision, Credit Supply, and Risk‐Taking: European Evidence from Multi‐Country Credit Registers","url":"https://doi.org/10.1111/jofi.70091","authors":["CARLO ALTAVILLA","MIGUEL BOUCINHA","MARTINA JASOVA","JOSÉ‐LUIS PEYDRÓ","FRANK SMETS"],"date":"2026-09-30","abstract":"ABSTRACT Using a novel data set of multi‐country credit registers and an institutional change from national to supranational supervision, we show that supranational banking supervision can increase credit supply while mitigating excessive risk‐taking. Supranational supervision increases credit supply only in financially stressed countries while reducing the credit supply to the riskiest (zombie) firms. These improved lending effects stem from weaker national institutions, differential national supervisory incentives, lower national supervisory abilities, and weaker national insolvency laws. Moreover, improved access to external finance from wholesale and bond markets as well as lower risk‐we","doi":"10.1111/jofi.70091","venue":"The Journal of Finance","sources":["Journal of Finance"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Mind the App: Mobile Access to Financial Information and Consumer Behavior","url":"https://doi.org/10.1111/jofi.70087","authors":["YARON LEVI","SHLOMO BENARTZI"],"date":"2026-09-30","abstract":"ABSTRACT We study whether easier monitoring of personal finances affects consumer spending. We use transaction data from an account aggregation company to study consumers who installed the mobile app after using the same service on a personal computer for several months. We utilize the staggered release of the apps on different devices (iPhone, iPad, and Android) to identify a causal effect conditional on adoption of the mobile app. Consumers decrease their discretionary spending following the installation of the mobile app. The decrease is larger during evening hours and among individuals with lower proxies of self‐control, patterns consistent with a monitoring/self‐regulation channel and w","doi":"10.1111/jofi.70087","venue":"The Journal of Finance","sources":["Journal of Finance"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"貿易統計データに基づく経済連携協定による輸出効果の考察～日EU経済連携協定を例に～","url":"http://www.rieti.go.jp/jp/publications/summary/26090013.html","authors":["鶴田 仁（コンサルティングフェロー）"],"date":"2026-09-29","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ポリシー・ディスカッション・ペーパー（日本語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"The Impact of TFP Improvement on CO2 Intensity","url":"http://www.rieti.go.jp/jp/publications/summary/26090012.html","authors":["田中 健太（武蔵大学）","辛 知恩（IESE Business School）","樽井 礼（University of Hawaiʻi at Mānoa）","乾 友彦（ファカルティフェロー）"],"date":"2026-09-29","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ディスカッション・ペーパー（英語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Long-term Scarring or Emerging Recovery? The decade-long trajectory of the GEJE","url":"http://www.rieti.go.jp/jp/publications/summary/26090011.html","authors":["泉 佑太朗（政策研究大学院大学）","中田 啓之（ファカルティフェロー）","澤田 康幸（東京大学）","関口 訓央（コンサルティングフェロー）"],"date":"2026-09-29","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ディスカッション・ペーパー（英語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The China Syndrome : A Misdiagnosis ?","url":"https://d.repec.org/n?u=RePEc:wbk:wbrwps:11470&r=&r=sea","authors":["Barattieri, Alessandro","Mattoo, Aaditya"],"date":"2026-09-29","abstract":"China’s growing dominance in manufacturing exports is attracting widespread attention. However, existing explanations of China’s export exceptionalism and its consequences for developing countries suffer from three shortcomings. First, attributing China’s large and increasing share in manufacturing exports primarily to its industrial policy obscures more fundamental factors: the scale of its economy, the diversity of its provincial endowments, and the pace of its automation. Second, focusing on the low-skilled export dimension of China’s economic expansion overlooks its positive impact on growth and its heterogeneous effects on structural transformation in developing countries. Finally, blam","doi":"","venue":"NEP 東南・東アジア (nep-sea)","sources":["NEP 東南・東アジア (nep-sea)"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Follow the Cash! Microstructure of Repo Markets","url":"https://d.repec.org/n?u=RePEc:fip:fednls:103827&r=&r=mon","authors":["Gara Afonso","Jun-Davinci Choi","Gonzalo Cisternas","Will Riordan"],"date":"2026-09-29","abstract":"The repo market in the U.S. is a mosaic of segments with distinct participants and various settlement and clearing practices. Why do large cash lenders typically settle their trades through a third-party agent? Why does the interdealer market clear through a central counterparty? Why do levered investors favor bilateral trades? In the second post of this series, we follow the cash as it navigates through repo markets to better understand the costs and benefits that shape the existing market structures.","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["repo markets; intermediation; dealers; money markets"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Macroeconomic Impacts of the Transition to Net Zero in Small Open Economies: A Case Study for Canada","url":"https://d.repec.org/n?u=RePEc:san:econdp:2604&r=&r=mon","authors":["Tatjana Dahlhaus","Madan Ghosh","Yena Joo","Stephen Murchison","Genevieve Nelson","Rachit Lumb","Jonathan Swarbrick","Alexander Ueberfeldt","Raven Wheesk","Yinxi Xie","Yang Zhang"],"date":"2026-09-29","abstract":"Climate change presents significant macroeconomic challenges, particularly for small open economies deeply integrated into global trade and energy markets. Focusing on Canada, we analyze the macroeconomic implications of the transition to a low-carbon economy, paying attention to global and domestic spillovers. On the domestic side, we introduce Energy-ToTEM (E-ToTEM), an extension of the Bank of Canadaâ€™s Terms-of-Trade Economic Model (ToTEM), which captures energy sector dynamics, substitution effects, and policy interactions. To account for international forces, we use a global, multi-sector, multi-region general equilibrium model, allowing us to assess international climate policy trans","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["macroeconomic simulations; transition to net-zero; climate policies; scenario analysis"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Debiased Inference for Bounding Wage Inequality with Many Controls","url":"https://arxiv.org/abs/2609.37412","authors":["Yaroslav Korobka","Vira Semenova"],"date":"2026-09-29","abstract":"We study estimation and inference for a partially identified parameter whose identified set depends on a first-stage nuisance parameter that must itself be estimated. Combining the criterion-function approach with the theory of Neyman-orthogonal moments that underlies double/debiased machine learning, we propose a two-step procedure: the point-identified nuisance is estimated by flexible machine-learning methods, and the set-identified target is recovered as a level set of a sample criterion built from orthogonal moment inequalities with cross-fitting. When the contour level is bounded, we show that the resulting set estimator converges in Hausdorff distance at the parametric rate of the inf","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Testing for Unobserved Heterogeneity in Censored Duration Models: EM Approach","url":"https://arxiv.org/abs/2609.36824","authors":["Hiroyuki Kasahara","Hirokazu Matsuyama","Katsumi Shimotsu","Shota Takeishi"],"date":"2026-09-29","abstract":"Ignoring unobserved heterogeneity in duration models biases parameter estimates and invalidates inference, but testing for it is non-regular: the null hypothesis lies on the boundary of the parameter space and some parameters are unidentified under the null. These features render standard asymptotic theory inapplicable. This paper develops an EM test for unobserved heterogeneity in censored Weibull duration models, building on the EM approach of Li, Chen, and Marriott (2009). The test statistic has an asymptotic null distribution equal to the square of max{0, N(0,1)}, hence critical values require neither simulation nor bootstrap, and the test accommodates covariate-dependent censoring of ar","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Continuously Updating GMM in Linear IV Models: A Polynomial Approach","url":"https://arxiv.org/abs/2609.36445","authors":["Marcelo J. Moreira","Whitney K. Newey","Mahrad Sharifvaghefi"],"date":"2026-09-29","abstract":"This paper characterizes the global minimum of the continuously updating generalized method of moments (CU-GMM) objective in linear instrumental variables models. We allow optimal weighting matrices under heteroskedasticity, autocorrelation, or clustering. We show that the objective is a ratio of polynomials. For one endogenous regressor, stationary points of CU-GMM objective function are real eigenvalues of a companion matrix. Comparing their objective values with the value at infinity gives the global minimum, extending the classical eigenvector approach to limited information maximum likelihood. With multiple endogenous regressors, algebraic elimination and checks for real solutions ident","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Gold-granulite association in Precambrian terranes: A metallogenic conundrum","url":"https://doi.org/10.1016/j.precamres.2026.108279","authors":["M. Santosh","Cheng‐Xue Yang"],"date":"2026-09-29","abstract":"Gold mineralization in Precambrian high-grade metamorphic terranes, particularly those hosted within middle- to lower-crustal upper amphibolite- to granulite-facies domains, remains a metallogenic paradox. While the vast majority of economic gold resources are concentrated in epizonal to mesozonal greenschist- and lower-amphibolite facies greenstone belts, a distinct class occurs in deep crustal rocks that equilibrated under high pressure–temperature conditions (700-900 °C and 5–9 kbar). The debate on their genesis is in contrast with the more accepted models on orogenic gold deposits that form through metamorphic devolatilization, the Carlin-type systems which show a mixture of magmatic and","doi":"10.1016/j.precamres.2026.108279","venue":"Precambrian Research","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["CN","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Resistance as climate change mitigation: Contested emissions from Japan's anti-coal movement","url":"https://doi.org/10.1016/j.erss.2026.104976","authors":["May Aye Thiri","Federico Demaria","Arnim Scheidel"],"date":"2026-09-29","abstract":"Grassroots resistance i ics & Finance","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Replication Data for \"Beyond the Iceberg Model: Welfare Bias from Exogenously Specified Transportation Costs in CGE Models\"","url":"https://doi.org/10.17632/6fvtnybmn8","authors":["Jixuan Liao","慎一 武藤"],"date":"2026-09-29","abstract":"This dataset provides the replication materials for the manuscript \"Beyond the Iceberg Model: Welfare Bias from Exogenously Specified Transportation Costs in CGE Models\" (Economic Modelling). The package contains the processed two-region SAM datasets for both the ETC and IB models, the Excel-based SCGE model files with VBA macros, parameter calibration workbooks, bias decomposition worksheets, elasticity sensitivity results, and travel-time shock-scenario simulations required to reproduce all empirical results reported in the manuscript. All model files are provided in their final computed state, so every reported number can be verified directly without re-running the models. A README file p","doi":"10.17632/6fvtnybmn8","venue":"Mendeley Data","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Validation of Claims‐Based Algorithms for Intussusception Identification in Japanese Hospitals: A Multicenter Analysis From the CLEAR Study","url":"https://doi.org/10.1002/pds.70488","authors":["Kumiko Saito","Chieko Ishiguro","Kazuki Sato","Masahiro Nakatochi","Haruhisa Fukuda"],"date":"2026-09-29","abstract":"PURPOSE: Intussusception is a serious condition and a rare adverse event of rotavirus vaccination. While health insurance claims data are increasingly used for epidemiological research, claims-based algorithms for identifying intussusception have not been validated in Japan. This study aimed to validate multiple claims-based algorithms f
