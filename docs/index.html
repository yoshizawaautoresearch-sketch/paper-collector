 goods pairs like this anywhere — in economics, in biology, or in history? We searched systematically and could not find one that simultaneous","doi":"10.5281/zenodo.23000369","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Artificial Intelligence, Welfare Transmission and Inclusive Development in the Asia‐Pacific: A Dual‐Pathway Framework","url":"https://doi.org/10.1111/apel.70070","authors":["Kai Zhao","Bohao Zhang","Xinran Qiao"],"date":"2026-09-27","abstract":"ABSTRACT Artificial intelligence is transforming labour demand, productivity growth and industrial upgrading in the Asia‐Pacific region. Its developmental consequences depend less on whether AI automates or augments tasks than on whether productivity gains remain connected to household welfare and public finance. This article proposes a dual‐pathway framework in which inclusive development can be sustained either through labour‐mediated gains in wages, employment, skills and formal labour‐market participation or through fiscal‐mediated capture and redistribution of AI‐generated capital, data, platform, land and public‐asset rents. Synthesizing four strands of literature (task‐based technolog","doi":"10.1111/apel.70070","venue":"Asian-Pacific Economic Literature","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["CN","IT"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Correlation Between Nighttime Light and Various Statistical Indicators in Japan","url":"https://doi.org/10.48550/arxiv.2609.33861","authors":["Shoichi OTOMO"],"date":"2026-09-27","abstract":"This manuscript is an English translation and extended version of a paper originally published in Japanese(otomo 2021) Recent years have seen a rapid expansion in applying satellite remote sensing and big data to economic analysis. In particular, satellite-observed nighttime light intensity has proven to be closely correlated with key socio-economic indicators, including gross domestic product, employment rates, population density, and educational attainment across countries. In this paper, I first outline the methodology for calculating regional nightlight intensity across Japanese prefectures and municipalities. Next, to evaluate the versatility of nightlight data, I examine the relationsh","doi":"10.48550/arxiv.2609.33861","venue":"arXiv (Cornell University)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Minimax Choice of Projection Geometry under Linear Inequality Constraints","url":"https://arxiv.org/abs/2609.32725","authors":["Joachim Freyberger","Julius Kappenberg"],"date":"2026-09-26","abstract":"Economic theory frequently implies linear inequality restrictions on parameters or functions of interest. A common way to impose such restrictions is to project an unrestricted estimator onto the feasible set. Projection estimators arise naturally from constrained least squares, instrumental variables, generalized method of moments, maximum likelihood, and related extremum procedures. When the sampling covariance, loss function, and projection criterion induce different geometries, the choice of projection geometry can substantially affect risk. We study this choice in a fixed-dimensional local Gaussian experiment under quadratic loss. At exact-boundary configurations where only one maintain","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Assessing the consistency of overall survival extrapolations in Swedish health technology assessment reports of oncology treatments using extended follow-up data","url":"https://doi.org/10.1080/13696998.2026.2736997","authors":["Máté Szilcz","Olof Mogard","Mattias Ekman","Olof Lindgren","Fredrik Nilsson","Kasper Munk Johannesen","Emma Medin"],"date":"2026-09-26","abstract":"BACKGROUND: Long-term overall survival (OS) extrapolations underpin cost-effectiveness appraisals, projecting survival beyond trial follow-up. We aimed to compare extrapolations presented in manufacturer submissions and appraisals published by the Swedish Dental and Pharmaceutical Benefits Agency (TLV) with extrapolations using OS data with longer follow-up available after the original appraisal. METHODS: We retrieved publicly available appraisals for oncology compounds from 2009 to 2019. For each appraisal, Kaplan-Meier curves of OS and base case extrapolation assumptions were collected. Longer-term OS data were identified through literature review and supplemented by manufacturers, then di","doi":"10.1080/13696998.2026.2736997","venue":"Journal of Medical Economics","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["GB","JP","SE","US"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"A local Shapley metric for spatial validation of urban infrastructure deterioration","url":"https://doi.org/10.1016/j.compenvurbsys.2026.102513","authors":["Pengcheng Zhang","Wen Yi","Yongze Song","Haiyang Liu","Kai Ren","Ning Yang","Jiao Hu","Peng Wu"],"date":"2026-09-26","abstract":"Knowledge of urban infrastructure deterioration is fundamental to urban mobility, safety, and economic activity, and spatial prediction models are increasingly used to estimate deterioration at unobserved locations. However, existing validation practices still rely largely on accuracy and goodness-of-fit metrics that summarize overall prediction performance, but provide limited capacity to diagnose how model adequacy varies across space and across individual explanatory variables. To address this gap, we develop a Shapley-based local validation (SLV) indicator to assess the local effectiveness of spatial prediction models by comparing the local interpretability of individual variables on dep","doi":"10.1016/j.compenvurbsys.2026.102513","venue":"Computers Environment and Urban Systems","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["AU","CN","HK","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"High-speed rail station-area typology in China’s county-level cities: intercity relations and land-finance dependence dynamics","url":"https://doi.org/10.1080/13467581.2026.2739668","authors":["Ming Xie","Tetsuya YAGUCHI"],"date":"2026-09-26","abstract":"National classifications of Chinese high-speed rail (HSR) station areas exist; none distinguishes county-level cities as a tier or reads land-use composition together with host-city intercity relations and the fiscal path after opening. This study asks what types recur, how intercity relations relate to them, and how land-finance dependence shifts after opening. Four types emerge from five land-use composition shares for 138 county-level cities: high-intensity residential–commercial, moderate-intensity public-service, moderate-intensity green-space, and low-intensity production–infrastructure. Intercity relations enter as railway-service connectivity, inward enterprise linkage, and hub-city ","doi":"10.1080/13467581.2026.2739668","venue":"Journal of Asian Architecture and Building Engineering","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Top Trading Cycles with Indifferences under Matroid Constraints","url":"https://arxiv.org/abs/2609.32337","authors":["Yasushi Kawase"],"date":"2026-09-26","abstract":"We study the reallocation of indivisible objects among agents who may hold initial endowments and may be indifferent between objects. Each agent has her own set of admissible objects, and a matroid constraint specifies which combinations of assigned objects are feasible. The model contains the housing market, house allocation with newcomers who hold no endowment, and the assignment of students to schools under matroidal constraints at each school. For this model, we introduce the top-class trading cycles mechanism (TCTC), which extends the top trading cycles mechanism (TTC) to matroid constraints and weak preferences. When a trading cycle is selected, TCTC fixes each agent's top indifference","doi":"10.48550/arxiv.2609.32337","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"医薬品の生産金額の薬効大分類の構成は 2019→2024 年に毎年 0.0290〜0.0398 入れ替わり、5 年分を足すと 0.1713 になるが、2019 年と 2024 年を直接比べると 0.0772 で、積み重なったのは 0.450 だけだった——並べる 21 分類のうち割合が毎年下がり続けたのは循環器官用薬(0.1023 → 0.0715)だけで、上位 5 の順位は変わらなかった [M084]","url":"https://doi.org/10.5281/zenodo.22979138","authors":["Yuuki Yamagishi"],"date":"2026-09-26","abstract":"厚生労働省の薬事工業生産動態統計調査の第2表(医薬品薬効大分類別生産金額)を 2019〜2024 年の 6 年並べ、薬効大分類の構成が毎年どれだけ入れ替わり、そのうちどれだけが積み重なったかを見た。2018 → 2019 年は調査の変更をはさみ総額が 1.3436 倍になったので、新調査の 6 年だけを比べた。 構成の入れ替わり(二つの年の構成割合の差の絶対値の和の半分)は毎年 0.0290〜0.0398 で、5 年分を足すと 0.1713 になるが、2019 年と 2024 年を直接比べると 0.0772 で、積み重なったのは 0.450 だけだった。行って戻った分がいちばん大きいのは体外診断用医薬品(割合 0.0436 → 2022 年 0.0581 → 2024 年 0.0422)。総額の増加 967,024 百万円に対して増えた分類の和は 1.342 倍で、減った分の 0.650 は循環器官用薬。並べる 21 分類で割合が毎年下がり続けたのは循環器官用薬(0.1023 → 0.0715)だけで、上位 5 の順位は変わらなかった。分けるのは、一年ごとの動きか、積み重なった入れ替わりかである。 本稿は公開の集計データの数の形を述べる構造的解釈であり、医学的な助言・診断・治療の推奨ではない。著者は医師ではない。個人の健康に関する判断は医師・医療機関に相談すること。査読を経ていないプレプリントである。新しい数学定理も新しい法則も主張しない。薬の値段の高い安い・良し悪し、効き目や安全性、医薬品産業や薬価の制度の評価には立ち入らない。製品名・製造販売業者の名前は使わず、集計の単位は","doi":"10.5281/zenodo.22979138","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"2023 年度の後発医薬品の割合は、数量ベース(新指標)で 84.82 %、薬剤料ベースで 19.34 %——19.34 = 84.82 × 0.708(後発医薬品のある市場に分母を絞る分)× 0.322(数量 1 単位の薬剤料の比の目安)に分かれ、2020→2023 年度には数量ベースが上がり続けるあいだに薬剤料ベースは 20.22 % から下がった [M081]","url":"https://doi.org/10.5281/zenodo.22978930","authors":["Yuuki Yamagishi"],"date":"2026-09-26","abstract":"厚生労働省の「調剤医療費(電算処理分)の動向」(月次版の表Ⅴ-1 と年度版の表4-2・表16・表10-2)で、「後発医薬品の割合」が数え方によってどれだけ違い、その違いがどこから来るかを見た。 2023 年度の後発医薬品の割合は、数量ベースの新指標で 84.82 %、医薬品全体の数量(旧指標)で 60.07 %、薬剤料ベースで 19.34 % である。19.34 % = 84.82 % × 0.708 × 0.322 と、分母を後発医薬品のある市場に絞る分と、数量 1 単位の薬剤料の比の分に分かれる。2013→2023 年度に新指標は毎年上がったが、薬剤料ベースは 2020 年度の 20.22 % がいちばん高く、そのあと毎年下がった(単価の目安 0.351 → 0.322)。分けるのは、分母にどの薬を入れるかと、数量で数えるか金額で数えるかである。 本稿は公開の集計データの数の形を述べる構造的解釈であり、医学的な助言・診断・治療の推奨ではない。著者は医師ではない。個人の健康に関する判断は医師・医療機関に相談すること。査読を経ていないプレプリントである。新しい数学定理も新しい法則も主張しない。後発医薬品と先発医薬品のどちらを使うべきか、薬の効き目や安全性、薬の値段の高い安い、後発医薬品を増やす施策の評価には立ち入らない。製品名・製造販売業者の名前は使わない。単価の目安は範囲の違う二つの指標の比で、近い値である。都道府県・薬局は比べない。出典:調剤医療費(電算処理分)の動向(厚生労働省のページ)を加工して作成。 作成にあたって:本稿の着想と内容は、著者自身の考察に基づくものです。","doi":"10.5281/zenodo.22978930","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"（日銀レビュー）証券会社による国債マーケットメイクビジネスの動向","url":"http://www.boj.or.jp/research/wps_rev/rev_2026/rev26j13.htm","authors":[],"date":"2026-09-25","abstract":"","doi":"","venue":"日本銀行(WP・日銀レビュー等)","sources":["日本銀行(WP・日銀レビュー等)"],"groups":["jp"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"（日銀レビュー）プライベートクレジットファンドの拡大と多様化について","url":"http://www.boj.or.jp/research/wps_rev/rev_2026/rev26j12.htm","authors":[],"date":"2026-09-25","abstract":"","doi":"","venue":"日本銀行(WP・日銀レビュー等)","sources":["日本銀行(WP・日銀レビュー等)"],"groups":["jp"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"An Adversarial Approach to Identification, Computation, and Inference in Models with a Linear-in-Measures Representation","url":"https://arxiv.org/abs/2609.32076","authors":["Irene Botosaru","Isaac Loh","Chris Muris"],"date":"2026-09-25","abstract":"We develop a framework for identification, computation, and inference in econometric models with a linear-in-measures representation. These models express maintained restrictions as moment conditions linear in the joint probability measure of observed and latent inputs, and map that measure linearly to the distribution of outputs, even with nonlinear outcome equations. We construct an adversarial discrepancy function whose zeros characterize the identified set for structural and counterfactual parameters. With finite output support, finite linear programs compute the discrepancy function or provide certified bounds even when latent inputs have infinite support, and a penalized bootstrap yiel","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Multiple testing of a function's monotonicity","url":"https://arxiv.org/abs/2609.31958","authors":["Wei Zhao","David M. Kaplan"],"date":"2026-09-25","abstract":"Instead of having a single \"yes\" or \"no\" result from a test of the global null hypothesis that a function is increasing, we propose a multiple testing procedure of the function's increasingness at several points. If the global null is rejected, then multiple testing provides more information about why. If the global null is not rejected, then multiple testing can provide stronger evidence in favor of increasingness, by rejecting null hypotheses that the function is decreasing. Our approach uses high-level assumptions that apply to a broad class of causal and descriptive statistical models. By inverting the proposed multiple testing procedure that controls the familywise error rate, we also g","doi":"10.1007/s11749-025-00986-6","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","math.ST","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Orthogonal Moments in Likelihood Models","url":"https://arxiv.org/abs/2609.31561","authors":["Stéphane Bonhomme","Koen Jochmans","Martin Weidner"],"date":"2026-09-25","abstract":"Many models, such as fixed-effect models for panel or network data, are hard to estimate because they feature nuisance parameters that are both numerous and estimated imprecisely. This, in general, causes an incidental-parameter problem in the estimator of the parameters of interest. The problem can be alleviated by working with an estimating equation whose expectation is insensitive to the value of the nuisance parameters. We discuss and contrast three notions of insensitivity, also called orthogonality, in the context of likelihood models: Neyman orthogonality, Neyman orthogonality to order q, and full orthogonality. Orthogonal moments are obtained by projecting the estimating equation on ","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Bootstrap Inference for Dynamic Panel Data Models with Common Correlated Effects","url":"https://arxiv.org/abs/2609.31442","authors":["Arturas Juodis","Ovidijus Stauskas","Sander Tromp"],"date":"2026-09-25","abstract":"We study recursive-design wild bootstrap inference for dynamic panel data models with unobserved common factors estimated by Common Correlated Effects. In the large N,T setting, the bootstrap reproduces the biased limiting distribution in pure autoregressive models, but fails to capture all bias and factor-estimation variance components in models with additional regressors, particularly under weak exogeneity. We trace this failure to holding regressors fixed across bootstrap replications. We propose to combine bootstrap procedure with available bias-correction methods to conduct adjusted inference. Monte Carlo evidence shows substantial improvements over conventional strategies of using bias","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Equilibrium selection in pure bubble models by dividend injection","url":"https://doi.org/10.1007/s00199-026-01747-8","authors":["Tomohiro Hirano","Alexis Akira Toda"],"date":"2026-09-25","abstract":"","doi":"10.1007/s00199-026-01747-8","venue":"Economic Theory","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["GB","JP","US"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"MODE: Mutual Optimality in Direct Effects of Reciprocal Recommendations in Matching Markets","url":"https://doi.org/10.1145/3773078.3831764","authors":["Yoji Tomita"],"date":"2026-09-25","abstract":"Matching platforms such as job posting services and online dating platforms have become widely used over the past decade. For a matching platform to be successful, it is crucial to design appropriate reciprocal recommendation systems (RRSs) that consider the preferences of users on both sides (job candidates and employers) and prevent opportunities from being concentrated too heavily on a few popular users. However, prioritizing concentration mitigation too much can lead to recommending undesirable results to some individual users, resulting in their dissatisfaction. In this paper, we formulate the concept of “optimality of direct effects” of the recommendation list for an individual user, g","doi":"10.1145/3773078.3831764","venue":"ACM Conference on Recommender Systems (RecSys)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Governing Fairness in Insurance Pricing: The Trilemma of Actuarial Adequacy, Solidarity, and Causal Legitimacy","url":"https://doi.org/10.1007/s10551-026-06479-2","authors":["Arthur Charpentier","Olivier C ocirc t eacute","Marie-Pier Côté"],"date":"2026-09-25","abstract":"","doi":"10.1007/s10551-026-06479-2","venue":"Journal of Business Ethics","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["CA","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"O que as eleições podem mudar na política externa do Brasil","url":"https://doi.org/10.64628/ade.jy6vjfw7y","authors":["Alberto Maresca"],"date":"2026-09-25","abstract":"","doi":"10.64628/ade.jy6vjfw7y","venue":"","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["BR","DE","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Public Charging Infrastructure Deployment and Credit Risk of Rural Commercial Banks in China: Evidence from Sustainable Mobility Infrastructure","url":"https://doi.org/10.3390/su18199848","authors":["Wenwen Zhang","Philip Y. L. Wong","Qianzheng Bai","Zhang Shi","Xiongyi Guo","Xuepeng Qian"],"date":"2026-09-25","abstract":"This study examines the relationship between public electric-vehicle charging-infrastructure deployment and the credit risk of rural commercial banks in China. Using an unbalanced panel dataset of 180 RCBs across 10 provinces from 2016 to 2022, this paper employs a two-way fixed-effects model and uses the provincial number of public charging piles as a proxy for the deployment scale of public charging infrastructure. The results show that the rapid expansion of public charging infrastructure is statistically associated with higher non-performing loan ratios among local RCBs and this association remains under alternative standard-error specifications and robustness tests. The theoretical anal","doi":"10.3390/su18199848","venue":"Sustainability","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["CN","HK","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Japan item and prefecture tests (angles B-JP and C): room for domestic demand and the pass-through of monetary easing","url":"https://doi.org/10.17605/osf.io/hjuc9","authors":["Ryo Watanabe"],"date":"2026-09-25","abstract":"Pre-registration of two Japanese tests of the central proposition (C1) of \"A General Theory of Structural Constraints\" (revision 73): (B-JP) durable goods with more unfilled household diffusion should see household spending respond more to monetary easing; (C) prefectures with a larger housing surplus should see new housing starts respond less to easing. Kubota-Shintani monetary policy surprises, 2003-2017. Linked to https://osf.io/vqsn8 and https://osf.io/9dvxm.","doi":"10.17605/osf.io/hjuc9","venue":"Open Science Framework","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Network Productivity and Loan-Income Adjustment after Monetary Policy Normalization: Evidence from Japanese Regional Banks","url":"https://doi.org/10.21203/rs.3.rs-10859122/v1","authors":["Hirohisa Shimura"],"date":"2026-09-25","abstract":"","doi":"10.21203/rs.3.rs-10859122/v1","venue":"Research Square","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Significance of the Semiconductor Industry in the Indian Economy","url":"https://doi.org/10.48175/ijarsct-38184","authors":["Nidhi Sharma and Dr. Meenal"],"date":"2026-09-25","abstract":"The semiconductor industry underpins the economic growth of nearly all global economies. Contemporary apparatus and industries such as Aerospace, Automotive, Telecommunications, Energy, Medical gadgets, Information Technology, Digital Infrastructure, and all electronic gadgets are constructed using semiconductor-based chips. The semiconductor sector will significantly influence economic growth and development, technological progress, and the creation of numerous employment opportunities for a nation. Taiwan, South Korea, Japan, the United States, and China are presently the leading producers of semiconductor chips and electronics. The semiconductor industry possesses significant potential in","doi":"10.48175/ijarsct-38184","venue":"International Journal of Advanced Research in Science Communication and Technology","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["IN"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The Value-Chain Capture Gap: Why Institutional Readiness Does Not Buy Value in Critical Minerals. Evidence from Africa, Latin America and Asia, 2000–2024","url":"https://doi.org/10.5281/zenodo.22967646","authors":["Alfredo Merlet"],"date":"2026-09-25","abstract":"Producing countries in Africa, Latin America and Asia increasingly seek to capture the processing of the critical minerals they extract, and a large literature holds that institutional quality is the key to doing so. This monograph tests that proposition. It constructs a producer-side value-chain capture gap, the difference between a country's share of world mine production and its share of world processing, for 15 countries (DR Congo, Zambia, Zimbabwe, Chile, Peru, Argentina, Brazil, Bolivia, Indonesia, the Philippines, Australia, China, Japan, Korea and India), four minerals (copper, nickel, cobalt and lithium) and the years 2000–2024, using British Geological Survey production statistics,","doi":"10.5281/zenodo.22967646","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["CL","ES"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Why capital stays: Territorial reproduction and the limits of manufacturing mobility","url":"https://doi.org/10.1177/10245294261490149","authors":["Kazuo Kadokawa"],"date":"2026-09-25","abstract":"Capital mobility is routinely invoked as a defining feature of contemporary capitalism and as a strategic resource in state–firm bargaining. Yet, advanced manufacturing often remains territorially anchored. This paper argues that the limits of mobility lie in the territorial reproduction of productive capabilities. Introducing the concept of capability stickiness, it shows how skills, organizational routines, and institutional supports become layered and mutually reinforcing, transforming relocation into a source of systemic uncertainty. Drawing on a comparative reinterpretation of Japanese manufacturing regions, the analysis demonstrates that uneven depths of territorial reproduction genera","doi":"10.1177/10245294261490149","venue":"Competition & Change","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"税執行の強化は税務コンプライアンスの自発的改善をもたらすか：税務行政記録データによる検証","url":"http://www.rieti.go.jp/jp/publications/summary/26090007.html","authors":["宇南山 卓（ファカルティフェロー）","稲葉 和洋（元税務大学校）","中川 貴文（税務大学校）"],"date":"2026-09-24","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ディスカッション・ペーパー（日本語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"Do Productivity Booms Push Down Prices?","url":"https://d.repec.org/n?u=RePEc:fip:l00001:103830&r=&r=mon","authors":["Ricardo Marto","Matthew McCollum"],"date":"2026-09-24","abstract":"Industries with unusually strong productivity growth, at times coinciding with new technologies, have seen relative declines in producer price inflation.","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["productivity growth; producer prices; inflation"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Risk-Averse Welfare Maximization via Marginal Treatment Effects","url":"https://arxiv.org/abs/2609.30617","authors":["Jarrod Burgh","Emerson Melo"],"date":"2026-09-24","abstract":"This paper studies risk-averse treatment allocation when individuals self-select into treatment based on unobserved characteristics. We develop a framework that combines the marginal treatment effect approach to endogenous selection with a general class of coherent risk measures that capture distributional preferences over welfare outcomes. We show that the planner's problem admits equivalent interpretations in terms of uncertainty aversion, distributional robustness, and worst-case welfare. For law-invariant coherent risk measures, we derive a Kusuoka representation that expresses the planner's objective as a weighted evaluation of different regions of the welfare distribution and character","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"When Do Surrogate Metrics Work? A Finite-Sample Comparison Under Realistic Failure Modes","url":"https://arxiv.org/abs/2609.30528","authors":["Zihao Chen"],"date":"2026-09-24","abstract":"Online experiments must often be evaluated before long-term outcomes mature. Under rolling enrollment, these outcomes are observed only for early enrollees, while short-term surrogates are available for everyone. We compare seven estimators across eleven data-generating processes, spanning partial mediation, drift, outcome sparsity, and enrollment-time labeling, with up to $R = 2,000$ replications over more than 500 method-by-scenario cells. We find a sharp robustness-efficiency tradeoff: the surrogate index delivers large efficiency gains when surrogacy holds but its coverage collapses under violations, while PPI-family methods stay asymptotically valid under random labeling at smaller gain","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.AP","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"A Characterization of the $M$-tests Under Nearly Integrated Nearly White Noise","url":"https://arxiv.org/abs/2609.30504","authors":["Aidan Wardak","Sayar Karmakar"],"date":"2026-09-24","abstract":"We derive the limiting distributions of the $M$-test family of unit root statistics in the nearly integrated nearly white noise (NINW) framework introduced by Nabeya and Perron (1994) in the case of an unknown linear time trend. In the case of known long run variance (LRV), the limiting distributions of the $M^{GLS}$ tests are contaminated by additional noise terms as a result of quasi differencing whereas these terms are less present in the $M^{OLS}$ limiting distributions, both of which display conservative properties under conventional critical values. Furthermore, we prove the Gaussian power envelope in the NINW model is asymptotically equivalent to the standard envelope of Elliott, Roth","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Do Third-Party Web Traffic Estimates Preserve Causal Variation?","url":"https://arxiv.org/abs/2609.30481","authors":["Mehrzad Khosravi","Hema Yoganarasimhan"],"date":"2026-09-24","abstract":"Researchers increasingly rely on third-party platforms such as Similarweb and Semrush to measure web traffic when first-party analytics are unavailable. Yet these platforms report model-generated estimates rather than raw data, raising questions about whether their measures preserve the temporal and cross-source variation required for causal inference. As a motivating diagnostic, we examine reported referral traffic around two documented search-engine outages; the absence of visible discontinuities illustrates why preservation of identifying variation cannot be taken for granted. We then characterize three mechanisms, within-source smoothing, cross-source leakage, and treatment-induced calib","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"First as Tragedy? Second as What? Estimating Dynamic Effects of Recurrent Events","url":"https://arxiv.org/abs/2609.30007","authors":["Agnes Norris Keiller"],"date":"2026-09-24","abstract":"I study treatment effect estimation when treatment events have persistent effects and can be experienced more than once. Natural disasters, job loss and health shocks are examples of such treatments. I show that the effect of a total treatment trajectory can be recovered under assumptions similar to those commonly invoked in single-event settings using suitably flexible TWFE models. Decomposing the total trajectory effect into portions attributable to distinct event occurrences, however, requires further assumptions. I propose an assumption similar to conditional parallel trends, imposing it on the growth of event-specific effects rather than on untreated outcomes. Combined with a linear-in-","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Multi-Dimensional Matching","url":"https://arxiv.org/abs/2609.29958","authors":["Irene Aldridge"],"date":"2026-09-24","abstract":"We study a matching mechanism where agents and objects are described by features rather than complete rankings. A single spectral projection reduces the problem to a one-dimensional sort, computable in O(N log N) time. We prove that on descaled features and preferences, our algorithm obtains the exact Nash Social Welfare (NSW) optimum within the projected space, with an unconditional utilitarian-welfare guarantee and a conditional NSW guarantee. The proposed mechanism is stable against exogenous noise but not strategy-proof; we provide an explicit profitable misreport. On an agentic AI shopping application, the diagnostics correctly anticipate both a success and a failure case. A 100-instanc","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["cs.GT","cs.LG","cs.MA","econ.EM","econ.TH"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Estimating Heterogeneous Causal Effects with Tree-Based Methods under Imperfect Compliance","url":"https://arxiv.org/abs/2609.31769","authors":["Karolina Gliszczyńska-Schroeder"],"date":"2026-09-24","abstract":"We study the impact of conditional complier average causal effect (CCACE) estimation methods on the performance of subgroup discovery and heterogeneous causal effect estimation under imperfect compliance. Building on the Bayesian Causal Forest with Instrumental Variable (BCF-IV) (Bargagli-Stoffi et al. (2022)) method, we introduce a two-step, model-agnostic approach that allows any suitable machine learning method to be used for the CCACE estimation in the first step. Specifically, we implement two non-Bayesian tree-based methods, both using forest-based learners: DRRF-IV, a debiased transformed-outcome regression-forest approach, and a GRF-based IV adaptation of the generalized random fores","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Kernel Balancing in Tree-based Methods","url":"https://arxiv.org/abs/2609.29440","authors":["Karolina Gliszczyńska-Schroeder"],"date":"2026-09-24","abstract":"Studying heterogeneous treatment effects has become essential in experimental and observational studies. A critical assumption for obtaining reliable treatment effect estimates is overlap, which requires that treated and control units have sufficiently similar covariate distributions. Poor overlap may limit the effectiveness of estimators, especially those based on propensity scores, potentially leading to unreliable results. We investigate the effectiveness of kernel balancing (KBal) (Hazlett, 2020) as an alternative to propensity score methods for conditional average treatment effect (CATE) estimation, particularly in settings with overlap violations. Building on optimization-based balanci","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Generic Covariate Adjustment for Regression Discontinuity Designs","url":"https://arxiv.org/abs/2609.29249","authors":["Jun Ma","Yuya Sasaki","Zhengfei Yu"],"date":"2026-09-24","abstract":"It is standard practice to include covariates in regression discontinuity designs (RDDs) and regression kink designs (RKDs), but the theoretical justification for doing so does not generally extend beyond linear estimands. This paper proposes a novel entropy balancing reweighting approach for covariate adjustment within a general framework of RDDs and RKDs. While conventional regression-based covariate adjustment methods generally fail to deliver consistent estimation for nonlinear estimands such as quantile treatment effects, our reweighting approach achieves consistency while improving efficiency. Moreover, even in settings where the regression-based covariate adjustment method already imp","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Panel Conditioning in Fixed-Effects Models: Identification and Bias Propagation","url":"https://arxiv.org/abs/2609.28871","authors":["Shoki Okubo"],"date":"2026-09-24","abstract":"Panel conditioning, the causal effect of prior survey participation on responses, can vary with tenure. Under an additive model of cell means in period, entry cohort, and tenure, we characterize which features of the conditioning path a staggered panel identifies on its observed support, and how the unidentified component affects common panel estimators. The identified set of the path is an affine translate of the tenure projection of the cell design's kernel, and a linear functional of the path is identified exactly when it annihilates that projection. It always contains an affine direction and, when the entry cohorts share a stride, periodic directions, which exhaust it under a connectivit","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.AP","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Universal Portfolio Shrinkage","url":"https://doi.org/10.1093/rfs/hhag084","authors":["Bryan Kelly","Semyon Malamud","Mo Pourmohammadi","Fabio Trojani"],"date":"2026-09-24","abstract":"Abstract We introduce a nonlinear covariance shrinkage method for building optimal portfolios. Our universal portfolio shrinkage approximator (UPSA) is built from closed-form basis portfolios, is cheap to implement, and improves on existing shrinkage methods. Rather than uniformly penalizing all principal components of returns or discarding low-variance ones, UPSA instead reweights components to explicitly optimize expected out-of-sample portfolio performance. In empirical applications using a large cross-section of anomaly factors, it delivers robust improvements over alternative shrinkage methods in the literature.","doi":"10.1093/rfs/hhag084","venue":"The Review of Financial Studies","sources":["Review of Financial Studies"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Original Sin Redux: Role of Duration Risk*","url":"https://doi.org/10.1093/rfs/hhag088","authors":["Carol Bertaut","Valentina Bruno","Hyun Song Shin"],"date":"2026-09-24","abstract":"Abstract We highlight the role of duration and exchange rate risks on portfolio flows by using a unique and comprehensive database of U.S. investor flows into emerging market government bonds denominated in local currency. Borrowing long-term mitigates rollover risk but amplifies valuation changes that further interact with currency movements. Our analysis highlights the double-edged nature of long-term borrowing and draws attention to market stress dynamics due to strategic complementarities among mutual fund investors.","doi":"10.1093/rfs/hhag088","venue":"The Review of Financial Studies","sources":["Review of Financial Studies"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Affordable Housing, Unaffordable Credit? Concentration and High-Cost Lending for Manufactured Homes","url":"https://doi.org/10.1093/rfs/hhag087","authors":["Sebastian Doerr","Andreas Fuster"],"date":"2026-09-24","abstract":"Abstract This paper shows that high market concentration in the U.S. manufactured home loan market allows lenders to charge markedly higher interest rates than in the mortgage market for site-built homes. Borrowers in counties with higher lender concentration face significantly higher rates, and evidence from bunching at a regulatory rate threshold, an instrumental variable analysis, and a difference-in-differences analysis suggests a causal link. Integrated lenders, which play an outsized role in this market, charge particularly high rates, and we provide evidence suggesting that these lenders exploit their market power over borrowers. We discuss factors that may explain limited lender entr","doi":"10.1093/rfs/hhag087","venue":"The Review of Financial Studies","sources":["Review of Financial Studies"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Assessing Financial Preparedness in Old Age in Asia: Evidence from the Republic of Korea","url":"https://d.repec.org/n?u=RePEc:ris:adbewp:023633&r=&r=sea","authors":["Sang-Hyop Lee","Hyun Kyung Kim","Huixia Wang","Donghyun Park"],"date":"2026-09-23","abstract":"We estimate expected financial resources in old age—including public transfers, family transfers, accumulated assets, and post-retirement labor income—and compare them with target consumption needs. The sample is divided into a reference group (individuals at or beyond retirement age) and a target group (pre-retirement individuals). Two retirement scenarios are considered: (i) a statutory retirement age of 62 for both men and women, and (ii) effective retirement ages of 66 for men and 65 for women. Results are presented by gender and place of residence. We find substantial heterogeneity in financial preparedness, with women facing significantly larger shortfalls than men. Continued work and ","doi":"","venue":"NEP 東南・東アジア (nep-sea)","sources":["NEP 東南・東アジア (nep-sea)"],"groups":["japan"],"countries":[],"tags":["population aging;financial preparedness;retirement;pensions;Republic of Korea"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Reduced-Rank Autoregressive Models for Matrix Time Series","url":"https://arxiv.org/abs/2609.28841","authors":["Han Xiao","Yuefeng Han","Rong Chen","Ama Ampadu-Kissi"],"date":"2026-09-23","abstract":"Matrix time series is a series of matrix data observed over time. Analytical tools for such time series is needed in many applications in finance, economics, engineering and many other fields. To avoid the use of vectorization of the matrices which loses the column and row information, and the vector autoregression framework in traditional time series analysis, \\cite{chen2021autoregressive} proposed the Matrix Autoregressive (MAR) Model. The model maintains and utilizes the matrix structure, leading to a substantial dimensional reduction and admitting explicit interpretations, comparing with the vector autoregressive model on the vectorized data. However, the MAR model still encounters diffi","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["stat.ME","econ.EM","math.ST"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Heterogeneous Policy Effects in Comparative Case Studies with Treated-Unit Microdata","url":"https://arxiv.org/abs/2609.28678","authors":["Carl Bonander"],"date":"2026-09-23","abstract":"Policy reforms are sometimes accompanied by detailed individual-level data in the implementing jurisdiction, while only aggregate outcomes are available for potential comparison jurisdictions. This article develops an identification framework for heterogeneous policy effects when individual-level data are unavailable for the comparison units. The framework combines treatment-effect contrasts from difference-in-differences comparisons within the treated jurisdiction with a compatible population-average effect identified from aggregate panel data. Identification requires relative parallel trends within the treated jurisdiction together with the assumptions needed to identify the population-ave","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Testing for Heterogeneous Treatment Effects in Regression Discontinuity Designs","url":"https://arxiv.org/abs/2609.27691","authors":["Xiaojun Song","Haojiao Zhao"],"date":"2026-09-23","abstract":"We propose a nonparametric test for unobserved treatment effect heterogeneity in regression discontinuity designs. Under the null of no unobserved heterogeneity, a transformed outcome that imputes treated potential outcomes for untreated units must have a continuous conditional distribution at the cutoff. We convert this implication into an integrated conditional-moment restriction using characteristic functions, thereby allowing the conditional local average treatment effect to be an unrestricted function of covariates. We derive the asymptotic distribution of the test statistics via a $U$-process and establish the validity of a multiplier bootstrap procedure for calculating critical values","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Local Optimality and Rigidity of Frobenius Tests for Dense High-Dimensional Covariance Alternatives","url":"https://arxiv.org/abs/2609.27200","authors":["Peter Reinhard Hansen","Werner Ploberger","Chen Tong"],"date":"2026-09-23","abstract":"We study identity testing for high-dimensional covariance matrices against dense alternatives of unknown direction, with $p/n \\to γ$. Along a globally positive quadratic precision path, mixing Gaussian alternatives over a Gaussian Orthogonal Ensemble direction yields a contiguous experiment whose log likelihood reduces to the corrected Frobenius statistic; its upper-tail test attains the limiting weighted-power envelope at every fixed strength. Fixing the prior's Frobenius radius perturbs the mixture by only $O(p^{-1/2})$ in total variation, and exact whitening carries the experiment, the statistic, and its null law to any known null covariance. Separately, under a product-coordinate null, f","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["math.ST","econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Globalization, Inflation Dynamics and the Slope of the Phillips Curve","url":"https://d.repec.org/n?u=RePEc:fip:feddwp:103848&r=&r=mon","authors":["Colin J. Hottman","Ricardo M. Reyes-Heroles"],"date":"2026-09-22","abstract":"We study how international trade has affected U.S. inflation dynamics. We develop a multi-region New Keynesian model of an open monetary union in which regional Phillips curve slopes depend on exposure to imported goods. Guided by the model, we construct state-level measures of import penetration in final consumption and exploit cross-state variation to estimate regional Phillips curves over 1976-2017. Greater import exposure leads to significantly flatter state-level Phillips curves. We estimate that rising import exposure accounts for roughly 40 percent of the flattening of the U.S. Phillips curve over this period. Increased import exposure also shifted the U.S. Phillips curve downward, re","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["globalization; inflation; Phillips curve; international economics"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Nonlinear Drivers of Macroeconomic Tail Risk: A Threshold Stochastic Volatility-in-Mean VAR with Regime-Dependent Leverage","url":"https://arxiv.org/abs/2609.26994","authors":["Haroon Mumtaz","Sofia Velasco"],"date":"2026-09-22","abstract":"The tails of macroeconomic outcomes can respond differently from the centre of their distribution: shocks with modest effects on median growth or inflation can shift downside growth or upside inflation risk. We develop a threshold stochastic-volatility-in-mean VAR with regime-dependent leverage to study their structural drivers. The model allows endogenous interactions between outcomes and volatility, contemporaneous level-volatility dependence, and regime-specific propagation. In nearly 150 years of U.S. data, predictive model selection supports three inflation-defined regimes. We identify business-cycle, financial, macroeconomic-uncertainty, and financial-uncertainty shocks and decompose t","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Target alignment, dilution and forecast selection when cross-sectional forecasts share a common target","url":"https://arxiv.org/abs/2609.26303","authors":["Masoud Soleimani"],"date":"2026-09-22","abstract":"Forecasters often score the same units per date against one standardized realized outcome. We show that every standardized forecast splits exactly into a component aligned with this common target and a component uncorrelated with it. Three consequences follow: forecast-error correlation largely mirrors forecast correlation and is therefore a poor measure of diversity; an equally weighted combination beats a no-information forecast only when average alignment is large relative to the combination's dispersion; and the gain from adding a forecaster separates into genuine improvement and mere dilution, which equal-weight admission can mistakenly reward. We develop a cautious selection rule, stud","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","cs.LG","q-fin.ST","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Conditional Tensor Diffusion: Distributional Counterfactual Learning and Inference","url":"https://arxiv.org/abs/2609.25924","authors":["Xinbing Kong","Zeyu Li","Junfan Mao","Bin Wu"],"date":"2026-09-22","abstract":"Causal inference guides operational and managerial decisions but remains challenging in high-dimensional panel or tensor settings, where decisions may depend on the joint conditional distribution of missing control outcomes. We develop \\emph{Counterfactual Tucker Diffusion} (\\CFTDiff), which integrates the treatment mask and latent Tucker structure into conditional diffusion to recover this distribution given observed control outcomes through efficient nonlinear score learning in a low-dimensional core. The masked Tucker score preserves dependence across tensor modes while reducing the dimension of nonlinear score learning from the product of mode dimensions to the much smaller product of Tu","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["stat.ML","cs.LG","econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Positive weight Hermite and Legendre quadrature rules","url":"https://arxiv.org/abs/2609.26840","authors":["Joris Pinkse"],"date":"2026-09-22","abstract":"This paper contains new 80-digit positive-weight Gauss-Hermite and positive-weight interior-node Gauss-Legendre quadrature rules for up to five dimensions and varying polynomial degree accuracy (depending on quadrature type and dimension). Some of these rules improve on the best available rules in the literature and some offer rules where none (other than the tensor product) existed. The results were produced by combining methodology developed by previous researchers with new approaches. The full precision rules themselves are at https://doi.org/10.5281/zenodo.22881864. Software in Julia, Python, and R providing the rules is available via a package registry and/or GitHub: Quadriceps.jl (both","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.CO"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Estimating Unobserved Cross-Sectional Network Links with Large-T Panel Data","url":"https://doi.org/10.1080/07350015.2026.2721418","authors":["Peter H. Egger","Jiaqing Zhu"],"date":"2026-09-22","abstract":"","doi":"10.1080/07350015.2026.2721418","venue":"Journal of Business & Economic Statistics","sources":["Journal of Business & Economic Statistics"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Testing High-Dimensional Effects in Quantile Regression with High-Dimensional Confounding: A Decorrelated Approach","url":"https://doi.org/10.1080/07350015.2026.2737286","authors":["Bowen Zhou","Heng Peng","Peirong Xu"],"date":"2026-09-22","abstract":"","doi":"10.1080/07350015.2026.2737286","venue":"Journal of Business & Economic Statistics","sources":["Journal of Business & Economic Statistics"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"ISSUE INFORMATION","url":"https://doi.org/10.1111/jofi.13353","authors":[],"date":"2026-09-22","abstract":"","doi":"10.1111/jofi.13353","venue":"The Journal of Finance","sources":["Journal of Finance"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"AMERICAN FINANCE ASSOCIATION","url":"https://doi.org/10.1111/jofi.13354","authors":[],"date":"2026-09-22","abstract":"","doi":"10.1111/jofi.13354","venue":"The Journal of Finance","sources":["Journal of Finance"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"ANNOUNCEMENTS","url":"https://doi.org/10.1111/jofi.70019","authors":[],"date":"2026-09-22","abstract":"","doi":"10.1111/jofi.70019","venue":"The Journal of Finance","sources":["Journal of Finance"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Justice Good as Random?","url":"https://doi.org/10.1111/jofi.70081","authors":["NIKLAS HÜTHER","KRISTOPH KLEINER"],"date":"2026-09-22","abstract":"ABSTRACT The random assignment of judges promotes fairness and underpins causal identification across the social sciences. Analyzing Chapter 11 bankruptcies, we find sophisticated parties “judge‐shop”: relative to secured hedge fund creditors, cases involving unsecured hedge fund creditors and equity holders are assigned judges with lower past conversion rates and higher unsecured recovery rates. Experienced legal counsel similarly influences assignment. Because judges are not assigned consecutive large cases, knowledgeable parties can judge‐shop by timing the filing date. We develop a method to measure the resulting bias and demonstrate the need for controls and bounded instrumental variabl","doi":"10.1111/jofi.70081","venue":"The Journal of Finance","sources":["Journal of Finance"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Inflation Inattention on the Production Network: Firm-Level Evidence and Macro Implications","url":"https://d.repec.org/n?u=RePEc:fip:fedcwq:103851&r=&r=mon","authors":["Rafael Gonçalves","Ina Hajdini"],"date":"2026-09-21","abstract":"Relying on a micro-level dataset of US firms' inflation expectations, we document that firms in industries with larger Domar weights and more flexible prices have more accurate inflation forecasts. To explain these patterns, we develop a rational inattention model of price-setting firms within a production network. In equilibrium, firms' inflation forecast accuracy depends on their attention to marginal costs, the comovement between their marginal cost and aggregate inflation, and the change in the marginal cost. When calibrated to US input-output data, the model replicates the cross-sectoral relationship between forecast accuracy, Domar weights, and price flexibility. Quantitatively, we fin","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["inflation expectations; rational inattention; production networks; inflation dynamics; monetary policy"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"What No First Stage Can Detect: Functional-Form Contamination in Linear IV","url":"https://d.repec.org/n?u=RePEc:ash:wpaper:170&r=&r=ecm","authors":["Parush Arora"],"date":"2026-09-18","abstract":"Applied instrumental variables (IV) practice reports a first-stage F, now often the conditional F of Sanderson and Windmeijer (2016), and reads a large value as a license to interpret the second stage. We show that no first-stage diagnostic can deliver that license. With a scalar instrument, a scalar treatment, and covariates entered linearly, the 2SLS estimand splits into a signal that a saturated specification would target and a contamination, the covariance between curvature in the instrument propensity and a level function of the covariates. The same nuisance sits in both terms, so it biases the estimand and inflates the reported strength at once. When the instrument is nearly collinear ","doi":"","venue":"NEP 計量経済学 (nep-ecm)","sources":["NEP 計量経済学 (nep-ecm)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Structural Shift in Job Creation: Evidence from Bangladesh","url":"https://d.repec.org/n?u=RePEc:wbk:wbrwps:111458&r=&r=sea","authors":["Khan, Nazmus Sadat"],"date":"2026-09-17","abstract":"This paper examines the relationship between economic growth and employment in Bangladesh, with a comparative perspective involving six other Asian countries. It first tests the validity of Okun’s law for Bangladesh and the selected countries using three distinct autoregressive distributed lag model specifications: a dynamic difference model, a gap model based on the Hodrick-Prescott filter, and a gap model based on the Baxter-King filter. The analysis then estimates the employment elasticity of economic growth for Bangladesh across three periods—2003–10, 2010–17, and 2017–24—while also exploring sectoral variations in employment elasticity within these subperiods. The results reveal that th","doi":"","venue":"NEP 東南・東アジア (nep-sea)","sources":["NEP 東南・東アジア (nep-sea)"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Regime-Dependent Dependence: Cryptocurrencies and Traditional Assets Under Structural Breaks","url":"https://d.repec.org/n?u=RePEc:hal:journl:hal-05752791&r=&r=ets","authors":["Virginie Terraza","Aslı Boru İpek"],"date":"2026-09-15","abstract":"This study proposes a multi-stage approach to modelling dependencies using Vector Autoregression (VAR), Nonlinear Autoregressive Neural Network (NAR-NN) models, and copulas. This paper aims to assess the dynamic dependency structure between cryptocurrencies and traditional financial assets, considering regime changes and safe-haven properties. The proposed methodology integrates change point detection with copula-based conditional correlation Generalized Autoregressive Conditional Heteroscedasticity (GARCH) models to identify structural breaks and nonlinear dependencies between regimes. A sequential change point procedure based on fast signal segmentation is employed to detect structural cha","doi":"","venue":"NEP 計量時系列 (nep-ets)","sources":["NEP 計量時系列 (nep-ets)"],"groups":["ecm"],"countries":[],"tags":["62M10, 68T07, neural network MSC: 91G15, DCC-GARCH family models, VAR, copula, change point detection, financial markets, interconnections, interconnections financial markets change point detection copula VAR DCC-GARCH family models neural network MSC: 91G15 62M10 68T07"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"（論文）金融研究所DPS：ユーザブルセキュリティ研究の現状と展望","url":"http://www.boj.or.jp/research/imes/dps/dps260914b.htm","authors":[],"date":"2026-09-14","abstract":"","doi":"","venue":"日本銀行(WP・日銀レビュー等)","sources":["日本銀行(WP・日銀レビュー等)"],"groups":["jp"],"countries":[],"tags":[]
