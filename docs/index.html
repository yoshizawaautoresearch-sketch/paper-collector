ss-sectional survey incorporating a discrete choice experiment was conducted among 150 US-based oncologists (medical, hematologic, and gynecologic). Participants completed 12 choice tasks comparing hypothetical patient profiles defined by eight attributes (age, stage, BRCA/HRD status, cytoreduction outcome, ascites, anti-VEGF use, progression-free survival, and CA-125 status). Hierarchical Bayesian models estimated preference weights and relative attribute importance. Exploratory subgroup analyses examined differences by practice setting, sp","doi":"10.1016/j.ijgc.2026.105648","venue":"International Journal of Gynecological Cancer","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP","NL","US"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Ranibizumab vs. laser photocoagulation for treating retinopathy in premature infants: a three-year cost-effectiveness analysis","url":"https://doi.org/10.1186/s12962-026-00832-y","authors":["Tomomi Higuchi","Yoko Akune","Rei Goto"],"date":"2026-10-01","abstract":"Abstract Background The standard treatments for retinopathy of prematurity (ROP) include laser photocoagulation of the avascular retina and intravitreal injections of anti-vascular endothelial growth factor agents. While laser photocoagulation is effective, it may lead to poor visual development. Conversely, the anti-vascular endothelial growth factor antibody, ranibizumab, is associated with a high recurrence rate. It is therefore important to consider the cost-effectiveness of these treatments. This study evaluated the three-year cost-effectiveness of ranibizumab vs. laser photocoagulation for ROP treatment. Methods This study performed cost-effectiveness analysis using a decision tree and","doi":"10.1186/s12962-026-00832-y","venue":"Cost Effectiveness and Resource Allocation","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Closing the global checkpoint: Why immune checkpoint inhibitors remain out of reach for most patients༟","url":"https://doi.org/10.1016/j.jncc.2026.09.010","authors":["Jorge Luis Espinoza","Mobil Akhmedov","Weiguo Huang"],"date":"2026-10-01","abstract":"Immune checkpoint inhibitors (ICIs) have revolutionized cancer care in high-income countries, delivering durable responses across multiple malignancies. Yet >75% of global cancer deaths occur in low- and middle-income countries (LMICs), where ICIs remain largely inaccessible due to high costs, regulatory delays, diagnostic gaps, workforce shortages, and exclusion from pivotal trials. Access within LMICs is highly heterogeneous and stratified by geography, sector, and socioeconomic status, reproducing global inequities at the local level. Emerging solutions—including biosimilars, voluntary licensing, pooled procurement, regional manufacturing, telepathology, nurse-led delivery models, inclusi","doi":"10.1016/j.jncc.2026.09.010","venue":"Journal of the National Cancer Center","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["CN","JP","NI","RU"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Financial Market Contagion Under Alternative Regional Alignments: Evidence from Indonesia’s BRICS vs. G7 Counterfactuals","url":"https://doi.org/10.3390/ijfs14100263","authors":["Mahjus Ekananda","Sugiharso Safuan","Rangga Handika"],"date":"2026-10-01","abstract":"Indonesia became a member of BRICS in January 2025, marking the first official entry from Southeast Asia. This study assesses whether Indonesia’s exposure to international financial contagion differs across two external financial-market configurations by comparing its spillover dynamics with BRICS markets and with a G7 advanced-market benchmark. Using daily equity index data for Indonesia, BRICS, and G7 markets, we implement counterfactual “as-if” membership scenarios and quantify return connectedness through the Diebold–Yilmaz spillover framework. We examine three major external shock episodes—the COVID-19 pandemic, the Russo–Ukrainian Conflict, and the Gaza conflict—to evaluate whether the","doi":"10.3390/ijfs14100263","venue":"International Journal of Financial Studies","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["ID","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Does Global Economic Uncertainty Matter for Carbon Dioxide Emissions in Central and Eastern Europe? Evidence from Linear and Asymmetric Dynamic Panel Models","url":"https://doi.org/10.3390/economies14100433","authors":["Bartosz Jóźwik","Phouphet Kyophilavong","Mesut Doğan","Aruna Kumar Dash","Phongsili Soukchalern","Souksavanh Vixathep"],"date":"2026-10-01","abstract":"Global uncertainty can influence carbon emissions by changing economic activity, investment decisions, access to finance, energy choices, and the implementation of environmental policy. The Russia–Ukraine war has further intensified uncertainty, energy-price volatility, and concerns about supply security in Central and Eastern Europe (CEE), where countries differ considerably in their energy systems and progress towards decarbonisation. This study examines the relationship between global uncertainty and fossil CO2 emissions per capita in ten CEE European Union economies during 1997–2024. Two complementary indicators are considered: the Global Economic Policy Uncertainty Index, and the World ","doi":"10.3390/economies14100433","venue":"Economies","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["IN","JP","LA","PL"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Opponent quality associated with attacking type distribution among successful scoring possessions in collegiate basketball","url":"https://doi.org/10.37393/jass.2026.10.02.2","authors":["Taiki Miyazawa","Taiga Kato","Mirai Mizutani","Daisuke Ichikawa"],"date":"2026-10-01","abstract":"This study examined the association between opponent quality and the distribution and structural characteristics of attacking types among successful scoring possessions in collegiate basketball. A total of 4,309 made ﬁeld goals from 97 games in the 2022 Kansai Intercollegiate Basketball League Division 1 were analyzed. Scoring possessions were classiﬁed into four attacking types: immediate attacks (<3 s), primary fast breaks (PFB), secondary fast breaks (SFB), and set offenses (SO), according to tactical characteristics, possession duration, and numerical situations. Opponent quality was deﬁned relative to each team’s ﬁnal league standing. Chi-square tests of goodness of ﬁ t and independence","doi":"10.37393/jass.2026.10.02.2","venue":"Journal of Applied Sports Sciences","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Energy Transitions, Natural Resource Sustainability, and Load Capacity Factor in South Asia: Evidence in the Context of Global Energy Price Shocks","url":"https://doi.org/10.1007/s00704-026-06520-4","authors":["Md. Rony Masud","Ratul Hasan","Rejaul Karim","Reday Chandra Bhowmik"],"date":"2026-10-01","abstract":"","doi":"10.1007/s00704-026-06520-4","venue":"Theoretical and Applied Climatology","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["BD","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Low-to-Negative: A Climate Stabilization Pathway Characterized by Heavy Reliance on CDR and Temperature Overshoot","url":"https://doi.org/10.5281/zenodo.23078121","authors":["Shinichiro Fujimori","Osamu Nishiura","Tomoko Hasegawa","Ken Oshiro","Chaeyeon Park","S. MORI","Limeng Fan","Yuto Osugi","Ryo Totake","Koga Yamazaki","Shiya Zhao","Akihiko Ito","Diego Silva Herran","Kiyoshi Takahashi","Kazuaki Tsuchiya"],"date":"2026-10-01","abstract":"","doi":"10.5281/zenodo.23078121","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["AT","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Synthetic control method with block kriging for point-referenced data","url":"https://doi.org/10.1016/j.spasta.2026.101056","authors":["Naoki Hiramoto","Daisuke Murakami"],"date":"2026-10-01","abstract":"","doi":"10.1016/j.spasta.2026.101056","venue":"Spatial Statistics","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Complex global interdependencies between economic policy uncertainty and geopolitical risk indices","url":"https://doi.org/10.1080/14697688.2026.2716868","authors":["Wataru Souma","Carolina Magda da Silva Roma","Irena Vodenska"],"date":"2026-10-01","abstract":"","doi":"10.1080/14697688.2026.2716868","venue":"Quantitative Finance","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["BR","JP","US"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Fairness and Non-wastefulness in Matching with Siblings and Initial Enrollments: Compatibility and Complexity","url":"https://arxiv.org/abs/2610.01041","authors":["Haris Aziz","Gergely Csáji","Zhaohong Sun","Makoto Yokoo"],"date":"2026-10-01","abstract":"We study a two-sided matching problem between families and daycare centers in which a family may have multiple children with joint preferences, and some children may already be enrolled in daycare centers while seeking transfers. Our model combines and generalizes two well-studied matching frameworks: matching with couples and school choice with initial enrollments. The interaction between joint family preferences and initial enrollments creates fundamental challenges for the existence of desirable outcomes and the design of computationally efficient algorithms. Since stable matchings need not exist, we decompose stability into individual rationality, fairness, and non-wastefulness, and stud","doi":"10.48550/arxiv.2610.01041","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["AU","HU","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Convergence of stationary distributions for a class of zero-range processes and its application to a wealth distribution model with debt","url":"https://arxiv.org/abs/2610.00901","authors":["Hironobu Sakagawa"],"date":"2026-10-01","abstract":"Understanding how macroscopic wealth distributions emerge from microscopic transaction rules among agents is a central problem in econophysics. While many traditional models restrict agents' wealth to non-negative values, debt is an essential feature of realistic economic systems. In this paper, we introduce a stochastic transaction mechanism into the agent-based model with a central-bank-mediated collective debt limit, as studied in [14]. In our model, each agent probabilistically determines whether to transfer a coin, depending on their current asset or debt level. From a probabilistic perspective, the resulting system can be formulated as a zero-range process with $\\mathbb{Z}$-valued site","doi":"10.48550/arxiv.2610.00901","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Determinants and variation of idiosyncratic risk in housing markets: evidence from New Zealand","url":"https://doi.org/10.1007/s00181-026-02983-6","authors":["Lydia Cheung","Jaqueson K. Galimberti","Philip Vermeulen"],"date":"2026-10-01","abstract":"","doi":"10.1007/s00181-026-02983-6","venue":"Empirical Economics","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["AU","CH","JP","NZ"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Neutralizing Hidden Green Protectionism: The Efficiency of National Treatment with Internal Taxes","url":"https://doi.org/10.1016/j.econlet.2026.113287","authors":["Molly Lin"],"date":"2026-10-01","abstract":"","doi":"10.1016/j.econlet.2026.113287","venue":"Economics Letters","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"A Faster Auction Algorithm for Weighted Matroid Intersection","url":"https://arxiv.org/abs/2610.00920","authors":["Tatsuya Terao"],"date":"2026-10-01","abstract":"We consider the weighted matroid intersection problem in the independence-oracle model. A sequence of works by Huang--Kakimura--Kamiyama [SODA'16 \\& Math. Program'19], Chekuri--Quanrud [SODA'16], Quanrud [ICALP'24], and Dudeja--Grilnberger [IPCO'26] has developed efficient $(1-\\varepsilon)$-approximation algorithms for this problem. We present a simple deterministic auction algorithm that, given two matroids on a common ground set of size $n$, computes a $(1-\\varepsilon)$-approximate maximum-weight common independent set using $O(n \\varepsilon^{-2} \\log^2(n))$ independence-oracle queries. This is the first deterministic $(1-\\varepsilon)$-approximation algorithm for the weighted matroid inter","doi":"10.48550/arxiv.2610.00920","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Earnings preview ban: Analyst consequences of restricting pre-earnings private communication","url":"https://doi.org/10.1016/j.pacfin.2026.103402","authors":["Kotaro Miwa","Hidenori Takahashi"],"date":"2026-10-01","abstract":"We identify sell-side analysts who privately communicate with firm management to obtain forthcoming earnings figures (“previews”) and examine the consequences of banning such communication in the Japanese stock market. Following the ban, the forecast accuracy of preview analysts—those who previously relied on previews—declines relative to that of nonpreview analysts. In addition, preview analysts experience a decline in popularity in analyst rankings based on institutional investor votes. Overall, our evidence suggests that private communication provides advantages in both forecast accuracy and analyst evaluations by institutional investors.","doi":"10.1016/j.pacfin.2026.103402","venue":"Pacific-Basin Finance Journal","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Beyond the Iceberg Model: Welfare Bias from Exogenously Specified Transportation Costs in CGE Models","url":"https://doi.org/10.1016/j.econmod.2026.107887","authors":["Jixuan Liao","Shinichì Muto","Xingwei LIU","Tatsuhito KONO"],"date":"2026-10-01","abstract":"","doi":"10.1016/j.econmod.2026.107887","venue":"Economic Modelling","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"An analytics protocol for calibrating benchmarking-community claims in data envelopment analysis","url":"https://doi.org/10.1016/j.dajour.2026.100754","authors":["Tengfei Shao","Xu Wang","Kotomichi Matsuno","Masayuki Goto"],"date":"2026-10-01","abstract":"Reading a data envelopment analysis intensity matrix as a reference network invites three claims that a partition cannot separate: that the structure is imposed by the envelopment programme, that the panel is extreme relative to a declared reference technology, or that more than one technology generated the units. We audit a pipeline on one confidential retail panel and six public panels and ask which claim each component identifies. One result is exact: a basic feasible solution of the variable returns-to-scale programme has at most m + s positive intensities per unit, and 63 solver-tolerance cells show no violation. A degree-preserving rewiring null fires in every replicate of both structu","doi":"10.1016/j.dajour.2026.100754","venue":"Decision Analytics Journal","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Energy, Development and Protest: Assessing China's Official Finance in ASEAN's Power Sector","url":"https://doi.org/10.1111/aspp.70110","authors":["Robert Lindner"],"date":"2026-10-01","abstract":"ABSTRACT Southeast Asia's economic growth demands substantial energy investment. This study investigates China's official financing for power generation in the ASEAN region since 2000 through a systematic mapping approach. Findings show that China has primarily supported coal and hydropower projects, especially in Indonesia, Vietnam, and Laos, while offering minimal renewable energy financing. This is mainly attributed to unfavorable local policy environments and China's focus on large‐scale infrastructure. The study also highlights widespread local resistance—particularly to coal projects—driven by environmental and livelihood concerns. The forms of mobilization were shaped by the political","doi":"10.1111/aspp.70110","venue":"Asian Politics & Policy","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Price dynamics in China’s national carbon market and the interactions with the Shanxi electricity spot market and northern energy hubs","url":"http://www.iges.or.jp/en/pub/price-dynamics-china-s-national-carbon-market/en","authors":["Xianbing Liu"],"date":"2026-10-01","abstract":"As China advances its national carbon emissions trading scheme (ETS) alongside power sector reforms, understanding the price transmission channels between these markets is vital for effective decarbonization. Utilizing daily data from July 2021 to December 2025, this study examines price interactions by linking China’s national carbon market with electricity prices from the pioneering Shanxi spot market and regional fossil fuel prices. Methodologically, an event study, a vector error correction model (VECM), and multivariate regressions are employed. The event study reveals that regulatory announcements trigger significant event-related price fluctuations in the carbon market. Econometric re","doi":"","venue":"Institutional Repositories DataBase (IRDB)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The Cesàro Average Criterion on Infinite Utility Streams and Its Extensions","url":"https://doi.org/10.1111/jpet.70143","authors":["Kensei Nakamura"],"date":"2026-10-01","abstract":"ABSTRACT When evaluating policies that affect future generations, the most commonly used criterion is the discounted utilitarian rule. However, in terms of intergenerational fairness, it is difficult to justify prioritizing the current generation over future generations. This paper axiomatically examines impartial utilitarian rules over infinite‐dimensional utility streams. We provide simple characterizations of the social welfare ordering that evaluates utility streams by their long‐run average on the domain where the average exists. Furthermore, we derive the necessary and sufficient conditions for the same axioms to hold in a more general domain, the set of bounded utility streams. Some o","doi":"10.1111/jpet.70143","venue":"Journal of Public Economic Theory","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Financial Stability, R&D, and AI Activity in High-Tech Exports: Evidence from Panel Data","url":"https://doi.org/10.1016/j.techsoc.2026.103577","authors":["Peter Wänke","Yong Tan","Rachita Gulati","Dragan Pamucar"],"date":"2026-10-01","abstract":"","doi":"10.1016/j.techsoc.2026.103577","venue":"Technology in Society","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["AZ","BR","GB","IN","JP","KR","TR"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Estimating price and expenditure elasticities of demand for cigarettes, beer and soda in Uganda: evidence from eight waves of the Uganda National Panel Survey using the Deaton approach","url":"https://doi.org/10.1136/bmjopen-2026-124788","authors":["Richard Ssempala","Katsunori Kaneko","Bruno Lule Yawe","Niu Bing"],"date":"2026-10-01","abstract":"Objective To estimate the most up-to-date price and expenditure elasticities of demand for cigarettes, beer and soda in Uganda to inform the optimal design of health taxes and contribute to reducing the burden of non-communicable diseases while increasing government tax revenue.Methods We used eight waves of the nationally representative Uganda National Panel Survey (2005/2006–2019/2020) and applied the Deaton demand framework, which exploited spatial price variation while correcting for quality substitution and measurement error in unit values. We adjusted the basic model for possible bias that may arise from the panel nature of the data.Results Our results reveal that budget shares have de","doi":"10.1136/bmjopen-2026-124788","venue":"BMJ Open","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP","UG"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"The complementarity of multi-level heterogeneous environmental regulation: a quasi-natural experiment based on the special provisions for photovoltaic power generation facilities in Japan","url":"https://doi.org/10.1007/s10098-026-03619-0","authors":["Chenyang Lee","Seiichi Ogata"],"date":"2026-10-01","abstract":"","doi":"10.1007/s10098-026-03619-0","venue":"Clean Technologies and Environmental Policy","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Industrialisation, Politics, and Banking Instability in Late Imperial Russia","url":"https://pure.qub.ac.uk/portal/en/theses/industrialisation-politics-and-banking-instability-in-late-imperial-russia(246c282e-5f25-404a-a477-2124f9adee07).html","authors":["Nikita Lychakov"],"date":"2026-10-01","abstract":"This thesis examines industrialisation, politics, banking and social instability in late Imperial Russia. The early-to-mid-1890s were characterised by rapid industrial growth, which was driven by protectionist policies and the state procurement of industrial products. The period 1899-1902 saw a severe financial and industrial crisis. The subsequent period 1903-1905 was marked by widespread labour strikes at industrial enterprises, a war with Japan, and a nation-wide revolution in 1905. My main findings are as follows. First, the national development policies of the 1890s incentivised, although did not compel, commercial banks to finance industrialisation. When industry experienced a slowdown","doi":"10.17034/32627013","venue":"Research Portal (Queen's University Belfast)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"REGULATORY RECURRENCE FOR APPROVAL OF ANDA (GENERIC DRUG) AS PER CDSCO IN INDIA COMPARISON WITH JAPAN","url":"https://doi.org/10.5281/zenodo.23031715","authors":["Dr. P. Ashok Kumar*, Jeevan S, Darshan V. S., Lingaraja N. P., Hemanth M., Kirankumar B. R."],"date":"2026-10-01","abstract":"Generic medicines play an important role in providing safe, effective, quality and affordable healthcare. They are developed as equivalent alternatives to brand-name medicines and must meet regulatory requirements for quality, safety, efficacy and bio equivalence. Their availability reduces healthcare expenditure, improves access to essential medicines and promotes competition in the pharmaceutical market. The Abbreviated New Drug Application (ANDA) is an important pathway for generic drug approval. It allows manufacturers to demonstrate equivalence to a Reference Listed Drug without repeating the complete development programme of the original product. Major requirements include bioequivalen","doi":"10.5281/zenodo.23031715","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The relationship between corporate governance mechanisms and carbon emissions performance in advanced and emerging economies","url":"https://doi.org/10.1007/s43621-026-04883-2","authors":["Sunaina Kanojia","Shweta Jain Goel","Neelam Jhawar"],"date":"2026-10-01","abstract":"This study investigates how corporate governance attributes shape firms’ carbon emissions performance, with the aim of identifying internal governance mechanisms that support effective carbon management and highlighting governance gaps that may impede such performance. The study uses a balanced panel of 972 listed non-financial firms from the world’s five largest economies—the United States, China, Germany, Japan, and India- over the period 2020–2024. The analysis utilises multiple econometric approaches, including fixed effects models with Driscoll–Kraay standard errors, Pooled Ordinary Least Squares (POLS) with Driscoll–Kraay standard errors and industry, year and country dummies, and 2 SL","doi":"10.1007/s43621-026-04883-2","venue":"Discover Sustainability","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["IN"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The Carbon-Captive Structure of the Political Economy in Japan","url":"https://doi.org/10.4324/9781003617525-16","authors":["Kensuke Yoshihiro","俊和 山川"],"date":"2026-10-01","abstract":"In the global trend toward decarbonization, the procurement of renewable energy has become a prerequisite for economic activity, regardless of the economic entity. Thus, renewable energy can be considered a growth industry of the 21st century. However, slow renewable energy adoption, continued reliance on fossil fuels, and a return to nuclear power characterize Japan’s decarbonization policy. Renewable energy, generally considered small-scale and regionally distributed, tends toward large-scale centralization, and its benefits are disproportionately distributed to urban areas. This situation reflects Japan’s heavy industrial energy consumption, based on the import of natural resources, and t","doi":"10.4324/9781003617525-16","venue":"Routledge eBooks","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"INSTITUTIONAL NON RELEASE OF RESOURCES AND FROZEN LIQUIDITY AS A REGIME OF BLOCKED DEVELOPMENT","url":"https://doi.org/10.52058/2695-1592-2026-9(64)-432-447","authors":["Svyatoslav Hromyak"],"date":"2026-10-01","abstract":"This article proposes Frozen Liquidity as a persistent functional regime in which resources remain available but institutions obstruct their conversion to feasible, more productive uses.Its central feature is the preservation of an institutional structure alongside the impairment of its adaptive allocation function.Organisations may actively reproduce this obstruction while continuing to provide services.The conceptual analysis specifies five diagnostic criteria and distinguishes monetary, legal, administrative, strategic-coercive and para-financial channels.Demand loss, technological obsolescence and temporary restrictions are comparison cases unless an additional institution persistently o","doi":"10.52058/2695-1592-2026-9(64)-432-447","venue":"Věda a perspektivy","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["UA"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"K. W. Kapp's Social Cost Theory in Japan","url":"https://doi.org/10.4324/9781003617525-3","authors":["Toshikazu Yamakawa"],"date":"2026-10-01","abstract":"In the tradition of environmental economics, ‘externalities’ and their internalization within the market economy have been given a privileged position. Recognizing environmental degradation as a market failure, economists have prescribed policies for internalization based on market criteria as solutions. However, the reality of severe environmental and human destruction, as seen in Japan’s postwar major pollution incidents, prompted leading Japanese theorists to mount a stringent critique of such externality-based frameworks and to embrace K. W. Kapp’s theory of social costs as an alternative. This study analyzes the reception of Kapp’s social cost theory in Japan and shows how it developed ","doi":"10.4324/9781003617525-3","venue":"Routledge eBooks","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Fundamental and Expectational Variable Investment Strategies and Mean–Variance Portfolio Selection in the US and Japanese Stock Markets, 1974–2024","url":"https://doi.org/10.1142/9789819831081_0004","authors":[],"date":"2026-10-01","abstract":"","doi":"10.1142/9789819831081_0004","venue":"World Scientific series in finance","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Who May Sign a Value Opinion: An Ontology of Apex Signing Authority in 134 Jurisdictions","url":"https://doi.org/10.5281/zenodo.23033529","authors":["William Bert Craytor"],"date":"2026-10-01","abstract":"Every jurisdiction has its own ontology of appraisers: its own classes of persons who may lawfully sign a value opinion, its own number of tiers, and its own axis for cutting them—by value in the United States, by purpose in Germany, by asset class in India, by the assignment rather than the person in Brazil, and not at all in Japan. This article records those native ontologies for the 134 jurisdictions in this Journal's coverage roster—in full for eight reference regimes and in summary for the rest—and annotates each class against one shared reference ontology of facets: a scope level (trainee, restricted, general) with two independent status facets (regulated-purpose register; court or swo","doi":"10.5281/zenodo.23033529","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Finance and Geopolitics","url":"https://doi.org/10.4324/9781003781189-8","authors":["Elmar Hellendoorn"],"date":"2026-10-01","abstract":"This summer, the financial rivalry between the United States and China became increasingly pronounced. In an important speech in late June, US Treasury Secretary Scott Bessent declared that America’s use of financial instruments should support US national-security interests. 1 Weeks later, the US led a currency intervention to support the Japanese yen. Several months earlier, Washington had organised support for the Argentinian peso. With these efforts, the US intended to limit the expansion of Chinese global power and influence.","doi":"10.4324/9781003781189-8","venue":"Routledge eBooks","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The Significance and Limitations of Entropy Economics and the Flow–Fund Model","url":"https://doi.org/10.4324/9781003617525-9","authors":["Takashi Seo"],"date":"2026-10-01","abstract":"This chapter examines the development of entropy economics pioneered by Kenneth E. Boulding and Nicholas Georgescu-Roegen, focusing on its reception in Japan and the emergence of original contributions by Japanese scholars. It also reassesses the flow–fund model, the first theoretical framework of entropy economics, by reviewing contemporary supportive and critical evaluations. The study aims to clarify both the significance and the limitations of this model as an alternative to conventional production theory based on the uncritical use of production functions. By emphasizing process analysis, the explicit incorporation of irreversible historical time, and the distinction between qualitative","doi":"10.4324/9781003617525-9","venue":"Routledge eBooks","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"\"Bangladesh Daily Gas Allocation to Power, Fertilizer and Other Sectors (2020\\u20132026)\"","url":"https://doi.org/10.21227/92ap-wb94","authors":["Abu Hena Shatil"],"date":"2026-10-01","abstract":"\"This comprehensive dataset provides a multidimensional view of Bangladesh\\u2019s natural gas infrastructure and its intersection with global energy markets, offering critical empirical data for energy economics and policy research. Developing nations increasingly face energy security challenges as they balance depleting domestic reserves with reliance on volatile international supply chains. To capture this dynamic, the dataset integrates high-resolution domestic operational metrics with long-term macroeconomic pricing indicators.The core of the dataset comprises daily natural gas supply and distribution records sourced from Petrobangla (2020\\u20132022) and the Energy and Mineral Resources ","doi":"10.21227/92ap-wb94","venue":"IEEE DataPort","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Japanese Political Economy of the Environment","url":"https://doi.org/10.4324/9781003617525","authors":["俊和 山川","Kei Ehara"],"date":"2026-10-01","abstract":"","doi":"10.4324/9781003617525","venue":"Routledge eBooks","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The Measure, the Date, and the Device: statutory form in the instruments verified","url":"https://doi.org/10.5281/zenodo.22901955","authors":["William Bert Craytor"],"date":"2026-10-01","abstract":"Repaginated 7 October 2026: content unchanged. Pages 349-382 of Vol. 1 No. 2 (formerly 333-366). Repaginated 5 October 2026: content unchanged; pages 333-366 of Vol. 1 No. 2 (formerly 329-362), following the version 1.1.0 corrections to the Foundations entries 000 and 007–010.This installment analyzes the form of the statutory texts that fix compensation for compulsory acquisition, and nothing else. Four tables classify the instruments verified for this issue's regional installments: thirty-five measure rules (what the text directs be paid), twenty-six date rules (the point as at which value is taken), thirty-one device rows (the mechanism by which a text controls the influence on value of t","doi":"10.5281/zenodo.22901955","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Japanese Marxian Studies of Joint-Stock Capital and Degrowth Theory","url":"https://doi.org/10.4324/9781003617525-8","authors":["Kei Ehara","Shinya Shibasaki"],"date":"2026-10-01","abstract":"Though Marx scarcely discussed joint-stock capital in Capital , Japanese Marxian economists have conducted theoretical studies of joint-stock capital since Kozo Uno started one in the postwar period. Uno presented a methodology of political economy to separate three arenas of study, viz., the principles of political economy, the stages theory, and the present analysis and placed the study of joint-stock capital at the level of the stages theory. After that, in the 1970s, Ichiro Kawai and Katsuzo Baba asserted that joint-stock capital should be studied at the level of the principles of political economy. Shigekatsu Yamaguchi integrated the theories of Kawai and Baba and developed a three-stru","doi":"10.4324/9781003617525-8","venue":"Routledge eBooks","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Development of Hirofumi Uzawa's ‘Social Overhead Capital’ Theory","url":"https://doi.org/10.4324/9781003617525-5","authors":["Midori Wakamori"],"date":"2026-10-01","abstract":"Hirofumi Uzawa (1928–2014), a prominent mathematical economist, had a profound impact on the American economics community for nearly two decades. Amid the dark shadows cast by the Vietnam War on this community, Uzawa, highly esteemed internationally, resolved to return to Japan. In 1969, he began to develop the innovative concept and theory of ‘social overhead capital (social common capital)’. His initial work in Japan was significantly supported by intellectual dialogues with scholars such as Ken’ichi Miyamoto, Yuichi Shionoya, and Shigeto Tsuru. In his publication for the general audience, The Social Costs of Automobiles (1974), Uzawa criticized urban development and transportation policie","doi":"10.4324/9781003617525-5","venue":"Routledge eBooks","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Conditions for Social Trajectory Collapse: Agent-Based Simulation of Time-Geographic Trajectory Distributions","url":"https://arxiv.org/abs/2610.02581","authors":["Daneul Kim","Yuyeong Kim"],"date":"2026-10-01","abstract":"Metropolitan concentration has motivated policies for more balanced regional development. We use agent-based simulation to examine trajectory diversity, the variety of people's recurring activity orientations toward neighborhoods, urban centers, and wider networks. The model maps 2010 population shares to 2026 distributions in five country cases, China, Russia, Japan, the United Kingdom, and the United States, and simulates change to 2036. Trajectory diversity declines by 52.6-79.0% over 2026-2036. Russia and Japan show the largest increases in the share of the most common trajectory, while US diversity contracts despite a slight decline in this share. Cost burdens rise throughout, whereas w","doi":"10.48550/arxiv.2610.02581","venue":"arXiv (Cornell University)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["KR"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Is Quad become dormant in the present time specially when it comes to 2026?","url":"https://doi.org/10.22271/multi.2026.v8.i10a.1222","authors":["Anurag Dhanda"],"date":"2026-10-01","abstract":"The Quadrilateral Security Dialogue (Quad), comprising the United States, India, Japan, and Australia, was revived in 2017 as a minilateral framework to uphold a free and open Indo-Pacific. By mid-2026, the grouping had not convened a leaders’ summit for nearly two years, and its strategic coherence appeared to be weakening under the pressure of Washington’s transactional foreign policy, US-China diplomatic re-engagement, trade frictions among member states, and shifting military priorities toward West Asia. This paper examines the period from September 2024 to September 2026, drawing on official joint statements, diplomatic meeting records, policy documents, and media analyses to assess whe","doi":"10.22271/multi.2026.v8.i10a.1222","venue":"International Journal of Multidisciplinary Trends","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Place-specific information and its heterogeneous effects on willingness to pay for water resources: a case of Aso, Japan","url":"https://doi.org/10.1016/j.envc.2026.101682","authors":["Mihoko Wakamatsu","Junya Kumagai","Shunsuke Managi"],"date":"2026-10-01","abstract":"","doi":"10.1016/j.envc.2026.101682","venue":"Environmental Challenges","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Demiliterisasi Jepang dan Remiliterisasi Jepang: Perubahan JSDF sebagai Instrumen Strategis Kawasan","url":"https://doaj.org/article/e6d75dcc15924b87a4025cf93149eba9","authors":["Muhammad Iqbal Fauzan","Mulyadi Mulyadi"],"date":"2026-10-01","abstract":"Following Japan’s defeat in World War II in 1945, Japan was forced by US to underwent demilitarization, the Imperial Japanese Military were disbanded and Japan was prohibited from maintaining military under Article 9 of the Japanese Constitution. Instead, Japan’s defense was entrusted to the United States military. However, the Korean War broke out on June 25, 1950, between North Korea, which was the Soviet Union’s ally, and South Korea, which was United States ally. This war involved the United States, which aided South Korea against North Korea. U.S. forces in Korean suffered massive losses at the start of the war; as a result, U.S. troops assigned to defend Japan were largely deployed to ","doi":"10.14710/kiryoku.v10i2.631-640","venue":"DOAJ (DOAJ: Directory of Open Access Journals)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The Role of Repos in Monetary Policy Implementation","url":"https://d.repec.org/n?u=RePEc:fip:fednls:103858&r=&r=mon","authors":["Gara Afonso","Jun-Davinci Choi","Gonzalo Cisternas","Will Riordan"],"date":"2026-09-30","abstract":"In the first two posts of this three-part series, we discussed private market participants that are active in repo markets for profit-making motives. Central banks are also active repo market participants, but their reasons often differ from those of private participants. In today’s post, we discuss how central banks use repos to manage liquidity in the financial system and implement monetary policy.","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["central bank repos; Federal Reserve; standing repo operations (SRPs); overnight reverse repo (ON RRP)"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"The Anatomy of Commodity Risk: Micro, Market, and Economy-Wide Sources","url":"https://arxiv.org/abs/2610.00581","authors":["Nektarios Aslanidis","Aurelio Bariviera","George Kapetanios","Vasilis Sarafidis","Alexia Ventouri"],"date":"2026-09-30","abstract":"We study the anatomy of commodity risk by distinguishing micro, market-level, and economy-wide sources. We develop a two-stage \"divide-and-conquer\" framework that allows sensitivities to these risk sources to vary across commodities while treating economy-wide risk as latent. The first stage uses defactored instrumental-variable estimation to recover commodity-specific sensitivities to micro and market conditions. The second combines principal components with high-dimensional variable selection to identify an observable representation of macro-financial risk. We then construct Risk Intensity Indices (RIIs), which combine estimated sensitivities with prevailing risk conditions to quantify the","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Partial identification with entropy regularized optimal transport","url":"https://arxiv.org/abs/2609.40156","authors":["Bruno N. Costa","Florian F. Gunsilius"],"date":"2026-09-30","abstract":"In many statistical settings, the available data and maintained assumptions do not suffice to uniquely identify the model parameters of interest. In such cases, one can only identify sets which are guaranteed to contain the true parameters. These are often characterized through linear programs that optimize over models compatible with the observed data. These programs can be infinite-dimensional in the optimizer and the number of constraints. We provide a unified way to characterize and solve such optimization problems by phrasing them as optimal transport problems on path spaces. This allows us to regularize the problem with an entropy penalty, recasting it as a multi-marginal entropic opti","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","math.ST","stat.ML"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Optimal Allocation and Volume under Surface","url":"https://arxiv.org/abs/2609.38875","authors":["Kai Feng","Han Hong","Jessie Li","Wenshi Wei"],"date":"2026-09-30","abstract":"This paper develops a framework for estimation and inference on the volumes of sets that are projections of critical function sets, focusing particularly on the convex body beneath the optimal receiver operating characteristic (ROC) surface. Specifically, we propose a volume calculation method that first uses an Aumann expectation representation and then applies Minkowski mixed volumes. Using this framework, we show that the population volume under the ROC surface (VUS) is proportional to the expectation of a symmetric U-statistic kernel. We then propose a double/debiased machine learning estimator of the VUS, derive its asymptotic properties, and develop an inference procedure. Further appl","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.ME","stat.ML"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Imputation is all you need: double robustness, semiparametric efficiency, and automatic covariate balance for estimating the average treatment effect","url":"https://arxiv.org/abs/2609.38692","authors":["Fang Han","Peng Ding"],"date":"2026-09-30","abstract":"Imputation-based causal estimation is typically viewed as relying exclusively on an outcome model, in contrast to augmented inverse-probability weighting, whose consistency is protected by fitting two nuisance models. This paper argues that this view can be misleading by highlighting a hidden dual weighting structure in least-squares sieve regression imputation. Although only outcome regressions are explicitly fitted, the resulting imputation estimator admits an exact weighting representation whose induced weights balance every function in the sieve space and the corresponding population weighting functions are the $L^2$ projections of the inverse propensity scores onto the same sieve space.","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","math.ST"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Charting the life of Billboard hits through memory, turnover and predictability","url":"https://doi.org/10.1098/rsos.261312","authors":["Arthur A. B. Pessa","Angelo A Flores","Matjaž Perc","Haroldo V. Ribeiro"],"date":"2026-09-30","abstract":"Abstract Rankings shape the visibility and success of cultural products, yet their temporal dynamics remain underexplored when comparing distinct ranked objects within the same domain. Here, we use nearly seven decades of Billboard Hot 100 songs and six decades of Billboard 200 albums to investigate how success emerges, persists and differs between songs and albums. We find that albums exhibit a heavier-tailed permanence distribution and re-enter the charts more often than songs, whereas songs typically have longer uninterrupted runs. Similarity between successive charts decays much faster for songs than for albums, suggesting that individual hits reflect shorter-lived collective attention, ","doi":"10.1098/rsos.261312","venue":"Royal Society Open Science","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["BR","JP","KR","SI"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"コロナ禍を契機とした広域型商店街の変容 －神戸元町商店街を事例に－","url":"https://ryuka.repo.nii.ac.jp/records/2000359","authors":["Masashi Atarashi"],"date":"2026-09-30","abstract":"","doi":"","venue":"Institutional Repositories DataBase (IRDB)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"コロナ禍を契機とした商店街の経済的・経営的変容に関する実証的研究 ―神戸元町商店街の変容―","url":"https://ryuka.repo.nii.ac.jp/records/2000358","authors":["Yasuyuki Nagasaka"],"date":"2026-09-30","abstract":"An Empirical Study of the Economic and Managerial Transformation of a Shopping","doi":"","venue":"Institutional Repositories DataBase (IRDB)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"Thermodynamic Deadlock and Systemic Survival at Bitcoin 100 Million JPY","url":"https://doi.org/10.5281/zenodo.23067654","authors":["Yoko Hasebe"],"date":"2026-09-30","abstract":"【要旨(日本語)】 本稿は、ビットコイン(BTC)の価格が法定通貨建てで「1億円」に達するプロセスを、金融工学や市場センチメントではなく、計算物理学、情報熱力学、およびグローバルなインフラ動学の視座から解析したテクニカルレポートである。 ビットコインが1億円という特異点に到達する過程において、以下の3つの相反するベクトルが衝突する。 1. 金融的虚構の極大化: S&P 500等との相関係数が0.87に達し、非相関の「デジタル・ゴールド」から法定通貨の減価を増幅するレバレッジ指標へと変質。 2. 物理的インフラの臨界点: AI/HPCデータセンターとの電力網接続権(Grid-connected power)の奪い合いにより、PoWマイニングは出力制御(Curtailment)の従属的バッファへと追いやられる。 3. 量子演算による暗号基盤の侵食: Shorのアルゴリズム最適化により、Mempool内でのOn-spend攻撃や休眠資産へのAt-rest攻撃が現実化。耐量子計算機暗号(PQC)への移行はUTXOセットの激増(ステート膨張)を招き、分散型ノードの維持を物理的に破壊する。 これらの力学を非平衡熱力学、Kibble-Zurek機構、およびランダウアーの原理(Landauer's principle)に基づき数理モデル化し、システムが迎える結末として「完全な熱的死(崩壊)」か、あるいは人間を排除しAIが自律管理する「永久箱庭(閉鎖熱力学系)」という二極化された終焉を論証する。 【Abstract (English)】 This paper analyzes the syste","doi":"10.5281/zenodo.23067654","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Natural gas prices and macroeconomies: Evidence from exporting and importing countries","url":"https://doi.org/10.1016/j.jcomm.2026.100591","authors":["Peng Chen","Xiaojing Cai"],"date":"2026-09-30","abstract":"","doi":"10.1016/j.jcomm.2026.100591","venue":"Journal of commodity markets","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Critical discourse analysis on Japan’s carbon neutrality declaration in October 2020: rationale of the government’s decision","url":"https://doi.org/10.1080/1523908x.2026.2740027","authors":["Mariho Asai"],"date":"2026-09-30","abstract":"This study examines discourse and structural conditions that facilitated Japan’s 2020 carbon neutrality declaration given the increased need to elucidate sociopolitical drivers underlying recent net-zero policy shifts. Policy texts, discourse and practices, and structural conditions were analyzed using Fairclough’s three-dimensional model of critical discourse analysis. Textual analysis (description) identifies the ‘virtuous cycle of the economy and the environment’ and top – down leadership rhetoric as textual values. The interpretation stage reveals that these values reflect a dominant discourse of weak ecological modernization, influenced by Prime Minister Yoshihide Suga’s political motiv","doi":"10.1080/1523908x.2026.2740027","venue":"Journal of Environmental Policy & Planning","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"STUDY ON THE YOKOHAMA TRADING HOUSE HANDLED IMPORTED IRON PRODUCTS DURING THE MEIJI PERIOD, AS SEEN IN “MEIJI TSUCHINOTO 2NEN TECHO UTSUSHI” AND “TEKKOGYO NO KONJAKU TSUKETARI MEIJISYONEN YORINO TEKKOGYO NI KANSURU KIROKU”","url":"https://doi.org/10.3130/aija.91.2425","authors":["Ikuo HIRAYAMA"],"date":"2026-09-30","abstract":"This article focused on the “Meiji tsuchinoto 2nen techo utsushi” written by Morioka Heiemon, the 7th of Morioka Shoten, and the ‘Gaikoku-torihiki-shokan’ section of “Tekkogyo no konjaku”, the following points were revealed.","doi":"10.3130/aija.91.2425","venue":"Journal of Architecture and Planning (Transactions of AIJ)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Exploring Crop and Flood Insurance as a Supporting Strategy Against Flood Disaster Risk: A Propensity Score Matching Analysis","url":"https://doi.org/10.20965/jdr.2026.p0993","authors":["Maria Angeles Catelo","Pierre Giuseppe P Gilles","Tomohiro Tanaka","Miho Ohara"],"date":"2026-09-30","abstract":"Smallholder farmers in flood-prone agricultural regions face severe flood risks that threaten household welfare and long-term economic stability. This study evaluates the causal impact of crop insurance on post-disaster coping mechanisms among smallholder farming households in Laguna, Philippines ( N =135). Methodologically, the study implements propensity score matching as its baseline framework, and extends the analysis using a multi-dimensional Mahalanobis distance nearest-neighbor matching algorithm ( nn =3) to address localized perfect prediction anomalies inherent in the baseline logistic covariates. Internal validity is rigorously assessed through a Rosenbaum bounds sensitivity analys","doi":"10.20965/jdr.2026.p0993","venue":"Journal of Disaster Research","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP","PH"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Banks That Talk, Banks That Lend: Institutional Structures of SME Finance in the GCC","url":"https://doi.org/10.1111/deve.70055","authors":["Jun Saito"],"date":"2026-09-30","abstract":"ABSTRACT This study examines small and medium‐sized enterprise (SME) finance in the Gulf Cooperation Council (GCC) through a two‐layer framework distinguishing banks' discursive engagement with SMEs (policy layer) from lending behavior (practice layer). Using an unbalanced panel of GCC banks from 2005 to 2024, we combine a text‐based indicator from annual reports with bank‐level SME lending data and estimate fixed‐effects and fractional response models. Large banks place greater emphasis on SME support, yet such policy‐aligned discourse has only a weak and statistically insignificant association with subsequent lending outcomes across alternative lag specifications. Controlling for annual oi","doi":"10.1111/deve.70055","venue":"The Developing Economies","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Blockchain beyond bitcoin: revolutionising trust, transparency, and scalable digital ecosystems","url":"https://doi.org/10.69645/mdia5402","authors":["Ravinder Singh"],"date":"2026-09-30","abstract":"","doi":"10.69645/mdia5402","venue":"The business & management collection.","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Functional Limits and Separation Times for Two Interacting Elephant Random Walks","url":"https://arxiv.org/abs/2609.39455","authors":["Rafik Aguech","Shuhei Shibata","Tomoyuki Shirai"],"date":"2026-09-30","abstract":"We establish functional scaling limits and study first separation times for the interacting two elephant model studied by Aguech and Qin. In the joint diffusive regime, we give a direct martingale proof of convergence to a two-dimensional continuous Gaussian process represented by a matrix-kernel analogue of the noise-reinforced Brownian motion. We then investigate the difference process, whose diffusive scaling persists in the symmetric case even when the joint walk is critical or superdiffusive. For the first separation time of the two walks, we establish convergence in distribution to the first exit time of the limiting Gaussian process, together with convergence of all positive moments u","doi":"10.48550/arxiv.2609.39455","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP","SA"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Inherited Wage Dispersion and Optimal Discretion in a Dual-Rigidity TANK Model","url":"https://arxiv.org/abs/2609.39070","authors":["Kenji Miyazaki"],"date":"2026-09-30","abstract":"How does an inherited cross-type wage gap enter Markov-perfect discretionary monetary policy when transfers are passive? In a two-agent New Keynesian model with sticky prices and type-specific own-lag wage adjustment, the gap changes implementable allocations and the second-order welfare loss. A positive lower bound establishes its value relevance; explicit rank conditions characterize when current price inflation, wage inflation, and the output gap fail to determine the implementing nominal rate. An illustrative parameterization satisfies these conditions, although the additional state explains little nominal-rate variance after conditioning on all three aggregate variables. Welfare compari","doi":"10.48550/arxiv.2609.39070","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The Capacity Cost of Informational Screening","url":"https://arxiv.org/abs/2609.39077","authors":["Keita Kuwahara"],"date":"2026-09-30","abstract":"An advisor knows who would benefit from using a resource but cannot assign its use. Individuals have private assessments and may ignore advice. We study how their choices can respect a fixed usage limit. In our model, whenever coordination is possible, eliciting private assessments makes some harmful use unavoidable. Policies that maximize welfare, or even minimize harm, also forgo beneficial uses that direct assignment would permit. In those environments, observing assessments instead allows advice to achieve as much beneficial use as direct assignment, without harmful use. The loss therefore reflects the incentive cost of eliciting private beliefs while leaving use voluntary.","doi":"10.48550/arxiv.2609.39077","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Auction-Based Algorithms for Matroid Intersection: Near-Linear Query Complexity and Constant-Pass Semi-Streaming","url":"https://arxiv.org/abs/2609.38685","authors":["Chien-Chung Huang","Yusuke Kobayashi"],"date":"2026-09-30","abstract":"In this paper, we develop a new auction-based framework for matroid intersection and use it to obtain improved approximation algorithms in several computational settings. Our framework is inspired by Fleiner's generalized stable matching algorithm and extends the semi-streaming auction algorithm for bipartite matching due to Assadi, Liu, and Tarjan. Using this framework, for any $\\varepsilon > 0$, we present a simple $(1-\\varepsilon)$-approximation algorithm in the rank-oracle model whose query complexity matches that of the current fastest algorithm. Furthermore, by extending this result, we obtain the first $(1-\\varepsilon)$-approximation algorithm for the weighted problem that requires on","doi":"10.48550/arxiv.2609.38685","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["FR","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Trends in Denture Insurance Claims and Their Association With Socioeconomic Indicators and Population Aging in Japan","url":"https://doi.org/10.1111/ger.70125","authors":["Yu Yonezawa","Akiko Asano","Yukinori Kuwajima","Hiroki Sato","Saori Yonezawa","Shigemi Nagai","Takuya Kobayashi"],"date":"2026-09-30","abstract":"OBJECTIVES: To describe nationwide temporal trends in insurance-covered denture claims in Japan and examine their associations with prefectural socioeconomic indicators and population aging using the National Database of Health Insurance Claims and Specific Health Checkups (NDB). BACKGROUND: Japan is experiencing rapid population aging while tooth retention among older adults is improving. How these demographic and oral-health changes are reflected in the provision of insurance-covered complete dentures and removable partial dentures (RPDs) remains unclear. MATERIALS AND METHODS: A prefecture-level time-series analysis of NDB dental claims from 2013 to 2018 was conducted. The primary outcome","doi":"10.1111/ger.70125","venue":"Gerodontology","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP","US"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"中国産業クラスターにおけるレント分析 ―丹陽市自動車部品産業を事例に―","url":"https://ryuka.repo.nii.ac.jp/records/2000362","authors":["之虹 陳"],"date":"2026-09-30","abstract":"","doi":"","venue":"Institutional Repositories DataBase (IRDB)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"公的年金政策の経済効果 －不信感を含むモデルの場合－","url":"https://ryuka.repo.nii.ac.jp/records/2000363","authors":["瑞樹 仲間"],"date":"2026-09-30","abstract":"","doi":"","venue":"Institutional Repositories DataBase (IRDB)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"生存確率を考慮した教育政策と年金政策の政治経済均衡","url":"https://ryuka.repo.nii.ac.jp/records/2000365","authors":["三原 裕子"],"date":"2026-09-30","abstract":"","doi":"","venue":"Institutional Repositories DataBase (IRDB)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"Analysis of Labor Market Performance in G7 Countries Using Trf-FUCOM and DOBI Methods","url":"https://doi.org/10.30784/epfad.1911171","authors":["Sinan Dündar","Şerife Merve KOŞAROĞLU"],"date":"2026-09-30","abstract":"The labor market, a complex structure with distinct dynamics, is significantly influenced by various macroeconomic factors. Enhancing its resilience against economic uncertainty and shocks is paramount for ensuring overall economic stability. This study sought to evaluate the labor market performance of G7 countries between 2000 and 2023, employing a set of labor market indicators. The Trapezoidal Fuzzy Full Consistency Method (TrF-FUCOM) was utilized to rank these indicators and determine their respective weights, while the DOmbi Bonferroni (DOBI) method was applied to establish the performance ranking of the G7 countries' labor markets. Analysis revealed that unit labor costs were the most","doi":"10.30784/epfad.1911171","venue":"Ekonomi Politika ve Finans Arastirmalari Dergisi","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["TR"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Major Misunderstandings About U.S. Treasuries and U.S. Public Finance Structural Non‑Settlement in International Finance","url":"https://osf.io/fhtcr","authors":["Hiromu Urushizaki"],"date":"2026-09-30","abstract":"Description This project presents an independent structural analysis of international finance, defining the concept of Structural Non‑Settlement—a mismatch in which foreign currency payments for U.S. Treasuries are fully recorded in global banking ledgers but never appear in U.S. sovereign accounting. Using IMF COFER, U.S. Treasury TIC, and BIS statistics, the study estimates that $40–46 trillion in foreign‑currency‑to‑dollar conversions remain unrecorded as U.S. assets. The research was originally developed in Japanese and refined through repeated Japanese–English back‑translation in collaboration with AI language models. The conceptual structure, problem setting, and quantitative analysis ","doi":"10.17605/osf.io/fhtcr","venue":"OSF Preprints (OSF Preprints)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Post-pandemic inflation: A look through the lens of modern monetary theory (MMT) and mainstream economics","url":"https://doi.org/10.24891/wuyder","authors":["Vladimir A. BELYAEV"],"date":"2026-09-30","abstract":"Subject. Inflation management in developed countries in the post‑COVID‑19 period. Objectives. To critically assess the effectiveness of traditional monetary instruments (interest rate hikes) versus alternative fiscal approaches under Modern Monetary Theory (MMT) in the context of post‑pandemic inflation. Methods. A comparative historical and economic analysis is applied, using empirical data from the USA, Europe, and Japan, along with a decomposition of inflationary factors according to A. Shapiro’s methodology. Results. It was found that traditional monetary instruments proved to be largely ineffective against inflation driven by supply‑side shocks (supply chain disruptions, energy crisis).","doi":"10.24891/wuyder","venue":"Finance and Credit","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["RU"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Disinflation Policies and Inflation Hysteresis: Nonlinear Evidence from the G7 and Türkiye","url":"https://doi.org/10.17065/huniibf.1796448","authors":["Havva Koç"],"date":"2026-09-30","abstract":"This study examines the presence of inflation hysteresis in G7 countries and Türkiye, with implications for monetary policy effectiveness, disinflation costs, and expectation management. It tests whether major shocks during 2000:01–2024:12 (2003:01–2024:12 for Türkiye) have permanent effects on CPI levels. Monthly data obtained from FRED and TURKSTAT are seasonally adjusted using TRAMO/SEATS and transformed into natural logarithms. A country-specific comparative time series approach is adopted. Linearity is tested using LR and Hansen tests, while nonlinear stationarity is examined using the Kapetanios–Shin–Snell (KSS) and Hepsag tests. The findings show that the linear model is rejected at t","doi":"10.17065/huniibf.1796448","venue":"Hacettepe Üniversitesi İktisadi ve İdari Bilimler Fakültesi Dergisi","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["TR"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Financial Toxicity Among Disaggregated Asian American Cancer Survivors","url":"https://doi.org/10.1001/jamanetworkopen.2026.37071","authors":["Advait Thaploo","Edward Christopher Dee","Kaitlyn Lapen","Fumiko Ladd Chino"],"date":"2026-09-30","abstract":"Importance: Panethnic categorization of Asian American individuals masks sociodemographic diversity. Whether this aggregation obscures heterogeneity in cancer-related financial toxicity remains unknown due to a lack of disaggregated data. Objective: To evaluate associations between disaggregated Asian American identity and financial toxicity among cancer survivors compared with non-Hispanic White survivors. Design, Setting, and Participants: This cross-sectional study analyzed National Institutes of Health All of Us Research Program data. Participants were Asian American and non-Hispanic White adults with an electronic health record-confirmed malignant neoplasm diagnosed before completing fi","doi":"10.1001/jamanetworkopen.2026.37071","venue":"JAMA Network Open","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["US"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Theoretical Impact of Human-in-Command (HIC) Supervisory Interlocks on Algorithmic Trading Dynamics: A Control-Theoretic Thought Experiment and Simulation Architecture (サブタイトル: 自律型AIにおけるHuman-in-Command(HIC)監督インターロックが金融市場動態に与える理論的影響:システム制御理論に基づく思考実験とシミュレーション・アーキテクチャ)","url":"https://doi.org/10.5281/zenodo.23051721","authors":["Yoko Hasebe"],"date":"2026-09-30","abstract":"Abstract (English) As autonomous Large Language Model (LLM) agents and multi-agent reasoning systems increasingly mediate capital allocation, high-frequency liquidity provision, and algorithmic price discovery, the governance of their physical operational boundaries becomes an acute systemic challenge. This paper formalizes a rigorous control-theoretic thought experiment and simulation architecture evaluating the macroeconomic implications of Human-in-Command (HIC) supervisory interlocks. We analyze the structural consequences of four fundamental pillars: (1) Operational Constraint Language (OCL) boundaries that enforce deterministic state transitions between active high-throughput exploitat","doi":"10.5281/zenodo.23051721","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"A Study on Development Strategies for Improving the Defense Standards System","url":"https://doi.org/10.34139/jscs.2026.16.3.124","authors":["Certification and Safety Society for Standards","Somi Park","Gyeonghwan Park","Mincheol Lee"],"date":"2026-09-30","abstract":"This study analyzes the current operation of Korea defense standards system and examines defense standardization practices in the United States, NATO, and Japan to propose directions for improving the system. Despite the growing importance of defense standardization amid rapid technological advances, Korea current defense standards system remains largely demand-driven, limiting its ability to respond proactively to future technological changes. Accordingly, this study reviews defense standardization trends in these countries and organizations and derives implications by comparing their practices with the Korea’s system. The findings identify four major challenges facing Korea defense standar","doi":"10.34139/jscs.2026.16.3.124","venue":"Society for Standards Certification and Safety","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"A Study on the Qualification and Training System for Crowd and Traffic Control Security Guards","url":"https://doi.org/10.64227/jdis.2026.2.2.8","authors":["Yun-gu Lee"],"date":"2026-09-30","abstract":"With the increasing number of mass gatherings, including local festivals, cultural events, and public demonstrations, preventing safety accidents caused by crowd congestion and ensuring professional on-site management have become increasingly important. This study analyzes the qualification and education and training systems for crowd and traffic control security services under Korea’s Security Services Industry Act and comparatively examines relevant systems in Japan and the United States. The findings indicate that the current Korean system lacks professional qualifications and education programs that adequately reflect the specific characteristics of crowd and traffic control security ser","doi":"10.64227/jdis.2026.2.2.8","venue":"Journal of Defense Industrial Security","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The Treatment of Import and Export Prices in International Comparisons of GDP","url":"https://doi.org/10.1111/roie.70091","authors":["Robert C. Feenstra","Robert Inklaar","Ninghui Li"],"date":"2026-09-30","abstract":"ABSTRACT The year 2025 marked the 50th anniversary of the Penn World Table (PWT). A key question in the construction of these international accounts is how the value of imports and exports for each country is converted into a common currency. PWT currently measures real GDP on the output side by using disaggregate, quality‐adjusted prices of imports and exports to construct PPP exchange rates that convert imports and exports into US$. In contrast, the International Comparison Program (ICP) of the World Bank uses the nominal exchange rates to convert trade balances into US$. Implementing the ICP approach in PWT data, we find that it results in real GDP that is somewhat higher than the output‐","doi":"10.1111/roie.70091","venue":"Review of International Economics","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["CN","NL","US"],"tags":[],"first_seen" ogen innovation by increasing uncertainty, financing pressure, and supply-chain instability, which may delay long-cycle R&D activities. In the long run, however, persistent ","doi":"10.64289/iej.26.0309.7880921","venue":"International Energy Journal","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["CN"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The Impact of the Iran War and the Closure of the Strait of Hormuz on International Trade","url":"https://infoacceso.org/index.php/ri/article/view/652","authors":["Nadjib Cherbal","Nedjar Amine"],"date":"2026-09-30","abstract":"The Strait of Hormuz represents one of the most strategically important maritime chokepoints in the international trading system. Located between Iran and Oman, it connects the Persian Gulf with the Gulf of Oman and the Arabian Sea and constitutes a critical maritime route for international energy flows. Its importance extends beyond the transportation of oil and natural gas because disruptions in the Strait can affect shipping costs, insurance premiums, food and fertilizer markets, industrial supply chains, inflation, and the broader movement of international merchandise. UN Trade and Development has described the Strait as a critical global trade corridor, noting that approximately one qua","doi":"","venue":"Revista Infoacceso","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["DZ"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Population aging and labor productivity in Japan: Spatial analysis based on prefectural panel data","url":"https://doi.org/10.24891/gwnspk","authors":["Ling JIANG"],"date":"2026-09-30","abstract":"Subject. The impact of population aging on labor productivity growth in Japanese prefectures. Objectives. Identification of the nature of the impact of demographic aging on the dynamics of labor productivity, as well as verification
