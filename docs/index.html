 in one pipeline. First, double/debiased machine learning (DML) removes nonlinear confounder effects from the outcomes and the lagged series. Second, adaptive causal lag estimation (ACLE) picks the lag order at each time step by sequential significance tests, tracking regime changes. Third, entry-wise $z$-tests with Benjamini--Hochberg correction select directed edges at a target FDR.","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["cs.LG","econ.EM","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Synthetic Control under Out-of-Span Common Shocks: Diagnosis, Exposure Balance and Correction","url":"https://arxiv.org/abs/2610.05535","authors":["Rok Spruk"],"date":"2026-10-04","abstract":"Synthetic control relies on pre-treatment fit to balance the unobserved factors that drive untreated outcomes. The argument fails when an observed common shock, such as a commodity price, moves with the latent factors before treatment and departs from them afterwards and pre-treatment fit then says almost nothing about the synthetic unit's exposure to the shock. I derive a period-specific bound that links the post-treatment bias of any weighting estimator to pre-treatment misfit through a leverage statistic, and show that the statistic decomposes exactly into a latent-factor component and the partial leverage of the observed shock. The decomposition yields a diagnostic for such silent factor","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Surrogate-powered Causal Inference with Censored Outcomes","url":"https://arxiv.org/abs/2610.05486","authors":["Yaroslav Mukhin","Tereza Oprea","Arielle Anderer","Christina Lee Yu","Jelena Bradic"],"date":"2026-10-04","abstract":"Clinical trials with survival endpoints lose information when participants are censored before death is observed. We develop target-preserving estimators that use posttreatment disease history, such as recurrence or progression, to recover information lost to censoring for marginal survival and restricted mean survival effects. The difficulty is that the intermediate event is downstream of treatment: naive adjustment can change the causal estimand, and the useful information enters only through the observed coarsening. We derive observed-data influence functions with and without recurrence history and obtain an exact gain identity. The identity shows that efficiency improvement is driven by ","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","math.ST","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Impulse Response Inference for Matrix Autoregressions","url":"https://arxiv.org/abs/2610.05405","authors":["Alain Hecq","Ivan Ricardo","Ines Wilms"],"date":"2026-10-04","abstract":"Matrix autoregressive (MAR) models offer a parsimonious framework for modeling matrix-valued time series, yet tools for estimation and inference for their impulse response functions are lacking. We develop asymptotic and bootstrap-based inference for impulse responses of stable MAR($p$) models. We derive the joint asymptotic distribution of the coefficient and covariance estimators, which permits closed-form delta-method standard errors. To address finite-sample bias, we propose ProBAB-MAR, a bias-corrected bootstrap that projects the corrected coefficients back onto the Kronecker parameter space, and prove that it attains asymptotically correct coverage. Monte Carlo simulations show that de","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Nonlinear fiscal multiplier controlling for policy and economic regimes","url":"https://arxiv.org/abs/2610.04982","authors":["Szymon P. Chudziak"],"date":"2026-10-04","abstract":"A new form of the fiscal multiplier suited to data expressed as gross growth rates is proposed, together with a structural vector autoregression that isolates discretionary fiscal policy from regime and rule-based components. Because cumulating growth-rate responses over a horizon involves a product rather than a sum, the proposed multiplier is multiplicative: both numerator and denominator are polynomials in the size of the fiscal impulse, so the multiplier varies nonlinearly with the scale of the expenditure programme -- a dependence that conventional additive multipliers cannot capture. The multiplier requires no discounting, no ad hoc conversion factor, and no auxiliary estimate of an av","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Late Triassic adakitic rocks in the Selenge igneous rock complex, northern Mongolia: petrogenesis and tectonic implications","url":"https://doi.org/10.1016/j.jaesx.2026.100225","authors":["Purevdulam SUKHBAATAR","Bayart Nadmid","Manchuk Nuramkhaan","Kazuhiro Tsukada","Sharav Davaanyam","Munkhtsetseg Oidov"],"date":"2026-10-04","abstract":"In northern Mongolia, in the region along the southern margin of the former Siberian continent, Permian–Triassic adakitic rock complexes formed by the melting of the oceanic slab are widely exposed (Selenge Igneous Rock Complex: SIC). However, the petrogenesis of the SIC remain incompletely constrained. This study presents new whole-rock geochemical data of volcanic rocks from the Bugat area and of intermediate dikes intruding into the SIC. Besides, we report U Pb zircon ages for the volcanic rock and a dike. The volcanic rock succession in the Bugat area consists of intermediate to felsic lava and pyroclastic rocks. The intermediate lava is characterized by high La/Yb, Sr/Y, and Sr/La ratio","doi":"10.1016/j.jaesx.2026.100225","venue":"Journal of Asian Earth Sciences X","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP","MN"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Tourism, energy use, and resource rents as determinants of ecological footprint in SAARC: cross-sectionally robust evidence","url":"https://doi.org/10.1038/s41598-026-74156-5","authors":["Mohammad Alami Musa","Preethu Rahman","Yuan Liu","Xiaoli Liu","Jiaxue Hui","Yanrong Huang"],"date":"2026-10-04","abstract":"Tourism is now one of the world’s fastest-growing industries, with measurable consequences for energy demand and natural resource use, and SAARC economies are no exception. Despite this exposure, no prior study has applied a cross-sectionally robust panel framework to jointly assess tourism, energy, natural resources, and growth as determinants of environmental quality in the region, leaving policymakers without reliable evidence on the region’s key drivers of ecological pressure. This study examines how economic growth, energy consumption, tourism, and natural resource exploitation jointly affect the ecological footprint across six SAARC countries from 1995 to 2024. We apply the Driscoll-Kr","doi":"10.1038/s41598-026-74156-5","venue":"Scientific Reports","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["CN","ES","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Contribution of subnational regions to national climate change mitigation targets","url":"https://doi.org/10.1007/s11625-026-01906-9","authors":["Kei Gomi","Yuki Ochi","Keita Mochihara","Yuko Kanamori","Go Hibino"],"date":"2026-10-04","abstract":"This study developed a methodology for analyzing the mitigation measures expected of each region within a country, as well as the resulting regional energy supply–demand balances, given national decarbonization targets and assumed future energy system conditions. Using national-level values as an overarching framework, the method represents interregional energy flows and constructed two scenarios: (1) a scenario in which all regions make efforts of equal stringency to collectively achieve the national target (CN1) and (2) a scenario in which each region seeks to achieve carbon neutrality independently within its own jurisdiction (CN2). For each scenario, regional energy supply and demand, ca","doi":"10.1007/s11625-026-01906-9","venue":"Sustainability Science","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Code for: Late-opening units and the probability of failing dissolution tests","url":"https://doi.org/10.5281/zenodo.23135782","authors":["Yasushi Arai"],"date":"2026-10-04","abstract":"Code and outputs for every table and figure of the paper and its Supplementary Information. Re-released for archiving on Zenodo.","doi":"10.5281/zenodo.23135782","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Debt discipline after privatization: lifecycle and market-structure evidence from Malaysia","url":"https://doi.org/10.1080/00036846.2026.2742448","authors":["Nor Aidila Natasha Azhari"],"date":"2026-10-04","abstract":"This study examines whether the marginal effects of leverage on firm performance vary across post-reform lifecycle stages and market structures. Using 794 firm-year observations from 40 Malaysian firms with documented privatization and state-linked corporate reform histories over 2000–2024, the study applies firm and year fixed-effects models. The findings show that the leverage-performance relationship is heterogeneous rather than uniform. However, there is no general evidence of the nonlinear balancing relationship predicted by trade-off theory, while evidence of lifecycle heterogeneity is limited. The strongest heterogeneity emerges across market structures, with competitive firms experie","doi":"10.1080/00036846.2026.2742448","venue":"Applied Economics","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The Impact of Policy Uncertainty on Foreign Direct Investment in Services: Evidence From Affiliate‐Level Data and the Role of Regional Trade Agreements","url":"https://doi.org/10.1111/twec.70166","authors":["Mitsuo Inada","Naoto Jinji"],"date":"2026-10-04","abstract":"ABSTRACT This study examined how foreign direct investment (FDI) in services is affected by regional trade agreement (RTA)‐induced policy uncertainty (i.e., second‐moment uncertainty shocks), which is separated from first‐moment shocks. Policy uncertainty is elicited by examining two different types of reservations regarding certain RTA obligations: current and future reservations. Examining these reservations allowed us to capture the different magnitudes and timing of shocks. Using affiliate‐level data, we evaluated how the activities of foreign affiliates of Japanese multinational enterprises are affected by Japan's RTAs with host country‐sector‐reservation level commitments such as marke","doi":"10.1111/twec.70166","venue":"World Economy","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Compatibility paradox: impossibilities in Shapley-based committee selection","url":"https://doi.org/10.1007/s11127-026-01483-6","authors":["Yusuke Kamishiro"],"date":"2026-10-04","abstract":"","doi":"10.1007/s11127-026-01483-6","venue":"Public Choice","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Prime factorisation of stable-matching instances: uniqueness, simultaneous products, and an exact census","url":"https://arxiv.org/abs/2610.05617","authors":["Yoshiteru Ishida"],"date":"2026-10-04","abstract":"Code and data for Prime factorisation of stable-matching instances: uniqueness, simultaneous products, and an exact census. Two independent implementations of serial deferred acceptance built from the definitions, the blocks and the unique finest partition they generate, the exact census of prime instances in exact integer arithmetic, and a verification suite that re-derives every checkable number of the paper and prints PASS or FAIL. Includes a dataset of all 46,656 size-three instances with their invariants. Scope: strict and complete preference lists on both sides, equal numbers of proposers and receivers, and a serial scheduler. Nothing here applies to ties, synchronous updates, many-to-","doi":"10.5281/zenodo.23130296","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Africa’s new credit agency: why it’s needed","url":"https://doi.org/10.64628/aaj.tg7mnffya","authors":["Daniel Cash"],"date":"2026-10-04","abstract":"","doi":"10.64628/aaj.tg7mnffya","venue":"","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["DE","GB","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"ASEAN's TFP Growth, Economic Weight, and Offsetting Contributions: Strong Gains, Modest Regional Productivity","url":"https://doi.org/10.5281/zenodo.23130223","authors":["Koji Nomura"],"date":"2026-10-04","abstract":"Productivity Research Notes (PRN Series), No. 2622 This note relates national TFP growth to economic weight and income levels across ASEAN's ten member economies over 2010–2024. Vietnam and Malaysia combined TFP growth of about 1% per year with sufficient economic weight to become the leading positive contributors. Indonesia, accounting for well over one-third of regional output, turned slightly negative TFP growth into a substantial drag. Country-origin contributions sum to 0.30 percentage points per year, compared with ASEAN TFP growth of 0.41%, as strong gains were partly offset by weakness elsewhere. Income alone did not determine performance: Vietnam and Indonesia, at similar income lev","doi":"10.5281/zenodo.23130223","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"How Much Does a Flight from the United States to Japan Cost? Round-Trip Fares by Origin, Season and Booking Pattern from Fare-Search Data, with US–Japan Air Traffic from DOT International Reports, 1990–2025, and US Visitor Arrivals, 2003–2026","url":"https://doi.org/10.5281/zenodo.23146768","authors":["Helen Askew","Daniel R. Whitcombe"],"date":"2026-10-04","abstract":"We describe what a flight from the United States to Japan costs and how the market behind the fare has changed. Fares are aggregate averages and medians from a commercial fare-search site as of 26 September 2026; traffic comes from US Department of Transportation International Report passenger and departure data for 1990–2025; visitor arrivals from the Japan National Tourism Organization; and taxes and fees from US and Japanese rate schedules. Round trips averaged USD 962 over the past month. Monthly medians ranged from USD 470 in February to USD 751 in June. The 12-month Tokyo average ran from USD 734 from Honolulu to USD 1,653 from Dallas, a ratio of 2.25, with Pacific-state origins averag","doi":"10.5281 nam) over 2007–2024. The panel is balanced, with 252 observations (14 partners × 18 years). Laos has no Liner Shipping Connectivity Index because it is landlocked, so it is excluded from estimation; all results in the article use the remaining 234 observations (13 partners). The depe","doi":"10.5281/zenodo.23134297","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Dimensions of Small and Medium Enterprise Resilience in the Face of Crisis and Expansion: A Look Into Japan","url":"https://doi.org/10.5281/zenodo.23136608","authors":["Hana Iida"],"date":"2026-10-04","abstract":"","doi":"10.5281/zenodo.23136608","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Can Accounting-Consistent Reduction Support Policy Inference? Preserving Institutional Feasibility in SFC Models: A Minimal Counterexample / 会計整合的な縮約は政策推論を支えられるか――SFCモデルにおける制度的実行可能性の保存と最小反例","url":"https://doi.org/10.5281/zenodo.23127810","authors":["Nyun"],"date":"2026-10-04","abstract":"English This record contains English and Japanese versions of the same unreviewed working paper. The paper examines whether state reduction in stock-flow consistent (SFC) models preserves institutional feasibility as well as numerical accounting consistency. It states a necessary and sufficient condition for reproducing target-operation admissibility and sufficient conditions for preserving finite operation sequences under deterministic updates. Deposit-use eligibility serves as a minimal witness to the failure of a general guarantee from accounting consistency to institutional feasibility; the issue is not restricted to deposits. Two sequences from a common initial state produce identical n","doi":"10.5281/zenodo.23127810","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"ja"},{"title":"Experiences of Sustainable Development: From Theory to Practice","url":"https://doi.org/10.5281/zenodo.23132803","authors":["Pouyan Mobaseri Abed"],"date":"2026-10-04","abstract":"Abstract Sustainable development has emerged as one of the most critical discourses of the 21st century, serving as a framework for balancing economic growth, social justice, and environmental protection. This paper aims to analyze global and national experiences of sustainable development by examining successful case studies and the challenges faced by different countries, using documentary research and qualitative analysis. Findings indicate that leading countries such as Sweden, Denmark, Japan, and South Korea have successfully integrated environmental policies with economic and social agendas, providing effective models for others. Moreover, the study highlights that public participation","doi":"10.5281/zenodo.23132803","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Dataset for: \"AI Data Centers and the 2027 Global Economic Outlook\"","url":"https://doi.org/10.7910/dvn/coheir","authors":["Santiago Sainz"],"date":"2026-10-04","abstract":"This report compiles and compares 2027 economic projections published by the International Monetary Fund, the OECD, the World Bank, and the central banks of the United States, the eurozone, the United Kingdom, and Japan, and sets that macro outlook alongside a second, equally weighted line of inquiry: the physical and regulatory economics of the artificial intelligence infrastructure now reshaping how, and where, economic growth itself is generated.","doi":"10.7910/dvn/coheir","venue":"Harvard Dataverse","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Testing persistence in real house prices in 47 countries from the OECD Database","url":"https://doi.org/10.1080/23322039.2026.2719270","authors":["Guglielmo Maria Caporale","Alfonso Dominguez","Luis A. Gil‐Alana"],"date":"2026-10-04","abstract":"This paper provides a comprehensive analysis of persistence in real house prices at the quarterly frequency in 47 countries from the OECD Database using fractional integration methods. The sample period varies depending on data availability, the longest series being the Japanese one (from 1960Q1), with the last observation at the end of 2023 or in early 2024 in all cases. Both linear and non-linear models are considered. In the latter case structural break tests are carried out first to capture sudden parameter shifts, and then a specification based on Chebyshev polynomials in time is also estimated in order to allow for smoother changes. The results generally indicate a high degree of persi","doi":"10.1080/23322039.2026.2719270","venue":"Cogent Economics & Finance","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["ES","GB"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"How Much Does a Premium Cabin Cost? First and Business Class Fares, Government Contract Business Fares, Premium-Cabin Taxes and Airline Premium Revenue from Fare-Search, GSA City Pair, Tax-Law and SEC Filing Data, 2009–2027","url":"https://doi.org/10.5281/zenodo.23146760","authors":["Helen Askew","Daniel R. Whitcombe"],"date":"2026-10-04","abstract":"Premium airfares are widely quoted but rarely compiled across sources. We assemble published fare-search averages, US government contract fares, tax schedules and airline filings. Across 66 countries with a published average, a business class round trip from the United States had a median of USD 4,357 on 25 September 2026; first class averages existed for only 15 countries and two US destinations. On the 10 long-haul routes where first class costs at least as much as business, the median first class round trip was about USD 16,261 against USD 5,112.50 in business, and first class to Japan averaged USD 24,527, 5.6 times business. On short routes such as Canada (USD 994) first class averaged l","doi":"10.5281/zenodo.23146760","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Matched Triple-Differences: A Framework for Covariate Adjustment","url":"https://arxiv.org/abs/2610.04223","authors":["Yihong Liu"],"date":"2026-10-03","abstract":"A common empirical strategy in triple-differences (DDD) is to include either covariate trends or covariate levels to a three-way fixed effects (3WFE) regression. This strategy is typically motivated by the conditional parallel gaps assumption which assumes that deviations from parallel trends are similar among units with comparable observed covariates. We formally study both 3WFE specifications and show that, in general, neither consistently estimates the average treatment effect on the treated (ATT). Our diagnosis has two parts. First, we show that the OLS estimands of both specifications fail to satisfy the covariate balancing condition that is sufficient for them to equal the ATT. Second,","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Bootstrap Inference with a Randomly Assigned Regressor: Covariance Filtering and the Limits of Marginal Resampling","url":"https://arxiv.org/abs/2610.04217","authors":["Ulrich Hounyo","Jungbin Hwang"],"date":"2026-10-03","abstract":"Random assignment can make ordinary least squares (OLS) inference insensitive to outcome dependence, yet iid resampling can still fail because assignment and resampling need not remove the same covariance terms. With binary treatment, the iid variance target differs from the sampling variance by exactly minus aggregate cross-unit covariance of treatment effects. Under a Gaussian first-order limit, positive covariance leads to over-rejection and negative covariance to under-rejection. Two designs can generate the same distribution for each observation but require variance corrections of opposite signs, so no marginal-only variance correction is first-order exact for both. For first-order Gaus","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"ANOVATS: a subsampling-based test to detect differences among short time series in marine studies","url":"https://doi.org/10.1080/02664763.2026.2737191","authors":["Yuichi Goto","Hiroko Kato Solvang","Masanobu Taniguchi","Tone Falkenhaug"],"date":"2026-10-03","abstract":"Assessing marine ecosystems is important for understanding the impacts of climate change and human activity, as well as for maintaining healthy oceans and ecosystems. In marine science, it is common for biologists and geologists to identify regional differences based on expert knowledge, frequently through data visualization. However, time series data collected through surveys in marine studies typically span only a few decades, limiting the applicability of classical time series methods. Additionally, without expert knowledge, detecting significant differences becomes challenging. To address these issues, we introduce ANOVATS (ANOVA for small-sample time series data), a subsampling-based me","doi":"10.1080/02664763.2026.2737191","venue":"Journal of Applied Statistics","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Heterogeneous effects of bottom-up responsiveness and top-down central environmental inspection on corporate green innovation across ownership and competition","url":"https://doi.org/10.1007/s43621-026-04567-x","authors":["Ziming Wang","Daiju Narita"],"date":"2026-10-03","abstract":"This paper examines how bottom-up municipal responsiveness and top-down central environmental inspection pressure shape firms' green innovation behavior in China. Using a firm-level panel of all non-financial A-listed firms, patent data from the China Research Data Services Platform, a city-level government responsiveness index, and the first round of Central Environmental Protection Inspections, we study how different environmental governance pressures are associated with green innovation in firms’ overall innovation portfolios. To address endogeneity in municipal responsiveness, we use an instrumental-variable strategy based on lagged leave-one-out responsiveness of other cities within the","doi":"10.1007/s43621-026-04567-x","venue":"Discover Sustainability","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Lithium Diplomacy and Economic Security: Zimbabwe’s Critical Minerals Strategy in the Global Energy Transition","url":"https://doi.org/10.64754/thedyke.v20i1.722","authors":["Fulton Upenyu Mangwanya","Prosper Mutswiri","Umali Saidi","Sibusisiwe Chibaya"],"date":"2026-10-03","abstract":"This paper theorises Zimbabwe’s emergent lithium strategy as a form of critical minerals diplomacy situated at the nexus of economic security, ESG governance, and strategic statecraft within the global energy transition. It argues that lithium is being reconstituted from a passive geological endowment into a geopolitical instrument through which the state seeks to renegotiate its position in asymmetrical battery value chains. This repositioning is operationalised through an evolving regulatory architecture comprising export bans, strategic mineral designation, mandatory beneficiation, and targeted fiscal instruments aimed at internalising value and disciplining capital. Moving beyond binary ","doi":"10.64754/thedyke.v20i1.722","venue":"The Dyke","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP","ZW"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"脱炭素電源の拡大と経済成長、日独米の異なる歩み","url":"https://doi.org/10.5281/zenodo.23117807","authors":["Koji Nomura","Sho Inaba"],"date":"2026-10-03","abstract":"エネルギーモニター, No. 2610 2015年平均から2026年第2四半期までに、日独米のゼロエミッション電源発電量はそれぞれ2.1倍、1.1倍、1.6倍となった一方、実質GDPの増加は6%、10%、29%であった。第7次エネルギー基本計画は脱炭素電源の確保を経済成長の鍵と位置づけるが、両者を結びつける条件と政策の在り方が問われる。","doi":"10.5281/zenodo.23117807","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"PMDA regulatory update on approval and revision of the precautions for use of anticancer drugs in Japan; tovorafenib and dordaviprone for glioma, mirvetuximab soravtansine and pembrolizumab for ovarian cancer, tislelizumab for nasopharyngeal cancer, trastuzumab deruxtecan, palbociclib and datopotamab deruxtecan for breast cancer, epcoritamab for lymphoma, teclistamab for multiple myeloma","url":"https://doi.org/10.1007/s10147-026-03211-y","authors":["Noriomi Matsumura"],"date":"2026-10-03","abstract":"","doi":"10.1007/s10147-026-03211-y","venue":"International Journal of Clinical Oncology","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Overnight investor sentiment, trading behaviors, and pre-opening price efficiency","url":"https://doi.org/10.1016/j.jbef.2026.101267","authors":["Zhaoyuan Gu","Xijuan Xiao","Ryuichi Yamamoto"],"date":"2026-10-03","abstract":"","doi":"10.1016/j.jbef.2026.101267","venue":"Journal of Behavioral and Experimental Finance","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["CN","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"GX Technological Trajectories in Japan - processed data","url":"https://doi.org/10.5281/zenodo.23113664","authors":["Natsuki Kamakura","Sebastián Baeza-González"],"date":"2026-10-03","abstract":"This dataset contains different tables related to the analysis of GX technological trajectories in Japan.","doi":"10.5281/zenodo.23113664","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["CL","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Monopsony power and the transferability of intangible capital","url":"https://doi.org/10.1080/00036846.2026.2740782","authors":["Kimiko Terai"],"date":"2026-10-03","abstract":"This paper develops a rent-sharing model of wage bargaining between firms and workers to provide a micro foundation for the relationship between labour market power and intangible investment. A central feature of the analysis is the transferability of intangible capital. The firm’s outside option is determined by the forgone return on sunk intangible capital, while workers’ outside option is given by the outside wage, which is augmented by intangible capital embodied in them. Greater transferability increases the extent of sunk capital, thereby lowering the firm’s outside option, while raising that of workers. When firms cannot commit to wage contracts, they anticipate the effects of intangi","doi":"10.1080/00036846.2026.2740782","venue":"Applied Economics","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Replication Data for: A Promise That Pays Anticipatory Effects of an Announced Tuition Waiver in an Advanced Democracy","url":"https://doi.org/10.7910/dvn/i3jydy","authors":["Hanako Ohmura"],"date":"2026-10-03","abstract":"This R Markdown file contains the replication code for “A Promise That Pays: Anticipatory Effects of an Announced Tuition Waiver in an Advanced Democracy.” The underlying survey data are available from the author upon reasonable request.","doi":"10.7910/dvn/i3jydy","venue":"Harvard Dataverse","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The \"Pipe Fallacy\" in Contemporary Japanese Economic Policy: A Comparative Economic-Historical and Institutional Analysis","url":"https://osf.io/n64pc","authors":["By STUDENT"],"date":"2026-10-03","abstract":"This study investigates the persistent stagnation of the Japanese economy during the post‑1990 “lost decades” through a comparative economic-historical and institutional analysis. Rather than attributing Japan’s weak macroeconomic performance to insufficient monetary or fiscal stimulus, the paper argues that the decisive factor lies in the structural condition of the distributional infrastructure—the channels (“pipes”) through which policy inputs are transmitted to households, firms, and local economies. By comparing the fiscal-monetary regime of Takahashi Korekiyo in the early 1930s with contemporary Japanese policy interventions, the paper demonstrates that Takahashi’s success derived not ","doi":"10.5281/zenodo.23117200","venue":"OSF Preprints (OSF Preprints)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Égypte - Nouvelle Fondation - Wadi El Gemal - Tracé Droit 24.27 - Pierre Angulaire du Développement de l'Afrique - Largeur 6km","url":"https://doi.org/10.5281/zenodo.23124685","authors":["Ali Ragab ali Khallaf"],"date":"2026-10-03","abstract":"> *بسم الله الرحمن الرحيم - دعوة سلام لدول حوض النيل* > نحن ندعو لنقل تجارة دول حوض النيل نهرياً عبر نهر النيل - أرخص 60% من القطار و 90% من الشاحنات - وآمن من القرصنة. > ودور مصر: هي البوابة التي تنقل هذه التجارة من النيل إلى البحر الأحمر عبر حجر الزاوية قنا-سفاجا 102 كم (ميناء نهري + قطار + منطقة صناعية). > وهذا يفتح خطاً خاصاً لكم للشرق كله - ليس فقط للبحر المتوسط وأوروبا - بل للعالم الشرقي. > مع التعاون مع السعودية (سفاجا-جدة 300 كم بحر قصير + قطار جدة-الأطلنطي 1242 كم) ومع الإمارات وقطر وعمان إلى المحيط الهندي بعيداً عن مضايق باب المندب وهرمز وقناة السويس. > هذا المشروع من موريتانيا على الأطلنطي إلى المحيط الهندي (13951 كم - خط عرض 24.27) - جزء من مشروع عالمي وثقافة عالمية تدعو للتعاون ","doi":"10.5281/zenodo.23124685","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"米国ISOにおける市場約定システム改良の歴史","url":"http://www.rieti.go.jp/jp/publications/summary/26100002.html","authors":["金本 良嗣（政策研究大学院大学）"],"date":"2026-10-02","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ポリシー・ディスカッション・ペーパー（日本語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"Bells and Whistles of Nowcasting Models: Which Matter and When?","url":"https://d.repec.org/n?u=RePEc:fip:fedgfe:103878&r=&r=ets","authors":["Freddy García-Albán","Manuel González-Astudillo"],"date":"2026-10-02","abstract":"This paper investigates which features of a Bayesian dynamic factor model improve U.S. GDP nowcasts and whether their contribution varies across historical episodes. Using pseudo-real-time information sets for 25 series, we estimate 16 combinations of dynamic heterogeneity, stochastic volatility, time-varying long-run growth, and a multiplicative outlier adjustment. We evaluate their marginal contributions to point, density, and quantile score forecasts using balanced paired factorial contrasts. Dynamic heterogeneity improves point, density, and tail forecasts, and it is the only feature that helps consistently across all three criteria. Stochastic volatility improves density and tail foreca","doi":"","venue":"NEP 計量時系列 (nep-ets)","sources":["NEP 計量時系列 (nep-ets)"],"groups":["ecm"],"countries":[],"tags":["Bayesian dynamic factor models; forecast evaluation; stochastic volatility; longrun growth; outliers"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"The Rise of Viet Nam’s Solar Panel Industry : Inputs, FDI, and Spillovers","url":"https://d.repec.org/n?u=RePEc:wbk:wbrwps:11478&r=&r=sea","authors":["Ngov, Meng Yu","Vézina, Pierre-Louis","Tran, Trang Thu","Nayyar, Gaurav"],"date":"2026-10-02","abstract":"This paper documents how foreign firms, inputs, and subsidies have shaped the development of Viet Nam’s solar panel industry. The analysis uses firmto-firm transaction data from Panjiva as well as firm-level data from the Viet Nam’s Enterprise Survey to trace solar panel value chains. It uncovers three key findings. First, parts and components from subsidizing countries are 30 percent cheaper than alternatives. Those from China, which provides the majority of solar inputs to Vietnamese producers, are cheapest. Foreign green subsidies may thus spill over across countries via value chains. Second, Chinese FDI firms dominate Viet Nam’s solar industry, accounting for 75% of exports and 50 percen","doi":"","venue":"NEP 東南・東アジア (nep-sea)","sources":["NEP 東南・東アジア (nep-sea)"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Partial Identification under Imperfect Measurement: A Distributionally Robust Approach","url":"https://arxiv.org/abs/2610.04146","authors":["Isaac Meza"],"date":"2026-10-02","abstract":"Imperfect measurements allow different underlying distributions to generate the same observations. Restrictions linking unobserved components can make it difficult to characterize all compatible distributions and compute the resulting range of parameter values. We ask how to construct computable parameter bounds and tighten them without additional data or stronger assumptions. We develop a general framework for partial identification under imperfect measurement based on distributionally robust optimization. We use measurement restrictions to construct a neighborhood around a benchmark distribution, ensuring that every compatible distribution lies within it. Optimizing over this neighborhood ","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"A Path-Dependent Agent-Based Microsimulation of Crime and Violence Reduction Policy Portfolios in Bolivia: Survey Calibration, Adaptive Emulator Ensembles, Global Sensitivity, Tempered MCMC, and Multi-Objective Policy Analysis","url":"https://arxiv.org/abs/2610.03895","authors":["Ricardo Alonzo Fernández-Salguero"],"date":"2026-10-02","abstract":"This study develops a survey-calibrated, path-dependent agent-based microsimulation for evaluating crime and violence reduction policies in Bolivia. A synthetic population is constructed from the 2025 Household Survey and the fourth-quarter 2025 Continuous Employment Survey using official expansion weights and cross-survey donor matching. The model combines heterogeneous agents, place-based risk, criminal adaptation, institutional capacity, community organization, and multiple policy channels. Uncertainty is propagated through adaptive Gaussian-process and tree-ensemble emulators, global sensitivity analysis, tempered ensemble MCMC, and predictive meta-calibration. Simulated portfolios inclu","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.AP"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Cross-Fitting Under Nonregularity: Normality and Inference via Locality","url":"https://arxiv.org/abs/2610.02944","authors":["Bruno Fava"],"date":"2026-10-02","abstract":"Cross-fitting is routine in much of applied research. While conventional confidence intervals that ignore cross-fold dependence are asymptotically valid in several settings, they undercover in many applications that share a common form of nonregularity: from the classic cross-validation problem of testing whether a fitted model outperforms another, to testing for heterogeneous treatment effects with machine learning, to estimating the value of a potentially non-unique optimal treatment regime. Exploiting a new locality condition, I show that a large class of cross-fitting estimators still satisfies a central limit theorem despite the nonregularity, but with an asymptotic variance that must b","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","math.ST","stat.ML"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Evaluating Threshold Policies in Randomized Threshold Designs: A Cautionary Tale for Regression Discontinuity Designs","url":"https://arxiv.org/abs/2610.02938","authors":["Shunsuke Imai","Koshi Nishida","Yuta Okamoto"],"date":"2026-10-02","abstract":"Many policies assign treatment according to whether a score crosses a cutoff. Regression discontinuity (RD) designs identify the effect of treatment assignment, but the threshold policy itself may also reshape individuals' incentives, inducing behavioral responses that affect outcomes even holding treatment status fixed---a channel that conventional RD designs cannot capture. We develop a framework that exploits randomized variation in policy thresholds, together with rank-invariance-type restrictions, to identify the treatment-assignment and incentive-response effects. We illustrate the empirical relevance of this distinction using data from a merit-based scholarship experiment in Malawi. I","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Benefit-principle accounting of CO₂ emissions in the global textile and clothing value chain","url":"https://doi.org/10.1016/j.ecolecon.2026.109265","authors":["Lila Ballav Bhusal"],"date":"2026-10-02","abstract":"Existing emission accounting frameworks assign CO₂ responsibility to producers or final consumers but do not identify factor-provider beneficiaries within bilateral trade flows. This study extends benefit-principle emissions (BPE) accounting by introducing a trade-pattern decomposition for the global textile and clothing (T&C) value chain. Using the multi-regional input-output table, the framework distinguishes producers, factor providers, final producers, and consumers, and separates final-goods, intermediate, and global value chain (GVC) trade. Consumer economies retain the largest single shares of their own T&C BPE. Developed-economy providers generally receive BPE above the consumption-b","doi":"10.1016/j.ecolecon.2026.109265","venue":"Ecological Economics","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Forward time-series causal inference based on forest weights and conditional dependence","url":"https://doi.org/10.64898/2026.10.02.756132","authors":["Shigeki Kishi"],"date":"2026-10-02","abstract":"Abstract Unveiling directional causality in complex, high-dimensional dynamical systems remains a fundamental challenge. Conventional nonparametric approaches, such as Convergent Cross Mapping, require computationally intensive surrogate tests and frequently yield false-positive detections under strong coupling due to generalized synchronization. Here, we present F-CODEC (Forest-weighted Conditional Dependence Coefficient), a forward-looking causal discovery framework integrating generalized random forests with adaptive rank conditioning. Nonparametrically conditioning on the target variable’s intrinsic delay coordinates systematically neutralizes shared manifold representations, suppressing","doi":"10.64898/2026.10.02.756132","venue":"bioRxiv (Cold Spring Harbor Laboratory)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Consumer preferences for domestically produced ingredients in Japan’s ready-to-eat meals and dining out: a best–worst scaling analysis","url":"https://doi.org/10.1017/age.2026.10041","authors":["Guanjun Li","Kohei Yagi","Ting Chen","Pappalardo Gioacchino"],"date":"2026-10-02","abstract":"Abstract As ready-to-eat (RTE) meals and dining out become increasingly popular, limited empirical evidence exists on how domestically produced ingredients are positioned relative to other food values in these contexts. Using online survey data from Japanese consumers collected in 2024, this study applies best–worst scaling to samples of 786 respondents for RTE meals and 771 for dining out to estimate the relative importance of 11 food values. Aggregated scores summarize overall rankings, and latent class analysis characterizes heterogeneity in stated priorities. Across both contexts, taste, price, and safety consistently rank highest, while domestically produced ingredients rank fifth, indi","doi":"10.1017/age.2026.10041","venue":"Agricultural and Resource Economics Review","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["IT","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Assessment of the appropriateness of the selection for radiotherapy intensity from a quality of life (EORTC QLQ-C30) perspective in older patients with cancer","url":"https://doi.org/10.1038/s41598-026-71278-8","authors":["Keiko Nemoto Murofushi","Shigehiko Kuribayashi","Kayoko Ohnishi","S. Hayakawa","Kazuhito Tsuchida","Yuko Inoue","Ayako Ohkawa","Toshiki Ishida","Yumiko Machitori","Motohiro Murakami","Daichi Takizawa","Makoto Saito"],"date":"2026-10-02","abstract":"We previously evaluated the predictive factors for reduced radiotherapy intensity based on radiation oncologist experience. In this study, we evaluated the appropriateness of the treatment intensity selection based on radiation and medical oncologists’ experience from a patient-reported outcome (PRO) perspective. We prospectively enrolled patients with non-metastatic cancer (≥ 70 years) between November 2020 and February 2022. Reduced treatment intensity implied changes to the irradiation field, radiotherapy schedule, and/or concurrent chemotherapy from the standard based on primary tumor guidelines. PRO was assessed using the European Organization for Research and Treatment of Cancer Core Q","doi":"10.1038/s41598-026-71278-8","venue":"Scientific Reports","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Neighborhood Spillovers from Residential Energy Retrofit Programs","url":"https://doi.org/10.3368/le.103.2.070926-0101r","authors":["Kareman Yassin"],"date":"2026-10-02","abstract":"Abstract We estimate neighborhood spillovers in energy consumption using data from Canada’s largest residential energy retrofit program. Identification exploits variation in retrofit timing by comparing neighbors of retrofitted homes with neighbors of “Almost retrofitted” homes that completed a pre-retrofit audit but did not undertake upgrades. We find that neighboring homes reduce natural gas consumption by 1.2% in the short run and 1.4% in the long run, while electricity consumption falls by 1% in the long run. Spillovers persist for more than a decade and are more than five times larger for highly visible retrofits, suggesting conventional evaluations substantially understate program bene","doi":"10.3368/le.103.2.070926-0101r","venue":"Land Economics","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"総合エネルギー価格、再び2022–23年の高値に迫る","url":"https://doi.org/10.5281/zenodo.23096741","authors":["Koji Nomura","Sho Inaba"],"date":"2026-10-02","abstract":"エネルギーモニター, No. 2609 主要9か国の総合FEC価格は2026年第2四半期に再上昇し、韓国・インド・フランスでは2022–23年の四半期最高値を上回った。7月には米韓印で第2四半期平均を下回ったが、韓印は当時の最高値をなお上回り、中国では2025年平均からの上昇幅が比較的小さい。","doi":"10.5281/zenodo.23096741","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"Auxiliary benefits and the fiscal sustainability of social security in an aging economy","url":"https://doi.org/10.1016/j.jeoa.2026.100666","authors":["Tomoaki Kotera"],"date":"2026-10-02","abstract":"","doi":"10.1016/j.jeoa.2026.100666","venue":"The Journal of the Economics of Ageing","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Structural crossover of complex networks: bridging degree correlation and fractality","url":"https://arxiv.org/abs/2610.02883","authors":["Shogo Mizutaka","J Yamamoto","Kousuke Yakubo"],"date":"2026-10-02","abstract":"We investigate the relationship between long-range degree correlations and fractality in scale-free random networks. By analyzing degree correlations in scale-free random networks at the percolation threshold, at which a giant component emerges, we derive the ball volume $\\tildeν_k(l)$, defined as the average number of nodes within distance $l$ from a root node with degree $k$. The resulting expression predicts a degree-dependent structural crossover. For $l\\ll k^{1/(\\df-1)}$, the ball volume grows as $\\tildeν_k(l)\\sim kl$, whereas for $l\\gg k^{1/(\\df-1)}$, it crosses over to the global fractal scaling $\\tildeν_k(l)\\sim l^{\\df}$. Here, $\\df$ is the fractal dimension of critical scale-free ra","doi":"10.48550/arxiv.2610.02883","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["AT","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"R Codes for Macroeconomic Impacts of Highly Pathogenic Avian Influenza Outbreaks to the Philippine Economy and Livestock SAM","url":"https://doi.org/10.17632/44ftj486t7","authors":["Lary Nel Abao"],"date":"2026-10-02","abstract":"Thanks to Dr. Deborah Kim Sy of the National Graduate Institute for Policy Studies (GRIPS), Tokyo, Japan in constructing the livestock-based SAM from PSA’s 2018 Input-Output table. This dataset applies an 18×18 Social Accounting Matrix (SAM) multiplier model, implemented entirely in R, to evaluate the short-run economy-wide consequences of a contraction in Philippine poultry output associated with HPAI outbreaks. The analysis simulates a 6 percent reduction in poultry production, based on the observed decline in national poultry output during 2019-2020. The initial 6 percent contraction (−PHP 22.31 billion) in chicken production generated a total modeled reduction of 10.75 percent in CHIX ou","doi":"10.17632/44ftj486t7","venue":"Mendeley Data","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"AI Data Centers and the 2027 Global Economic Outlook","url":"https://doi.org/10.5281/zenodo.23107279","authors":["Santiago Sainz"],"date":"2026-10-02","abstract":"This report compiles and compares 2027 economic projections published by the International Monetary Fund, the OECD, the World Bank, and the central banks of the United States, the eurozone, the United Kingdom, and Japan, and sets that macro outlook alongside a second, equally weighted line of inquiry: the physical and regulatory economics of the artificial intelligence infrastructure now reshaping how, and where, economic growth itself is generated. On the macro side, the report's central finding is that institutional forecasts for 2027 diverge genuinely rather than converging on a technical consensus. The IMF's 3.4% world growth projection and the OECD's 3.0% trace back to different explici","doi":"10.5281/zenodo.23107279","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Replication data and code for: \"Corridor, Not Factory: Trade Reorientation and the Missing Investment Response in Kazakhstan, 2022–2025\"","url":"https://doi.org/10.17632/zk2csn8wf6","authors":["Zhanbolat Kakishev"],"date":"2026-10-02","abstract":"A large, sector-specific rise in demand for a tradeable good is expected to induce domestic investment. After February 2022, with Russia's direct trade with its main partners disrupted, part of it was reallocated through neighbouring economies, Kazakhstan among them. Using product-level trade data (HS6, 2018–2025; UN Comtrade), this dataset and code measure the demand shock, calibrate what Kazakhstan retains (a wholesale-and-freight margin of 6–14% propagated through the OECD Inter-Country Input–Output table implies 5–11 cents of domestic value added per rerouted dollar, against about three-quarters for a produced dollar), and test for an investment response using three commercial deal datab","doi":"10.17632/zk2csn8wf6","venue":"Mendeley Data","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"On the Monetary Endogenous Growth Model with Idiosyncratic Investment Risk","url":"http://www.rieti.go.jp/jp/publications/summary/26100001.html","authors":["平口 良司（明治大学）"],"date":"2026-10-01","abstract":"","doi":"","venue":"RIETI ディスカッション・ペーパー","sources":["RIETI ディスカッション・ペーパー"],"groups":["jp"],"countries":[],"tags":["ディスカッション・ペーパー（英語）"],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Forecasting Using Supervised Factors and Idiosyncratic Elements","url":"https://d.repec.org/n?u=RePEc:ucr:wpaper:202607&r=&r=ets","authors":["Tae-Hwy Lee","Daanish Padha"],"date":"2026-10-01","abstract":"We extend the Three-Pass Regression Filter (3PRF) in two dimensions. First, we allow the factors driving the predictor panel to be weak. Second, we allow the idiosyncratic components of the predictors to contain additional predictive information for the forecasting target. We establish conditions under which 3PRF consistently recovers the target-relevant factor space under weak factor structures and characterize how its convergence rate depends on the relative strength of relevant and irrelevant factors. Stronger relevant factors improve the rate at which 3PRF approaches the infeasible factor forecast, whereas stronger irrelevant factors have the opposite effect. We use these results to comp","doi":"","venue":"NEP 計量時系列 (nep-ets)","sources":["NEP 計量時系列 (nep-ets)"],"groups":["ecm"],"countries":[],"tags":["Weak Factors; Forecasting; High-dimensional data; Supervision; Three pass regression filter; LASSO"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Bayesian Machine Learning Methods For Large Scale Demand Estimation","url":"https://d.repec.org/n?u=RePEc:arx:papers:2610.08409&r=&r=ets","authors":["Anna B. Schmidt"],"date":"2026-10-01","abstract":"This work studies how Bayesian machine learning methods can be used for large-scale demand estimation with many product categories. I compare two model classes, a latent factorization model and a mixed logit model and two Bayesian estimation approaches, Markov Chain Monte Carlo (MCMC) and Variational Inference (VI). The analysis combines a simulation study with an application to supermarket scanner data. The results show that the latent factorization model benefits from information across categories and improves its predictive performance as the dimensionality of the choice environment increases, whereas the mixed logit model does not exhibit the same pattern. MCMC delivers the highest predi","doi":"","venue":"NEP 計量時系列 (nep-ets)","sources":["NEP 計量時系列 (nep-ets)","arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Capital centralization, protectionism and increasing military expenditures: A SVAR/BVAR analysis","url":"https://d.repec.org/n?u=RePEc:hpo:wpaper:1_2026&r=&r=ets","authors":["Giulia Chiara","Stefano Lucarelli"],"date":"2026-10-01","abstract":"This paper formalizes and empirically tests the causal transmission mechanism linking international capital centralization, macro-financial imbalances, protectionism, and systemic military escalation. We challenge the orthodox view of globalization as a self-stabilizing framework for peace, conceptualizing contemporary geoeconomic fragmentation through a theoretical framework stemming from the debate on global imbalances and the analytical revival of the Marxian tendential law of capital centralization. Integrating Structural Vector Autoregression (SVAR) and Bayesian Vector Autoregression (BVAR) models on historical time-series data (1998–2024), we estimate the dynamic interactions between n","doi":"","venue":"NEP 計量時系列 (nep-ets)","sources":["NEP 計量時系列 (nep-ets)"],"groups":["ecm"],"countries":[],"tags":["Capital centralization; Protectionism; Military expenditure; SVAR and BVAR models"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Firm Inflation Expectations and the Macroeconomy: Evidence from Thailand","url":"https://d.repec.org/n?u=RePEc:pui:dpaper:265&r=&r=sea","authors":["Pym Manopimoke","Nuwat Nookhwun","Tanaporn Sriklay","Tanisa Tawichsri"],"date":"2026-10-01","abstract":"In an open emerging market economy, firm inflation expectations are not simply noisy survey responses; instead, they are a state-dependent transmission channel through which global shocks affect firm behavior. Using monthly firm-level survey data from Thailand between 2012 and 2023, we show that short-term expected inflationâ€”though biased and highly dispersedâ€” responds systematically to macroeconomic conditions, particularly global inflation and oil prices. This response is state dependent, with firms exhibiting more attention during periods of higher inflation and stronger economic growth. Moreover, salient global shocks such as negative oil supply news shocks can lead to persistent and","doi":"","venue":"NEP 東南・東アジア (nep-sea)","sources":["NEP 東南・東アジア (nep-sea)","NEP 金融政策 (nep-mon)"],"groups":["global","japan"],"countries":[],"tags":["Firm inflation expectations; Emerging markets; Oil shocks; Minimum wage; Price-setting; Investment; Employment; State-dependence"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"ECB monetary policy transmission to unilaterally euroised economies","url":"https://d.repec.org/n?u=RePEc:ecb:ecbwps:20263293&r=&r=mon","authors":["Krustev, Georgi"],"date":"2026-10-01","abstract":"Leveraging the unique setting of unilateral euroisation, this paper examines the spillover effects of euro area monetary policy on Montenegro and Kosovo. Through the lens of a structural VAR model with block exogeneity, it shows that euro area monetary policy shocks can significantly influence output and inflation in these economies, albeit with a delayed response, while contributing only modestly to their overall business cycle fluctuations. JEL Classification: C11, C32, E52","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["block exogeneity, monetary transmission, structural VAR"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Monetary policy surprises with imperfect information","url":"https://d.repec.org/n?u=RePEc:ecb:ecbwps:20263292&r=&r=mon","authors":["Jarociński, Marek","Karadi, Peter"],"date":"2026-10-01","abstract":"High-frequency interest rate surprises around Fed announcements do not identify monetary policy (MP) shocks if markets are imperfectly informed. Instead, they can also reflect central bank information (CBI) shocks, when the Fed assesses the economy differently, and Fed-response-to-news (FRN) shocks, when markets misperceive the policy rule. The literature treats these as competing explanations; we show they are distinct, and jointly identify all three from the co-movement of interest rate and equity surprises, their predictability from public news, and heteroskedasticity between FOMC and non-FOMC communication. CBI effects are robust at daily and monthly frequencies; FRN matters only daily. ","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["Fed chair speeches, high-frequency identification, local projection, monetary policy shock, structural vector autoregression"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Understanding inflation: insights from the term structure of inflation risks","url":"https://d.repec.org/n?u=RePEc:ecb:ecbwps:20263294&r=&r=mon","authors":["García, Juan Angel","Gimeno, Ricardo","Hinds, Piers","Su, Haozhe","Tretyakov, Michael V."],"date":"2026-10-01","abstract":"This paper investigates the information content of the term structure of inflation risks and its usefulness for understanding inflation dynamics. Using prices of traded zero-coupon inflation caps and floors, we develop a robust non-parametric methodology, combined with a Student’s t-copula, to estimate spot and forward risk-neutral densities at short-, medium-, and long-term horizons, i.e., long-horizon risks are identified from liquid instruments alone, at daily frequency, without forward-starting contracts. Focusing on the euro area over 2009-2026, we show that the term structure of inflation risks provides valuable information about the persistence of inflation shocks and the degree to wh","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["financial conditions, inflation compensation, inflation risks, option prices, risk-neutral densities"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"The Stories People Tell: Householdsâ€™ Inflation Narratives and the Media","url":"https://d.repec.org/n?u=RePEc:gwc:wpaper:2026-014&r=&r=mon","authors":["Samuel Drößler","Ulrich Fritsche","Junbo Huang","Max Weinig"],"date":"2026-10-01","abstract":"This paper investigates how households conceptualize inflation and how these qualitative narratives correlate with inflation expectations and policy preferences. Using a representative survey of over 4, 000 German households, we elicit open-ended narratives regarding the 2022â€“2023 inflation surge and represent them as directed acyclic graphs (DAGs) via fine-tuned large language models. We find that German households overwhelmingly interpret the inflation episode through supply-side channels and the war in Ukraine, while demand-side explanations remain comparatively rare. Beyond these aggregate patterns, inflation narratives systematically vary by financial literacy, personal economic exper","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["."],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Prima: The Bank of Canada’s New Projection and Policy-Analysis Model—An Overview","url":"https://d.repec.org/n?u=RePEc:bca:bocsap:26-47&r=&r=mon","authors":["Donald Coletti","Martin Kuncl","Martin Harding","Dmitry Matveev","Tolga Özden","Yang Zhang"],"date":"2026-10-01","abstract":"Prima is the Bank of Canada’s new model for projection and policy analysis. It builds on the economic foundations of earlier Bank models, adding detail on how sectoral pressures affect production costs and their pass-through to consumer prices.","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["Models and tools; Econometric, statistical and computational methods; Monetary policy; Inflation dynamics and pressures; Real economy and forecasting"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Economists, Economic Knowledge, and Central Banks","url":"https://d.repec.org/n?u=RePEc:hal:journl:hal-05083645&r=&r=mon","authors":["Aurélien Goutsmedt","Francesco Sergi","Juan Acosta"],"date":"2026-10-01","abstract":"What do economists do in central banks? Why do central banks hire economists? This book investigates the evolving role of economists and economic knowledge within central banks, arguing that their current centrality is neither self-evident nor historically inevitable. While the presence and influence of economists in central banks today may seem natural, this book shows that it is the result of a complex, gradual, and uneven historical process shaped by institutional structures, disciplinary transformations, and shifting relationships between science and policy. Drawing on a rich but dispersed body of literature, the book traces how economists progressively gained authority through the estab","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Do Markets Dream of Artificial Intelligence? Macroeconomic Effects and International Spillovers of AI News Shocks","url":"https://d.repec.org/n?u=RePEc:dnb:dnbwpp:871&r=&r=mon","authors":["Maria Sole Pagliari"],"date":"2026-10-01","abstract":"This paper identifies AI news shocks from financial markets and traces their macroe-conomic effects in the United States and the euro area. We combine a daily equity factor based on differences in firmsâ€™ AI exposures with sign, magnitude, and narrative restrictions in a Bayesian VAR to isolate revisions in AIâ€™s expected economic value. Monthly local projections reveal an investment-led adjustment in the US: capital-goods orders rise early and persistently, while aggregate activity responds more gradually and with greater uncertainty. Producer prices increase before consumer prices, and the expansion spreads from sectors closely connected to the AI production network to the broader econom","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["AI news shocks; macroeconomic dynamics; international spillovers; pro-duction networks"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Sector-based producer price indexes: New measures of producer price pressures in Canada","url":"https://d.repec.org/n?u=RePEc:bca:bocsap:26-46&r=&r=mon","authors":["Yena Joo","Ali Rouhghalandari","Vivian Chu","Xin Ha"],"date":"2026-10-01","abstract":"Producer price indexes measure changes in the prices that producers receive for their outputs or that they pay for their inputs. Statistics Canada publishes a range of producer price indexes for specific products and industries. For the first time, these series have been combined into a small set of broad sectoral measures.","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["Models and tools; Econometric, statistical and computational methods; Economic models; Monetary policy; Inflation dynamics and pressures; Real economy and forecasting"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"How Do Import Tariffs Affect Aggregate Prices? Theory and Evidence from Canada","url":"https://d.repec.org/n?u=RePEc:bca:bocawp:26-36&r=&r=mon","authors":["Christian Bustamante","Xing Guo","Lu Han","Soyoung Lee","Gaelan MacKenzie","Mariel Yacolca Maguiña","Jacob Short"],"date":"2026-10-01","abstract":"By how much do import tariffs raise aggregate prices? We develop a simple decomposition that separates the aggregate price effect of a tariff into three channels—cost pass-through, markup adjustments, and consumer substitution across varieties—and calibrate an oligopolistic competition model with endogenous markups to firm-level market shares for Canadian domestic producers, U.S. exporters, and rest-of-world suppliers. A 25% counter-tariff on U.S. imports raises Canada's aggregate price index by 0.66—well below the 1.25% that direct cost pass-through alone would predict. The dominant offsetting force is consumer substitution toward non-U.S. varieties, which reduces the price effect by 0.47 p","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["Monetary policy; Inflation dynamics and pressures; Structural challenges; International trade, finance and competitiveness"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"A Quantitative Model of Banking Industry Dynamics","url":"https://d.repec.org/n?u=RePEc:fip:fedpwp:103867&r=&r=mon","authors":["Dean Corbae","Pablo D'Erasmo"],"date":"2026-10-01","abstract":"We develop a simple model of banking industry dynamics to study the relation between market structure and financial stability. Motivated by data, we analyze an environment where a small number of dominant (nonatomistic) banks strategically interact with a large number of small (atomistic) banks. A nontrivial endogenous bank size distribution arises out of entry and exit in response to aggregate and regional shocks to borrowers’ production technologies and banks’ idiosyncratic deposit inflows. Since the model has nonatomistic banks that generate granular spillovers from idiosyncratic shocks and pose systemic risk, we use the model to study the implications of too-big-to-fail policies.","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["Macroprudential policy; bank size distribution; industry dynamics with imperfect competition"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Expected Utility Regret Rule: Minimax and Bayes Optimal Portfolio Choice","url":"https://arxiv.org/abs/2610.02290","authors":["Masahiro Kato"],"date":"2026-10-01","abstract":"This study considers the problem of portfolio choice, where we recommend a portfolio to an investor to maximize the expected utility of their wealth. Our goal is to construct an asymptotically optimal portfolio choice rule in terms of expected utility regret, the difference between the expected utility of an oracle investor and that achieved by a portfolio chosen from data. We propose the Expected Utility Regret (EUR) rule, which jointly selects a portfolio class and estimates its weights. In a regular parametric return model, a single EUR rule attains both the minimax and the Bayes lower bounds, including their leading constants, without using the prior distribution that defines the Bayes c","doi":"10.48550/arxiv.2610.02290","venue":"arXiv econ.EM","sources":["OpenAlex:日本の研究機関の著者を含む論文","arXiv econ.EM(計量経済学)"],"groups":["ecm","japan"],"countries":["JP"],"tags":["cs.LG","econ.EM","math.ST","q-fin.MF","stat.ML"],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Pragmatic DML with AI-Learned Representations","url":"https://arxiv.org/abs/2610.01935","authors":["Andres Aradillas Fernandez","Victor Chernozhukov","Carlos Cinelli","Sven Klaassen","Whitney Newey","Martin Spindler","Jan Teichert-Kluge","Suhas Vijaykumar"],"date":"2026-10-01","abstract":"Text, images, and other rich covariates are increasingly compressed into AI-learned representations and then used as controls in causal analysis. We study when this approach is valid and develop a practical framework for causal inference with learned representations. For a broad class of estimands, an imperfect representation distorts the target causal parameter by the product of two representation errors: one in the outcome regression and one in the balancing weight (or Riesz representer). This yields three constructive results. First, cross-fitted double machine learning (DML) provides valid Wald inference for the representation-dependent target. When representation errors are small, the s","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.ML"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Identifying Panel Conditioning with Refreshment Samples: Sharp Bounds and Design Assumptions","url":"https://arxiv.org/abs/2610.01654","authors":["Shoki Okubo"],"date":"2026-10-01","abstract":"Refreshment samples are the standard remedy for panel attrition, and the identification results behind them maintain that participation does not change measurement. We characterize what a refreshment sample identifies about panel conditioning, modelled as a deterministic monotone map at reinterview, when attrition is unrestricted. A candidate map is consistent with the data if and only if the retention-scaled distribution of the stayers' implied latent outcomes is setwise dominated by the refreshment distribution; every such map is rationalized by an explicit attrition process. Without attrition the map is identified on the latent-outcome support; with attrition, a density-ratio condition go","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.AP","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"A distributional modelling approach with application to electricity price forecasting","url":"https://arxiv.org/abs/2610.01465","authors":["Aitor Ciarreta","Peru Muniain","Ainhoa Zarraga"],"date":"2026-10-01","abstract":"The increasing volatility of electricity prices driven by renewable energy integration, market shocks, and regulatory changes has reinforced the need for forecasting methods that go beyond point predictions and accurately describe the full conditional price distribution. This paper applies the Generalised Additive Models for Location, Scale and Shape (GAMLSS) framework to forecast Spanish day-ahead electricity prices using hourly data from 2020 to 2024. Alternative specifications based on Normal, Johnson's SU (JSU), and Sinh-Arcsinh (SHASH) distributions are considered, allowing the location, scale, and shape parameters to vary with market fundamentals, including electricity demand, renewabl","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Inference after data-driven control-unit selection in difference-in-differences with estimated covariance","url":"https://arxiv.org/abs/2610.01464","authors":["Ryoya Nakano","Takahiro Hoshino"],"date":"2026-10-01","abstract":"In difference-in-differences (DiD), researchers may use pre-treatment trends to select a control group for which the parallel-trends assumption appears plausible, with the aim of estimating the average treatment effect on the treated (ATT). Our earlier paper,Nakano and Hoshino (2016), and the present paper jointly provide the first selective-inference approach to the ATT that explicitly accounts for this control selection. We generalize our exact Gaussian procedure with known covariance to allow the covariance matrix to be estimated from the same individual-level data used for control selection and DiD estimation. We use this estimate to compute the variance, conditioning direction, residual","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Quantifying the Effectiveness of Multiple SAI Strategies Across Different Dimensions","url":"https://doi.org/10.1029/2026ef008696","authors":["Cindy Wang","Daniele Visioni","Walker Lee","Alistair Duffey","Christopher Robert Wentland","Lauren Wheeler","Benjamin Wagman","Samantha M Turbeville","Shingo Watanabe","Matthew Henry"],"date":"2026-10-01","abstract":"Abstract Stratospheric aerosol injection (SAI) modeling experiments are often designed to keep global mean surface air temperature (GMSAT) close to a reference target, such as early‐century SSP2‐4.5. However, meeting this target does not necessarily restore regional climates or the seasonal and spatial patterns of key variables. We evaluate multiple SAI strategies (ARISE‐SAI‐1.0/1.5, G6‐1.5K‐SAI, and G6‐1.5K‐HiLLA) across four Earth system models (CESM2‐WACCM6, UKESM1, E3SMv3, and MIROC) using a dimensionless, variability‐scaled distance‐to‐target metric applied to the monthly climatological seasonal cycle. We decompose this distance into mean offset, seasonal‐cycle amplitude, and phase/patt","doi":"10.1029/2026ef008696","venue":"Earth s Future","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["GB","JP","US"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Living in a Ghost Town: The Geography of Depopulation and Aging","url":"https://doi.org/10.3386/w35852","authors":["Elisa Giannone","Yuhei Miyauchi","Nuno Paixão","Xinle Pang","Yuta Suzuki"],"date":"2026-10-01","abstract":"How do depopulation and population aging evolve differently across regions within a country, and what are their implications for aggregate economic activity and regional inequality?Using spatially disaggregated data from Japan over the past several decades, we show that rural areas have experienced significantly faster depopulation and aging than urban areas, driven by low fertility and sustained out-migration of young cohorts.Regions undergoing these trends face declining local amenities and rising per-capita public service costs.To study the future evolution and economic consequences of these dynamics, we develop and calibrate a dynamic life-cycle spatial general equilibrium model.The mode","doi":"10.3386/w35852","venue":"National Bureau of Economic Research","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["CA","ES","JP","US"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Patient Characteristics and Clinical Indicators Influencing Oncologists’ Perceptions of Prognosis in Ovarian Cancer: A Discrete Choice Experiment","url":"https://doi.org/10.1016/j.ijgc.2026.105648","authors":["Robert Louis Coleman","Zulikhat Segunmaru","Elizabeth A. Szamreta","Kathryn L. Krupsky","Kathleen Marie Beusterien","M. Janelle Cambron‐Mellott","Michael F. Barry","Nicole Kashine","Emily Mulvihill","Daniel Simmons"],"date":"2026-10-01","abstract":"Objective To quantify how patient characteristics and treatment outcomes influence oncologists' perceptions of prognosis in ovarian cancer. Methods A cro
