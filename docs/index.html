усственного интеллекта (ИИ) ослабляет связь между человеческим трудом и стоимостью, которую создают предприятия. Существующие исследования рассматривали распределительные последствия ИИ главным образом с точки зрения спроса и предложения на рынке труда, цен факторов производства и изменения совокупной доли труда в добавленной","doi":"10.5281/zenodo.23204657","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"AI यग म मजदर क समसय: AI दवर सजत मलय कसक ह?","url":"https://doi.org/10.5281/zenodo.23206017","authors":["K. Tsuchiya"],"date":"2026-10-07","abstract":"This is the Hindi-language version of the original Japanese paper, “AI時代の賃金問題――AIが生み出した価値は誰のものか――” by Kiyoto Tsuchiya.The main text and argument are identical to the original Japanese version. A Hindi abstract and keywords have been added for international readability.Original Japanese version: https://doi.org/10.5281/zenodo.22954607 कृत्रिम बुद्धिमत्ता (AI) का तीव्र प्रसार मानव श्रम और फर्मों द्वारा सृजित मूल्य के बीच के संबंध को शिथिल कर रहा है। मौजूदा शोध ने AI के वितरणात्मक परिणामों की जाँच मुख्यतः श्रम बाज़ार में माँग और आपूर्ति, उत्पादन-कारकों की कीमतों तथा समग्र स्तर पर मूल्य वर्धन में श्रम के हिस्से में परिवर्तन के दृष्टिकोण से की है। यह शोध-पत्र एक भिन्न दृष्टिकोण अपनाता है। इसका तर","doi":"10.5281/zenodo.23206017","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Die Lohnfrage im Zeitalter der KI: Wem gehört der durch KI geschaffene Wert?","url":"https://doi.org/10.5281/zenodo.23201872","authors":["K. Tsuchiya"],"date":"2026-10-07","abstract":"This is the German-language version of the original Japanese paper, “AI時代の賃金問題――AIが生み出した価値は誰のものか――” by Kiyoto Tsuchiya.The main text and argument are identical to the original Japanese version. A German abstract and keywords have been added for international readability.Original Japanese version: https://doi.org/10.5281/zenodo.22954607 Die rasche Verbreitung Künstlicher Intelligenz (KI) lockert die Verbindung zwischen menschlicher Arbeit und dem Wert, den Unternehmen schaffen. Die bisherige Forschung hat die Verteilungswirkungen der KI vor allem unter dem Gesichtspunkt von Angebot und Nachfrage auf dem Arbeitsmarkt, der Faktorpreise und der Veränderung des gesamtwirtschaftlichen Arbeitsantei","doi":"10.5281/zenodo.23201872","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Institutional Breakdown and Moral Hazard Dynamics in Sovereign Hedge-Fund Architectures: Comparative Institutional Analysis of the \"Japan Fund\" and the Mathematics of Sovereign Liquidity Collapse","url":"https://doi.org/10.5281/zenodo.23224176","authors":["Yoko Hasebe"],"date":"2026-10-07","abstract":"和文要旨(Japanese Abstract) 2026年10月の衆議院本会議において、年金積立金管理運用独立行政法人(GPIF)、外国為替資金特別会計、および日本銀行保有ETF等の公的資本を統合・再レバレッジ化し、総額500兆円規模の運用を目指す「ジャパン・ファンド」の法制化構想が公明党・岡本三成代表らによって提起された。本稿は、この国家主導型ソブリン・ウェルス・ファンド(SWF)構想に対し、比較制度分析、公的債務トポロジー、および流動性ストレステストの数理モデルを用いて批判的検討を加えるものである。 第一に、シンガポールGIC/TemasekやノルウェーGPFG等の先行事例が有する「外生的な経常・財政黒字または資源レントの保全」という制度的前提と、巨額の累積債務および構造的財政赤字を抱える日本財政の非対称性を対比し、公的年金・外為準備をリスク資本化することに伴う制度的自己撞着(バランスシートの二重脆弱化)を証明する。第二に、過去の官民ファンド(産業革新投資機構/INCJ、JDI等)およびイタリア「スーパーボーナス110%」に見られた「利益の私有化と損失の公有化」というモラルハザードの力学が、国家規模に拡大された際のガバナンス崩壊経路を解明する。第三に、世界的なソブリン債利回り上昇局面において、為替介入余力の喪失と金利感応度(デュレーション)の跳躍がもたらす無リスク金利の非線形断絶および流動性蒸発リスクを数理的に定式化する。本分析は、国家バランスシートのヘッジファンド化がもたらすシステミック・テールリスクを警告し、公的資本の投機的動員に対する法制度的抑止の必要性を論証する。 ","doi":"10.5281/zenodo.23224176","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Utility models and health technology: patterns of use and decision criteria in Spain, Germany and Japan (2015–2026)","url":"https://doi.org/10.5281/zenodo.23224006","authors":["Arturo Argüello"],"date":"2026-10-07","abstract":"Background. Utility models (UMs) are often recommended for incremental innovation because they are faster and less costly than patents. Their suitability, however, depends on the technical contribution and the institutional context. This study compares their use in health technology in Spain, Germany and Japan and proposes decision criteria for healthcare organisations. Methods. Comparative legal analysis and descriptive study of UMs in IPC class A61 with priority dates from 2015 to 2026 in Spain (n = 2,777), Germany (n = 8,738) and Japan (n = 4,705), retrieved from The Lens. Trends, applicant origin and type, internationalisation, lapse and relative intensity by subclass were analysed. Resu","doi":"10.5281/zenodo.23224006","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["ES"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Flow‐Driven ESG Returns","url":"https://doi.org/10.1111/jofi.70083","authors":["PHILIPPE VAN DER BECK"],"date":"2026-10-07","abstract":"ABSTRACT I show that the recent returns to environmental, social, and governance (ESG) investing are strongly driven by price impact from flows toward ESG portfolios. Using data on trades, I estimate the market's ability to accommodate ESG flows, which is given by the elasticity of substitution between ESG and other stocks. I show that every dollar flowing toward a representative ESG portfolio increases the market value of ESG stocks by $0.8. The growing institutional flows into the ESG portfolio are the main driver of ESG returns and have caused an annual flow‐driven return of 1.9%. In the absence of flows, ESG stocks would not have outperformed the market from 2012 to 2023.","doi":"10.1111/jofi.70083","venue":"The Journal of Finance","sources":["Journal of Finance"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"When Do Treasuries Earn the Convenience Yield?—A Hedging Perspective","url":"https://doi.org/10.1111/jofi.70085","authors":["VIRAL V. ACHARYA","TOOMAS LAARITS"],"date":"2026-10-07","abstract":"ABSTRACT We document that the convenience yield of U.S. Treasuries exhibits properties consistent with a hedging perspective of safe assets, that is, Treasuries are valued highly if they appreciate with poor aggregate shocks. In particular, the convenience yield tends to be low when the covariance of Treasury returns with the aggregate stock market returns is high. A decomposition of the aggregate stock‐bond covariance into terms corresponding to the convenience yield, the frictionless risk‐free rate, and default risk reveals that the covariance between stock returns and the convenience yield itself drives the effect in a substantive capacity.","doi":"10.1111/jofi.70085","venue":"The Journal of Finance","sources":["Journal of Finance"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Targeted Philanthropy: Evidence from M&As","url":"https://doi.org/10.1111/jofi.70090","authors":["CARA VANSTEENKISTE"],"date":"2026-10-07","abstract":"ABSTRACT I show how firms optimize the allocation of charitable funds around investments that require external stakeholder support, such as mergers and acquisitions. Acquirers increase donations to target‐related charities before making a takeover offer, but scale funds back after withdrawing from a deal. Firms redistribute funds from nontakeover‐related areas to target insider–affiliated charities, employee communities, and counties with a regulatory presence. Targeted donations that encourage blockholder reciprocity and employee commitment are associated with better deal performance through decreased merger premiums and lower integration costs. Overall, the results highlight firms’ use of ","doi":"10.1111/jofi.70090","venue":"The Journal of Finance","sources":["Journal of Finance"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"How Fast Do Tariffs Pass Through into Consumer Prices?","url":"https://d.repec.org/n?u=RePEc:fip:fednls:103890&r=&r=mon","authors":["Mary Amiti","Sebastian Heise","David E. Weinstein"],"date":"2026-10-06","abstract":"There has been a lot of interest in how tariffs affect consumer prices (for example, Cavallo et al. 2021, 2025). In this post, we present results from our new research paper that estimates the effects of the 2025-26 tariffs on retail consumer prices. We find that for every percentage point increase in average tariffs, consumer goods prices increase by about a quarter of a percent after one year. Roughly two-thirds of the effect arises because tariffs raise the prices of imported consumer goods. The remaining third arises indirectly: tariffs increase the prices of goods made in the U.S. because producers pay more for imported parts and materials, and because producers raise their markups when","doi":"","venue":"NEP 金融政策 (nep-mon)","sources":["NEP 金融政策 (nep-mon)"],"groups":["global"],"countries":[],"tags":["tariffs; pass-through; inflation; consumer prices; import prices"],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Measuring Gift Card Program Incrementality via Causal Data Fusion","url":"https://arxiv.org/abs/2610.08558","authors":["Justin Whitehouse","William Betz","Yan Zhang","Peter Coles","Ramesh Johari","Vasilis Syrgkanis"],"date":"2026-10-06","abstract":"Businesses regularly offer gift card programs to drive customer spending and increase engagement. A central question is how much incremental revenue these programs generate, and which channels drive it most efficiently. Measuring the incremental revenue associated with a gift card program is a challenging problem in causal inference, requiring a firm to infer how much each customer would have spent if they never received a gift card. Observational data on past customer purchasing behavior reveal possession of a gift card only when a customer makes a purchase, thus leaving a customer's treatment status systematically censored. In this paper, we develop a novel data fusion approach to overcome","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Early Investment Snowballs for Low-Skill Children: Average Marginal Returns and the Dynamics of Skill Formation","url":"https://arxiv.org/abs/2610.12509","authors":["Liam Puknys"],"date":"2026-10-06","abstract":"Program evaluations routinely find larger returns to investment in low-skill children, while structural models of skill formation typically find that skill and investment are complements. I show that these findings are not in tension: they measure different objects. The Beckerian schedule of returns (BSR) is the elasticity of output with respect to an input, holding all inputs at fixed values; average marginal returns (AMR) average that elasticity over the joint distribution of inputs. Revisiting Cunha, Heckman, and Schennach (2010)'s model of child skill formation on the Children of the NLSY79, I find that skill and investment are complements, but that low-skill children receive so much les","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"The Noise Is the Signal: Correlated Sampling Error Is Rank-Informative for Proxy Metric Selection","url":"https://arxiv.org/abs/2610.08194","authors":["Sandro Provenzano"],"date":"2026-10-06","abstract":"North-star metrics such as customer lifetime value are often too slow and noisy to decide a short A/B test. Teams therefore rely on a proxy metric, commonly chosen by how closely its effects tracked the north star's across past experiments. Validating that choice, or any method for making it, is hard: the only benchmark is the noisy north star, and the number of available past experiments is limited. In addition, proxy and north-star effects are estimated on the same customers, so their sampling errors are correlated. Recent work at major experimentation platforms removes this shared error as contamination, improving estimates of the true-effect covariance. Choosing a proxy, however, is a ra","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","econ.GN","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Vine Copula VAR:From Recursive Margins to Joint Forecast Inference","url":"https://arxiv.org/abs/2610.07589","authors":["Hunter Ng","Yubo Tao"],"date":"2026-10-06","abstract":"Joint-event forecasts often combine a dependence estimate based on past forecast errors with newly estimated marginal distributions. When each historical error retains the marginal fit available at its issue date, inference must account for an overlapping sequence of estimation errors. We derive their joint influence with the terminal forecast estimates in a stable Vine Copula VAR with normal innovation margins and a fixed, correctly specified Gaussian or positive Clayton vine. An intercept identity and the stable VAR filter reduce the historical correction to harmonically weighted innovation moments, while terminal slope uncertainty remains. The resulting covariance estimator gives asymptot","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","math.ST","stat.ML"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Approximation Algorithms for the b-Matching and List-Restricted Variants of MaxQAP","url":"https://doi.org/10.1007/978-3-032-34519-6_25","authors":["Jiratchaphat Nanta","Vorapong Suppakitpaisarn","Piyashat Sripratak"],"date":"2026-10-06","abstract":"","doi":"10.1007/978-3-032-34519-6_25","venue":"Lecture notes in computer science","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP","TH"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"A passion for science, a heart for people","url":"https://doi.org/10.1140/epjs/s11734-026-02639-7","authors":["Zbigniew R. Struzik","Aneta Stefanovska","Alberto Porta","Ryszard Kutner","J urgen Kurths","Henryk Fukś"],"date":"2026-10-06","abstract":"","doi":"10.1140/epjs/s11734-026-02639-7","venue":"The European Physical Journal Special Topics","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["CA","CN","DE","GB","IT","JP","PL","SI"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Diagnosing systematic overestimation and feature dependencies in data-driven predictions of urban CO₂ emissions in China","url":"https://doi.org/10.1016/j.eiar.2026.108770","authors":["Yukai Jin","Ayyoob Sharifi"],"date":"2026-10-06","abstract":"Machine learning is increasingly used to simulate and predict complex urban phenomena, such as CO₂ emission patterns in cities. However, the effectiveness, biases, and uncertainty of these predictive models are not well understood. This study systematically evaluates 18 different machine learning algorithms using a rich dataset of county-level CO₂ emissions in China from 2001 to 2020, incorporating 41 diverse features spanning socioeconomic, environmental, and energy consumption factors. The analysis reveals a widespread issue: nearly all models, regardless of type, tend to systematically overestimate emissions in Chinese county-level cities across both space and time. By isolating the effec","doi":"10.1016/j.eiar.2026.108770","venue":"Environmental Impact Assessment Review","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Asymmetric Financial Flash-Crash Sabotage: Weaponizing Trusted Media Distribution Nodes, Algorithmic Latency, and Cross-Border Market Contagion in Gig-Economy Warfare","url":"https://doi.org/10.5281/zenodo.23178514","authors":["Yoko Hasebe"],"date":"2026-10-06","abstract":"【Description / Abstract】Modern financial market microstructure is defined by high-frequency trading (HFT) algorithms and quantitative automated execution models that parse incoming news headlines with sub-millisecond latency. While regulatory frameworks focus predominantly on exchange-level cyber resilience, this paper identifies a fatal, unaddressed systemic vulnerability: the weaponization of trusted third-party media distribution nodes as asymmetric strike vectors in hybrid warfare. Using the October 2026 enterprise cloud compromise of Nihon Keizai Shimbun (Nikkei Inc.)—wherein threat actors compromised internal Microsoft 365 environments to dispatch 9,000 targeted spear-phishing vectors ","doi":"10.5281/zenodo.23178514","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Forward-Airbase Vulnerability, Asymmetric Drone Saturation, and the Physical-Layer Fragility of Sovereign Semiconductor IP: From RAF Lakenheath to MCAS Iwakuni","url":"https://doi.org/10.5281/zenodo.23182410","authors":["Yoko Hasebe"],"date":"2026-10-06","abstract":"Abstract The rapid obsolescence of static perimeter defense under modern kinetic conditions was empirically validated by Ukraine's long-range thermite and FPV drone strikes against dispersed Russian strategic aviation infrastructure, as documented in frontline investigations by The New York Times. A sub-$500 autonomous or tethered drone carrying shaped incendiary charges fundamentally overturns the cost-exchange ratio of defending $100M+ strategic aircraft sheltered in conventional open hangars. This paper examines the systemic geopolitical and financial contagion triggered by this technological inflection point, tracing its operational consequences across three interconnected theaters: (1) ","doi":"10.5281/zenodo.23182410","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The military that isn’t: how legalized anti‑militarism shapes the limits of Japan’s defense policy","url":"https://doi.org/10.1080/09512748.2026.2740751","authors":["Yuji Idomoto"],"date":"2026-10-06","abstract":"Scholarship increasingly claims that Japan’s anti‑militarism has eroded, pointing to rising defense spending, expanding Self‑Defense Forces (SDF) missions, and new counterstrike capabilities. This paper challenges that view by highlighting a neglected but enduring dimension of anti‑militarism: its legalization. Because the SDF are legally defined as an administrative organ rather than a military, they operate under a police‑like system that imposes significant operational constraints. In peacetime, the SDF may act only under narrowly defined regulations governing permissible uses of weapons, and any shift to military operations requires explicit political authorization. The absence of milita","doi":"10.1080/09512748.2026.2740751","venue":"The Pacific Review","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Transplanting a socio-cultural innovation: Life insurance in Meiji Japan","url":"https://doi.org/10.1080/00076791.2026.2733720","authors":["YingYing Jiang"],"date":"2026-10-06","abstract":"This study examines the establishment of a domestic life insurance industry in Meiji Japan from a comparative perspective. Life insurance represented a socio-cultural innovation that emerged in the context of Western modernization. Its rapid adaptation to Japan’s socio-economic and cultural environment was remarkable. To uncover the underlying mechanisms of this process, the study addresses three key questions: how foreign insurers, the government, and domestic entrepreneurs contributed to the establishment of the industry; how the market was developed as seen in the occupational and regional distribution of early customers and the changes in product composition; and how domestic entrepreneu","doi":"10.1080/00076791.2026.2733720","venue":"Business History","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Household unit values, measurement units, and the current-share Stone index in LA/AIDS estimation","url":"https://doi.org/10.1080/00036846.2026.2743817","authors":["Hideyasu Sato"],"date":"2026-10-06","abstract":"Household surveys often replace unavailable transaction prices with unit values. This article examines linear approximate Almost Ideal Demand System (LA/AIDS) applications in which raw or incompletely standardized household unit values enter a contemporaneous current-share Stone index. Building on the established non-commensurability of that index, it develops a household-level representation of the measurement-unit channel, isolates its transmission through the real-expenditure deflator, and quantifies the resulting sensitivity. An exact-AIDS Monte Carlo design with 500 replications per scenario shows that fixed commodity-specific unit scales generate elasticity differences through the Ston","doi":"10.1080/00036846.2026.2743817","venue":"Applied Economics","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"The Investment Banking \"Revolving Door\" and the Structural Financialization of Sovereign Household Savings: Subprime Risk Reproduction, Elite Behavioral Traps, and Systemic Fragility in State-Mandated Retail Asset Schemes","url":"https://doi.org/10.5281/zenodo.23179173","authors":["Yoko Hasebe"],"date":"2026-10-06","abstract":"【Description / Abstract】Over the past three decades, modern democratic governance has been fundamentally reshaped by the institutional phenomenon known colloquially as the \"revolving door\"—the systematic transition of senior executives from tier-one global investment banks (exemplified by Goldman Sachs) into sovereign ministerial cabinets, central banking governorships, and parliamentary leadership. While celebrated in elite political discourse as the importation of technocratic financial expertise, this paper demonstrates that this migration embeds an acute, systemic distortion into national economic architecture: the forced financialization of sovereign household savings. Through a synthes","doi":"10.5281/zenodo.23179173","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Area-Level Correlates of Inpatient Care Self-Sufficiency in Subnational Health Planning Areas: A Disease-Stratified Ecological Study from Aichi Prefecture, Japan","url":"https://doi.org/10.3390/healthcare14193322","authors":["Jinsang Park","Kikue Sato"],"date":"2026-10-06","abstract":"Background/Objectives: Japan organizes inpatient care through secondary medical areas (SMAs), but evidence linking area-level care self-sufficiency with population need, healthcare supply, and socioeconomic context is limited. We quantified disease-stratified self-sufficiency across Aichi Prefecture and examined its ecological correlates. Methods: This cross-sectional ecological study analyzed fiscal-year 2024 Diagnosis Procedure Combination discharges from 203 of 276 acute-care hospitals across 11 SMAs. The dataset comprised 396 cells (11 SMAs × 18 Major Diagnostic Categories × surgical/non-surgical strata) linked to census, healthcare-resource, household, and pooled 2020–2024 standardized ","doi":"10.3390/healthcare14193322","venue":"Healthcare","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Cost-effectiveness of transversus abdominis plane block versus caudal block for pediatric lower abdominal surgery under general anesthesia: a simulation-based study","url":"https://doi.org/10.1186/s40981-026-00882-4","authors":["Soichiro Obara","Hajime Watanabe","Yoshinori Nakata"],"date":"2026-10-06","abstract":"Abstract Introduction The economic implications of transversus abdominis plane block (TAPB) versus caudal block (CB) for pediatric lower abdominal surgery remain unclear. Methods We developed a decision tree from the Japanese public healthcare payer perspective, comparing general anesthesia plus standard-case TAPB with general anesthesia plus CB for a representative 3-year-old child. Outcomes were expected reimbursed expenditure and quality-adjusted life years (QALYs) over 7 postoperative days. Uncertainty was examined using deterministic and probabilistic sensitivity analyses, threshold analysis, and scenario analyses. Results Expected reimbursed expenditure was JPY 751.8 for TAPB and JPY 2","doi":"10.1186/s40981-026-00882-4","venue":"JA Clinical Reports","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Supplementary and diversified: the functional logic of Japan’s participation in Indo-Pacific minilateral cooperations","url":"https://doi.org/10.1080/09512748.2026.2741396","authors":["Haonan Hua"],"date":"2026-10-06","abstract":"Since the return of Shinzo Abe to office, Japan has systematically engaged in institution-building within subregional security architectures situated between formal military alliances and broader multilateral security dialogue mechanisms through various forms of minilateral cooperation, including support for Pillar II of AUKUS, the deepening of the QUAD, and leadership in multilateral defense-industrial cooperation initiatives such as the GCAP. Japan’s minilateral cooperation exhibits a distinctly functional orientation, structured around two criteria: geopolitical proximity and technological sovereignty sensitivity. In maritime security-related domains, these cooperations primarily suppleme","doi":"10.1080/09512748.2026.2741396","venue":"The Pacific Review","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The lattice structure of the crawler","url":"https://arxiv.org/abs/2610.08096","authors":["Hinata Kurashita"],"date":"2026-10-06","abstract":"We study object reallocation problems with single-peaked preferences. On the unrestricted domain of strict preferences, top trading cycles (TTC) is the unique rule that satisfies efficiency, individual rationality, and strategy-proofness. On the single-peaked preference domain, the crawler introduced by Bade (2019) satisfies the same properties. We show that the Nash equilibrium allocations of the crawler's direct revelation game form a complete lattice under weak Pareto dominance. The truthful allocation is the greatest element of this lattice, while the initial endowment allocation is its least element.","doi":"10.48550/arxiv.2610.08096","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Regimes of attrition: financial infrastructure and capital mobilisation in Japan and its colonies, 1931-1945","url":"https://hdl.handle.net/1842/45305","authors":["Tsz Ho Wong"],"date":"2026-10-06","abstract":"This dissertation investigates the ‘financial infrastructure’, which is an umbrella term encompassing financial systems, instruments, and institutions, that facilitated Japan’s total war mobilisation in its home islands and colonies. While extensive Anglophone literature exists on technocrats, social and cultural mobilisation, and the ecological and environmental impact of Japan’s colonial presence, the financial history of Japan during the war years, particularly the Pacific War, remains largely uncharted. Although Japanese scholars have scrutinised the state interventions in the capital market, the organisational changes within business entities, and the investment strategies of zaibatsu a","doi":"10.7488/era/7820","venue":"ERA","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"AI时代的工资问题——AI创造的价值归属于谁?","url":"https://doi.org/10.5281/zenodo.23185772","authors":["K. Tsuchiya"],"date":"2026-10-06","abstract":"This is the Chinese-language version of the original Japanese paper, “AI時代の賃金問題――AIが生み出した価値は誰のものか――” by Kiyoto Tsuchiya.The content and argument are identical to the original Japanese version.Original Japanese version: https://doi.org/10.5281/zenodo.22954607 本文是土屋清人《AI時代の賃金問題――AIが生み出した価値は誰のものか――》的中文版本。本中文版与日文原版在内容与论旨上保持一致。日文原版:https://doi.org/10.5281/zenodo.22954607 以生成式AI为代表的人工智能(AI)的迅速普及,正在削弱人类劳动与企业所创造价值之间的联系。既有研究主要从劳动力市场供求、要素价格以及宏观劳动收入份额的变化等角度考察AI的分配效应。本文采取不同的视角,指出AI所创造的价值并不会自动归属于任何主体;其在工资、高管薪酬、股利、留存收益及投资之间的配置,取决于企业内部的分配决定权。本文进一步借鉴井尻雄士的会计计量理论,说明AI导入所带来的效益与牺牲可能分别归属于不同主体,并将生计保障与追加价值的分配区分为收入问题的两个层次。在此基础上,本文提出三个概念:“AI价值归属问题”“效益与牺牲归属主体的分离”以及“生计保障与追加分配的双层结构”。本文的结论是,AI时代的工资不应仅被视为劳动的对价,而应被重新理解为将企","doi":"10.5281/zenodo.23185772","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"My Personal Tribute to Professor Taizo Yakushji","url":"https://doi.org/10.6084/m9.figshare.34077963","authors":["Hiroyasu Akutsu"],"date":"2026-10-06","abstract":"This article is a personal tribute to my academic mentor in Japan, Professor Taizo Yakushiji, who passed away on January 9, 2026. It reflects the analytical techniques I learned from him in the early 1990s and demonstrates how I have built upon that foundation in light of recent academic literature.（本稿は、2026年1月9日に逝去された恩師・薬師寺泰蔵教授に捧げる追悼草稿であり、学術誌等を通じた正式な出版・公刊を目的としたものではありません。）AbstractThis article revisits the Richardson-type arms race model by introducing a frequency-domain perspective on strategic interaction. Using SIPRI military expenditure data for Japan, the United States, and China from 1990 to 2024, it develops a generalized relative power contribution (RPC) framework that integrates orde","doi":"10.6084/m9.figshare.34077963","venue":"Figshare","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"AI时代的收入不平等是如何产生的?——从市场到企业内部分配结构——","url":"https://doi.org/10.5281/zenodo.23186308","authors":["K. Tsuchiya"],"date":"2026-10-06","abstract":"This is the Chinese-language version of the original Japanese paper, “AI時代の所得格差はどのように発生するのか――市場から企業内部の分配構造へ――” by Kiyoto Tsuchiya.The content and argument are identical to the original Japanese version.Original Japanese version: https://doi.org/10.5281/zenodo.22975442 本文是土屋清人《AI時代の所得格差はどのように発生するのか――市場から企業内部の分配構造へ――》的中文版本。本中文版与日文原版在内容与论旨上保持一致。日文原版:https://doi.org/10.5281/zenodo.22975442 本文不将AI时代的收入不平等视为AI这一技术的直接结果,而是将其重新理解为AI所形成的价值经由企业内部的分配决定归属于不同主体这一过程的结果。AI可以为价值形成作出贡献,但它并不是将成果作为收入加以领取的主体。成果流向工资、高管薪酬、股利还是留存收益,是在制度所规定的分配决定权结构之下,通过企业内部的分配决定而具体化的。因此,即使是同一AI,收入不平等也可能不同。此外,本文在肯定劳动收入份额作为汇总指标之意义的同时,指出该指标将高管薪酬与员工工资合并计算,因而无法识别企业内部价值归属的差异。行业数据显示,整形美容外科与托儿所的劳动收入份额几乎处于同一水平,但高管薪酬分配率分别为30.1%和9.2%,差异显著。在此基","doi":"10.5281/zenodo.23186308","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"ja"},{"title":"On the empirical relevance of the exchange rate as a shock absorber at the zero lower bound","url":"https://doi.org/10.1016/j.euroecorev.2026.105494","authors":["David Finck","Mathias Hoffmann","Patrick Hürtgen"],"date":"2026-10-06","abstract":"","doi":"10.1016/j.euroecorev.2026.105494","venue":"European Economic Review","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["DE"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Japan and NATO, 1995-2025: A Transitioning Security Relationship","url":"https://doi.org/10.25777/wejd-ps88","authors":["Aira Yoshida"],"date":"2026-10-06","abstract":"Japan is facing the most serious security environment it has ever known. In eastern Asia, China has increased its military power significantly, and North Korea’s missiles are threatening neighboring countries. Russia's invasion of Ukraine since 2022 has continued as an issue in both military and humanitarian aspects. These authoritarian states' aggressive behavior increases regional threats in the East Asia region. Besides that, expanding security fields makes it complex. To address these security concerns, one approach that Japan has explored is to strengthen its cooperation with NATO. Why has Japan chosen this path to address its security concerns? What has this increased cooperation looke","doi":"10.25777/wejd-ps88","venue":"Old Dominion University","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["US"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Cost-effectiveness of dapagliflozin for the treatment of chronic kidney disease: a systematic review","url":"https://doi.org/10.1186/s12962-026-00817-x","authors":["Zehui Jiang","Nannan Yan","Dongxiao Chen","Cai Xiao","Fei Le","Jun Zhang"],"date":"2026-10-06","abstract":"This systematic review aims to evaluate the existing cost-effectiveness evidence for dapagliflozin in chronic kidney disease (CKD), summarizing the findings and analyzing the economic outcomes. This study systematically searched Chinese and English databases (including PubMed, Web of Science, Embase, Cochrane Library, China National Knowledge Infrastructure (CNKI), Wanfang Data, and Chongqing VIP) and relevant Health Technology Assessment (HTA) agency websites (including NICE, CADTH, PBAC, and HITAP) up to July 28, 2026, to identify economic evaluations of dapagliflozin for CKD. The included studies were assessed using the CHEERS and Drummond checklists. The systematic review included 14 stu","doi":"10.1186/s12962-026-00817-x","venue":"Cost Effectiveness and Resource Allocation","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["CN"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Transmedia Storytelling","url":"https://doi.org/10.4324/9781003753438","authors":["Jean Pierre Magro"],"date":"2026-10-06","abstract":"Transmedia Storytelling examines how successful stories move between platforms, from traditional media to digital formats, and diagnoses how platform capitalism has transformed transmedia storytelling from a democratic expansion of storyworlds into a machinery of extraction. Drawing on the author’s dual expertise as both producer and academic, this book analyses how storytellers create worlds that work successfully across multiple formats through an abundance of case studies. These case studies span from Marvel and Stranger Things to diverse global storytelling ecologies, including Japanese manga serialisation, Korean platform co-productions, and Nollywood video-film networks. Readers will d","doi":"10.4324/9781003753438","venue":"Routledge eBooks","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"An Empirical Model of Mobile App Competition: The Role of the Revenue-Source Channel","url":"https://doi.org/10.31235/osf.io/2bdk4_v3","authors":["Kohei Kawaguchi","Susumu Sato","Toshifumi Kuroda"],"date":"2026-10-06","abstract":"Mobile apps can earn revenue from download fees, in-app purchases, and in-app advertising, and mixed business models coexist within a market, unlike in many familiar markets where firms rely primarily on a single price per product. Because developers choose these revenue sources jointly, a shock to one source can induce adjustments in the others, including the activation or shutdown of a source, a mechanism we call the revenue-source channel. We develop an empirical model of app competition in download prices, usage prices, and advertising intensities, in which developers endogenously determine their business models. The model admits a competition-in-utility formulation that yields a tractab","doi":"10.31235/osf.io/2bdk4_v3","venue":"","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Comparative Political and Economic Vulnerability: A Composite-Index Approach","url":"https://doi.org/10.36287/setsci.25.6.001","authors":["Madhu Thota","Sri Ram Uppugalla","Chaitanya Basava"],"date":"2026-10-06","abstract":"This study develops the Political and Economic Vulnerability Score (PAVS), a composite index for assessing cross-country differences in macro-financial and institutional vulnerability. Drawing on publicly available World Bank data, the index combines 13 indicators across financial, macroeconomic, external-liquidity, and governance dimensions for 30 economies during 2000–2020. The empirical analysis uses 516 complete country-year observations to examine cross-sectional variation, the sensitivity of country rankings to alternative weighting schemes, and the persistence of vulnerability over time. The results show marked differences in average PAVS across the sample. Vietnam, Mexico, Italy, Tur","doi":"10.36287/setsci.25.6.001","venue":"","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["US"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"TriTaP: A Harmonized Panel Dataset of Corporate Tax Avoidance in Korea, the United States and Japan","url":"https://doi.org/10.5281/zenodo.23188420","authors":["Song WonHo","Hyungjoon Kim","Gyumun Choi","Sejin Myung"],"date":"2026-10-06","abstract":"TriTaP (Tri-jurisdiction Tax avoidance Panel) is a firm-year panel of corporate tax avoidance measures for listed non-financial firms in Korea, the United States and Japan. It is built to a single specification so that the measures can be compared across the three tax jurisdictions: every measure is computed with the same formula, the same OECD combined statutory tax rates and the same accrual model, and all inputs come from public sources (KoTaP v2.1, SEC EDGAR XBRL and EDINET). Coverage (rows with all four primary measures) Korea: 12,650 firm-years from 1,754 firms, FY2011–2024 United States: 13,135 firm-years from 1,838 firms, FY2011–2025 Japan: 18,766 firm-years from 2,790 firms, FY2017–","doi":"10.5281/zenodo.23188420","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["KR"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Central Bank Economic Transparency and Managerial Learning","url":"https://doi.org/10.1093/rfs/hhag089","authors":["Oliver Binz","Elia Ferracuti","Gary Lind"],"date":"2026-10-06","abstract":"Abstract Central banks increasingly disclose their private information regarding the economy’s current and future state (CBET). Consistent with CBET shifting investors’ collection and pricing of aggregate-level (where managers do not have an information advantage) toward firm-level (where managers do have an information advantage) information, we find that CBET reduces managers’ learning from stock price. The results are (1) pronounced when firms do not provide guidance and when noise trading in firms’ stock is low, and (2) robust to using the 2013–2014 amendments to the Bank of England’s Inflation Report as an exogenous shock. Additional evidence suggests that CBET lowers investment efficie","doi":"10.1093/rfs/hhag089","venue":"The Review of Financial Studies","sources":["Review of Financial Studies"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Directing the Labor Market: Shared Directors and Employee Flows","url":"https://doi.org/10.1093/rfs/hhag090","authors":["Taylor A Begley","Peter Haslag","Daniel Weagley"],"date":"2026-10-06","abstract":"Abstract Using résumé data on over 20 million U.S. workers, we find that the flow of employees between a pair of firms sharply drops by about 20% during periods in which the firms share a board director. This relationship is stronger in settings where firms have greater potential gains from limiting worker mobility and is most pronounced for higher-skilled employees. Moreover, we find more connected firms have lower rates of internal promotion and no improvements in employee satisfaction. The evidence is consistent with shared directors serving as a mechanism for labor market coordination. (JEL G34, G38, J42, J62, J08, K21, K31, M50)","doi":"10.1093/rfs/hhag090","venue":"The Review of Financial Studies","sources":["Review of Financial Studies"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Representation over Rents: Stochastic Volatility Models with Stable Disturbances: Estimation via Linearization","url":"https://d.repec.org/n?u=RePEc:tin:wpaper:20260082&r=&r=ets","authors":["Fernando Roders","Siem Jan Koopman","Karim Moussa"],"date":"2026-10-05","abstract":"In this study, we propose to estimate the parameters of stochastic volatility models with stable disturbances using methods based on linearization. Specifically, we obtain a linear state space form of the model by taking the logarithm of the squared financial returns, which, together with analytical expressions for logarithmic and fractional lower order moments of the stable distribution, forms the basis of the proposed quasi-maximum likelihood and generalized method of moments estimators. The methods are straightforward to implement and do not require simulation. We provide details of the implementation and study the finite-sample performance of the two estimation methods in a Monte Carlo s","doi":"","venue":"NEP 計量時系列 (nep-ets)","sources":["NEP 計量時系列 (nep-ets)"],"groups":["ecm"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Network Experiments with Edge Treatments and Node Outcomes","url":"https://arxiv.org/abs/2610.07363","authors":["Artem Kuriksha","Kenneth Hung"],"date":"2026-10-05","abstract":"We present a methodology for analyzing node-level outcomes while experimenting with edge-level treatments in a population connected by an undirected graph. Under our design, nodes are randomly assigned to test or control, and each edge inherits the treatment of its endpoints, with conflicts resolved by randomization. We use each node's assigned status as an instrument for its treatment exposure. We show that the Wald estimator is consistent for the global average treatment effect (GATE), even when the edge weights used to construct the exposure are misspecified. We formalize the assumptions needed both in terms of the linearity of potential outcomes and the sparsity of the graph, and prove t","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Measuring Trade Direction in a Prediction Market: Settlement Ground Truth and Trading-Cost Measurement on Polymarket","url":"https://arxiv.org/abs/2610.06412","authors":["Philipp D. Dubach"],"date":"2026-10-05","abstract":"Trade-sign errors can change measured trading costs even when classification accuracy is high. We validate the side of Polymarket's public trade prints against the taker leg of each print's on-chain settlement. On twelve selected days between April and August 2026, spanning both exchange generations, 92.1% to 100.0% of prints match a settled taker leg, with exact side and token agreement on all 24.5 million matched pairs. Mint-and-merge settlement makes that taker leg essential: pooling maker and taker legs changes the measured buy share. Signing the full cached tape before settlement selection yields 16.6 million prints signed by every rule; equal-day balanced accuracy is 0.942 for Lee-Read","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","q-fin.TR"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Power enhancement via cross-fit variance estimation: Applications to specification, overidentification, and many-restriction testing","url":"https://arxiv.org/abs/2610.06119","authors":["Keita Sunada","Yukitoshi Matsushita","Taisuke Otsu"],"date":"2026-10-05","abstract":"Quadratic-form test statistics are widely used in econometrics, and their performance depends on accurate variance estimation. Conventional plug-in estimators are consistent under the null hypothesis, but under alternatives the drift in the residuals inflates them and the test loses power. We develop a general framework for variance estimation in such statistics, replacing one of the two squared-residual factors by an auxiliary linear combination of the residuals (``cross-fitting'') chosen to annihilate the drift. We characterize the conditional bias of each estimator exactly. The drift enters the plug-in estimator squared, multiplied by quantities bounded away from zero, so its bias is posi","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"An Averaging Alternative to Pre-Trend Testing","url":"https://arxiv.org/abs/2610.05705","authors":["Nicholas L. Brown","Qiushi Bu"],"date":"2026-10-05","abstract":"We study difference-in-differences (DID) estimation of average treatment effects on the treated when the researcher is uncertain about which pre-treatment periods satisfy the parallel trends assumption. Roth (2022) shows that pre-trend testing can induce bias, complementing the statistical literature on post-selection inference. We propose the model averaged difference-in-differences (MADID) estimator, a weighted average of the candidate $2\\times2$ DID estimators. The weights are normalized exponential functions of the candidate residual sums of squares, so implementation requires no specification test. We derive MADID's asymptotic properties under conditions that make invalid comparisons de","doi":"","venue":"arXiv econ.EM","sources":["arXiv econ.EM(計量経済学)"],"groups":["ecm"],"countries":[],"tags":["econ.EM","stat.ME"],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Too hot to give birth? Temperature shocks and general fertility rates in Japan","url":"https://doi.org/10.3389/fhumd.2026.1899647","authors":["Qifan Fu"],"date":"2026-10-05","abstract":"This paper studies how alternative measures of ambient temperature change the estimated short-run relationship between heat and fertility. I combine monthly vital statistics for all 47 Japanese prefectures from 2012 through 2019 with daily weather reconstructed from raw station records. The outcome is the monthly general fertility rate, defined as live births per 1,000 women ages 15–49. Models include complete temperature-bin vectors, lagged precipitation and missing-weather controls, year-month fixed effects, prefecture-by-calendar-month fixed effects, and prefecture-by-year fixed effects. A day with a minimum temperature of at least 25 ∘ C is associated with 0.39 and 0.25 percent lower fer","doi":"10.3389/fhumd.2026.1899647","venue":"Frontiers in Human Dynamics","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Trends in intergenerational income mobility in Japan, 1985–2015","url":"https://doi.org/10.1080/13504851.2026.2740166","authors":["Zhi-Xiao Jia"],"date":"2026-10-05","abstract":"This paper examines trends in father-son income mobility in Japan between 1985 and 2015 using repeated cross-sectional data from the Social Stratification and Social Mobility (SSM) surveys. Fathers’ income is imputed using a two-sample two-stage least squares (TS2SLS) approach based on education and occupation. The results show that intergenerational income persistence increased substantially during the period, particularly between 1985 and 1995, broadly corresponding to the period of rising income inequality in Japan. Decomposition analysis further indicates that while the contribution of education to intergenerational persistence declined over time, the contribution of occupation increased","doi":"10.1080/13504851.2026.2740166","venue":"Applied Economics Letters","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"There are Three Big Reasons of Global Warming and their Solutions","url":"https://doi.org/10.47363/jgwcc/2026(2)145","authors":["Sunao Sugihara","Hiroshi Maiwa"],"date":"2026-10-05","abstract":"As civilization develops, it is remarkable associating with climate change and make the Earth warmer, then it was reported that Arctic ice has been melted several years ago. We don’t feel four seasons in Japan around ten years ago. We analyzed the reasons of global warming and climate change and assumed three big reasons. One is the number of cars, and the second is increase of nuclear power plants in the world. The third one is data center station along with the internet technology. Moreover, wars in east Europa make it worse, and our air conditioning seems making warm the air in our daily life. We propose new idea to solve warming Earth and climate change. Three of the idea are current tec","doi":"10.47363/jgwcc/2026(2)145","venue":"Journal of Global Warming and Climate Change","sources":["OpenAlex:タイトル・抄録に Japan を含む論文","OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Managing the AI Transition: Upskilling and Reskilling Asia’s Workforce in the Age of Automation","url":"https://doi.org/10.56506/dssf6074","authors":["Subhasis Bera","Dil Bahadur Rahut","Ishita Bera"],"date":"2026-10-05","abstract":"","doi":"10.56506/dssf6074","venue":"","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Leximin budget allocation across heterogeneous budgeted Markov decision processes","url":"https://doi.org/10.1016/j.disopt.2026.100972","authors":["Hideaki Goto"],"date":"2026-10-05","abstract":"We study how to allocate a common budget across agents facing heterogeneous finite-horizon budgeted Markov decision processes so as to optimize the resulting value vector according to the leximin criterion. Boutilier and Lu (2016) show that, under deterministic policies, each agent’s attainable value is represented by finitely many budget-value pairs. Using this finite representation, we establish an exact two-stage decomposition of the leximin allocation problem. First, the leximin criterion requires maximizing the number of agents attaining positive value. Second, conditional on this maximum number, the planner must jointly decide which agents receive positive budgets and which budget leve","doi":"10.1016/j.disopt.2026.100972","venue":"Discrete Optimization","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"How Rational are Individuals in Asset Price Formation? Impact Assessment of Flood and Land Subsidence on Farmland Prices in Taiwan","url":"https://doi.org/10.1007/s41885-026-00214-x","authors":["Yu-Ching Shen","Kei Kajisa"],"date":"2026-10-05","abstract":"","doi":"10.1007/s41885-026-00214-x","venue":"Economics of Disasters and Climate Change","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"ScenarioMIP-CMIP7 CDR and Sustainability assessment","url":"https://doi.org/10.5281/zenodo.23151280","authors":["Osamu Nishiura"],"date":"2026-10-05","abstract":"","doi":"10.5281/zenodo.23151280","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Bayesian sensory integration explains ball-count bias in Major League Baseball umpires","url":"https://doi.org/10.1038/s44271-026-00534-4","authors":["Mitsuto Tomomura","Masahiro Shinya"],"date":"2026-10-05","abstract":"Abstract Bayesian sensory integration, the brain’s strategy of combining noisy sensory evidence with prior expectations in proportion to their relative reliability, is one of the most influential frameworks in cognitive neuroscience, yet its validity has been primarily demonstrated in controlled experimental settings. Whether it also governs real-world expert decision-making remains largely untested. Here, we leveraged 451,172 called pitches from ten seasons of Major League Baseball (2015–2024) to ask whether the count-dependent bias in umpire strike–ball judgements, a systematic expansion and contraction of the effective strike zone depending on the ball count, is a signature of Bayesian se","doi":"10.1038/s44271-026-00534-4","venue":"Communications Psychology","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Thermodynamic and Telecommunication Non-Survivability of Bitcoin in Total Kinetic Warfare: The Collapse of the \"Digital Gold\" Paradigm Under EMP Strikes, Undersea Cable Severance, and Rationing Economies","url":"https://doi.org/10.5281/zenodo.23151691","authors":["Yoko Hasebe"],"date":"2026-10-05","abstract":"【Description / Abstract】 A foundational tenet of the cryptocurrency paradigm asserts that Bitcoin functions as sovereign-independent \"digital gold\"—an immutable, non-state reserve asset and unassailable hedge against systemic collapse, geopolitical conflict, and currency debasement. This paper disproves this premise through an exhaustive physical-layer and thermodynamic failure-mode analysis under the conditions of total kinetic conflict (World War III). We demonstrate that Bitcoin is fundamentally parasitic upon an ultra-fragile, highly centralized peacetime civil infrastructure: uninterrupted terawatt-scale electrical grids, global synchronization clocks, and intercontinental submarine fib","doi":"10.5281/zenodo.23151691","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"The cost of collateral scarcity: Asset prices and misallocation in supply crises","url":"https://doi.org/10.1016/j.econmod.2026.107873","authors":["Ye Zhang","Ying Tung Chan"],"date":"2026-10-05","abstract":"Standard economic models predict that higher asset prices increase investment by relaxing firms’ borrowing limits. We find that a supply–valuation paradox can arise. The standard price channel operates, but it is overwhelmed by the contraction of the collateral stock. Using China’s sudden end to its zero-COVID-19 policy as a major supply shock, we observe that housing prices rose while housing investment collapsed during the same period. We build a model to explain this puzzle. When a supply shock reduces the physical quantity of real estate that firms can use as collateral, the total value of available collateral falls, even if the price per unit goes up. Banks care about total collateral v","doi":"10.1016/j.econmod.2026.107873","venue":"Economic Modelling","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["CN","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Random satisficing model: Characterization and (generic) identification","url":"https://doi.org/10.1016/j.jmateco.2026.103316","authors":["Saptarshi Mukherjee","Nozomu Muto"],"date":"2026-10-05","abstract":"Satisficing choice is a well-known decision-making rule. However, as the literature shows, its predictive power is limited because identifying the underlying primitives is difficult. We consider a random satisficing model (RSM) where the decision maker is endowed with a preference, a random threshold, and a random search order. We characterize RSM with two axioms that use the concept of “virtual satisficing sets” introduced in the paper. We also show that the underlying preference can be generically identified when the distribution of search orders has full support and is known to the analyst. Further, we consider a possible generalization of the result when the analyst does not have full kn","doi":"10.1016/j.jmateco.2026.103316","venue":"Journal of Mathematical Economics","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["IN","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"The Discrete Interval (Fencepost) Fragility of Blockchain Tokenomics and Macroeconomic Contagion: Thermodynamic Limits of Zero-Sum Distributed Ledgers and Systemic Vulnerabilities in Politicized Mass-Savings Vehicles","url":"https://doi.org/10.5281/zenodo.23148003","authors":["Yoko Hasebe"],"date":"2026-10-05","abstract":"【Abstract】 Distributed ledger technologies and speculative blockchain networks are widely promoted as decentralized paradigms of trustless value creation. However, this paper demonstrates that the underlying topology of linear blockchain extension represents an applied manifestation of the classic discrete interval (fencepost) problem. In a closed cryptographic network, the value assigned to discrete transaction intervals between consecutive blocks cannot generate intrinsic positive economic surplus; rather, it functions as a recursive redistribution mechanism that requires an exponentially increasing injection of external capital (\"posts\") to maintain apparent interval equilibrium. From a t","doi":"10.5281/zenodo.23148003","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Forecasting Variable Insurance Surrender Rates in Korea: Explainable Machine Learning and Macro‐financial Transmission","url":"https://doi.org/10.1111/ajfs.70061","authors":["Changki Kim","Keonwoong Shin","Ephraim Kwashie Thompson"],"date":"2026-10-05","abstract":"Abstract This study examines aggregate life insurance surrender risk as a macro‐financial transmission mechanism linking household contract adjustment to insurer balance sheets. Using monthly data for Korean Variable Annuity Insurance (VAI) and Variable Universal Insurance (VUI) from 2006 to 2019, we compare econometric and machine learning forecasts over 1‐, 3‐, 6‐, and 12‐month horizons. Forecast performance is evaluated over 2017–2019 using expanding and 120‐month rolling windows. No model dominates uniformly across products, horizons, and estimation windows. Tree‐based methods frequently perform well, but SARIMAX and LASSO remain competitive in other settings, indicating that the value o","doi":"10.1111/ajfs.70061","venue":"Asia-Pacific Journal of Financial Studies","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP","KR","US"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Elasticity estimation via the CKLS--CIR transform for small-noise CEV-type diffusions","url":"https://arxiv.org/abs/2610.05864","authors":["Boyuan Ning","Yasutaka Shimizu"],"date":"2026-10-05","abstract":"We construct a feasible two-step estimator for the elasticity parameter in small-noise CEV-type diffusions. Under joint small-noise and high-frequency asymptotics, we establish its consistency and an $\\varepsilon^{-1}$ central limit theorem with an explicit asymptotic variance. We adapt a Lamperti-based transformation strategy to elasticity inference for a CEV process with an attainable, absorbing $0$ boundary. Under a local-to-CEV scaling, an auxiliary CKLS process and a Girsanov change of measure yield a strictly positive CIR-type benchmark in which the elasticity is recast as a linear-drift parameter. A preliminary elasticity estimator based on local realized variance supplies the unknown","doi":"10.48550/arxiv.2610.05864","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":true,"lang":"en"},{"title":"Global Disparities in the Availability and Reimbursement of Systemic Therapies for Renal Cell Carcinoma: Results of the International ARON-AID Survey","url":"https://doi.org/10.1093/oncolo/oyag397","authors":["Yuksel Urun","Kannan Sridharan","Anca Florina Zgura","Anas Zayed","Martin Ignacio Zapata Laguado","Tarkan Yetişyiğit","Akihiro Yano","Mike Wenzel","Nuno Vau","Deniz Tural","Karine Martins da Trindade","Ben Tran","Frederic Ivan L. Ting","Arnoud J. Templeton","Hideki Takeshita","Kaisa Sunela","Vinicius Carrera Souza","Mopa Alina Sooro","Andrey Soares","Shankar Siva","Ashish Singh","Glauco Silveira","Shamik Shah","Emmanuel Seront","Fabio A.B. Schutz","Maite De Liz Vassen Schurmann","Timothy J. Schieber","Sarah Scagliarini","Amalya Sargsyan","Carlos Salinas Simonetti","Marine Rushanyan","Giandomenico Roviello","Alejo Rodriguez-Vida","Orión Erenhú Rodríguez González","Robin Roberts","Astrid A M Van der Veldt","Mimma Rizzo","Alessandro Rizzo","Alexandr Poprach","Alina Pirshtuk","Alvaro Pinto","Erin Pierce","Jose Mauricio Penaloza","Martino Pedrani","Se Hoon Park","Ibukun Adewumi Okunade","Karen Flora Odounga","Julio Noriega","Edriss Noorzai","Maria Tereza Nieto Coronel","Jiri Navratil","Zin W Myint","Vladan Mutavdzic","Olivier Mukuku","Robert Mugarura","Fernando Sabino Marques Monteiro","Abdikarim Hussein Mohamed","Daniel Mmereki","Carlo Messina","Bohuslav Melichar","Pitchou Mukaz Mbey","Ernesto Maturana","Diana Matthews","Francesco Massari","Esther Martínez","Priyamvada Maitre","Patrick Maison","Beaud Conrad Mabika Ndjembidouma","Kevin Lu","Jiakun Li","Haoran Li","Luciana de Moura Leite","Aly‐Khan A. Lalani","Zsófia Kürönya","Jakub Kucharz","Arnaud Boris Koumba","Ray Manneh Kopp","Jindřich Kopecký","Alba J. Kihn-Alarcón","Özge Keskin","Kymbat Kabdullina","Álvaro Juárez","María José Juan-Fita","Denis L. Fontes Jardim","Laurianne Grégoria James","Enrique Grande","Alfonso Gómez de Liaño","Patrizia Giannatempo","Marwan G. Ghosn","Cinthia Gauna","María Natalia Gandur Quiroga","Kazutoshi Fujita","Marcelo Roberto Pereira Freitas","Ondřej Fiala","Mauricio Fernández Lazzaro","Glenda Marina Falcon Pacheco","Theophilus Olaide Esan","Deborah Tolulope Esan","Danelo Du Plessis","Silvia Neciosup Delgado"],"date":"2026-10-05","abstract":"BACKGROUND: Renal Cell Carcinoma (RCC) represents a growing global health burden, with rising incidence and mortality worldwide. Despite major therapeutic advances, access to novel systemic treatments remains uneven across countries and regions. METHODS: We conducted a cross-sectional, web-based international survey to assess the availability and reimbursement status of 20 innovative systemic therapies for RCC. Responses were collected from 144 clinicians, including medical oncologists, radiation oncologists, urologists, and nuclear medicine specialists, across 58 countries. Analyses examined associations between national income level, gross domestic product (GDP), and treatment availability","doi":"10.1093/oncolo/oyag397","venue":"The Oncologist","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["AM","AU","BE","BH","BR","BS","CA","CD","CH","CL","CN","CO","CZ","DE","ES","GA","GB","GH","GT","HU","IN","IT","JO","JP","KR","KZ","LB","MX","NG","NL","PE","PH","RO","RS","TR","TW","UG","US","ZA"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Strategic Multi-Agent Learning for Interpretable Action Valuation of All Players in Football","url":"https://arxiv.org/abs/2610.05961","authors":["Kenjiro Ide","Taiga Someya","Kohei Kawaguchi","Keisuke Fujii"],"date":"2026-10-05","abstract":"Valuing player actions in football requires accounting for strategic interactions among 22 players, including off-ball movements and defensive positioning. Existing reinforcement-learning-based methods commonly aggregate decisions at the team level or estimate player values independently, leaving strategic interdependence among players insufficiently represented. This study proposes an action valuation framework inspired by Markov perfect equilibrium (MPE) for all players. Each possession is modeled as a finite-horizon dynamic game, with each player represented as an autonomous agent whose policy depends on the current game state. MPE is used as a motivating solution concept rather than an e","doi":"10.48550/arxiv.2610.05961","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["HK","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"An evolutionary origin of collective decision making in humans and machines","url":"https://arxiv.org/abs/2610.05676","authors":["Guocheng Wang","Qi Su","Joshua B. Plotkin"],"date":"2026-10-05","abstract":"Groups of individuals can solve collective problems more accurately than any single member, by aggregating their opinions. Recent theoretical work has identified individual-level reward schemes that allow uninformed individuals to evolve collective intelligence from the bottom up, through social learning. Yet these results are restricted to linear prediction problems and simple averaging, while the decision tasks that real groups confront are often non-linear, and the institutions that aggregate opinions are seldom single-layer averages: districts elect representatives who in turn vote on policy, referees advise editors who decide on publication. Here we develop a framework for the evolution","doi":"10.48550/arxiv.2610.05676","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["CN","JP","US"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Computing Stable Matchings under Complementarities and Preference Misalignment","url":"https://arxiv.org/abs/2610.06337","authors":["Tatsuya Iwase","Bahar Rastegari","Sebastian Stein","Enrico Gerding"],"date":"2026-10-05","abstract":"We study many-to-one, two-sided stable matching problems in which preferences are complementary and firms and workers may rank the same allocation differently. Here a coalition is a group of workers that can be jointly matched with a firm. With complementary preferences, a stable matching need not exist. We show that a stable matching exists for every instance when two conditions hold. The first requires each firm to have an anchor worker who is included in every feasible coalition that can be matched with that firm. The second is Transitive Alignment, which means there must be an overall ranking across different coalitions that is consistent with the workers' preferences. We propose CDAR (C","doi":"10.48550/arxiv.2610.06337","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["GB","JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Rethinking Least-Core Computation in Contextual-Distractor Games","url":"https://arxiv.org/abs/2610.06087","authors":["Hiroshi Kera","Toshinori Yamauchi","Sai Ganesh Nagarajan"],"date":"2026-10-05","abstract":"Game-theoretic attribution explains a model by assigning credit to its features or training examples. The least core has attracted interest as an alternative to Shapley-style averaging because it can expose players that cause substantial harm in rare, high-value contexts. However, least-core allocations are generally nonunique, and the choice of allocation can affect the resulting explanation. In this study, we investigate how payoff selection and coalition sampling affect least-core attribution. Our experiments show that selector choice matters for distinguishing useful and harmful contributions, and that sampling can degrade harmful-player identification across the tested selectors even wh","doi":"10.48550/arxiv.2610.06087","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Administrative Boundary Reforms and Firm Pollution in China: Institutional Path Divergence and Spatial Reallocation of Pollution","url":"https://arxiv.org/abs/2610.06374","authors":["Yuting Chen","Xuancheng Qin"],"date":"2026-10-05","abstract":"Administrative boundary reforms in China alter the assignment of local authority and growth incentives without changing physical geography. We study two reforms with opposite institutional content---county-to-district (centralization: a county absorbed into a municipality as an urban district) and county-to-city (empowerment: a county upgraded to a county-level city)---using a firm-year pollution panel (1998--2013) and a border-pair research design that compares firms on opposite sides of the same county border. Centralizing reform lowers local NOx intensity by 14.8% through cleaner production, without shrinking output or employment; empowering reform raises COD, dust, and wastewater levels ","doi":"10.48550/arxiv.2610.06374","venue":"arXiv (Cornell University)","sources":["OpenAlex:日本の研究機関の著者を含む論文"],"groups":["japan"],"countries":["JP"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Systematic review of the cost effectiveness of pre exposure prophylaxis for HIV prevention among men who have sex with men in Asia","url":"https://doi.org/10.1186/s12982-026-02874-2","authors":["Umairah Norazman","Nurshafinaz Abu Bakar","Sashi Kumar Balasinggam","Boniventure Muneh","Nur Azyyati Amalina Amran","Helmy Sajali","Afidah Abidin","Rahimah Rasali","Mohammad Azri Bantalani","Ri Wei Andrew Chin","Abdul Rahman Ramdzan","Riswandy Wasir"],"date":"2026-10-05","abstract":"Introduction Pre-Exposure Prophylaxis (PrEP) is a highly effective intervention for HIV prevention, yet its economic viability across diverse Asian settings, particularly among men who have sex with men (MSM), remains variable. This systematic review aimed to synthesize evidence regarding the cost-effectiveness of various PrEP formulations and delivery strategies for MSM in Asia. Methodology This systematic review was reported in accordance with the PRISMA 2020 guidelines. The PICO framework was used to define the review scope, focusing on studies evaluating PrEP formulations among MSM populations in Asian countries that reported at least one economic outcome and were published in English fr","doi":"10.1186/s12982-026-02874-2","venue":"Discover Public Health","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["ID","MY"],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"Wer zu spät handelt, bezahlt mit Leid und Leben","url":"https://doi.org/10.24945/mvf.05.26.1866-0533.2871","authors":["P. Stegmaier"],"date":"2026-10-05","abstract":"Wer zu spät handelt, bezahlt mit Leid und Leben Die modernsten Gesundheitssysteme scheitern bisher an der Prävention chronischer Krankheiten Mit der Veröffentlichung des Whitepapers \"Acting Early on Non-Communicable Diseases: A Framework for Health System Transformation\"(1) im Januar 2026 legt das Weltwirtschaftsforum (WEF) in Zusammenarbeit mit der Partnership for Health System Sustainability and Resilience (PHSSR) eine schonungslose Diagnose (2) vor.Die Analyse folgt einem an der London School of Economics and Political Science (LSE) entwickelten Untersuchungsrahmen; das PHSSR-Steuerungsgremium wird von Alistair McGuire mitgeleitet, Professor für Gesundheitsökonomie und Vorsitzender von LS","doi":"10.24945/mvf.05.26.1866-0533.2871","venue":"Monitor Versorgungsforschung","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"THE IMPACT OF LOW-RESILIENCE BAT REGULATIONS ON COMPETITIVE PERFORMANCE IN JAPANESE HIGH SCHOOL BASEBALL","url":"https://doi.org/10.20319/icssh.2026.734735","authors":["Shun‐Chuan Chang"],"date":"2026-10-05","abstract":"This study investigates how regulatory shifts in equipment standards induce structural transformations in competitive performance and team strategies. Such phenomena extend beyond sports, reflecting broader economic principles of policy intervention and resource allocation efficiency. In 2024, the Japan High School Baseball Federation (JHBF) mandated the transition to \"low-resilience bats\" to enhance player safety and correct the \"offensive-heavy\" imbalance. This policy change represents a significant exogenous shock to the competitive environment. Utilizing a comprehensive database of Koshien tournament statistics, this research employs a rigorous econometric approach—Regression Discontinui","doi":"10.20319/icssh.2026.734735","venue":"","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["TW"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Economic policy uncertainty, green finance, and CO2 emissions in Japan: Evidence from a structural-break ARDL analysis","url":"https://doi.org/10.1016/j.jemecp.2026.100034","authors":["Fakhrul Islam","Sajjad Hossain","Montasir Alam","Zobayer Ahmed","Mahmud Hasan Riaz"],"date":"2026-10-05","abstract":"Economic policy uncertainty can influence environmental quality by altering production, energy demand, and investment decisions, while green finance may support the transition toward low-carbon economic activity. This study examines the short-run and long-run effects of economic policy uncertainty, environmental policy stringency, green finance, renewable energy consumption, and industrialization on per capita CO 2 emissions in Japan over the period 1990–2025. Green finance is measured using green bond issuance by Japanese companies and other entities, providing a direct market-based indicator of sustainable capital mobilization. The empirical analysis applies the Zivot–Andrews structural-br","doi":"10.1016/j.jemecp.2026.100034","venue":"Environmental Management Economics and Policy","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":["BD","MY"],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Europe to Japan business class: 2026 Award Changes—Split or Not","url":"https://doi.org/10.5281/zenodo.23158515","authors":["Riley Quinn"],"date":"2026-10-05","abstract":"Evaluate how American Airlines' 2026 award-chart changes affect Europe–Japan business-class splits, with award totals and terms compared before booking. Independent technical note mirroring the canonical version: https://www.mightytravels.com/2026/10/europe-to-japan-business-class-2026-award-changessplit-or-not/","doi":"10.5281/zenodo.23158515","venue":"Zenodo (CERN European Organization for Nuclear Research)","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":true,"econometrics":false,"lang":"en"},{"title":"Інститут патентних повірених у Польщі: від «вільного фаху» до цифрового самоврядування","url":"https://pti.org.ua/index/article/view/1414","authors":["Gennady Androshchuk","Геннадій Андрощук"],"date":"2026-10-05","abstract":"Problem setting. The institute of patent attorneys serves as a vital legal and technological bridge between inventors, business entities, and patent offices. In the context of Ukraine’s ongoing European integration and the comprehensive reform of its intellectual property (IP) ecosystem, transitioning from state-centric administrative regulation to full-fledged professional self-governance is an urgent priority. A critical aspect of this transformation involves rethinking the legal status of patent attorneys, establishing robust procedural guarantees, protecting professional privilege, and institutionalizing independent self-governing bodies. Examining the historical evolution and current op","doi":"","venue":"Law and innovations","sources":["OpenAlex:タイトル・抄録に Japan を含む論文"],"groups":["japan"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":false,"lang":"en"},{"title":"High-Dimensional Sliced Inverse Kendall’s Tau Estimation for Heavy-Tailed Data","url":"https://doi.org/10.1080/07350015.2026.2707219","authors":["Jiaqi Li","Shuaida He","Xin Chen"],"date":"2026-10-05","abstract":"","doi":"10.1080/07350015.2026.2707219","venue":"Journal of Business & Economic Statistics","sources":["Journal of Business & Economic Statistics"],"groups":["journal"],"countries":[],"tags":[],"first_seen":"2026-10-12","japan":false,"econometrics":true,"lang":"en"},{"title":"Causal Lag Structure Discovery in Confounded Time Series via Orthogonalized Adaptive Estimation","url":"https://arxiv.org/abs/2610.05618","authors":["Hong Kiat Tan","Isaac-Neil Zanoria","James Chen","Haoyang Lyu","Mihai Cucuringu"],"date":"2026-10-04","abstract":"Finding which variables cause which others in multivariate time series, and at what lags, is central to science and policy, yet existing methods force a choice between flexible confounder adjustment, data-driven lag selection, and inference that controls the false discovery rate (FDR). ORACLE-VARX does all three
