name: 論文新着の収集

on:
  schedule:
    # 時刻は世界標準時(UTC)。下の設定は日本時間の「月曜と木曜の朝6時47分ごろ」
    # (混雑時は数十分遅れることがあります)
    - cron: "47 21 * * 0,3"
  workflow_dispatch: {}   # Actions 画面の「Run workflow」ボタンから手動実行もできる

permissions:
  contents: write   # 結果ファイルを保存するため
  issues: write     # 新着のお知らせ(メール通知)を作るため

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 新着論文を集める
        id: collect
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CINII_APPID: ${{ secrets.CINII_APPID }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python collect.py

      - name: 結果を保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "新着論文を更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
            git push
          fi

      - name: 新着のお知らせを作る(GitHub からメールが届きます)
        if: steps.collect.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "新着論文" --color "1f5f8b" --force >/dev/null
          # 前回のお知らせは閉じて、最新の1件だけを残す
          for n in $(gh issue list --label "新着論文" --state open --json number --jq '.[].number'); do
            gh issue close "$n" >/dev/null
          done
          gh issue create \
            --title "論文新着 $(TZ=Asia/Tokyo date '+%Y-%m-%d')(${{ steps.collect.outputs.new_count }} 本)" \
            --label "新着論文" \
            --body-file data/latest_summary.md
